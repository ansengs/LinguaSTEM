/* ── KINEMATICS ─────────────────────────────────── */
{cat:'Physics',tags:['physics','engineering'],
 title:'Kinematics: UARM, Projectile & Circular Motion',
 theory:'',
 reality:'A quarterback throws a football — where will it land? That is projectile motion. A roller coaster going through a loop uses circular motion math to keep riders safely in their seats. Traffic engineers calculate the maximum safe speed for every highway curve.',
 formula:'UARM (Uniformly Accelerated Rectilinear Motion):\nv = v₀ + at\nx = x₀ + v₀t + ½at²\nv² = v₀² + 2a(x − x₀)\n\nProjectile (launch angle α, v₀):\nvₓ = v₀cosα  (constant)\nvᵧ = v₀sinα − gt\nx = v₀cosα·t\ny = v₀sinα·t − ½gt²\nRange: R = v₀²sin2α/g\nMax height: H = v₀²sin²α/(2g)\n\nCircular Motion:\nω = 2π/T = 2πf   v = ωR\naₙ = v²/R = ω²R  (centripetal)\nT = 2π/ω   f = 1/T',
 method:'Projectile method: always resolve into x (no acceleration) and y (a=−g) components and treat as two independent 1D problems. Identify unknowns in each axis, match the shared time variable t to link them.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="ka" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#7aabcf"/></marker></defs>
  <line x1="10" y1="100" x2="250" y2="100" stroke="#444" stroke-width="1"/>
  <line x1="10" y1="100" x2="10" y2="10" stroke="#444" stroke-width="1"/>
  <!-- Parabola path -->
  <path d="M10 100 Q100 10 190 100" fill="none" stroke="#7aabcf" stroke-width="2.5"/>
  <!-- launch vector -->
  <line x1="10" y1="100" x2="52" y2="64" stroke="#c9a060" stroke-width="2" marker-end="url(#ka)"/>
  <text x="30" y="78" font-size="8" fill="#c9a060">v₀</text>
  <!-- angle arc -->
  <path d="M30 100 A20 20 0 0 1 26 82" fill="none" stroke="#7ab060" stroke-width="1.5"/>
  <text x="32" y="96" font-size="8" fill="#7ab060">α</text>
  <!-- height label -->
  <line x1="100" y1="10" x2="100" y2="100" stroke="#c07070" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="103" y="55" font-size="8" fill="#c07070">H</text>
  <!-- range label -->
  <line x1="10" y1="106" x2="190" y2="106" stroke="#888" stroke-width="1"/>
  <text x="100" y="116" text-anchor="middle" font-size="8" fill="#888">R = v₀²sin2α/g</text>
  <!-- Circular inset -->
  <circle cx="230" cy="55" r="30" fill="none" stroke="#7ab060" stroke-width="1.5"/>
  <circle cx="230" cy="55" r="3" fill="#7ab060"/>
  <line x1="230" y1="55" x2="252" y2="35" stroke="#c9a060" stroke-width="1.5"/>
  <text x="243" y="43" font-size="7.5" fill="#c9a060">R</text>
  <text x="213" y="52" font-size="7.5" fill="#7ab060">aₙ=v²/R</text>
 </svg>`,
 caption:'Projectile: parabolic path from independent x (constant v) and y (constant −g). Circular: centripetal acceleration points inward.',
 steps:['Resolve initial velocity: vₓ=v₀cosα (stays constant), vᵧ=v₀sinα (decreases at rate g).','For range and flight time: set y=0, solve for t → T=2v₀sinα/g, then R=vₓ·T.','For max height: set vᵧ=0, solve for t → H=v₀²sin²α/(2g).','For circular motion: centripetal acceleration aₙ=v²/R always points toward the centre — it is NOT tangential.','Angular frequency ω=2πf. Linear and angular quantities: v=ωR, aₙ=ω²R.'],
 example:'Ball launched at 30 m/s, 45°. H=900·sin²45°/(2·10)=22.5 m. T=2·30·sin45°/10=4.24 s. R=30·cos45°·4.24=90 m. Circular: car at v=20 m/s, R=50 m. aₙ=400/50=8 m/s².'},

/* ── DYNAMICS & NEWTON'S LAWS ───────────────────── */
{cat:'Physics',tags:['physics','engineering'],
 title:'Dynamics: Newton\'s Laws, Weight, Friction & Torque',
 theory:'',
 reality:'A car needs more engine force going uphill than on flat ground — that is Newton\'s second law. A screwdriver works because torque multiplies your hand force into a stronger twist. Friction keeps your sneakers from sliding. Every vehicle and machine is designed around these laws.',
 formula:'1st Law: ΣF=0 ↔ a=0 (inertia)\n2nd Law: ΣF=ma  (vector equation)\n3rd Law: F₁₂=−F₂₁\nWeight: W = mg  (g=9.8 m/s²)\nFriction: Fₓ ≤ μₛN (static); Fₖ=μₖN (kinetic)\nNormal N: reaction from surface ⊥ to surface\nTorque: τ = F·d = F·r·sinθ  (N·m)\nEquilibrium: ΣF=0  AND  Στ=0\nHooke\'s Law: F = −kx  (spring)',
 method:'FBD protocol for inclined planes: rotate axes so x is along the slope, y is perpendicular. Decompose weight: W∥=mgsinθ (down slope), W⊥=mgcosθ (into surface). Then N=mgcosθ and Ffriction=μmgcosθ.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="fa" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#c9a060"/></marker>
  <marker id="fb" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#c07070"/></marker>
  <marker id="fc" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#7ab060"/></marker>
  <marker id="fd" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#7aabcf"/></marker></defs>
  <!-- Inclined plane -->
  <polygon points="10,100 130,100 130,50" fill="rgba(122,171,207,.08)" stroke="#7aabcf" stroke-width="1.5"/>
  <rect x="80" y="64" width="28" height="22" rx="3" fill="rgba(201,160,96,.15)" stroke="#c9a060" stroke-width="1.5" transform="rotate(-24,94,75)"/>
  <text x="88" y="78" font-size="8" fill="#c9a060" transform="rotate(-24,88,78)">m</text>
  <!-- weight -->
  <line x1="94" y1="75" x2="94" y2="100" stroke="#c07070" stroke-width="2" marker-end="url(#fb)"/>
  <text x="97" y="90" font-size="8" fill="#c07070">W=mg</text>
  <!-- normal -->
  <line x1="94" y1="75" x2="72" y2="53" stroke="#7ab060" stroke-width="2" marker-end="url(#fc)"/>
  <text x="60" y="60" font-size="8" fill="#7ab060">N</text>
  <!-- friction -->
  <line x1="94" y1="75" x2="120" y2="65" stroke="#7aabcf" stroke-width="2" marker-end="url(#fd)"/>
  <text x="116" y="62" font-size="8" fill="#7aabcf">f</text>
  <!-- angle -->
  <path d="M115 100 A18 18 0 0 1 125 84" fill="none" stroke="#888" stroke-width="1.2"/>
  <text x="118" y="97" font-size="8" fill="#888">θ</text>
  <!-- Torque diagram -->
  <circle cx="210" cy="75" r="25" fill="rgba(122,171,207,.06)" stroke="#7aabcf" stroke-width="1.2"/>
  <circle cx="210" cy="75" r="3" fill="#7aabcf"/>
  <line x1="210" y1="75" x2="230" y2="75" stroke="#888" stroke-width="1"/>
  <line x1="230" y1="55" x2="230" y2="95" stroke="#c9a060" stroke-width="2.5" marker-end="url(#fa)"/>
  <text x="233" y="76" font-size="8" fill="#c9a060">F</text>
  <text x="215" y="56" font-size="7.5" fill="#888">d</text>
  <text x="160" y="110" font-size="7.5" fill="#c9a060">τ = F·d</text>
 </svg>`,
 caption:'Inclined plane: rotate axes to align with slope. Torque = force × perpendicular distance from pivot.',
 steps:['Draw the FBD: one dot for each body, every force as a labelled arrow.','For inclined planes: tilt your axes so x is along the slope — this eliminates one unknown from each equation.','Write ΣFₓ=maₓ and ΣFy=may separately. On a flat surface with no vertical motion, N=mg.','Friction force: static friction adjusts to prevent motion up to μₛN; once sliding, kinetic friction = μₖN (always opposing motion).','For torque equilibrium: choose the pivot at an unknown force to eliminate it from the moment equation.'],
 example:'Block m=5 kg on θ=30° slope, μₖ=0.2. N=5·10·cos30°=43.3 N. Friction=0.2·43.3=8.66 N. Net force down slope=5·10·sin30°−8.66=25−8.66=16.34 N. a=16.34/5=3.27 m/s².'},

/* ── WORK, ENERGY & MOMENTUM ────────────────────── */
{cat:'Physics',tags:['physics','engineering'],
 title:'Work, Energy, Power & Momentum–Collisions',
 theory:'',
 reality:'A crash investigator measures skid marks to calculate how fast a car was going before impact — using energy and momentum. Solar panels are rated in watts, which is power. The energy in a bouncing ball follows the same conservation laws as a rocket in flight.',
 formula:'Work: W = F·d·cosθ  (J)\nKE = ½mv²   PE = mgh (gravitational)\nPE_spring = ½kx²\nWork-Energy Thm: W_net = ΔKE\nConservation: KE₁+PE₁ = KE₂+PE₂ (conservative forces)\nPower: P = W/t = F·v  (W = J/s)\nMomentum: p = mv\nImpulse: J = FΔt = Δp\nConservation of p: Σpᵢ = Σpf\nElastic: KE conserved, p conserved\nInelastic: only p conserved\nPerfectly inelastic: bodies stick → v_f=(m₁v₁+m₂v₂)/(m₁+m₂)',
 method:'Energy method vs Newton method: use energy when you want speed at a point without knowing time or intermediate forces. Use Newton when you need forces, time, or acceleration. They give the same answer — choose whichever gives fewer unknowns.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <line x1="14" y1="108" x2="246" y2="108" stroke="#444" stroke-width="1"/>
  <!-- incline energy -->
  <polygon points="14,108 130,108 130,40" fill="rgba(122,171,207,.06)" stroke="#7aabcf" stroke-width="1"/>
  <circle cx="30" cy="105" r="7" fill="rgba(201,160,96,.3)" stroke="#c9a060" stroke-width="1.5"/>
  <circle cx="120" cy="44" r="7" fill="rgba(122,176,96,.3)" stroke="#7ab060" stroke-width="1.5"/>
  <text x="22" y="98" font-size="7.5" fill="#c9a060">KE₁=½mv²</text>
  <text x="88" y="38" font-size="7.5" fill="#7ab060">PE₂=mgh</text>
  <path d="M37 100 Q80 60 112 50" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="65" y="78" font-size="8" fill="#888">KE₁→PE₂</text>
  <!-- collision -->
  <rect x="148" y="82" width="36" height="22" rx="4" fill="rgba(122,171,207,.2)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="166" y="97" text-anchor="middle" font-size="8.5" fill="#7aabcf" font-weight="700">m₁</text>
  <rect x="192" y="82" width="36" height="22" rx="4" fill="rgba(201,160,96,.2)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="210" y="97" text-anchor="middle" font-size="8.5" fill="#c9a060" font-weight="700">m₂</text>
  <line x1="186" y1="93" x2="196" y2="93" stroke="#c07070" stroke-width="2"/>
  <text x="190" y="88" font-size="7.5" fill="#c07070">→</text>
  <text x="166" y="78" font-size="7.5" fill="#7aabcf">v₁→</text>
  <text x="204" y="78" font-size="7.5" fill="#c9a060">←v₂</text>
  <text x="190" y="116" text-anchor="middle" font-size="8" fill="#888">m₁v₁+m₂v₂=const</text>
 </svg>`,
 caption:'Energy conserved along frictionless path: KE at bottom = PE at top. Collision: momentum always conserved regardless of type.',
 steps:['Identify all forces — label conservative (gravity, spring) and non-conservative (friction, applied).','If only conservative forces act: KE₁+PE₁=KE₂+PE₂. If friction acts: KE₁+PE₁=KE₂+PE₂+W_friction.','For collisions: always write momentum conservation p_before=p_after.','For elastic collisions: also write KE conservation or use elastic collision formulas.','Perfectly inelastic: bodies stick together after collision. Use momentum conservation to find v_f.'],
 example:'Ball m=0.5 kg dropped from h=5 m: v=√(2gh)=√100=10 m/s on impact. Elastic collision m₁=2 kg, v₁=4 m/s hits m₂=2 kg at rest: v₁_f=0, v₂_f=4 m/s (equal masses exchange velocities). ✓ KE: ½(2)(16)=½(2)(16).'},

/* ── HEAT & THERMODYNAMICS ──────────────────────── */
{cat:'Physics',tags:['physics','chemistry','engineering'],
 title:'Heat, Thermodynamics & Thermal Machines',
 theory:'',
 reality:'A refrigerator pumps heat from inside to outside — that is the second law of thermodynamics. Car engines convert fuel heat into wheel motion. Your home insulation rating describes how well it resists heat flow. Thermodynamics explains every engine and air conditioner ever built.',
 formula:'Temperature: K = °C + 273.15\nHeat: Q = mcΔT  (specific heat)\nLatent heat: Q = m·L\nFirst Law: ΔU = Q − W\nW (gas expanding): W = pΔV (isobaric)\nProcesses:\n  Isothermal (T=const): ΔU=0, Q=W\n  Adiabatic (Q=0): ΔU=−W\n  Isochoric (V=const): W=0, ΔU=Q\n  Isobaric (p=const): W=pΔV\nCarnot efficiency: η=1−T_cold/T_hot\nCOP (heat pump): COP=Q_hot/W = T_hot/(T_hot−T_cold)',
 method:'Thermal equilibrium problem: set Qgained=Qlost (heat gained by cooler body = heat lost by warmer body). Q=mcΔT for each component. The final temperature is found by solving the equation — it must lie between the initial temperatures.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <!-- Carnot engine diagram -->
  <rect x="90" y="10" width="80" height="28" rx="6" fill="rgba(192,112,112,.15)" stroke="#c07070" stroke-width="1.5"/>
  <text x="130" y="28" text-anchor="middle" font-size="9" fill="#c07070" font-weight="700">T_hot (source)</text>
  <rect x="90" y="80" width="80" height="28" rx="6" fill="rgba(122,171,207,.15)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="130" y="98" text-anchor="middle" font-size="9" fill="#7aabcf" font-weight="700">T_cold (sink)</text>
  <rect x="106" y="44" width="48" height="30" rx="6" fill="rgba(122,176,96,.15)" stroke="#7ab060" stroke-width="2"/>
  <text x="130" y="62" text-anchor="middle" font-size="9" fill="#7ab060" font-weight="700">ENGINE</text>
  <line x1="130" y1="38" x2="130" y2="44" stroke="#c07070" stroke-width="2"/>
  <line x1="130" y1="74" x2="130" y2="80" stroke="#7aabcf" stroke-width="2"/>
  <line x1="154" y1="59" x2="190" y2="59" stroke="#c9a060" stroke-width="2.5"/>
  <text x="196" y="63" font-size="10" fill="#c9a060" font-weight="700">W</text>
  <text x="112" y="40" font-size="8" fill="#c07070">Q_hot</text>
  <text x="112" y="78" font-size="8" fill="#7aabcf">Q_cold</text>
  <text x="10" y="30" font-size="8" fill="#888">η=1−T_c/T_h</text>
  <text x="10" y="44" font-size="8" fill="#888">W=Q_hot−Q_cold</text>
  <text x="10" y="58" font-size="8" fill="#888">ΔU=Q−W</text>
  <text x="10" y="72" font-size="8" fill="#7aabcf">Isothermal: T=const</text>
  <text x="10" y="86" font-size="8" fill="#c9a060">Adiabatic: Q=0</text>
  <text x="10" y="100" font-size="8" fill="#7ab060">Isochoric: V=const</text>
 </svg>`,
 caption:'Carnot engine: takes Q_hot from hot source, outputs W, dumps Q_cold to cold sink. η=1−T_c/T_h is the theoretical maximum.',
 steps:['Convert all temperatures to Kelvin before using gas law or efficiency formulas.','For Q=mcΔT: m in kg, c in J/(kg·K), ΔT=T_final−T_initial (sign gives heat direction).','For phase changes: Q=mL (no temperature change during the phase transition).','First Law: ΔU=Q−W. For an ideal gas: ΔU=(n·Cv·ΔT) and depends only on temperature.','Carnot efficiency is the upper bound — real engines are always less efficient due to irreversible processes.'],
 example:'Carnot engine between 500 K and 300 K: η=1−300/500=40%. For every 100 J from hot source, maximum 40 J can become work; 60 J goes to the cold sink. Thermal equilibrium: 0.5 kg water at 20°C + 2 kg at 80°C: 0.5·4200·(T−20)=2·4200·(80−T) → T=68°C.'},

/* ── HYDROSTATICS & HYDRODYNAMICS ───────────────── */
{cat:'Physics',tags:['physics','engineering'],
 title:'Fluid Mechanics: Pascal, Archimedes & Bernoulli',
 theory:'',
 reality:'A steel ship floats because of buoyancy — water pushes up with a force equal to the weight of water displaced (Archimedes). A car lift uses Pascal\'s law to multiply force with hydraulic pressure. An airplane wing creates lift because faster air above it means lower pressure below.',
 formula:'Hydrostatic pressure: P = P₀ + ρgh\nPascal: ΔP transmitted uniformly → F₁/A₁ = F₂/A₂\nArchimedes: E = ρ_fluid·V_submerged·g\nFloating: ρ_object/ρ_fluid = V_submerged/V_total\nContinuity: S₁v₁ = S₂v₂  (A·v = Q)\nBernoulli: p + ½ρv² + ρgh = constant\nToricelli: v_exit = √(2gh)\nReynolds: Re = ρvL/η',
 method:'Bernoulli application: identify two points along a streamline, write p₁+½ρv₁²+ρgh₁=p₂+½ρv₂²+ρgh₂. If the pipe is horizontal, ρgh terms cancel. Combine with continuity S₁v₁=S₂v₂ to eliminate one unknown.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <!-- Venturi tube / Bernoulli -->
  <path d="M10 45 L70 45 Q90 45 95 55 L165 55 Q170 45 190 45 L250 45" fill="none" stroke="#7aabcf" stroke-width="2"/>
  <path d="M10 75 L70 75 Q90 75 95 65 L165 65 Q170 75 190 75 L250 75" fill="none" stroke="#7aabcf" stroke-width="2"/>
  <text x="40" y="63" text-anchor="middle" font-size="8" fill="#7aabcf">S₁,v₁,p₁</text>
  <text x="130" y="62" text-anchor="middle" font-size="8" fill="#c9a060">S₂,v₂,p₂</text>
  <text x="220" y="63" text-anchor="middle" font-size="8" fill="#7aabcf">S₁,v₁</text>
  <!-- pressure gauges -->
  <line x1="40" y1="45" x2="40" y2="20" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="40" y="16" text-anchor="middle" font-size="8" fill="#888">p₁ high</text>
  <line x1="130" y1="55" x2="130" y2="30" stroke="#888" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="130" y="26" text-anchor="middle" font-size="8" fill="#c07070">p₂ low</text>
  <!-- Archimedes inset -->
  <rect x="176" y="80" width="70" height="36" rx="4" fill="rgba(122,171,207,.12)" stroke="#7aabcf" stroke-width="1"/>
  <rect x="195" y="88" width="30" height="20" rx="3" fill="rgba(201,160,96,.2)" stroke="#c9a060" stroke-width="1.5"/>
  <line x1="210" y1="88" x2="210" y2="76" stroke="#7ab060" stroke-width="2"/>
  <text x="200" y="73" font-size="7.5" fill="#7ab060">E=ρ_f·V·g</text>
  <text x="130" y="108" text-anchor="middle" font-size="8" fill="#888">Bernoulli: p+½ρv²+ρgh=const · Narrow→fast→low pressure</text>
 </svg>`,
 caption:'Venturi effect: narrowing increases v, decreases p. Archimedes buoyancy = weight of displaced fluid.',
 steps:['For hydrostatic problems: P=P₀+ρgh — pressure increases linearly with depth.','Pascal\'s principle: F₁/A₁=F₂/A₂ — a hydraulic press multiplies force by area ratio.','Archimedes: buoyant force = weight of fluid displaced. Object floats if ρ_object < ρ_fluid.','Continuity equation: in an incompressible fluid, volume flow rate Q=Av is constant — narrower means faster.','Bernoulli: apply at two points on the same streamline. Combine with continuity when both v and A are given.'],
 example:'Water flows through pipe: A₁=0.04 m², v₁=2 m/s. Narrows to A₂=0.01 m². Continuity: v₂=v₁A₁/A₂=8 m/s. Bernoulli (horizontal): p₁+½ρv₁²=p₂+½ρv₂². Δp=½·1000·(64−4)=30,000 Pa.'},

/* ── SIMPLE HARMONIC MOTION & WAVES ─────────────── */
{cat:'Physics',tags:['physics','engineering'],
 title:'SHM, Waves, Sound & Doppler Effect',
 theory:'',
 reality:'A fire truck siren sounds higher as it rushes toward you and lower as it drives away — that is the Doppler effect. Doctors use ultrasound waves to see babies before birth. Your speaker vibrates in simple harmonic motion to produce every sound you hear from music to speech.',
 formula:'SHM: x(t) = A·cos(ωt+φ₀)\nω = 2πf = 2π/T\nSpring: ω=√(k/m), T=2π√(m/k)\nPendulum: T=2π√(L/g)\nWave: v=λf,  y(x,t)=A·sin(kx−ωt)\nWave number: k=2π/λ\nSound intensity: β=10·log(I/I₀)  dB\nDoppler: f\'=f·(v±v_observer)/(v∓v_source)\nStanding waves (string, fixed both ends):\nλₙ=2L/n,  fₙ=nv/(2L)',
 method:'Doppler sign rule: numerator +v_observer when observer moves toward source; denominator −v_source when source moves toward observer. Invert these signs for moving away. Remember: a stationary reference = denominator v±0.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <!-- SHM sinusoid -->
  <line x1="10" y1="60" x2="160" y2="60" stroke="#444" stroke-width="1"/>
  <path d="M10 60 Q32 20 55 60 Q78 100 100 60 Q122 20 145 60" fill="none" stroke="#7aabcf" stroke-width="2.5"/>
  <line x1="10"  y1="20" x2="10"  y2="100" stroke="#444" stroke-width="1"/>
  <line x1="55"  y1="20" x2="55"  y2="60"  stroke="#c9a060" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="145" y1="20" x2="145" y2="60"  stroke="#c9a060" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="55"  y1="18" x2="145" y2="18"  stroke="#c9a060" stroke-width="1.2"/>
  <text x="100" y="15" text-anchor="middle" font-size="8" fill="#c9a060">T = period</text>
  <line x1="10"  y1="22" x2="55"  y2="22"  stroke="#7ab060" stroke-width="1.2"/>
  <text x="32"   y="18" text-anchor="middle" font-size="8" fill="#7ab060">A</text>
  <text x="90"   y="50" font-size="8" fill="#7aabcf">x=Acos(ωt)</text>
  <!-- Standing wave inset -->
  <rect x="168" y="8" width="88" height="102" rx="6" fill="rgba(122,171,207,.06)" stroke="#7aabcf" stroke-width="1"/>
  <text x="212" y="20" text-anchor="middle" font-size="8" fill="#7aabcf" font-weight="700">Standing Waves</text>
  <line x1="176" y1="50" x2="248" y2="50" stroke="#888" stroke-width="1"/>
  <path d="M176 50 Q212 25 248 50" fill="none" stroke="#7ab060" stroke-width="2"/>
  <text x="212" y="40" text-anchor="middle" font-size="8" fill="#7ab060">n=1, λ=2L</text>
  <line x1="176" y1="80" x2="248" y2="80" stroke="#888" stroke-width="1"/>
  <path d="M176 80 Q194 64 212 80 Q230 96 248 80" fill="none" stroke="#c9a060" stroke-width="2"/>
  <text x="212" y="97" text-anchor="middle" font-size="8" fill="#c9a060">n=2, λ=L</text>
 </svg>`,
 caption:'SHM: amplitude A, period T. Standing wave: n=1 has half-wavelength = L (one loop). Harmonics at multiples of f₁.',
 steps:['SHM: identify k (spring constant) or L (pendulum length) and compute ω=√(k/m) or ω=√(g/L), then T=2π/ω.','Wave speed: v=λf. In a medium, v is fixed — if f increases, λ decreases proportionally.','For standing waves on a string of length L fixed at both ends: allowed wavelengths λₙ=2L/n, so f_n=nf₁.','Sound intensity level in dB: β=10·log(I/I₀) where I₀=10⁻¹² W/m². Every 10 dB = 10× intensity.','Doppler: observer moving toward source → higher f. Source moving toward observer → higher f. Both increase f_observed.'],
 example:'Spring m=0.2 kg, k=80 N/m: ω=√(80/0.2)=20 rad/s, T=2π/20=0.314 s. Sound source f=400 Hz, v_sound=340 m/s, source approaches at 34 m/s: f\'=400·340/(340−34)=400·340/306≈444 Hz.'},

/* ── OPTICS ─────────────────────────────────────── */
{cat:'Physics',tags:['physics','engineering'],
 title:'Geometric Optics: Reflection, Refraction & Lenses',
 theory:'',
 reality:'Your glasses or contacts refract light to correct your vision. A telescope uses curved mirrors to collect light from stars billions of miles away. Security cameras use wide-angle lenses. A rainbow forms because raindrops refract sunlight and split it into colors.',
 formula:'Reflection: θᵢ = θᵣ  (angle of incidence = angle of reflection)\nSnell\'s Law: n₁sinθ₁ = n₂sinθ₂\nRefractive index: n = c/v\nCritical angle: sinθ_c = n₂/n₁  (n₁ > n₂)\nMirror/Lens: 1/f = 1/s + 1/s\'\nMagnification: m = −s\'/s = y\'/y\nLens power: P = 1/f  (dioptres, f in metres)\nConvex lens/concave mirror: f > 0\nConcave lens/convex mirror: f < 0',
 method:'Sign convention: distances measured from the optical centre. Object distance s > 0 (always). Image distance s\' > 0 → real image (same side as outgoing light for lenses, same side as incoming for mirrors). s\' < 0 → virtual image. Magnification m < 0 → inverted image.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <!-- Convex lens -->
  <line x1="130" y1="8" x2="130" y2="110" stroke="#7aabcf" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="10"  y1="60" x2="250" y2="60" stroke="#444" stroke-width="1"/>
  <!-- Lens shape -->
  <path d="M126 20 Q118 60 126 100" fill="rgba(122,171,207,.18)" stroke="#7aabcf" stroke-width="1.5"/>
  <path d="M134 20 Q142 60 134 100" fill="rgba(122,171,207,.18)" stroke="#7aabcf" stroke-width="1.5"/>
  <!-- Object -->
  <line x1="60" y1="60" x2="60" y2="30" stroke="#c9a060" stroke-width="2.5"/>
  <text x="50" y="28" font-size="8" fill="#c9a060">obj</text>
  <!-- Rays -->
  <line x1="60" y1="30" x2="130" y2="30" stroke="#c07070" stroke-width="1.2"/>
  <line x1="130" y1="30" x2="200" y2="90" stroke="#c07070" stroke-width="1.2"/>
  <line x1="60" y1="30" x2="130" y2="60" stroke="#7ab060" stroke-width="1.2"/>
  <line x1="130" y1="60" x2="200" y2="90" stroke="#7ab060" stroke-width="1.2"/>
  <!-- Image -->
  <line x1="200" y1="60" x2="200" y2="90" stroke="#c07070" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="204" y="88" font-size="8" fill="#c07070">img</text>
  <!-- focal points -->
  <circle cx="172" cy="60" r="3" fill="#888"/>
  <text x="172" y="56" text-anchor="middle" font-size="8" fill="#888">F</text>
  <circle cx="88"  cy="60" r="3" fill="#888"/>
  <text x="88"  y="56" text-anchor="middle" font-size="8" fill="#888">F</text>
  <text x="20" y="108" font-size="8" fill="#888">1/f = 1/s + 1/s'  ·  m = −s'/s</text>
 </svg>`,
 caption:'Convex lens: rays parallel to axis converge at focal point F. Real inverted image forms on far side. 1/f=1/s+1/s\'.',
 steps:['Apply Snell\'s law at every interface: n₁sinθ₁=n₂sinθ₂. Angles are measured from the normal, not the surface.','Total internal reflection occurs when light goes from dense to less-dense medium and θ > θ_critical = arcsin(n₂/n₁).','Mirror/lens equation: 1/f=1/s+1/s\'. Rearrange for the unknown. A positive s\' means real image (inverted, m<0).','For diverging lenses (f<0) or convex mirrors: the equation still works — just use negative f.','Magnification |m|>1 → image is enlarged; |m|<1 → reduced. m<0 → inverted; m>0 → upright.'],
 example:'Convex lens f=20 cm, object at s=30 cm: 1/s\'=1/20−1/30=3/60−2/60=1/60. s\'=60 cm (real). m=−60/30=−2 (inverted, twice as tall). Snell: light enters glass (n=1.5) at 30°: sinθ₂=sin30°/1.5=0.333 → θ₂=19.5°.'},

/* ── ELECTRICITY & MAGNETISM ────────────────────── */
{cat:'Physics',tags:['physics','engineering'],
 title:'Electricity: Coulomb, Electric Field, Capacitors & Circuits',
 theory:'',
 reality:'Every electronic device is a circuit. An electrician uses Ohm\'s law every day to safely wire a house. Your phone touchscreen detects your finger using tiny capacitors that sense changes when you touch the glass. Circuits power literally everything around you.',
 formula:'Coulomb: F = kq₁q₂/r²  (k=9×10⁹ N·m²/C²)\nElectric field: E = kQ/r²  (from point charge)\nGauss: ∮E·dA = Q_enclosed/ε₀\nPotential: V = kQ/r  (J/C = V)\nCapacitor: Q = CV,  U = Q²/(2C) = ½CV²\nParallel plates: C = ε₀A/d\nOhm: V = IR\nPower: P = IV = I²R = V²/R\nSeries R: R_total = ΣRᵢ\nParallel R: 1/R = Σ(1/Rᵢ)\nKVL: Σ voltages around loop = 0\nKCL: Σ currents into node = 0',
 method:'Gauss\'s law shortcut: for high-symmetry charge distributions (sphere, cylinder, plane) the flux integral reduces to E·(surface area) = Q_enclosed/ε₀. This gives E directly without integration.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <!-- Field lines around positive charge -->
  <circle cx="70" cy="60" r="8" fill="rgba(201,160,96,.3)" stroke="#c9a060" stroke-width="2"/>
  <text x="70" y="64" text-anchor="middle" font-size="9" fill="#c9a060" font-weight="700">+Q</text>
  <line x1="80" y1="54" x2="102" y2="38" stroke="#c9a060" stroke-width="1.2"/>
  <line x1="78" y1="60" x2="104" y2="60" stroke="#c9a060" stroke-width="1.2"/>
  <line x1="80" y1="66" x2="102" y2="80" stroke="#c9a060" stroke-width="1.2"/>
  <line x1="70" y1="52" x2="70" y2="28" stroke="#c9a060" stroke-width="1.2"/>
  <line x1="60" y1="54" x2="38" y2="38" stroke="#c9a060" stroke-width="1.2"/>
  <line x1="62" y1="60" x2="36" y2="60" stroke="#c9a060" stroke-width="1.2"/>
  <text x="70" y="108" text-anchor="middle" font-size="8" fill="#888">E=kQ/r²  radially outward</text>
  <!-- Capacitor -->
  <line x1="150" y1="30" x2="150" y2="90" stroke="#7aabcf" stroke-width="3"/>
  <line x1="170" y1="30" x2="170" y2="90" stroke="#7aabcf" stroke-width="3"/>
  <line x1="130" y1="60" x2="150" y2="60" stroke="#888" stroke-width="1.5"/>
  <line x1="170" y1="60" x2="190" y2="60" stroke="#888" stroke-width="1.5"/>
  <text x="160" y="110" text-anchor="middle" font-size="8" fill="#7aabcf">C=ε₀A/d  Q=CV</text>
  <!-- Series-parallel -->
  <rect x="198" y="30" width="25" height="15" rx="3" fill="none" stroke="#7ab060" stroke-width="1.5"/>
  <text x="210" y="42" text-anchor="middle" font-size="8" fill="#7ab060">R₁</text>
  <rect x="198" y="55" width="25" height="15" rx="3" fill="none" stroke="#7ab060" stroke-width="1.5"/>
  <text x="210" y="67" text-anchor="middle" font-size="8" fill="#7ab060">R₂</text>
  <line x1="210" y1="30" x2="210" y2="20" stroke="#7ab060" stroke-width="1.2"/>
  <line x1="210" y1="70" x2="210" y2="80" stroke="#7ab060" stroke-width="1.2"/>
  <text x="210" y="95" text-anchor="middle" font-size="8" fill="#7ab060">parallel</text>
 </svg>`,
 caption:'Electric field lines point outward from positive charges. Parallel plate capacitor: E=σ/ε₀ between plates, uniform field.',
 steps:['Coulomb\'s law gives force between two point charges; electric field E=F/q is the force per unit charge.','For multiple charges: E fields add as vectors (superposition) — compute x and y components separately.','Circuit analysis: identify series (same current) vs parallel (same voltage) connections.','KVL: sum of all voltage drops and rises around any closed loop = 0.','KCL: current into a node = current out. Use these to write equations for unknown currents.'],
 example:'Two charges q₁=+2μC, q₂=−3μC, 0.3 m apart: F=9×10⁹·2×10⁻⁶·3×10⁻⁶/0.09=0.6 N (attractive). Capacitor C=10 μF, V=12 V: Q=120 μC, U=½·10⁻⁵·144=7.2×10⁻⁴ J.'},

/* ── MAGNETISM & INDUCTION ──────────────────────── */
{cat:'Physics',tags:['physics','engineering'],
 title:'Magnetism: Lorentz Force, Biot-Savart & Induction',
 theory:'',
 reality:'Electric motors spin because magnetic fields push on moving electrons — that is the Lorentz force. Every generator in a power plant, wind turbine, or car alternator works through electromagnetic induction. MRI machines use powerful magnetic fields to photograph the inside of your body without any cutting.',
 formula:'Lorentz force: F = qv×B  |F|=qvBsinθ\nBiot-Savart (long wire): B = μ₀I/(2πr)\nSolenoid: B = μ₀nI  (n=turns/length)\nMagnetic flux: Φ = B·A·cosθ\nFaraday: ε = −dΦ/dt = −N·dΦ/dt (N turns)\nLenz: induced current opposes the change in flux\nForce on wire: F = BIL·sinθ\nTransformer: V₁/V₂ = N₁/N₂  (ideal)',
 method:'Lenz\'s law right-hand rule: point thumb in direction of increasing flux — induced current flows in the direction your curled fingers resist that change (always opposes the change). For the force on a moving charge: use F=qv×B with the right-hand rule.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <!-- Solenoid -->
  <rect x="8" y="38" width="120" height="40" rx="5" fill="rgba(122,171,207,.08)" stroke="#7aabcf" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="8"  y1="38" x2="8"  y2="78" stroke="#7aabcf" stroke-width="2"/>
  <line x1="128" y1="38" x2="128" y2="78" stroke="#7aabcf" stroke-width="2"/>
  <text x="68" y="62" text-anchor="middle" font-size="8.5" fill="#7aabcf">B = μ₀nI →</text>
  <line x1="24" y1="58" x2="104" y2="58" stroke="#c9a060" stroke-width="1.5"/>
  <text x="68" y="88" text-anchor="middle" font-size="8" fill="#888">Solenoid: uniform B inside</text>
  <!-- Moving charge Lorentz -->
  <line x1="148" y1="60" x2="210" y2="60" stroke="#c9a060" stroke-width="2"/>
  <text x="215" y="64" font-size="8.5" fill="#c9a060" font-weight="700">v→</text>
  <text x="190" y="44" font-size="8.5" fill="#7aabcf">⊗ B (into page)</text>
  <line x1="183" y1="60" x2="183" y2="28" stroke="#c07070" stroke-width="2"/>
  <text x="186" y="25" font-size="8" fill="#c07070">F=qvB ↑</text>
  <circle cx="183" cy="60" r="5" fill="rgba(201,160,96,.3)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="183" y="64" text-anchor="middle" font-size="7" fill="#c9a060">q</text>
  <!-- Faraday loop -->
  <rect x="148" y="80" width="70" height="30" rx="4" fill="rgba(122,176,96,.10)" stroke="#7ab060" stroke-width="1.5"/>
  <text x="183" y="93" text-anchor="middle" font-size="8" fill="#7ab060">ε = −dΦ/dt</text>
  <text x="183" y="106" text-anchor="middle" font-size="7.5" fill="#7ab060">Lenz opposes ΔΦ</text>
 </svg>`,
 caption:'Solenoid: uniform field inside B=μ₀nI. Lorentz force F=qvB⊥v and ⊥B. Faraday: changing flux induces EMF opposing the change.',
 steps:['Lorentz force direction: use right-hand rule for positive charges (F=qv×B). For negative charges, reverse direction.','Magnetic force on a current-carrying wire: F=BIL·sinθ. Two parallel wires carrying current attract if in same direction, repel if opposite.','Magnetic flux Φ=BAcosθ — only the component of B perpendicular to the area matters.','Faraday\'s law: EMF=−dΦ/dt. A changing B, changing area, or rotation all change flux.','Transformer: ideal → V₁/V₂=N₁/N₂ and I₁/I₂=N₂/N₁ (power conserved: V₁I₁=V₂I₂).'],
 example:'Solenoid n=1000 turns/m, I=2 A: B=4π×10⁻⁷·1000·2≈2.51×10⁻³ T. Loop area=0.05 m², B changes from 0.2 to 0.5 T in 0.1 s: ε=−(0.5−0.2)·0.05/0.1=−0.15 V. Transformer 220 V/110 V: N₁/N₂=2. If I₁=1 A, then I₂=2 A.'},

/* ── RELATIVITY & QUANTUM ───────────────────────── */
{cat:'Physics',tags:['physics','science'],
 title:'Special Relativity, Quantum Physics & Nuclear Basics',
 theory:'',
 reality:'GPS satellites must correct for time running slightly differently in orbit due to relativity — otherwise your maps would be off by miles every day. Nuclear power plants split uranium atoms to generate electricity for millions of homes. Solar panels work because light knocks electrons loose — pure quantum physics.',
 formula:'Lorentz factor: γ = 1/√(1−v²/c²)\nTime dilation: Δt = γΔt₀\nLength contraction: L = L₀/γ\nMass-energy: E = mc²  (rest energy)\nRelativistic KE: K = (γ−1)mc²\nPhotoelectric: E = hf − W  (h=6.63×10⁻³⁴ J·s)\nDe Broglie: λ = h/mv = h/p\nHeisenberg: Δx·Δp ≥ h/(4π)\nBohr hydrogen: Eₙ = −13.6/n²  eV\nRadioactive decay: N = N₀e^(−λt)\nHalf-life: T½ = ln2/λ',
 method:'Radioactive decay: activity A=λN. After n half-lives, N=N₀/2ⁿ. For carbon dating or half-life problems, identify initial amount, current amount, and solve for t using N=N₀e^(−λt) with λ=ln2/T½.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <!-- Photoelectric -->
  <rect x="4" y="8" width="118" height="106" rx="7" fill="rgba(122,171,207,.06)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="63" y="22" text-anchor="middle" font-size="8.5" fill="#7aabcf" font-weight="700">Photoelectric Effect</text>
  <rect x="16" y="60" width="88" height="40" rx="4" fill="rgba(122,171,207,.12)" stroke="#7aabcf" stroke-width="1"/>
  <text x="60" y="84" text-anchor="middle" font-size="8.5" fill="#9ecef0">Metal surface</text>
  <line x1="34" y1="32" x2="34" y2="60" stroke="#c9a060" stroke-width="2"/>
  <line x1="50" y1="32" x2="50" y2="60" stroke="#c9a060" stroke-width="2"/>
  <text x="60" y="30" text-anchor="middle" font-size="8" fill="#c9a060">hf photons</text>
  <line x1="60" y1="60" x2="80" y2="40" stroke="#7ab060" stroke-width="2"/>
  <text x="84" y="38" font-size="8" fill="#7ab060">e⁻</text>
  <text x="14" y="106" font-size="8" fill="#888">KE=hf−W</text>
  <!-- Decay curve -->
  <rect x="138" y="8" width="118" height="106" rx="7" fill="rgba(201,160,96,.06)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="197" y="22" text-anchor="middle" font-size="8.5" fill="#c9a060" font-weight="700">Radioactive Decay</text>
  <line x1="148" y1="100" x2="248" y2="100" stroke="#444" stroke-width="1"/>
  <line x1="148" y1="28" x2="148" y2="104" stroke="#444" stroke-width="1"/>
  <path d="M148 32 Q168 32 178 52 Q188 72 198 80 Q218 88 248 94" fill="none" stroke="#c9a060" stroke-width="2.5"/>
  <line x1="148" y1="62" x2="178" y2="62" stroke="#c07070" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="178" y1="62" x2="178" y2="100" stroke="#c07070" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="163" y="58" font-size="8" fill="#c07070">T½</text>
  <text x="163" y="96" font-size="8" fill="#c07070">N₀/2</text>
  <text x="148" y="116" font-size="7.5" fill="#888">N=N₀e^(−λt), T½=ln2/λ</text>
 </svg>`,
 caption:'Photoelectric: photon energy hf must exceed work function W to eject electron. Decay: exponential decrease, halving every T½.',
 steps:['Lorentz factor γ≥1; at v=0, γ=1 (no relativistic effects). At v=0.99c, γ≈7.','Time dilation: moving clocks run slow. Δt=γΔt₀ — proper time Δt₀ is measured in the rest frame.','Photoelectric: incident photon must have f>f_threshold. Extra energy goes into kinetic energy of ejected electron.','De Broglie: all matter has wave properties. λ=h/p — significant only for very small masses (electrons, not baseballs).','Radioactive decay: identify T½ from problem, compute λ=ln2/T½, then apply N=N₀e^(−λt) or use N₀/2ⁿ for integer n half-lives.'],
 example:'Carbon-14 T½=5730 years. Fossil has 25% of original C-14: N/N₀=0.25=e^(−λt). ln(0.25)=−λt → t=2·T½=11,460 years (since 0.25=(1/2)²). Photoelectric: hf=6.63×10⁻³⁴·8×10¹⁴=5.3×10⁻¹⁹ J. W=2 eV=3.2×10⁻¹⁹ J. KE=5.3−3.2=2.1×10⁻¹⁹ J.'},

/* ── GRAVITATIONAL FIELD ────────────────────────── */
{cat:'Physics',tags:['physics','engineering'],
 title:'Gravitational Field, Kepler\'s Laws & Orbital Mechanics',
 theory:'',
 reality:'Planets orbit the Sun in precise oval paths that Kepler described centuries before space travel existed. GPS satellites orbit at a precise altitude to stay in sync with Earth\'s rotation. SpaceX engineers use these same equations to launch rockets and land them back on the pad.',
 formula:'Newton: F = Gm₁m₂/r²  (G=6.67×10⁻¹¹ N·m²/kg²)\nGravitational field: g = GM/r²\nGravitational PE: U = −GMm/r\nOrbital speed: v = √(GM/r)\nEscape velocity: v_e = √(2GM/r)\nKepler 1st: elliptical orbits, Sun at focus\nKepler 2nd: equal areas in equal times (L conserved)\nKepler 3rd: T² ∝ r³  →  T²=4π²r³/(GM)',
 method:'For satellite orbit problems: set gravitational force equal to centripetal force. GMm/r²=mv²/r → v=√(GM/r). This gives orbital speed at any radius. Total orbital energy = KE+PE = −GMm/(2r) — always negative for a bound orbit.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <!-- Elliptical orbit -->
  <ellipse cx="120" cy="62" rx="95" ry="50" fill="none" stroke="#7aabcf" stroke-width="2"/>
  <!-- Sun at focus -->
  <circle cx="82" cy="62" r="8" fill="rgba(201,160,96,.5)" stroke="#c9a060" stroke-width="2"/>
  <text x="82" y="66" text-anchor="middle" font-size="7.5" fill="#c9a060">☉</text>
  <!-- Satellite positions -->
  <circle cx="215" cy="62" r="5" fill="rgba(122,171,207,.5)" stroke="#7aabcf" stroke-width="1.5"/>
  <circle cx="25"  cy="62" r="5" fill="rgba(122,171,207,.5)" stroke="#7aabcf" stroke-width="1.5"/>
  <!-- Kepler 2nd law areas -->
  <path d="M82 62 L215 62 A95 50 0 0 0 200 25 Z" fill="rgba(122,176,96,.15)" stroke="none"/>
  <path d="M82 62 L25  62 A95 50 0 0 1 60  25 Z" fill="rgba(192,112,112,.15)" stroke="none"/>
  <text x="182" y="52" font-size="7.5" fill="#7ab060">equal</text>
  <text x="38"  y="48" font-size="7.5" fill="#c07070">areas</text>
  <text x="120" y="118" text-anchor="middle" font-size="8" fill="#888">T²∝r³  ·  v=√(GM/r)  ·  v_e=√(2GM/r)</text>
 </svg>`,
 caption:'Kepler 2nd law: equal shaded areas swept in equal times (same orbit). Perihelion (close) → fast; aphelion (far) → slow.',
 steps:['Gravitational force follows inverse-square law: doubling the distance → ¼ the force.','Orbital speed: set F_grav = F_centripetal → GMm/r²=mv²/r → v=√(GM/r). Speed decreases with larger orbit.','Kepler\'s 3rd law: T²/r³=4π²/(GM) — same constant for all satellites orbiting the same central body.','Escape velocity: v_e=√(2GM/r) — set total energy to zero (KE+PE=0). At Earth\'s surface ≈11.2 km/s.','Gravitational PE is negative: U=−GMm/r. As r→∞, U→0. Binding energy = |U|−KE = GMm/(2r).'],
 example:'Geostationary orbit (T=24 h=86400 s): r³=GMT²/(4π²)=6.67×10⁻¹¹·6×10²⁴·(86400)²/(4π²). r≈4.2×10⁷ m ≈ 42,000 km. Orbital speed: v=√(6.67×10⁻¹¹·6×10²⁴/4.2×10⁷)≈3.07 km/s.'},

/* ── ATOMIC STRUCTURE & PERIODIC TABLE ─────────── */
{cat:'Chemistry',tags:['chemistry','physics','science'],
 title:'Atomic Structure, Electronic Configuration & Periodic Trends',
 theory:'',
 reality:'Your non-stick pan is coated with Teflon — made of fluorine atoms that grip their electrons tightly. Gold does not rust because its electron arrangement is extremely stable. The periodic table lets chemists predict which atoms will bond, react violently, or do absolutely nothing.',
 formula:'Atomic number Z = number of protons\nMass number A = protons + neutrons\nElectronic config: 1s² 2s² 2p⁶ 3s² 3p⁶...\nMax electrons per sublevel: s=2, p=6, d=10, f=14\nBohr energy: Eₙ = −13.6/n² eV (hydrogen)\nRydberg: 1/λ = Rₕ(1/n₁² − 1/n₂²)\nIonisation energy trend: increases → across period, ↓ down group\nAtomic radius trend: decreases → across period, ↑ down group\nElectronegativity: increases → and ↑ (except noble gases)',
 method:'Electron configuration shortcut: use the noble gas core in brackets, then continue from after it. For transition metals, remember Cr=[Ar]3d⁵4s¹ and Cu=[Ar]3d¹⁰4s¹ (half-filled and fully-filled d shells are extra stable).',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <!-- Periodic table trends arrows -->
  <rect x="10" y="10" width="240" height="96" rx="8" fill="rgba(122,171,207,.06)" stroke="#7aabcf" stroke-width="1.5"/>
  <!-- Simplified periodic table block -->
  <text x="130" y="26" text-anchor="middle" font-size="9" fill="#7aabcf" font-weight="700">Periodic Trends</text>
  <!-- Period arrow (left to right) -->
  <line x1="30" y1="50" x2="200" y2="50" stroke="#c9a060" stroke-width="2.5"/>
  <polygon points="200,46 210,50 200,54" fill="#c9a060"/>
  <text x="120" y="44" text-anchor="middle" font-size="8.5" fill="#c9a060">→ IE ↑  radius ↓  EN ↑</text>
  <!-- Group arrow (top to bottom) -->
  <line x1="228" y1="30" x2="228" y2="96" stroke="#c07070" stroke-width="2.5"/>
  <polygon points="224,96 228,106 232,96" fill="#c07070"/>
  <text x="228" y="26" text-anchor="middle" font-size="8" fill="#c07070">↓</text>
  <text x="246" y="65" font-size="8" fill="#c07070" transform="rotate(90,228,65)">IE ↓  radius ↑</text>
  <!-- Orbital filling -->
  <text x="25" y="72" font-size="8" fill="#7ab060">Aufbau: 1s 2s 2p 3s 3p 4s 3d 4p...</text>
  <text x="25" y="86" font-size="8" fill="#9ecef0">Pauli: max 2 e⁻/orbital (↑↓)</text>
  <text x="25" y="100" font-size="8" fill="#c9a060">Hund: fill empty first (↑↑↑ before ↑↓)</text>
 </svg>`,
 caption:'Trends across period: IE and EN increase, radius decreases. Down a group: opposite. Orbital filling follows Aufbau, Pauli, Hund.',
 steps:['Write electron configuration: fill sublevels in Aufbau order (1s 2s 2p 3s 3p 4s 3d...).','Use noble gas core shorthand: Na=[Ne]3s¹ (Ne ends at Z=10, Na adds one 3s electron).','Note exceptions: Cr=[Ar]3d⁵4s¹ and Cu=[Ar]3d¹⁰4s¹ — half-filled and full d shells gain extra stability.','Periodic trends: ionisation energy increases left→right (nuclear charge increases, same shielding); decreases top→bottom (more shielding, larger radius).','Electronegativity highest at F (3.98); increases across periods and up groups following the same logic as IE.'],
 example:'Fe (Z=26): [Ar]3d⁶4s². Fe²⁺ loses 4s first: [Ar]3d⁶. Fe³⁺: [Ar]3d⁵. Rydberg: light emitted when H transitions n=3→n=2: 1/λ=1.097×10⁷(1/4−1/9)=1.524×10⁶ m⁻¹ → λ=656 nm (red, visible).'},

/* ── CHEMICAL BONDING ───────────────────────────── */
{cat:'Chemistry',tags:['chemistry','science'],
 title:'Chemical Bonding: Ionic, Covalent, VSEPR & Hybridisation',
 theory:'',
 reality:'Table salt forms because sodium gives an electron to chlorine — ionic bonding. Water is bent in shape (VSEPR), making it polar, which is why it dissolves salt but not oil. The shape of a molecule determines its smell, melting point, and how it reacts with your body.',
 formula:'Ionic: Δ electronegativity > 1.7 → ionic\nCovalent: ΔEN < 1.7 → covalent (< 0.5 nonpolar)\nBond order = (bonding e⁻ − antibonding e⁻)/2\nFormal charge = valence e⁻ − lone e⁻ − ½ bonding e⁻\nVSEPR pairs → geometry:\n  2 → linear (180°)\n  3 → trigonal planar (120°)\n  4 → tetrahedral (109.5°)\n  5 → trigonal bipyramidal\n  6 → octahedral (90°)\nHybridisation: sp(2 regions), sp²(3), sp³(4)\nσ bond: head-on overlap; π bond: side-on',
 method:'Lewis structure method: (1) count total valence electrons, (2) connect atoms with single bonds, (3) fill octets on outer atoms first, (4) give remaining electrons to central atom, (5) convert lone pairs to multiple bonds if central atom lacks octet. Minimise formal charges.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="4" y="4" width="118" height="110" rx="7" fill="rgba(122,171,207,.06)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="63" y="18" text-anchor="middle" font-size="8.5" fill="#7aabcf" font-weight="700">VSEPR Geometries</text>
  <!-- Linear -->
  <circle cx="28" cy="36" r="7" fill="rgba(122,171,207,.3)" stroke="#7aabcf" stroke-width="1"/>
  <circle cx="63" cy="36" r="7" fill="rgba(201,160,96,.3)" stroke="#c9a060" stroke-width="1.5"/>
  <circle cx="98" cy="36" r="7" fill="rgba(122,171,207,.3)" stroke="#7aabcf" stroke-width="1"/>
  <line x1="35" y1="36" x2="56" y2="36" stroke="#888" stroke-width="1.5"/>
  <line x1="70" y1="36" x2="91" y2="36" stroke="#888" stroke-width="1.5"/>
  <text x="63" y="52" text-anchor="middle" font-size="8" fill="#888">linear 180°</text>
  <!-- Tetrahedral -->
  <circle cx="63" cy="78" r="7" fill="rgba(201,160,96,.3)" stroke="#c9a060" stroke-width="1.5"/>
  <circle cx="32" cy="68" r="5" fill="rgba(192,112,112,.3)" stroke="#c07070" stroke-width="1"/>
  <circle cx="94" cy="68" r="5" fill="rgba(192,112,112,.3)" stroke="#c07070" stroke-width="1"/>
  <circle cx="45" cy="98" r="5" fill="rgba(192,112,112,.3)" stroke="#c07070" stroke-width="1"/>
  <circle cx="81" cy="98" r="5" fill="rgba(192,112,112,.3)" stroke="#c07070" stroke-width="1"/>
  <line x1="57" y1="73" x2="37" y2="70" stroke="#888" stroke-width="1.2"/>
  <line x1="69" y1="73" x2="89" y2="70" stroke="#888" stroke-width="1.2"/>
  <line x1="58" y1="83" x2="48" y2="95" stroke="#888" stroke-width="1.2"/>
  <line x1="68" y1="83" x2="78" y2="95" stroke="#888" stroke-width="1.2"/>
  <text x="63" y="112" text-anchor="middle" font-size="8" fill="#888">tetrahedral 109.5°</text>
  <!-- Right panel: hybridisation -->
  <rect x="134" y="4" width="122" height="110" rx="7" fill="rgba(201,160,96,.06)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="195" y="18" text-anchor="middle" font-size="8.5" fill="#c9a060" font-weight="700">Hybridisation</text>
  <text x="142" y="34" font-size="8" fill="#d4b87a">sp  → 2 σ bonds, linear</text>
  <text x="142" y="48" font-size="8" fill="#d4b87a">sp² → 3 σ bonds, 1 π bond</text>
  <text x="142" y="62" font-size="8" fill="#d4b87a">sp³ → 4 σ bonds, tetrahedral</text>
  <text x="142" y="78" font-size="8" fill="#c9a060">σ bonds: overlap along axis</text>
  <text x="142" y="92" font-size="8" fill="#c9a060">π bonds: side-on, above/below</text>
  <text x="142" y="106" font-size="8" fill="#888">C₂H₂: sp  C₂H₄: sp²  CH₄: sp³</text>
 </svg>`,
 caption:'VSEPR: electron pairs (bonding + lone) repel → geometry. Lone pairs compress angles. sp³=tetrahedral, sp²=trigonal planar.',
 steps:['Count total valence electrons from the periodic table, accounting for charge (add e⁻ for negative, subtract for positive).','Draw skeleton with central atom; connect all atoms with single bonds.','Distribute remaining electrons to outer atoms to complete octets; place leftover on central atom.','Determine electron pair geometry (all pairs) and molecular geometry (bonding pairs only).','Assign hybridisation: count electron pair regions around central atom → sp(2), sp²(3), sp³(4), sp³d(5), sp³d²(6).'],
 example:'CO₂: C has 4 valence e⁻, each O has 6 → total=16. C connects to 2 O (4 e⁻ used). Each O needs 4 more → 8 lone pair e⁻. But C has 0 — promote lone pairs to double bonds. Result: O=C=O, 2 regions → sp hybridisation, linear, 180°. Nonpolar (symmetric).'},

/* ── CHEMICAL REACTIONS & STOICHIOMETRY ─────────── */
{cat:'Chemistry',tags:['chemistry','science'],
 title:'Reaction Types, Balancing, Redox & Electrochemistry',
 theory:'',
 reality:'Bleach cleans because it strips electrons from stain molecules — a redox reaction. Rust forms when iron loses electrons to oxygen on your car. Your rechargeable battery works by reversing a redox reaction. Balancing chemical equations is chemistry\'s version of double-entry accounting.',
 formula:'Balancing: atoms and charge equal on both sides\nOxidation state rules:\n  free element = 0; monoatomic ion = charge\n  O usually −2; H usually +1; F always −1\nOIL RIG: Oxidation Is Loss, Reduction Is Gain\nCell potential: E°cell = E°cathode − E°anode\nΔG° = −nFE°  (F=96,485 C/mol)\nNernst: E = E° − (RT/nF)·lnQ\nElectrolysis: m = (M·I·t)/(n·F)  (Faraday\'s law)\nActivity series: more active metal displaces less active',
 method:'Half-reaction method for balancing redox in acidic solution: (1) separate into oxidation and reduction half-reactions, (2) balance atoms (use H₂O for O, H⁺ for H), (3) balance charge with electrons, (4) multiply to equalise electrons transferred, (5) add half-reactions and cancel electrons.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <!-- Galvanic cell diagram -->
  <rect x="10" y="18" width="100" height="80" rx="6" fill="rgba(122,171,207,.08)" stroke="#7aabcf" stroke-width="1.5"/>
  <rect x="150" y="18" width="100" height="80" rx="6" fill="rgba(201,160,96,.08)" stroke="#c9a060" stroke-width="1.5"/>
  <!-- electrodes -->
  <rect x="40" y="28" width="12" height="58" rx="3" fill="rgba(192,112,112,.25)" stroke="#c07070" stroke-width="1.5"/>
  <text x="46" y="24" text-anchor="middle" font-size="8" fill="#c07070">Anode</text>
  <text x="46" y="96" text-anchor="middle" font-size="7.5" fill="#c07070">oxidation</text>
  <rect x="208" y="28" width="12" height="58" rx="3" fill="rgba(122,176,96,.25)" stroke="#7ab060" stroke-width="1.5"/>
  <text x="214" y="24" text-anchor="middle" font-size="8" fill="#7ab060">Cathode</text>
  <text x="214" y="96" text-anchor="middle" font-size="7.5" fill="#7ab060">reduction</text>
  <!-- electron flow -->
  <path d="M52 28 Q130 4 208 28" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="130" y="10" text-anchor="middle" font-size="8" fill="#888">e⁻ flow →</text>
  <!-- salt bridge -->
  <rect x="108" y="30" width="44" height="24" rx="4" fill="rgba(128,128,128,.2)" stroke="#888" stroke-width="1.5"/>
  <text x="130" y="46" text-anchor="middle" font-size="8" fill="#888">salt bridge</text>
  <text x="60" y="60" text-anchor="middle" font-size="8" fill="#7aabcf">Zn→Zn²⁺</text>
  <text x="200" y="60" text-anchor="middle" font-size="8" fill="#7ab060">Cu²⁺→Cu</text>
  <text x="130" y="108" text-anchor="middle" font-size="8" fill="#888">E°cell = E°cathode − E°anode = 0.34−(−0.76) = 1.10 V</text>
 </svg>`,
 caption:'Galvanic cell: electrons flow from anode (oxidation, −) to cathode (reduction, +). Salt bridge maintains charge balance.',
 steps:['Assign oxidation states to all atoms. Identify what is oxidised (OS increases) and reduced (OS decreases).','Write separate half-reactions. Balance atoms, then balance oxygen with H₂O, hydrogen with H⁺.','Balance charge with electrons (e⁻). Multiply half-reactions so electrons cancel when added.','Add half-reactions; cancel electrons and anything appearing on both sides.','For cell potential: E°cell=E°cathode−E°anode. Positive E°cell → spontaneous. ΔG°=−nFE°.'],
 example:'Zn/Cu galvanic cell: Anode: Zn→Zn²⁺+2e⁻ (E°=−0.76 V). Cathode: Cu²⁺+2e⁻→Cu (E°=+0.34 V). E°cell=0.34−(−0.76)=+1.10 V. ΔG°=−2·96485·1.10=−212,270 J=−212.3 kJ. Spontaneous ✓'},

/* ── ORGANIC CHEMISTRY ──────────────────────────── */
{cat:'Chemistry',tags:['chemistry','science'],
 title:'Organic Chemistry: Functional Groups, Reactions & Nomenclature',
 theory:'',
 reality:'Aspirin, plastic, gasoline, vitamins, and alcohol are all organic molecules. The -OH group makes something an alcohol. The -COOH group makes it an acid like vinegar. Knowing functional groups tells a chemist how a molecule will react, what it smells like, and whether it is safe.',
 formula:'Alkane: CₙH₂ₙ₊₂  (only C−C single bonds)\nAlkene: CₙH₂ₙ   (C=C double bond)\nAlkyne: CₙH₂ₙ₋₂ (C≡C triple bond)\nKey functional groups:\n  −OH: alcohol\n  −COOH: carboxylic acid\n  −COO−: ester\n  −CO−: ketone; −CHO: aldehyde\n  −NH₂: amine\nCombustion: CₓHᵧ + O₂ → CO₂ + H₂O\nAddition (alkene): Br₂ adds across C=C\nSaponification: ester + NaOH → acid salt + alcohol',
 method:'IUPAC naming: (1) find the longest carbon chain containing the principal functional group, (2) number from the end closest to the functional group, (3) name substituents as prefixes with their position numbers. Suffix for functional group: -ol, -al, -one, -oic acid, -amine.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="4" y="4" width="252" height="110" rx="8" fill="rgba(122,176,96,.05)" stroke="#7ab060" stroke-width="1.5"/>
  <text x="130" y="18" text-anchor="middle" font-size="9" fill="#7ab060" font-weight="700">Key Functional Groups</text>
  <!-- Alcohol -->
  <text x="22" y="36" font-size="8.5" fill="#7aabcf" font-weight="700">−OH</text>

function stemFilter(cat){
  document.querySelectorAll('.formula-card').forEach(c=>{
    const show=cat==='All'||c.dataset.cat===cat;
    c.style.display=show?'flex':'none';

function stemSolve(){
  const kind=document.getElementById('stem-solver-kind').value;
  const a=parseFloat(document.getElementById('stem-a').value);
  const b=parseFloat(document.getElementById('stem-b').value);
  let out='Enter two numbers to solve.';
  if(Number.isFinite(a)&&Number.isFinite(b)){
    if(kind==='percent')out=`${a}% of ${b} = <strong>${(a/100*b).toFixed(4)}</strong>. (Decimal: ${a/100} × ${b})`;
    if(kind==='slope')out=`Slope m = Δy/Δx = ${b}/${a} = <strong>${(b/a).toFixed(4)}</strong>. Equation: y − y₁ = ${(b/a).toFixed(3)}(x − x₁)`;
    if(kind==='pythag')out=`Hypotenuse c = √(${a}² + ${b}²) = √${a*a+b*b} = <strong>${Math.hypot(a,b).toFixed(4)}</strong>`;
    if(kind==='compound')out=`Compound A = ${a}(1 + ${b/100})¹ = <strong>${(a*(1+b/100)).toFixed(2)}</strong>. Rule of 72: doubles in ≈${(72/b).toFixed(1)} years.`;
    if(kind==='convert')out=`${a} m = <strong>${(a*3.28084).toFixed(3)} ft</strong> &nbsp;|&nbsp; ${b} mph = <strong>${(b*0.44704).toFixed(3)} m/s</strong>`;
  }
  document.getElementById('stem-answer').innerHTML=out;
}

function startTimer(){
  if(timerRunning||timerSec<=0)return;
  timerRunning=true;
  timerInterval=setInterval(()=>{
    timerSec--;
    updateTimer();
    if(timerSec<=0){clearInterval(timerInterval);timerRunning=false;updateTimer();}
  },1000);
  updateTimer();
}
function pauseTimer(){
  if(!timerRunning)return;
  clearInterval(timerInterval);
  timerRunning=false;
  updateTimer();
}
function toggleTimer(){
  if(timerSec<=0){resetTimer();return;}
  if(timerRunning)pauseTimer();else startTimer();
}
function resetTimer(){
  clearInterval(timerInterval);
  timerRunning=false;
  timerSec=600;
  updateTimer();
}
function updateTimer(){
  const m=Math.floor(timerSec/60),s=timerSec%60;
  const el=document.getElementById('timer');
  if(!el)return;
  el.textContent=`${m}:${s.toString().padStart(2,'0')}`;
  let cls='timer-box';
  if(timerSec<=0)cls+=' done';
  else if(timerSec<=60)cls+=' warn';
  if(!timerRunning&&timerSec>0&&timerSec<600)cls+=' paused';
  el.className=cls;
}

/* ─── QUIZ HELPERS ─────────────────────────────────────────────── */
function rnd(n){return Math.floor(Math.random()*n);}
function pick(arr){return arr[rnd(arr.length)];}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function distractors(correct,pool,n=3){const d=[];const tried=new Set([String(correct)]);const p=shuffle(pool);for(const x of p){const s=String(x);if(!tried.has(s)){d.push(x);tried.add(s);}if(d.length>=n)break;}while(d.length<n)d.push('—');return d;}
function fmtNum(n,dec=2){return parseFloat(n.toFixed(dec));}

    // Organization & Structure
    ()=>{const cases=[{q:'Which paragraph structure is most effective for a persuasive essay?',correct:'Claim → Evidence → Explanation → Transition',opts:['Evidence → Claim → Conclusion','Introduction → Examples → Introduction','Background → Background → Background'],hint:'WritePlacer Organization: C-E-E (Claim, Evidence, Explanation) ensures logical flow',cat:'Organization & Structure'},{q:'Where should a counterargument appear in a 5-paragraph persuasive essay?',correct:'Typically in its own body paragraph, with a refutation following',opts:['Only in the introduction','Only in the conclusion','It should never appear'],hint:'Addressing counterarguments shows maturity and strengthens your overall argument',cat:'Organization & Structure'},{q:'Which transition best signals a contrast between two ideas?',correct:'However',opts:['Furthermore','In addition','Similarly'],hint:'"However" = contrast. "Furthermore"/"In addition"/"Similarly" = adding or comparing similar ideas',cat:'Organization & Structure'}];const c=pick(cases);return{prompt:`📝 <em style="font-size:10px;color:var(--ts)">${c.cat}</em><br><br><strong>${c.q}</strong>`,correct:c.correct,opts:shuffle([c.correct,...distractors(c.correct,c.opts)]),hint:c.hint};},
    // Development & Support
    ()=>{const cases=[{q:'Which is the best evidence to support the claim "Social media affects teen mental health"?',correct:'A peer-reviewed study showing higher depression rates among heavy social media users',opts:['A tweet from a teenager','Your own personal experience','A commercial for a social media app'],hint:'WritePlacer Development: Academic, peer-reviewed evidence is the most credible and persuasive',cat:'Development & Support'},{q:'After presenting evidence, what should a writer do next?',correct:'Explain how the evidence supports the thesis (the "so what")',opts:['Move immediately to the next paragraph','Restate the evidence again in different words','Begin a new topic'],hint:'Evidence alone is not enough — you must connect it to your argument by analyzing it',cat:'Development & Support'},{q:'Which type of support would MOST strengthen the claim "Exercise improves mental health"?',correct:'"A 2023 study in JAMA found that 30 minutes of aerobic exercise reduces anxiety symptoms by 40%."',opts:['"Exercise feels good."','"Many doctors recommend exercise."','"I feel better after I run."'],hint:'Specific, sourced, quantified evidence is strongest. Vague claims and personal anecdotes are weakest',cat:'Development & Support'}];const c=pick(cases);return{prompt:`📝 <em style="font-size:10px;color:var(--ts)">${c.cat}</em><br><br><strong>${c.q}</strong>`,correct:c.correct,opts:shuffle([c.correct,...distractors(c.correct,c.opts)]),hint:c.hint};},
    // Sentence Variety & Style
    ()=>{const cases=[{q:'Which version shows the best sentence variety?',correct:'"Technology has transformed education. Students now access resources instantly; however, digital distractions remain a challenge."',opts:['"Technology has transformed education. Technology is very helpful. Technology is widely used."','"Technology has transformed education and students now access resources instantly but digital distractions remain a challenge."','"Technology. Education. Distractions."'],hint:'WritePlacer Sentence Variety: Mix short and long sentences, vary structure (simple, compound, complex)',cat:'Sentence Variety & Style'},{q:'Which sentence uses the most precise, academic language?',correct:'"Research indicates that sleep deprivation significantly impairs cognitive performance."',opts:['"Not sleeping makes you dumb."','"People say sleeping is important."','"Sleep is very very important for your brain."'],hint:'Academic writing avoids slang, uses specific verbs (indicates, impairs) and formal vocabulary',cat:'Sentence Variety & Style'},{q:'Which revision makes the sentence more concise?',correct:'"The study concluded that exercise is beneficial." (from: "The study came to the conclusion that exercise is beneficial.")',opts:['Add more adjectives','Use more prepositional phrases','Make it two sentences'],hint:'Concise writing eliminates redundancy: "came to the conclusion" → "concluded"',cat:'Sentence Variety & Style'}];const c=pick(cases);return{prompt:`📝 <em style="font-size:10px;color:var(--ts)">${c.cat}</em><br><br><strong>${c.q}</strong>`,correct:c.correct,opts:shuffle([c.correct,...distractors(c.correct,c.opts)]),hint:c.hint};},
    // Critical Thinking
    ()=>{const cases=[{q:'Which concluding sentence best demonstrates critical thinking?',correct:'"Ultimately, investing in renewable energy is not merely an economic decision — it is a moral imperative for future generations."',opts:['"In conclusion, this essay discussed renewable energy."','"So, that is why renewable energy is good."','"Renewable energy was covered in the body paragraphs."'],hint:'WritePlacer Critical Thinking: Strong conclusions make an insightful, broader point that goes beyond restating the thesis',cat:'Critical Thinking'},{q:'The best way to handle a counterargument in an essay is:',correct:'Acknowledge it, then refute it with specific evidence',opts:['Ignore it completely','State it but offer no response','Agree with it and change your thesis'],hint:'Addressing counterarguments shows maturity; ignoring them weakens your credibility',cat:'Critical Thinking'},{q:'Which statement shows the strongest critical thinking about school uniforms?',correct:'"While uniforms may reduce visible economic inequality, research is inconclusive about whether they improve academic outcomes — suggesting policy decisions should be school-specific."',opts:['"Uniforms are bad because I don\'t like them."','"Some people like uniforms and some people don\'t."','"Schools should just do whatever parents want."'],hint:'Strong critical thinking acknowledges complexity, uses evidence, and avoids oversimplification',cat:'Critical Thinking'}];const c=pick(cases);return{prompt:`📝 <em style="font-size:10px;color:var(--ts)">${c.cat}</em><br><br><strong>${c.q}</strong>`,correct:c.correct,opts:shuffle([c.correct,...distractors(c.correct,c.opts)]),hint:c.hint};},
  ];
  return pick(types)();
}

function genAccuplacerQ(){
  if(quizSubCategory==='arithmetic')return genAccuplacerArithmeticQ();
  if(quizSubCategory==='qas')return genAccuplacerQRQ();
  if(quizSubCategory==='aaf')return genAccuplacerAdvAlgQ();
  if(quizSubCategory==='reading')return genAccuplacerReadingQ();
  if(quizSubCategory==='writing')return genAccuplacerWritingQ();
  if(quizSubCategory==='essay')return genAccuplacerEssayQ();
  // Mixed: pick randomly across all sections
  const all=[genAccuplacerArithmeticQ,genAccuplacerQRQ,genAccuplacerAdvAlgQ,genAccuplacerReadingQ,genAccuplacerWritingQ,genAccuplacerEssayQ];
  return pick(all)();
}

function generateQuiz(){
  let q;
  if(quizCategory==='alphabet')q=genAlphabetQ();
  else if(quizCategory==='morphemes')q=genMorphQ();
  else if(quizCategory==='arithmetic')q=genArithmeticQ();
  else if(quizCategory==='algebra')q=genAlgebraQ();
  else if(quizCategory==='geometry')q=genGeometryQ();
  else if(quizCategory==='calculus'){
    if(quizSubCategory==='clep_precalc')q=genCLEPPrecalcQ();
    else if(quizSubCategory==='ap_calc')q=genAPCalcQ();
    else q=genCalculusQ();
  }
  else if(quizCategory==='physics'){
    if(quizSubCategory==='ap_mech')q=genAPMechQ();
    else if(quizSubCategory==='ap_em')q=genAPEMQ();
    else q=genPhysicsQ();
  }
  else if(quizCategory==='chemistry'){
    if(quizSubCategory==='ap_chem')q=genAPChemQ();
    else q=genChemistryQ();
  }
  else if(quizCategory==='accuplacer')q=genAccuplacerQ();
  else q=genAlphabetQ();
  quizState={...q,answered:false};
}
function setQuizCategory(cat){quizCategory=cat;quizSubCategory='general';generateQuiz();render();}
function setQuizSubCategory(sub){quizSubCategory=sub;generateQuiz();render();}

function answerQuiz(idx){
  if(!quizState||quizState.answered)return;
  quizState.answered=true;
  quizState.chosenIdx=idx;
  const isCorrect=quizState.opts[idx]===quizState.correct;
  if(isCorrect)setStreak(streak+1);else setStreak(0);
  render();
}

function originHit(e,o){return o==='all'||String(e.origin).toLowerCase().includes(o);}
function kindHit(e,k){return k==='all'||String(e.type).toLowerCase().includes(k);}
