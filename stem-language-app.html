/* === ROBUST QUIZ LAB PATCH: opens independently and preserves other app modes === */
let elapsedQuizSec = 0;
let elapsedQuizRunning = false;
let elapsedQuizInterval = null;
function formatElapsedQuiz(){const m=Math.floor(elapsedQuizSec/60),s=elapsedQuizSec%60;return `${m}:${String(s).padStart(2,'0')}`;}
function startTimer(){
  if(elapsedQuizRunning)return;
  elapsedQuizRunning=true;
  elapsedQuizInterval=setInterval(()=>{elapsedQuizSec++;updateTimer();},1000);
  updateTimer();
}
function pauseTimer(){clearInterval(elapsedQuizInterval);elapsedQuizRunning=false;updateTimer();}
function toggleTimer(){elapsedQuizRunning?pauseTimer():startTimer();}
function resetTimer(){clearInterval(elapsedQuizInterval);elapsedQuizRunning=false;elapsedQuizSec=0;updateTimer();}
function updateTimer(){const el=document.getElementById('timer');if(!el)return;el.textContent=formatElapsedQuiz();el.className='timer-box'+(elapsedQuizRunning?'':' paused');el.title='Elapsed test time. Click to pause/resume; double-click to reset.';}

const QUIZ_LAB_CATS=[
  {id:'alphabet',label:'Alphabet'},
  {id:'morphemes',label:'Morphemes'},
  {id:'arithmetic',label:'Numbers & Operations'},
  {id:'algebra',label:'Algebra'},
  {id:'geometry',label:'Geometry'},
  {id:'calculus',label:'Calculus'},
  {id:'physics',label:'Physics'},
  {id:'chemistry',label:'Chemistry'},
  {id:'ap',label:'AP Exams'},
  {id:'clep',label:'CLEP Exams'},
  {id:'accuplacer',label:'ACCUPLACER'}
];
const QUIZ_LAB_SUBS={
  accuplacer:[
    {id:'mixed',label:'Mixed'},
    {id:'reading',label:'Reading'},
    {id:'writing',label:'Writing'},
    {id:'arithmetic',label:'Arithmetic'},
    {id:'qas',label:'Quantitative Reasoning'},
    {id:'aaf',label:'Advanced Algebra'},
    {id:'essay',label:'Essay'}
  ]
};
let quizLab={cat:'accuplacer',sub:'mixed',answered:false,current:null,attempted:0,correct:0,difficulty:1,history:[],full:false,fullIndex:0,fullTotal:30};
function qEsc(s){return String(s??'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}
function qPick(a){return a[Math.floor(Math.random()*a.length)];}
function qShuffle(a){return a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);}
function qMake(prompt,correct,wrong,hint,focus){return {prompt,correct,opts:qShuffle([correct,...wrong].slice(0,4)),hint:hint||'',focus:focus||quizLab.cat};}
function genQuizLabQuestion(){
  const letter=DATA&&DATA[cur]?DATA[cur]:{l:'A',sym:'ox / strength',hname:'Aleph',vocab:[{w:'alpha',def:'first'}]};
  const classic={
    alphabet:[()=>qMake(`What symbolic idea is connected with <strong>${letter.l}</strong>?`,letter.sym,['water / chaos','door / pathway','hand / action','eye / seeing'],'Use the alphabet root card for this letter.','Alphabet roots'),()=>qMake(`Which Hebrew-root name is shown for <strong>${letter.l}</strong>?`,letter.hname,['Beth','Mem','Nun','Ayin'],'Check the letter hero card.','Alphabet roots')],
    morphemes:[()=>{const arr=(MORPHEMES&&MORPHEMES[letter.l])||[];const e=arr[0]||{m:'bio',meaning:'life'};return qMake(`What does the morpheme <strong>${qEsc(e.m)}</strong> most nearly mean?`,qEsc(e.meaning).slice(0,90),['opposite or against','small or reduced','across or through','before or earlier'],'Morphemes build meaning from word parts.','Morphemes');}],
    arithmetic:[()=>qMake('What is <strong>3/4 + 5/6</strong>?','1 7/12',['7/10','3/2','19/24'],'Use a common denominator of 12.','Fractions'),()=>qMake('A $40 item is discounted 25%. What is the sale price?','$30',['$10','$25','$35'],'25% of 40 is 10; subtract from 40.','Percent')],
    algebra:[()=>qMake('Solve: <strong>2x + 5 = 17</strong>','x = 6',['x = 5','x = 7','x = 11'],'Subtract 5, then divide by 2.','Linear equations'),()=>qMake('Factor: <strong>x² − 9</strong>','(x − 3)(x + 3)',['(x − 9)(x + 1)','(x − 3)²','prime'],'Difference of squares: a² − b².','Factoring')],
    geometry:[()=>qMake('A triangle has base 10 and height 6. What is its area?','30',['60','16','15'],'Area = 1/2 bh.','Area'),()=>qMake('What is the circumference of a circle with radius 4?','8π',['4π','16π','πr²'],'Circumference = 2πr.','Circles')],
    calculus:[()=>qMake('What is the derivative of <strong>x³</strong>?','3x²',['x²','3x','x⁴/4'],'Power rule: bring down the exponent and subtract 1.','Derivatives'),()=>qMake('What is ∫ 2x dx?','x² + C',['2 + C','2x² + C','x + C'],'Reverse the power rule.','Integration')],
    physics:[()=>qMake('A 10 kg object accelerates at 2 m/s². What force acts on it?','20 N',['5 N','12 N','40 N'],'Newton’s second law: F = ma.','Forces'),()=>qMake('Which unit measures electric current?','ampere',['volt','joule','newton'],'Current is measured in amperes.','Electricity')],
    chemistry:[()=>qMake('What is the atomic number of carbon?','6',['12','8','14'],'Carbon has 6 protons.','Atomic structure'),()=>qMake('A solution with pH 3 is:','acidic',['basic','neutral','nonpolar'],'pH below 7 is acidic.','Acids and bases')]
  };
  const accu={
    reading:[()=>qMake(`<div style="text-align:left">Passage: Many historians argue that technological innovation drives social change. Others contend that social needs often shape technological development. For example, demand for faster communication led to the telegraph.<br><br><strong>What is the main idea?</strong></div>`,'Social needs and technology influence each other',['Technology develops independently of society','The telegraph was the first invention','Historians only study communication'],'ACCUPLACER Reading often asks for main idea, inference, word meaning, and evidence.','Reading'),()=>qMake(`<div style="text-align:left">Passage: The researcher’s conclusion was tentative because the sample size was small.<br><br><strong>The word “tentative” most nearly means:</strong></div>`,'not final or certain',['careless','permanent','unrelated'],'Use context: the small sample makes the conclusion uncertain.','Vocabulary in context')],
    writing:[()=>qMake('Choose the best version:','Each of the students has completed his or her assignment.',['Each of the students have completed their assignments.','Each of the students has completed their assignments.','Each of the students have completed his or her assignment.'],'“Each” is singular, so use “has.”','Writing conventions'),()=>qMake('Which sentence is correctly punctuated?','It’s raining outside; bring an umbrella.',['Its raining outside, bring an umbrella.','It’s raining outside bring an umbrella.','Its raining outside; bring an umbrella.'],'Use it’s = it is; a semicolon can join two related independent clauses.','Punctuation')],
    arithmetic:[()=>qMake('What is <strong>2.4 × 0.5</strong>?','1.2',['12','0.12','2.9'],'Half of 2.4 is 1.2.','Decimal operations'),()=>qMake('A recipe uses 3 cups of flour for 12 servings. How many cups are needed for 20 servings?','5',['4','6','7.5'],'3/12 = x/20, so x = 5.','Ratios and proportions')],
    qas:[()=>qMake('The line through (2,3) and (6,11) has what slope?','2',['1','3','4'],'Slope = (11−3)/(6−2)=8/4.','Slope'),()=>qMake('Solve: <strong>3(x − 2) = 18</strong>','x = 8',['x = 4','x = 6','x = 10'],'Divide by 3, then add 2.','Linear equations')],
    aaf:[()=>qMake('If f(x)=2x²+3x, what is f(2)?','14',['10','16','8'],'2(2²)+3(2)=8+6.','Functions'),()=>qMake('Solve: <strong>x² − 5x + 6 = 0</strong>','x = 2 or x = 3',['x = −2 or −3','x = 1 or 6','x = 0 or 6'],'Factor as (x−2)(x−3).','Quadratics')],
    essay:[()=>({essay:true,prompt:'Some people believe technology makes life easier, while others believe it creates new problems. Write an essay explaining your position.',focus:'WritePlacer essay',hint:'Score high by using a clear thesis, organized paragraphs, specific examples, sentence variety, grammar control, and a conclusion that extends the argument.'})]
  };
  if(quizLab.cat==='ap'){
    let q;
    if(quizLab.sub==='ap_calc') q=genAPCalcQ();
    else if(quizLab.sub==='ap_mech') q=genAPMechQ();
    else if(quizLab.sub==='ap_em') q=genAPEMQ();
    else if(quizLab.sub==='ap_chem') q=genAPChemQ();
    else if(quizLab.sub==='ap_stats') q=qPick([
      ()=>qMake('A random sample of 64 students has mean 78 and standard deviation 12. What is the standard error?', '1.5', ['12','8','0.1875'], 'Standard error = s/√n = 12/8.', 'AP Statistics'),
      ()=>qMake('Which condition is most important for a one-sample proportion z-test?', 'Expected successes and failures are both large enough', ['The population must be normal','The sample mean must equal the population mean','The standard deviation must be unknown'], 'For proportions, check np and n(1−p).', 'AP Statistics'),
      ()=>qMake('A p-value of 0.03 means:', 'Results this extreme would occur about 3% of the time if H₀ were true', ['The null hypothesis is 3% true','There is a 97% chance H₀ is false','The sample is biased'], 'A p-value is conditional on the null hypothesis.', 'AP Statistics')
    ])();
    q.focus=q.focus||({ap_calc:'AP Calculus AB/BC',ap_mech:'AP Physics C: Mechanics',ap_em:'AP Physics C: E&M',ap_chem:'AP Chemistry',ap_stats:'AP Statistics'}[quizLab.sub]||'AP Exam');
    return q;
  }
  if(quizLab.cat==='clep'){
    let q;
    if(quizLab.sub==='clep_precalc') q=genCLEPPrecalcQ();
    else if(quizLab.sub==='clep_college_algebra') q=qPick([
      ()=>qMake('Solve: <strong>2x² − 5x − 3 = 0</strong>', 'x = 3 or x = −1/2', ['x = −3 or x = 1/2','x = 1 or x = −3/2','x = 2 or x = −3'], 'Factor: (2x+1)(x−3)=0.', 'CLEP College Algebra'),
      ()=>qMake('If <strong>f(x)=x²−4x+7</strong>, what is f(3)?', '4', ['7','10','16'], 'Substitute 3: 9−12+7=4.', 'CLEP College Algebra'),
      ()=>qMake('Simplify: <strong>(x³y²)(x²y⁵)</strong>', 'x⁵y⁷', ['x⁶y¹⁰','x⁵y¹⁰','x⁶y⁷'], 'When multiplying like bases, add exponents.', 'CLEP College Algebra')
    ])();
    else if(quizLab.sub==='clep_college_math') q=qPick([
      ()=>qMake('A set has values 4, 6, 8, 10. What is the mean?', '7', ['6','8','28'], 'Mean = total ÷ count = 28÷4.', 'CLEP College Mathematics'),
      ()=>qMake('If a shirt costs $30 after a 25% discount, what was the original price?', '$40', ['$37.50','$45','$55'], '$30 is 75% of the original price.', 'CLEP College Mathematics'),
      ()=>qMake('How many ways can 3 books be arranged on a shelf?', '6', ['3','9','27'], '3! = 3×2×1 = 6.', 'CLEP College Mathematics')
    ])();
    q.focus=q.focus||({clep_precalc:'CLEP Precalculus',clep_college_algebra:'CLEP College Algebra',clep_college_math:'CLEP College Mathematics'}[quizLab.sub]||'CLEP Exam');
    return q;
  }
  if(quizLab.cat==='accuplacer'){
    let sub=quizLab.sub==='mixed'?qPick(['reading','writing','arithmetic','qas','aaf']):quizLab.sub;
    return qPick(accu[sub]||accu.reading)();
  }
  return qPick(classic[quizLab.cat]||classic.alphabet)();
}
function quizScoreEstimate(){const pct=quizLab.attempted?quizLab.correct/quizLab.attempted:0;const adaptive=Math.min(30,Math.max(0,Math.round((pct*22)+(quizLab.difficulty*8))));return 200+adaptive;}
function quizBand(){const s=quizScoreEstimate();return s>=271?'271–300 band: advanced readiness focus':'Keep practicing toward the 271–300 band';}
function openQuizLab(){
  mode='quiz';
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  const qb=document.getElementById('mode-quiz'); if(qb){qb.classList.add('active');qb.textContent='Quiz';qb.title='Quiz';}
  const nav=document.getElementById('letter-nav'); if(nav)nav.style.display='none';
  const bottom=document.querySelector('.bottom-nav'); if(bottom)bottom.style.display='none';
  const prog=document.getElementById('prog'); if(prog)prog.style.width='100%';
  const pos=document.getElementById('pos-label'); if(pos)pos.textContent='Quiz';
  if(!quizLab.current)quizLab.current=genQuizLabQuestion();
  startTimer();
  renderQuizLab();
}
function quizLabSetCat(cat){
  quizLab.cat=cat;
  quizLab.sub=cat==='accuplacer'?'mixed':cat==='ap'?'ap_calc':cat==='clep'?'clep_college_algebra':'general';
  quizLab.current=genQuizLabQuestion();
  quizLab.answered=false;
  renderQuizLab();
}
function quizLabSetSub(sub){quizLab.sub=sub;quizLab.current=genQuizLabQuestion();quizLab.answered=false;renderQuizLab();}
function quizLabSetFull(on){quizLab.full=!!on;quizLab.fullIndex=0;quizLab.current=genQuizLabQuestion();quizLab.answered=false;renderQuizLab();}
function quizLabReset(){quizLab.attempted=0;quizLab.correct=0;quizLab.difficulty=1;quizLab.history=[];quizLab.fullIndex=0;quizLab.current=genQuizLabQuestion();quizLab.answered=false;resetTimer();startTimer();renderQuizLab();}
function quizLabAnswer(i){const q=quizLab.current;if(!q||q.answered||q.essay)return;q.answered=true;q.chosen=i;const ok=q.opts[i]===q.correct;quizLab.attempted++;if(ok){quizLab.correct++;quizLab.difficulty=Math.min(3,quizLab.difficulty+.2);setStreak(streak+1);}else{quizLab.difficulty=Math.max(.5,quizLab.difficulty-.15);setStreak(0);}quizLab.history.push({ok,focus:q.focus,hint:q.hint});renderQuizLab();}
function quizLabNext(){if(quizLab.full)quizLab.fullIndex=(quizLab.fullIndex+1)%quizLab.fullTotal;quizLab.current=genQuizLabQuestion();quizLab.answered=false;renderQuizLab();}
function quizLabGradeEssay(){const txt=(document.getElementById('quiz-essay')?.value||'').trim();const words=txt?txt.split(/\s+/).length:0;let pts=1;if(words>150)pts++;if(/because|therefore|however|although|for example/i.test(txt))pts++;if(/first|second|finally|in conclusion/i.test(txt))pts++;if(words>300)pts++;if(/[.!?]/.test(txt)&&txt.split(/[.!?]+/).length>4)pts++;const score=Math.max(1,Math.min(6,pts));document.getElementById('essay-score').innerHTML=`<div class="answer"><strong>Rubric estimate: ${score}/6</strong><br>Word count: ${words}. Improve by using a clear thesis, organized examples, transitions, varied sentences, grammar control, and a conclusion.</div>`;}
function renderQuizLab(){
  const q=quizLab.current||genQuizLabQuestion();quizLab.current=q;
  const catBar=QUIZ_LAB_CATS.map(c=>`<button class="link-chip${quizLab.cat===c.id?' active':''}" onclick="quizLabSetCat('${c.id}')">${c.label}</button>`).join('');
  const subBar=(QUIZ_LAB_SUBS[quizLab.cat]||[]).map(s=>`<button class="link-chip${quizLab.sub===s.id?' active':''}" onclick="quizLabSetSub('${s.id}')">${s.label}</button>`).join('');
  const recent=quizLab.history.slice(-5).map(h=>`<div class="root-box"><b>${qEsc(h.focus)}</b><br><span class="muted">${h.ok?'Correct':'Review'} · ${qEsc(h.hint)}</span></div>`).join('')||'<div class="muted">Answer questions to build a score report.</div>';
  const score=`<div class="count-grid"><div class="count-card"><div class="big">${quizScoreEstimate()}</div><div class="small">scaled estimate</div></div><div class="count-card"><div class="big">${quizLab.correct}/${quizLab.attempted}</div><div class="small">correct</div></div><div class="count-card"><div class="big">${quizLab.difficulty.toFixed(1)}</div><div class="small">adaptive level</div></div><div class="count-card"><div class="big">${formatElapsedQuiz()}</div><div class="small">elapsed</div></div></div>`;
  let body='';
  if(q.essay){
    body=`<div class="quiz-prompt" style="text-align:left">${qEsc(q.prompt)}</div><textarea id="quiz-essay" class="search" style="height:180px;resize:vertical" placeholder="Type your essay response here..."></textarea><div class="filter-row"><button class="btn primary" onclick="quizLabGradeEssay()">Grade with rubric</button><button class="btn" onclick="quizLabNext()">New essay prompt</button></div><div id="essay-score"></div><div class="write-box"><strong>WritePlacer rubric:</strong> thesis, organization, support/examples, sentence variety, word choice, grammar/mechanics, and critical thinking.</div>`;
  }else{
    body=`<div class="write-box">${quizLab.full?`Full-length question ${quizLab.fullIndex+1} of ${quizLab.fullTotal}. `:''}${quizBand()}. Choose the best answer.</div><div class="quiz-prompt" style="text-align:left">${q.prompt}</div><div class="quiz-opts">${q.opts.map((opt,i)=>{let cls='quiz-opt';if(q.answered){if(opt===q.correct)cls+=' correct';else if(i===q.chosen)cls+=' wrong';}return `<button class="${cls}" onclick="quizLabAnswer(${i})" ${q.answered?'disabled':''}>${qEsc(opt)}</button>`;}).join('')}</div>${q.answered?`<div class="root-box" style="margin-top:8px"><strong style="color:var(--tsucc)">Answer: ${qEsc(q.correct)}</strong><br><span class="muted">${qEsc(q.hint)}</span></div><div style="text-align:center;margin-top:8px"><button class="btn primary" onclick="quizLabNext()">Next question →</button></div>`:''}`;
  }
  document.getElementById('main-content').innerHTML=`<div class="card"><div class="stem-title">Quiz</div><div class="strategy-sub">Original quiz categories plus ACCUPLACER-style practice. The timer counts elapsed test time upward.</div><div class="section-title">Quiz category</div><div class="filter-row">${catBar}</div>${subBar?`<div class="filter-row"><span class="muted">Exam section</span>${subBar}</div>`:''}<div class="filter-row"><span class="muted">Mode</span><button class="link-chip${!quizLab.full?' active':''}" onclick="quizLabSetFull(false)">Adaptive practice</button><button class="link-chip${quizLab.full?' active':''}" onclick="quizLabSetFull(true)">Full-length practice</button><button class="link-chip" onclick="quizLabReset()">Reset</button></div>${score}${body}</div><div class="card"><div class="section-title">Score report</div>${recent}</div><div class="card"><div class="section-title">ACCUPLACER 271–300 focus topics</div><div class="pill-row">${['Main idea','Inference','Vocabulary in context','Grammar','Punctuation','Fractions','Percents','Ratios','Linear equations','Slope','Functions','Quadratics','Exponents','Essay organization'].map(t=>`<span class="pill">${t}</span>`).join('')}</div></div>`;
}
function openExamLab(cat){
  openQuizLab();
  quizLabSetCat(cat);
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  const b=document.getElementById('mode-'+cat);
  if(b)b.classList.add('active');
}
window.openQuizLab=openQuizLab;
window.openExamLab=openExamLab;
window.quizLabSetCat=quizLabSetCat;window.quizLabSetSub=quizLabSetSub;window.quizLabAnswer=quizLabAnswer;window.quizLabNext=quizLabNext;window.quizLabReset=quizLabReset;window.quizLabSetFull=quizLabSetFull;window.quizLabGradeEssay=quizLabGradeEssay;
setTimeout(()=>{const qb=document.getElementById('mode-quiz');if(qb){qb.textContent='Quiz';qb.setAttribute('onclick','openQuizLab()');qb.title='Quiz';}},0);
/* === END ROBUST QUIZ LAB PATCH === */

setStreak(streak);
updateTimer();
render();
</script>

<script>
// ===== ACCUPLACER UPGRADE (Injected) =====
let accScore = 250;
let difficulty = 1;
let correctStreak = 0;
let testMode = false;
let testTime = 3600;
let answered = false;

function updateAdaptive(isCorrect){
  if(isCorrect){
    accScore += 3 + difficulty;
    correctStreak++;
    if(correctStreak >= 2 && difficulty < 5){
      difficulty++;
      correctStreak = 0;
    }
  } else {
    accScore -= 2;
    difficulty = Math.max(1, difficulty - 1);
    correctStreak = 0;
  }
  accScore = Math.max(200, Math.min(300, accScore));
}

const accuplacerQuestions = [
  {section:"Reading",level:1,prompt:"The passage mainly discusses:",options:["A theory","An experiment","A result","An opinion"],answer:1},
  {section:"Writing",level:2,prompt:"Choose the correct sentence:",options:["Dog run fast","The dog runs fast","Dog runs fastly","The dog run fast"],answer:1},
  {section:"Arithmetic",level:1,prompt:"3/4 + 2/5 =",options:["23/20","7/9","1 7/20","11/20"],answer:0},
  {section:"Quantitative",level:3,prompt:"x + 5 = 9, x =",options:["4","5","9","14"],answer:0},
  {section:"Algebra",level:4,prompt:"x² - 4 = 0",options:["±2","±4","2","4"],answer:0}
];

function getAdaptiveQuestion(){
  let pool = accuplacerQuestions.filter(q=>q.level===difficulty);
  return pool[Math.floor(Math.random()*pool.length)];
}

function renderAccuplacer(){
  let q = getAdaptiveQuestion();
  answered = false;
  let html = `<div class="card">
    <div class="quiz-prompt">${q.prompt}</div>
    <div class="quiz-opts">`;
  q.options.forEach((opt,i)=>{
    html += `<button class="quiz-opt" onclick="submitAccuplacer(${i},${q.answer})">${opt}</button>`;
  });
  html += `</div><div class="score-row">Score: ${accScore}</div></div>`;
  document.getElementById("main-content").innerHTML = html;
}

function submitAccuplacer(choice,answer){
  if(answered) return;
  answered = true;
  updateAdaptive(choice===answer);
  setTimeout(renderAccuplacer,800);
}

function startFullTest(){
  testMode = true;
  testTime = 3600;
}

function gradeEssay(){
  let text = document.getElementById("essayInput")?.value || "";
  let score = 1;
  if(text.length > 300) score++;
  if(text.includes("because")) score++;
  if(text.split('.').length > 5) score++;
  alert("Essay Score: " + score + "/8");
}

// Hook into existing mode system
const oldSetMode = window.setMode;
window.setMode = function(mode){
  if(mode === "accuplacer"){
    renderAccuplacer();
  } else {
    oldSetMode(mode);
  }
}
</script>

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function shuffleQ(q){
    const pairs = q.options.map((t,i)=>({t,i}));
    for(let i=pairs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pairs[i],pairs[j]]=[pairs[j],pairs[i]];}
    return {...q, options: pairs.map(p=>p.t), answer: pairs.findIndex(p=>p.i===q.answer)};
  }

  /* ---------- QUESTION SELECTION ---------- */
  function nextQuestion(){
    if(S.track === 'quiz'){
      const pool = QB[S.quizCat] || QB.arithmetic;
      return shuffleQ(pick(pool));
    }
    if(S.track === 'ap'){
      const pool = QB[S.apExam] || [];
      return pool.length ? shuffleQ(pick(pool)) : null;
    }
    if(S.track === 'clep'){
      const pool = QB[S.clepExam] || [];
      return pool.length ? shuffleQ(pick(pool)) : null;
    }
    if(S.track === 'accuplacer'){
      if(S.accuSection === 'essay') return null; // handled separately
      let pool;
      if(S.accuSection === 'mixed'){
        pool = [...QB.accu_reading, ...QB.accu_writing, ...QB.accu_arithmetic, ...QB.accu_qras, ...QB.accu_aaf];
      } else {
        pool = QB[S.accuSection] || [];
      }
      // progressive difficulty: prefer questions at current difficulty ±1
      const lvl = S.accuDifficulty;
      const sameLevel = pool.filter(q=>q.level===lvl);
      const candidatePool = sameLevel.length ? sameLevel : pool.filter(q=>Math.abs(q.level-lvl)<=1);
      return shuffleQ(pick((candidatePool.length?candidatePool:pool)));
    }
    return null;
  }

  /* ---------- ACCUPLACER ADAPTIVE ENGINE ---------- */
  function updateAccu(isCorrect, topic){
    if(isCorrect){
      S.accuScaled += 3 + S.accuDifficulty;
      S.accuStreak++;
      if(S.accuStreak >= 2 && S.accuDifficulty < 5){ S.accuDifficulty++; S.accuStreak = 0; }
      S.accuStrong[topic] = (S.accuStrong[topic]||0) + 1;
    } else {
      S.accuScaled -= 2;
      S.accuDifficulty = Math.max(1, S.accuDifficulty - 1);
      S.accuStreak = 0;
      S.accuMissed[topic] = (S.accuMissed[topic]||0) + 1;
    }
    S.accuScaled = Math.max(200, Math.min(300, S.accuScaled));
  }

      <div class="strategy-grid">
        <div class="strategy-card"><strong>Purpose / Focus</strong>Clear position consistent with the prompt.</div>
        <div class="strategy-card"><strong>Organization</strong>Intro, body paragraphs, transitions, conclusion.</div>
        <div class="strategy-card"><strong>Development</strong>Specific reasons and concrete examples.</div>
        <div class="strategy-card"><strong>Language Use</strong>Sentence variety, word choice, grammar, mechanics.</div>
      </div>
    </div>`;
  }

  /* ---------- TOP-LEVEL RENDER ---------- */
  function render(){
    const main = document.getElementById('main-content');
    if(!main) return;
    let subcats = '';
    if(S.track==='quiz') subcats = quizSubcats();
    if(S.track==='ap') subcats = apSubcats();
    if(S.track==='clep') subcats = clepSubcats();
    if(S.track==='accuplacer') subcats = accuSubcats();

    let content;
    if(S.track==='accuplacer' && S.accuSection==='essay'){
      content = essayCard();
    } else {
      content = questionCard();
    }
    const stats = (S.track==='accuplacer') ? accuStats() : '';
    const sheet = answerSheet();
    main.innerHTML = `
      <div class="card">
        <div class="stem-title">Quiz &amp; Exam Lab</div>
        <div class="stem-sub">Adaptive practice with a learn-as-you-go answer sheet. Every answer shows the reasoning and a step-by-step walkthrough.</div>
        ${trackTabs()}
        ${bannerFor(S.track)}
        ${subcats}
        <div class="filter-row" style="margin-top:8px">
          <button class="link-chip" onclick="QXReset()">Reset session</button>
          ${S.track==='accuplacer'?'<button class="link-chip" onclick="QXStartTimedTest()">Start full-length timed test</button>':''}
        </div>
      </div>
      ${stats}
      ${content}
      ${sheet}
    `;
  }

  /* ---------- ACTIONS ---------- */
  window.QXSetTrack = function(t){
    S.track = t;
    if(t==='quiz') S.current = nextQuestion();
    if(t==='ap') S.current = nextQuestion();
    if(t==='clep') S.current = nextQuestion();
    if(t==='accuplacer'){ S.current = nextQuestion(); }
    S.answered = false;
    render();
  };
  window.QXSetQuizCat = function(c){ S.quizCat=c; S.current=nextQuestion(); S.answered=false; render(); };
  window.QXSetApExam  = function(c){ S.apExam=c;  S.current=nextQuestion(); S.answered=false; render(); };
  window.QXSetClepExam= function(c){ S.clepExam=c;S.current=nextQuestion(); S.answered=false; render(); };
  window.QXSetAccuSection = function(c){
    S.accuSection = c;
    S.current = (c==='essay') ? null : nextQuestion();
    S.answered = false;
    render();
  };

  window.QXAnswer = function(idx){
    if(S.answered || !S.current) return;
    const q = S.current;
    q.chosen = idx;
    S.answered = true;
    const ok = idx === q.answer;
    S.total++;
    if(ok) S.score++;
    if(S.track==='accuplacer') updateAccu(ok, q.topic||q.focus||'general');
    S.sheet.push({
      focus:q.focus, prompt:q.prompt, options:q.options,
      chosen:q.chosen, correctIdx:q.answer,
      why:q.why, how:q.how, topic:q.topic, ok
    });
    if(S.sheet.length > 60) S.sheet.shift();
    render();
  };

  window.QXNext = function(){
    S.current = nextQuestion();
    S.answered = false;
    render();
  };

  window.QXReset = function(){
    S.score=0; S.total=0; S.sheet=[];
    if(S.track==='accuplacer'){
      S.accuScaled=250; S.accuDifficulty=1; S.accuStreak=0; S.accuMissed={}; S.accuStrong={};
      if(S.timerId){clearInterval(S.timerId); S.timerId=null;} S.timeLeft=3600;
    }
    S.current = nextQuestion(); S.answered=false;
    render();
  };

  window.QXStartTimedTest = function(){
    S.track='accuplacer';
    S.score=0; S.total=0; S.sheet=[];
    S.accuScaled=250; S.accuDifficulty=1; S.accuStreak=0; S.accuMissed={}; S.accuStrong={};
    S.timeLeft=3600;
    if(S.timerId) clearInterval(S.timerId);
    S.timerId = setInterval(()=>{
      S.timeLeft--;
      if(S.timeLeft<=0){ clearInterval(S.timerId); S.timerId=null; alert('Time up! Review your score report.'); }
    }, 1000);
    S.current = nextQuestion(); S.answered=false;
    render();
  };

  window.QXGradeEssay = function(){
    const text = (document.getElementById('qx-essay-input')?.value || '').trim();
    const words = text ? text.split(/\s+/).length : 0;
    let score = 1;
    if(words >= 150) score++;
    if(words >= 300) score++;
    if(/\b(because|therefore|however|for example|as a result|in addition)\b/i.test(text)) score++;
    if((text.match(/[.!?]/g)||[]).length >= 6) score++;
    if(/\b(first|second|finally|in conclusion|moreover|consequently)\b/i.test(text)) score++;
    if(words >= 450) score++;
    score = Math.max(1, Math.min(8, score));
    const el = document.getElementById('qx-essay-score');
    if(el){
      const feedback = [];
      if(words<150) feedback.push('Length is short — aim for 300+ words.');
      if(!/\b(first|second|finally|in conclusion)\b/i.test(text)) feedback.push('Add organizational signposts (first, second, finally).');
      if(!/\b(because|therefore|however|for example)\b/i.test(text)) feedback.push('Use transitions to connect reasons.');
      el.innerHTML = `<div class="qx-feedback ${score>=5?'correct':'wrong'}">
        <b>WritePlacer estimate: ${score}/8 · ${words} words</b>
        <span class="qx-why"><strong>Rubric:</strong> Purpose, Organization, Development, Language Use.</span>
        ${feedback.length?`<span class="qx-how"><em>To improve:</em> ${feedback.join(' ')}</span>`:'<span class="qx-how"><em>Strong response — review for grammar and word choice.</em></span>'}
      </div>`;
    }
  };

  /* ---------- ENTRY HOOKS — REPLACE EARLIER DEFS ---------- */
  window.openQuizLab = function(){
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    const btn = document.getElementById('mode-quiz');
    if(btn) btn.classList.add('active');
    const nav = document.getElementById('letter-nav'); if(nav) nav.style.display='none';
    const bottom = document.querySelector('.bottom-nav'); if(bottom) bottom.style.display='none';
    const prog = document.getElementById('prog'); if(prog) prog.style.width='100%';
    const pos = document.getElementById('pos-label'); if(pos) pos.textContent='Quiz & Exam Lab';
    S.track = 'quiz';
    S.current = nextQuestion();
    S.answered = false;
    render();
  };

  window.openExamLab = function(cat){
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    const btn = document.getElementById('mode-'+cat);
    if(btn) btn.classList.add('active');
    const nav = document.getElementById('letter-nav'); if(nav) nav.style.display='none';
    const bottom = document.querySelector('.bottom-nav'); if(bottom) bottom.style.display='none';
    const prog = document.getElementById('prog'); if(prog) prog.style.width='100%';
    const pos = document.getElementById('pos-label'); if(pos) pos.textContent=cat.toUpperCase()+' Practice';
    S.track = cat; // 'ap' or 'clep'
    S.current = nextQuestion();
    S.answered = false;
    render();
  };

  // expose state for debugging
  window.QXBank = QB;
})();
</script>



<script>
// ===== MENU GROUPING FIX =====
(function(){
  const previousSetMode = window.setMode;
  window.setMode = function(mode){
    if(typeof previousSetMode === 'function'){
      previousSetMode(mode);
    }
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    const btn = document.getElementById('mode-' + mode);
    if(btn) btn.classList.add('active');
  };
})();
</script>





<script>
// ===== SAFETY PATCH: PREVENT BROKEN MENU HOOKS =====
(function(){
  window.safeSetMode = window.safeSetMode || function(mode){
    if(typeof window.setMode === 'function') return window.setMode(mode);
    const main=document.getElementById('main-content');
    if(main) main.innerHTML='<div class="card"><div class="section-title">Unavailable</div><div class="muted">This section could not load.</div></div>';
  };

  if(typeof window.openQuizLab !== 'function'){
    window.openQuizLab = function(){
      const main=document.getElementById('main-content');
      if(main) main.innerHTML='<div class="card"><div class="section-title">Quiz</div><div class="muted">Quiz section is unavailable in this file.</div></div>';
    };
  }

  if((document.getElementById('mode-ap') || document.getElementById('mode-clep')) && typeof window.openExamLab !== 'function'){
    window.openExamLab = function(cat){
      const main=document.getElementById('main-content');
      if(main) main.innerHTML='<div class="card"><div class="section-title">'+cat.toUpperCase()+'</div><div class="muted">Exam section is unavailable in this file.</div></div>';
    };
  }
})();
</script>
