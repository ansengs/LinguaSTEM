<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alphabet Root Language Exercise</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#2a2a2a;color:#c8c8c8;min-height:100vh;padding:0.5rem}
:root{
--c1:#333333;
--c2:#3a3a3a;
--c3:#424242;
--tx:#d4d4d4;
--ts:#8a8a8a;
--tt:#5e5e5e;
--bd:rgba(255,255,255,0.09);
--info:#1e2d3d;
--tinfo:#7aabcf;
--warn:#2e2518;
--twarn:#c9a060;
--succ:#1c2a18;
--tsucc:#7ab060;
--danger:#2e1e1e;
--tdanger:#c07070;
}
@media(prefers-color-scheme:dark){
:root{
--c1:#272520;
--c2:#2f2d27;
--c3:#38352e;
--tx:#ccc8be;
--ts:#8a8780;
--tt:#5e5c57;
--bd:rgba(200,190,170,0.1);
--info:#1e2e3d;
--tinfo:#7aabcf;
--warn:#332a18;
--twarn:#c9a060;
--succ:#1c2e18;
--tsucc:#7ab060;
--danger:#2e1e1e;
--tdanger:#c07070;
}}
#app{max-width:760px;margin:0 auto;padding:0.5rem 0.25rem}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.6rem;gap:6px;flex-wrap:wrap}
.timer-box{font-size:12px;font-weight:500;color:var(--tinfo);background:var(--info);padding:3px 10px;border-radius:20px;min-width:64px;text-align:center;cursor:pointer;user-select:none}
.timer-box.warn{color:var(--twarn);background:var(--warn)}
.timer-box.done{color:var(--tsucc);background:var(--succ)}
.timer-box.paused{opacity:.55}
.mode-divider{display:inline-block;width:1px;height:16px;background:var(--bd);margin:0 2px;vertical-align:middle}
.progress-bar{height:3px;background:var(--bd);border-radius:2px;margin-bottom:0.55rem;overflow:hidden}
.progress-fill{height:100%;background:var(--tinfo);border-radius:2px;transition:width .3s}
.nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:0.55rem}
.nav-btn{font-size:11px;font-weight:500;padding:3px 7px;border:0.5px solid var(--bd);border-radius:5px;cursor:pointer;background:var(--c2);color:var(--ts);transition:all .15s}
.nav-btn:hover{background:var(--c3);color:var(--tx)}
.nav-btn.active{background:var(--tinfo);color:#fff;border-color:var(--tinfo)}
.card{background:var(--c1);border:0.5px solid var(--bd);border-radius:10px;padding:0.85rem 0.95rem;margin-bottom:0.5rem}
.card-row{display:grid;grid-template-columns:1fr;gap:0.5rem;margin-bottom:0.5rem}
@media(min-width:640px){.card-row.split{grid-template-columns:1fr 1fr}.card-row.split>.card{margin-bottom:0}}
.letter-hero{display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.letter-glyph{font-size:54px;font-weight:500;line-height:1;color:var(--tinfo);min-width:64px;text-align:center}
.hebrew-glyph{font-size:36px;color:var(--ts);margin-top:2px;text-align:center}
.letter-info{flex:1;min-width:200px}
.letter-en{font-size:18px;font-weight:500;color:var(--tx);margin-bottom:2px}
.hebrew-name{font-size:13px;color:var(--ts);margin-bottom:5px}
.symbol-tag{display:inline-block;font-size:11px;padding:2px 9px;background:var(--warn);color:var(--twarn);border-radius:20px;margin-bottom:6px}
.meaning-tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.tag{font-size:10px;padding:2px 7px;background:var(--c2);border:0.5px solid var(--bd);border-radius:20px;color:var(--ts)}
.ipa-row{font-size:12px;color:var(--tx);margin-bottom:2px}
.ipa-sym{font-size:14px;font-weight:500;color:var(--tinfo);font-family:monospace}
.section-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--tt);margin-bottom:6px;margin-top:0.5rem}
.section-title:first-child{margin-top:0}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.vocab-item{background:var(--c2);border:0.5px solid var(--bd);border-radius:7px;padding:8px 10px;cursor:pointer;transition:all .15s}
.vocab-item:hover{border-color:var(--tinfo)}
.vocab-item.revealed .vocab-meaning{display:block}
.vocab-item.revealed{border-color:var(--tsucc)}
.vocab-word{font-size:13px;font-weight:500;color:var(--tx)}
.vocab-ipa{font-size:11px;color:var(--ts);font-family:monospace;margin:1px 0}
.vocab-meaning{display:none;font-size:11px;color:var(--tsucc);margin-top:3px;line-height:1.4}
.vocab-hint{font-size:10px;color:var(--tt);margin-top:2px}
.lang-tabs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.lang-tab{font-size:11px;padding:2px 8px;border:0.5px solid var(--bd);border-radius:20px;cursor:pointer;background:var(--c2);color:var(--ts);transition:all .15s}
.lang-tab:hover{background:var(--c3)}
.lang-tab.active{background:var(--tinfo);color:#fff;border-color:var(--tinfo)}
.lang-entry{font-size:12px;color:var(--tx);margin-bottom:3px;line-height:1.45}
.lang-word{font-weight:500}
.lang-ipa{font-family:monospace;font-size:11px;color:var(--ts)}
.root-box{background:var(--c2);border-left:2px solid var(--bd);border-radius:0 6px 6px 0;padding:6px 10px;margin-bottom:4px;font-size:12px;line-height:1.4}
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:0.5rem;gap:6px}
.btn{font-size:12px;padding:6px 14px;border:0.5px solid var(--bd);border-radius:7px;cursor:pointer;background:var(--c2);color:var(--tx);transition:all .15s;font-weight:500}
.btn:hover{background:var(--c3)}
.btn.primary{background:var(--tinfo);color:#fff;border-color:var(--tinfo)}
.btn.primary:hover{opacity:.9}
.mode-bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.mode-btn{font-size:11px;padding:3px 9px;border:0.5px solid var(--bd);border-radius:20px;cursor:pointer;background:var(--c2);color:var(--ts)}
.mode-btn.active{background:var(--succ);color:var(--tsucc);border-color:var(--tsucc)}
.quiz-prompt{font-size:15px;font-weight:500;color:var(--tx);margin-bottom:10px;text-align:center;padding:0.7rem;background:var(--c2);border-radius:7px}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.quiz-opt{padding:9px 10px;border:0.5px solid var(--bd);border-radius:7px;cursor:pointer;font-size:12px;background:var(--c2);color:var(--tx);transition:all .15s;text-align:left}
.quiz-opt:hover{border-color:var(--tinfo);background:var(--info)}
.quiz-opt.correct{background:var(--succ);color:var(--tsucc);border-color:var(--tsucc)}
.quiz-opt.wrong{background:var(--danger);color:var(--tdanger);border-color:var(--tdanger)}
.score-row{font-size:12px;color:var(--ts);text-align:center}
.streak{font-size:11px;color:var(--twarn);background:var(--warn);padding:2px 8px;border-radius:20px}
.chars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:3px}
.char-item{background:var(--c2);border:0.5px solid var(--bd);border-radius:7px;padding:8px 10px}
.char-script{font-size:10px;color:var(--tt);margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.char-glyph{font-size:20px;font-weight:500;color:var(--tinfo);margin-bottom:1px;line-height:1.2}
.char-name{font-size:11px;font-weight:500;color:var(--tx);margin-bottom:1px}
.char-note{font-size:10px;color:var(--ts);line-height:1.35}
/* Added balanced morpheme bank styles: keeps original app look */
.search{width:100%;font-size:13px;padding:7px 10px;border:0.5px solid var(--bd);border-radius:7px;background:var(--c2);color:var(--tx);outline:none;margin-bottom:6px}
.search:focus{border-color:var(--tinfo);box-shadow:0 0 0 2px rgba(122,171,207,.12)}
.filter-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:6px 0}
.link-chip{font-size:11px;padding:3px 8px;border:0.5px solid var(--bd);border-radius:20px;cursor:pointer;background:var(--c2);color:var(--ts);text-decoration:none;display:inline-block;transition:all .15s}
.link-chip:hover{background:var(--c3);color:var(--tx)}
.link-chip.active{background:var(--tinfo);color:#fff;border-color:var(--tinfo)}
.muted{font-size:11px;color:var(--ts);line-height:1.4}
.count-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-top:6px}
.count-card{background:var(--c2);border:0.5px solid var(--bd);border-radius:8px;padding:10px;text-align:center;text-decoration:none;display:block;transition:all .15s}
.count-card:hover{border-color:var(--tinfo);background:var(--c3)}
.big{font-size:24px;color:var(--tinfo);font-weight:600;line-height:1}
.small{font-size:10px;color:var(--ts);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.vocab-item:target,.root-box:target{border-color:var(--tinfo);box-shadow:0 0 0 2px rgba(122,171,207,.18)}
.download-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* Reading/Writing Strategy module */
.strategy-title{font-size:18px;font-weight:600;color:var(--tx);margin-bottom:4px}.strategy-sub{font-size:12px;color:var(--ts);line-height:1.45;margin-bottom:8px}.strategy-jump{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.strategy-jump a{font-size:11px;padding:3px 8px;border:0.5px solid var(--bd);border-radius:20px;background:var(--c2);color:var(--tinfo);text-decoration:none}.mini-formula{white-space:pre-line;background:var(--c2);border:0.5px solid var(--bd);border-radius:7px;padding:8px 10px;margin:6px 0;font-size:11px;line-height:1.45;color:var(--tx)}.method-list{padding-left:1rem;margin-top:5px;color:var(--ts);font-size:12px;line-height:1.45}.method-list li{margin-bottom:5px}.strategy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px;margin-top:6px}.strategy-card{background:var(--c2);border:0.5px solid var(--bd);border-radius:8px;padding:9px 10px;font-size:11px;line-height:1.4;color:var(--ts)}.strategy-card strong{display:block;color:var(--tx);font-size:12px;margin-bottom:3px}.topic-row{background:var(--c2);border-left:2px solid var(--tinfo);border-radius:0 7px 7px 0;padding:8px 10px;margin-bottom:5px;font-size:11px;line-height:1.45;color:var(--ts)}.topic-row b{display:block;color:var(--tx);font-size:12px;margin-bottom:2px}.write-box{background:var(--info);border:0.5px solid rgba(122,171,207,.25);border-radius:8px;padding:9px 10px;font-size:12px;line-height:1.45;color:var(--tinfo);margin:6px 0}.pill-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.pill{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--succ);color:var(--tsucc)}

/* ═══════════════════════════════════════════════════
   STEM FORMULA LAB — Polished Card System
   ═══════════════════════════════════════════════════ */
.stem-title{font-size:20px;font-weight:700;color:var(--tx);margin-bottom:4px;letter-spacing:-.02em}
.stem-sub{font-size:12px;color:var(--ts);line-height:1.55;margin-bottom:10px}
.stem-toolbar{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.stem-chip{font-size:11px;padding:4px 10px;border:.5px solid var(--bd);border-radius:20px;background:var(--c2);color:var(--tinfo);cursor:pointer;transition:all .15s;white-space:nowrap}
.stem-chip:hover{background:var(--c3);color:var(--tx)}
.stem-chip.active{background:var(--tinfo);color:#fff;border-color:var(--tinfo);box-shadow:0 2px 8px rgba(122,171,207,.28)}
/* Card grid */
.stem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px;margin-top:8px}
/* The card itself */
.formula-card{
  background:linear-gradient(160deg,var(--c2) 0%,var(--c1) 100%);
  border:.5px solid var(--bd);border-radius:14px;padding:0;
  font-size:11.5px;line-height:1.5;color:var(--ts);
  cursor:default;transition:transform .18s,box-shadow .18s;
  overflow:hidden;position:relative;display:flex;flex-direction:column;
}
.formula-card:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.28);border-color:rgba(122,171,207,.38)}
/* Colour-coded top stripe by subject */
.formula-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0}
.formula-card[data-cat='Problem-Solving']::before{background:linear-gradient(90deg,#7aabcf,#c9a060)}
.formula-card[data-cat='Numbers & Operations']::before{background:linear-gradient(90deg,#5ab0d8,#7aabcf)}
.formula-card[data-cat='Algebra']::before{background:linear-gradient(90deg,#7ab060,#5ab0d8)}
.formula-card[data-cat='Coordinate Geometry']::before,.formula-card[data-cat='Geometry']::before{background:linear-gradient(90deg,#c07070,#c9a060)}
.formula-card[data-cat='Trigonometry']::before{background:linear-gradient(90deg,#a060c0,#7aabcf)}
.formula-card[data-cat='Derivatives & Limits']::before,.formula-card[data-cat='Integration']::before,.formula-card[data-cat='Multivariable Calculus']::before{background:linear-gradient(90deg,#c9a060,#c07070)}
.formula-card[data-cat='Matrices & Vectors']::before,.formula-card[data-cat='Complex Numbers']::before,.formula-card[data-cat='ODEs']::before{background:linear-gradient(90deg,#7060c0,#a060c0)}
.formula-card[data-cat='Statistics']::before,.formula-card[data-cat='Computer/Data']::before{background:linear-gradient(90deg,#60a0c0,#7ab060)}
.formula-card[data-cat='Chemistry']::before{background:linear-gradient(90deg,#7ab060,#c07070)}
.formula-card[data-cat='Physics']::before{background:linear-gradient(90deg,#c07070,#c9a060)}
.formula-card[data-cat='Finance & Commerce']::before{background:linear-gradient(90deg,#c9a060,#7ab060)}
.formula-card[data-cat='Engineering & Statics']::before{background:linear-gradient(90deg,#5ab0d8,#c07070)}
.formula-card[data-cat='Unit Conversions']::before,.formula-card[data-cat='Everyday Math']::before{background:linear-gradient(90deg,#7aabcf,#7ab060)}
/* Card inner layout */
.fc-head{padding:14px 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-top:4px}
.fc-title{font-size:13px;font-weight:700;color:var(--tx);line-height:1.3;flex:1}
.fc-badge{font-size:9.5px;padding:2px 7px;border-radius:20px;background:rgba(122,171,207,.14);color:var(--tinfo);border:.5px solid rgba(122,171,207,.3);white-space:nowrap;margin-top:1px;flex-shrink:0}
/* Purpose row */
.fc-purpose{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:8px 14px 0}
.fc-purpose-box{background:rgba(0,0,0,.13);border-radius:8px;padding:7px 9px}
.fc-purpose-box b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--tt);margin-bottom:3px}
.fc-purpose-box span{font-size:11px;color:var(--ts);line-height:1.4}
.fc-realworld{display:flex;gap:10px;align-items:flex-start;background:rgba(122,171,207,.09);border-left:3px solid var(--ta);border-radius:0 8px 8px 0;padding:9px 12px;margin:8px 14px 0}
.fc-realworld-icon{font-size:20px;flex-shrink:0;margin-top:1px}
.fc-realworld b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ta);margin-bottom:4px}
.fc-realworld p{font-size:11.5px;color:var(--ts);line-height:1.5;margin:0}
/* SVG diagram */
.fc-diagram{margin:8px 14px 0;border-radius:10px;overflow:hidden;background:rgba(0,0,0,.18);border:.5px solid rgba(122,171,207,.18);text-align:center}
.fc-diagram svg{display:block;margin:0 auto;width:100%;height:auto}
.fc-diagram-caption{font-size:10px;color:var(--tinfo);padding:4px 8px 6px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.02em}
/* Formula block */
.fc-formula{margin:8px 14px 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;white-space:pre-line;background:rgba(0,0,0,.22);border:.5px solid rgba(122,171,207,.22);border-radius:8px;padding:8px 10px;color:#9ecef0;line-height:1.6}
/* Steps */
.fc-steps{padding:8px 14px 12px;margin:0}
.fc-steps-title{font-size:9.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--tt);margin-bottom:5px}
.fc-step-row{display:flex;gap:7px;align-items:flex-start;margin-bottom:4px}
.fc-step-num{min-width:18px;height:18px;border-radius:50%;background:rgba(122,171,207,.18);color:var(--tinfo);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.fc-step-text{font-size:11px;color:var(--ts);line-height:1.45}
/* Worked example */
.fc-example{margin:0 14px 12px;background:rgba(122,176,96,.10);border:.5px solid rgba(122,176,96,.28);border-radius:8px;padding:8px 10px}
.fc-example b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--tsucc);margin-bottom:3px}
.fc-example span{font-size:11px;color:rgba(180,220,160,.9);line-height:1.45}
/* Vedic / research method tag */
.fc-method-tag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:20px;background:rgba(201,160,96,.14);color:var(--twarn);border:.5px solid rgba(201,160,96,.3);margin:6px 14px 0;margin-bottom:0}
/* Solver & answer */
.solver-box{background:var(--info);border:.5px solid rgba(122,171,207,.25);border-radius:10px;padding:12px;margin-top:8px}
.solver-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.solver-row input,.solver-row select{width:100%;font-size:12px;padding:7px 9px;border:.5px solid var(--bd);border-radius:7px;background:var(--c2);color:var(--tx);outline:none}
.solver-row input:focus,.solver-row select:focus{border-color:var(--tinfo)}
.answer{background:var(--succ);color:var(--tsucc);border-radius:7px;padding:8px 10px;margin-top:6px;font-size:12px;line-height:1.5}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
.mini-badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:20px;background:var(--warn);color:var(--twarn);margin:2px 3px 0 0}


/* Quick-method video links */
.video-link{display:inline-block;margin-top:5px;font-size:10px;color:var(--tinfo);text-decoration:none;border-bottom:0.5px solid rgba(122,171,207,.45)}
.video-link:hover{color:var(--tx);border-color:var(--tx)}

</style>
</head>
<body>
<div id="app">
<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Daily alphabet root language exercise — Hebrew, IPA, and cross-language vocabulary</h2>
<div class="top-bar">
  <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
    <span style="font-size:13px;font-weight:500;color:var(--tx)">Alphabet Roots + STEM</span>
    <span class="streak" id="streak-display">streak: 0</span>
    <button class="btn" onclick="resetStreak()" title="Reset streak counter" style="font-size:10px;padding:2px 7px">↺</button>
    <button class="btn download-app" onclick="downloadCurrentHTML()" title="Download this app as an HTML file">Download</button>
  </div>
  <div class="mode-bar" role="tablist" aria-label="Study modes">
    <button class="mode-btn active" onclick="setMode('explore')" id="mode-explore" title="Alphabet view">Alphabet</button>
    <button class="mode-btn" onclick="setMode('vocab')" id="mode-vocab" title="Vocabulary">Vocab</button>
    <button class="mode-btn" onclick="setMode('morph')" id="mode-morph" title="Morphemes">Morphemes</button>
    
    
    <span class="mode-divider" aria-hidden="true"></span>
    <button class="mode-btn" onclick="openQuizLab()" id="mode-quiz" title="Quiz">Quiz</button>
    <button class="mode-btn" onclick="openExamLab('ap')" id="mode-ap" title="AP exam practice">AP</button>
    <button class="mode-btn" onclick="openExamLab('clep')" id="mode-clep" title="CLEP exam practice">CLEP</button>
    <span class="mode-divider" aria-hidden="true"></span>
    <button class="mode-btn" onclick="setMode('counts')" id="mode-counts" title="Morpheme overview">Counts</button>
    <button class="mode-btn" onclick="setMode('stem')" id="mode-stem" title="STEM reference">STEM</button>
    <button class="mode-btn" onclick="setMode('strategy')" id="mode-strategy" title="Reading/writing strategy">Strategy</button>
  </div>
  <div class="timer-box" id="timer" role="button" tabindex="0" title="Click to pause/resume; double-click to reset" onclick="toggleTimer()" ondblclick="resetTimer()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleTimer();}">0:00</div>
</div>
<div class="progress-bar"><div class="progress-fill" id="prog" style="width:3.8%"></div></div>
<div class="nav" id="letter-nav"></div>
<div id="main-content"></div>
<div class="bottom-nav">
  <button class="btn" id="prev-btn" onclick="go(-1)">← Prev</button>
  <span style="font-size:11px;color:var(--tt)" id="pos-label">A — 1 of 26</span>
  <button class="btn primary" id="next-btn" onclick="go(1)">Next →</button>
</div>
</div>
<script>

const STRATEGY_CATS = ['All','Reading','Writing','Pronunciation','Foreign Language Listening','Memory'];

let stratCat = 'All';

function setStratCat(c){
  stratCat = c;
  document.querySelectorAll('.strat-chip').forEach(b => b.classList.toggle('active', b.dataset.cat === c));
  document.querySelectorAll('.strat-card-wrap').forEach(el => {
    el.style.display = (c === 'All' || el.dataset.cat === c) ? 'flex' : 'none';
  });
}

function buildStratCard(s){
  const steps = s.steps.map((st,i) =>
    `<div class="fc-step-row"><div class="fc-step-num">${i+1}</div><div class="fc-step-text">${st}</div></div>`
  ).join('');
  return `<div class="strat-card-wrap" data-cat="${s.cat}" style="display:flex;flex-direction:column">
  <div class="formula-card" data-cat="Strategy" style="flex:1">
    <div class="fc-head">
      <div class="fc-title">${s.title}</div>
      <span class="fc-badge" style="background:rgba(122,171,207,.14);color:var(--tinfo)">${s.cat}</span>
    </div>
    <span class="fc-method-tag" style="margin:6px 14px 0">🎓 ${s.research}</span>
    <div class="fc-purpose">
      <div class="fc-purpose-box"><b>Research Finding</b><span>${s.finding}</span></div>
      <div class="fc-purpose-box"><b>Model / Framework</b><span>${s.model}</span></div>
    </div>
    <div class="fc-steps">
      <div class="fc-steps-title">Evidence-Based Procedure</div>
      ${steps}
    </div>
    <div class="fc-example"><b>Applied Example</b><span>${s.example}</span></div>
  </div>
</div>`;
}

function renderStrategy(){
  document.getElementById('pos-label').textContent = 'Academic Strategy Lab';
  document.getElementById('main-content').innerHTML = `
<div class="card">
  <div class="stem-title">Academic Strategy Lab</div>
  <div class="stem-sub">Research-backed strategies for reading, writing, pronunciation, foreign language listening, and memory. Every card cites the primary research, states the key empirical finding, and gives a step-by-step procedure grounded in that evidence.</div>
  <div class="stem-toolbar">
    ${STRATEGY_CATS.map(c => `<button class="stem-chip strat-chip${c==='All'?' active':''}" data-cat="${c}" onclick="setStratCat('${c}')">${c}</button>`).join('')}
  </div>
</div>
<div class="stem-grid" id="strat-grid" style="margin-top:8px">
  ${STRATEGY_CARDS.map(s => buildStratCard(s)).join('')}
</div>`;
}

 example:'5/6 − 1/4 = ? LCD of 6 and 4 is 12. 5/6 = 10/12, 1/4 = 3/12. Subtract: 10/12 − 3/12 = 7/12. Already in lowest terms.'},

{cat:'Numbers & Operations',tags:['arithmetic','beginner','fractions'],
 title:'Multiplying & Dividing Fractions',
 theory:'',
 reality:'Half of a half-pizza is a quarter-pizza. Doubling 3/4 cup is 1½ cups. Splitting a 3/4-mile route into 1/8-mile segments is a division problem. These come up daily.',
 formula:'Multiply:  a/b × c/d = (a·c) / (b·d)\nDivide:    a/b ÷ c/d = a/b × d/c   (flip & multiply)',
 method:'For division, "Keep, Change, Flip": keep the first fraction, change ÷ to ×, flip the second. Cancel common factors BEFORE multiplying to keep numbers small.',
 svg:`<svg viewBox="0 0 260 100" xmlns="http://www.w3.org/2000/svg">
  <text x="14" y="32" font-size="11" fill="#7aabcf" font-weight="700">×</text>
  <rect x="28" y="20" width="48" height="22" rx="5" fill="rgba(122,171,207,.10)" stroke="#7aabcf" stroke-width="1"/>
  <text x="52" y="35" text-anchor="middle" font-size="10" fill="#9ecef0">2/3 × 4/5</text>
  <text x="80" y="33" font-size="10" fill="#7aabcf">→</text>
  <rect x="96" y="20" width="68" height="22" rx="5" fill="rgba(122,176,96,.12)" stroke="#7ab060" stroke-width="1"/>
  <text x="130" y="35" text-anchor="middle" font-size="10" fill="#a0c888" font-weight="700">(2·4)/(3·5)</text>
  <text x="170" y="33" font-size="10" fill="#7ab060">=</text>
  <rect x="184" y="20" width="48" height="22" rx="5" fill="rgba(122,176,96,.18)" stroke="#7ab060" stroke-width="1"/>
  <text x="208" y="35" text-anchor="middle" font-size="11" fill="#7ab060" font-weight="700">8/15</text>

  <text x="14" y="74" font-size="11" fill="#c9a060" font-weight="700">÷</text>
  <rect x="28" y="62" width="48" height="22" rx="5" fill="rgba(201,160,96,.10)" stroke="#c9a060" stroke-width="1"/>
  <text x="52" y="77" text-anchor="middle" font-size="10" fill="#d4b87a">3/4 ÷ 1/2</text>
  <text x="80" y="75" font-size="10" fill="#c9a060">→</text>
  <rect x="96" y="62" width="68" height="22" rx="5" fill="rgba(201,160,96,.18)" stroke="#c9a060" stroke-width="1"/>
  <text x="130" y="77" text-anchor="middle" font-size="10" fill="#d4b87a" font-weight="700">3/4 × 2/1</text>
  <text x="170" y="75" font-size="10" fill="#7ab060">=</text>
  <rect x="184" y="62" width="48" height="22" rx="5" fill="rgba(122,176,96,.18)" stroke="#7ab060" stroke-width="1"/>
  <text x="208" y="77" text-anchor="middle" font-size="11" fill="#7ab060" font-weight="700">6/4 = 3/2</text>
 </svg>`,
 caption:'Multiply straight across; divide = flip & multiply',
 steps:['For multiplying: multiply the tops together, then the bottoms together.','Look for common factors between any top and any bottom — cancel them BEFORE multiplying.','For dividing: keep the first fraction; change the sign to ×; flip the second fraction (its reciprocal).','Now follow the multiply steps on the rewritten expression.','Simplify the final result if needed.'],
 example:'3/8 ÷ 9/16. Keep-Change-Flip: 3/8 × 16/9. Cancel: 3/9 → 1/3, 16/8 → 2/1. Now: (1·2)/(3·1) = 2/3.'},

{cat:'Numbers & Operations',tags:['arithmetic','beginner','percents'],
 title:'Decimals ↔ Fractions ↔ Percents',
 theory:'',
 reality:'Sale signs say "25% off". Test scores say "0.85". Recipes say "1/2". They\'re all the same kind of number — the unit just changed. Knowing how to switch between them is essential.',
 formula:'Decimal → Percent:  ×100  (move decimal 2 right)\nPercent → Decimal:  ÷100  (move decimal 2 left)\nFraction → Decimal: divide top by bottom\nDecimal → Fraction: write over a power of 10, simplify',
 method:'Memorize 4 anchors: 1/2 = 0.5 = 50%, 1/4 = 0.25 = 25%, 3/4 = 0.75 = 75%, 1/10 = 0.1 = 10%. Most percent problems on tests reduce to one of these.',
 svg:`<svg viewBox="0 0 260 100" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="20" width="68" height="60" rx="8" fill="rgba(122,171,207,.10)" stroke="#7aabcf" stroke-width="1"/>
  <text x="48" y="38" text-anchor="middle" font-size="10" fill="#7aabcf" font-weight="700">FRACTION</text>
  <text x="48" y="58" text-anchor="middle" font-size="14" fill="#9ecef0">3/4</text>
  <line x1="84" y1="50" x2="98" y2="50" stroke="#c9a060" stroke-width="1.2"/>
  <polygon points="98,50 95,47 95,53" fill="#c9a060"/>
  <rect x="100" y="20" width="68" height="60" rx="8" fill="rgba(201,160,96,.10)" stroke="#c9a060" stroke-width="1"/>
  <text x="134" y="38" text-anchor="middle" font-size="10" fill="#c9a060" font-weight="700">DECIMAL</text>
  <text x="134" y="58" text-anchor="middle" font-size="14" fill="#d4b87a">0.75</text>
  <line x1="170" y1="50" x2="184" y2="50" stroke="#7ab060" stroke-width="1.2"/>
  <polygon points="184,50 181,47 181,53" fill="#7ab060"/>
  <rect x="186" y="20" width="68" height="60" rx="8" fill="rgba(122,176,96,.10)" stroke="#7ab060" stroke-width="1"/>
  <text x="220" y="38" text-anchor="middle" font-size="10" fill="#7ab060" font-weight="700">PERCENT</text>
  <text x="220" y="58" text-anchor="middle" font-size="14" fill="#a0c888">75%</text>
 </svg>`,
 caption:'All three are the same number in different clothes',
 steps:['Decimal → Percent: shift the decimal point two places to the right (or multiply by 100).','Percent → Decimal: shift the decimal point two places to the left (or divide by 100).','Fraction → Decimal: divide the top number by the bottom number using long division.','Decimal → Fraction: write the digits after the decimal over the matching power of 10 (one digit → /10, two digits → /100). Simplify.','To find a percent of a number: convert the percent to a decimal first, then multiply.'],
 example:'What is 35% of 80?  Convert 35% → 0.35.  Multiply: 0.35 × 80 = 28.'},

{cat:'Algebra',tags:['algebra','beginner'],
 title:'One-Step & Two-Step Equations',
 theory:'',
 reality:'When you reverse-engineer a phone bill, find the original price after a discount, or figure out how many hours you worked from your paycheck — you\'re solving a one- or two-step equation.',
 formula:'Goal: isolate x.\n• Undo addition with subtraction (and vice-versa).\n• Undo multiplication with division (and vice-versa).\n• Whatever you do to one side, do to the other.',
 method:'Two-step rule: undo addition/subtraction FIRST, then undo multiplication/division. (Reverse order of PEMDAS.) This rule almost never fails.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <text x="130" y="22" text-anchor="middle" font-size="11" fill="#9ecef0" font-weight="700">3x + 7 = 22</text>
  <line x1="50" y1="32" x2="210" y2="32" stroke="#7aabcf" stroke-width="0.5" stroke-dasharray="2,2"/>
  <text x="14" y="50" font-size="10" fill="#c9a060" font-weight="700">Step 1:</text>
  <text x="60" y="50" font-size="10" fill="#d4b87a">subtract 7 from both sides</text>
  <text x="180" y="50" font-size="10" fill="#d4b87a">→ 3x = 15</text>
  <text x="14" y="70" font-size="10" fill="#7ab060" font-weight="700">Step 2:</text>
  <text x="60" y="70" font-size="10" fill="#a0c888">divide both sides by 3</text>
  <text x="180" y="70" font-size="10" fill="#a0c888">→ x = 5</text>
  <rect x="60" y="84" width="140" height="20" rx="5" fill="rgba(122,176,96,.18)" stroke="#7ab060" stroke-width="1"/>
  <text x="130" y="98" text-anchor="middle" font-size="11" fill="#7ab060" font-weight="700">Check: 3(5)+7 = 22 ✓</text>
 </svg>`,
 caption:'Undo +/− first, then undo ×/÷. Always check.',
 steps:['Identify which operations are being done to x (addition? multiplication? both?).','Undo addition or subtraction first by doing the opposite to BOTH sides.','Then undo multiplication or division by doing the opposite to BOTH sides.','You should now have x = (some number).','CHECK by substituting your answer back into the original equation. Both sides equal? You\'re done.'],
 example:'Solve 5x − 3 = 17.  Step 1: add 3 to both sides → 5x = 20.  Step 2: divide by 5 → x = 4.  Check: 5(4) − 3 = 17 ✓.'},

{cat:'Coordinate Geometry',tags:['algebra','beginner','geometry'],
 title:'Slope-Intercept Form  y = mx + b',
 theory:'',
 reality:'Phone plans cost a flat fee (b) plus a per-minute rate (m). Distance during a road trip = starting odometer (b) + speed × time (mx). Slope-intercept lines are how rates show up in the real world.',
 formula:'y = m x + b\n  m = slope    (rise over run)\n  b = y-intercept   (where the line crosses the y-axis)\nSlope between two points: m = (y₂ − y₁) / (x₂ − x₁)',
 method:'Plot the y-intercept first (the line\'s anchor point on the y-axis). From there, use slope as "rise over run" — up = positive rise, right = positive run.',
 svg:`<svg viewBox="0 0 260 120" xmlns="http://www.w3.org/2000/svg">
  <line x1="20" y1="100" x2="240" y2="100" stroke="#5e5e5e" stroke-width="0.6"/>
  <line x1="40" y1="10" x2="40" y2="110" stroke="#5e5e5e" stroke-width="0.6"/>
  <text x="234" y="113" font-size="9" fill="#8a8a8a">x</text>
  <text x="30" y="14" font-size="9" fill="#8a8a8a">y</text>
  <line x1="20" y1="80" x2="240" y2="20" stroke="#7aabcf" stroke-width="1.5"/>
  <circle cx="40" cy="74" r="3" fill="#c9a060"/>
  <text x="48" y="72" font-size="9" fill="#c9a060" font-weight="700">b = 2  (y-intercept)</text>
  <line x1="100" y1="58" x2="160" y2="58" stroke="#7ab060" stroke-width="0.8" stroke-dasharray="3,2"/>
  <line x1="160" y1="58" x2="160" y2="42" stroke="#7ab060" stroke-width="0.8" stroke-dasharray="3,2"/>
  <text x="124" y="55" font-size="8" fill="#a0c888">run = 2</text>
  <text x="164" y="52" font-size="8" fill="#a0c888">rise = 1</text>
  <text x="174" y="98" font-size="9" fill="#7aabcf" font-weight="700">slope m = 1/2</text>
 </svg>`,
 caption:'Start at b on the y-axis, then climb by m for every step right',
 steps:['If the equation is not yet in y = mx + b form, solve it for y first.','Identify m (the coefficient on x) and b (the constant alone).','Plot the point (0, b) on the y-axis — this is your starting anchor.','From that anchor, count "rise" up and "run" right based on m. (Slope of 2 = up 2, right 1. Slope of 3/4 = up 3, right 4.)','Mark the second point and connect with a straight line.'],
 example:'Graph y = 2x − 3. Start at (0, −3). Slope 2 = up 2, right 1, so next point is (1, −1). Connect.'},

{cat:'Trigonometry',tags:['geometry','beginner','trigonometry'],
 title:'SOH-CAH-TOA — Right Triangle Trig',
 theory:'',
 reality:'You see a tall building, walk back 50 ft, look up at a 60° angle — how tall is it? You know one leg of a right triangle and the angle, so trig finds the other leg. SOH-CAH-TOA solves angle-of-elevation, ramp problems, and roof pitches.',
 formula:'sin θ = Opposite / Hypotenuse\ncos θ = Adjacent / Hypotenuse\ntan θ = Opposite / Adjacent\n\nMnemonic: SOH · CAH · TOA',
 method:'Step 1: identify which side is opposite the angle, which is adjacent (next to it, NOT the hypotenuse), and which is the hypotenuse (always opposite the right angle). Then pick the ratio that uses the two sides you know/want.',
 svg:`<svg viewBox="0 0 260 120" xmlns="http://www.w3.org/2000/svg">
  <polygon points="40,100 200,100 200,30" fill="rgba(122,171,207,.08)" stroke="#7aabcf" stroke-width="1.4"/>
  <rect x="190" y="90" width="10" height="10" fill="none" stroke="#7aabcf" stroke-width="0.7"/>
  <path d="M 70,100 A 30,30 0 0,0 60,84" fill="none" stroke="#c9a060" stroke-width="1"/>
  <text x="76" y="92" font-size="10" fill="#c9a060" font-weight="700">θ</text>
  <text x="120" y="113" text-anchor="middle" font-size="10" fill="#9ecef0">Adjacent</text>
  <text x="208" y="68" font-size="10" fill="#a0c888">Opposite</text>
  <text x="100" y="60" font-size="10" fill="#d4b87a" font-weight="700" transform="rotate(-25 100 60)">Hypotenuse</text>
  <rect x="6" y="14" width="48" height="14" rx="3" fill="rgba(122,171,207,.18)" stroke="#7aabcf" stroke-width="0.5"/>
  <text x="30" y="24" text-anchor="middle" font-size="9" fill="#7aabcf" font-weight="700">SOH</text>
  <rect x="6" y="32" width="48" height="14" rx="3" fill="rgba(201,160,96,.18)" stroke="#c9a060" stroke-width="0.5"/>
  <text x="30" y="42" text-anchor="middle" font-size="9" fill="#c9a060" font-weight="700">CAH</text>
  <rect x="6" y="50" width="48" height="14" rx="3" fill="rgba(122,176,96,.18)" stroke="#7ab060" stroke-width="0.5"/>
  <text x="30" y="60" text-anchor="middle" font-size="9" fill="#7ab060" font-weight="700">TOA</text>
 </svg>`,
 caption:'Identify Opposite, Adjacent, Hypotenuse — then pick the ratio',
 steps:['Find the right angle (the small square). The side opposite to it is the HYPOTENUSE — always the longest.','Locate the angle θ you care about. The side directly across from θ is the OPPOSITE side.','The remaining leg, touching θ but not the hypotenuse, is the ADJACENT side.','Look at which two sides you have or need. SOH if you need O and H. CAH if A and H. TOA if O and A.','Set up the ratio, plug in known values, solve for the unknown using a calculator.'],
 example:'A ramp rises 4 ft over a horizontal run of 10 ft. Find θ. tan θ = O/A = 4/10 = 0.4. θ = arctan(0.4) ≈ 21.8°.'},

{cat:'Statistics',tags:['data','beginner','statistics'],
 title:'Mean, Median, & Mode — The Three Averages',
 theory:'',
 reality:'Your "average grade" (mean), the "middle income" of a town (median), and the "most popular shoe size" (mode) are three different ways to describe a typical value. Each tells a different story.',
 formula:'Mean   = (sum of all values) ÷ (count)\nMedian = middle value once sorted\n         (with even count: mean of the two middle values)\nMode   = the value that appears most often\nRange  = max − min',
 method:'Outliers (extreme values) drag the mean but barely move the median. Use median when data is skewed (incomes, house prices). Use mean when data is symmetric (test scores).',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <text x="14" y="20" font-size="10" fill="#9ecef0" font-weight="700">Data: 4, 7, 7, 9, 13</text>
  <rect x="14" y="32" width="74" height="22" rx="5" fill="rgba(122,171,207,.18)" stroke="#7aabcf" stroke-width="1"/>
  <text x="51" y="46" text-anchor="middle" font-size="10" fill="#7aabcf" font-weight="700">MEAN = 8</text>
  <rect x="92" y="32" width="74" height="22" rx="5" fill="rgba(201,160,96,.18)" stroke="#c9a060" stroke-width="1"/>
  <text x="129" y="46" text-anchor="middle" font-size="10" fill="#c9a060" font-weight="700">MEDIAN = 7</text>
  <rect x="170" y="32" width="74" height="22" rx="5" fill="rgba(122,176,96,.18)" stroke="#7ab060" stroke-width="1"/>
  <text x="207" y="46" text-anchor="middle" font-size="10" fill="#7ab060" font-weight="700">MODE = 7</text>
  <text x="14" y="74" font-size="9" fill="#7aabcf">sum 40 ÷ count 5</text>
  <text x="92" y="74" font-size="9" fill="#c9a060">middle of 5 values</text>
  <text x="170" y="74" font-size="9" fill="#7ab060">7 appears twice</text>
  <text x="14" y="100" font-size="9" fill="#8a8a8a">Range = 13 − 4 = 9   (spread of the data)</text>
 </svg>`,
 caption:'Mean: the balance point. Median: the middle. Mode: the most common.',
 steps:['SORT the data from smallest to largest. (Always step 1.)','MEAN: add every value, then divide by how many there are.','MEDIAN: pick the middle value. If there are two middle values, take their average.','MODE: count how many times each value appears; the most frequent is the mode. (Data can have no mode, one mode, or multiple modes.)','RANGE: subtract the smallest from the largest.'],
 example:'Data: 3, 6, 6, 7, 10, 12. Mean = (3+6+6+7+10+12)/6 = 44/6 ≈ 7.33. Median = (6+7)/2 = 6.5. Mode = 6.'},

{cat:'Statistics',tags:['data','beginner','probability'],
 title:'Probability Basics — Counting Possibilities',
 theory:'',
 reality:'Will it rain? What\'s the chance of drawing an ace? Should you take this insurance? Probability is the math of "how often" — it tells you what to expect over many tries.',
 formula:'P(event) = (favorable outcomes) / (total possible outcomes)\n0 ≤ P ≤ 1\nP(A and B independent) = P(A) × P(B)\nP(A or B disjoint)     = P(A) + P(B)\nP(not A) = 1 − P(A)',
 method:'List the sample space (all possible outcomes), then count which ones match the event. For "and" with independent events, multiply. For "or" with disjoint events, add. Always check 0 ≤ P ≤ 1.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="14" width="232" height="40" rx="6" fill="rgba(122,171,207,.08)" stroke="#7aabcf" stroke-width="0.7"/>
  <text x="22" y="28" font-size="9" fill="#7aabcf" font-weight="700">Sample space (single die):</text>
  <g font-family="ui-monospace,monospace">
    <rect x="22" y="32" width="20" height="20" fill="rgba(255,255,255,.06)" stroke="#7aabcf" stroke-width="0.6"/>
    <text x="32" y="46" text-anchor="middle" font-size="11" fill="#9ecef0">1</text>
    <rect x="46" y="32" width="20" height="20" fill="rgba(122,176,96,.18)" stroke="#7ab060" stroke-width="0.7"/>
    <text x="56" y="46" text-anchor="middle" font-size="11" fill="#a0c888">2</text>
    <rect x="70" y="32" width="20" height="20" fill="rgba(255,255,255,.06)" stroke="#7aabcf" stroke-width="0.6"/>
    <text x="80" y="46" text-anchor="middle" font-size="11" fill="#9ecef0">3</text>
    <rect x="94" y="32" width="20" height="20" fill="rgba(122,176,96,.18)" stroke="#7ab060" stroke-width="0.7"/>
    <text x="104" y="46" text-anchor="middle" font-size="11" fill="#a0c888">4</text>
    <rect x="118" y="32" width="20" height="20" fill="rgba(255,255,255,.06)" stroke="#7aabcf" stroke-width="0.6"/>
    <text x="128" y="46" text-anchor="middle" font-size="11" fill="#9ecef0">5</text>
    <rect x="142" y="32" width="20" height="20" fill="rgba(122,176,96,.18)" stroke="#7ab060" stroke-width="0.7"/>
    <text x="152" y="46" text-anchor="middle" font-size="11" fill="#a0c888">6</text>
  </g>
  <text x="178" y="46" font-size="10" fill="#a0c888" font-weight="700">3 evens of 6</text>
  <rect x="14" y="68" width="232" height="32" rx="6" fill="rgba(122,176,96,.10)" stroke="#7ab060" stroke-width="0.8"/>
  <text x="130" y="88" text-anchor="middle" font-size="11" fill="#7ab060" font-weight="700">P(even) = 3/6 = 1/2 = 0.5 = 50%</text>
 </svg>`,
 caption:'Favorable ÷ Total. Probability is always between 0 and 1.',
 steps:['List the SAMPLE SPACE — every possible outcome. Make sure each is equally likely.','COUNT how many of those outcomes match the event you care about (favorable).','DIVIDE: P = favorable / total.','For "and" with INDEPENDENT events (one doesn\'t affect the other), multiply: P(A) × P(B).','For "or" with DISJOINT events (cannot both happen), add: P(A) + P(B). Sanity-check: never above 1.'],
 example:'Two coins flipped. P(both heads)? Each flip is independent. P(H) = 1/2 each. P(HH) = 1/2 × 1/2 = 1/4.'},

{cat:'Numbers & Operations',tags:['arithmetic','beginner'],
 title:'GCF & LCM — Greatest Common Factor, Least Common Multiple',
 theory:'',
 reality:'GCF tells you how to simplify a fraction. LCM tells you when two events line up — like when two buses, one running every 12 min and one every 20 min, will arrive at the same stop together.',
 formula:'GCF (greatest common factor): the largest number that divides BOTH evenly\nLCM (least common multiple): the smallest number that BOTH divide into evenly\n\nUseful identity: GCF(a,b) × LCM(a,b) = a × b',
 method:'Prime-factor method works for everything: factor each number into primes, then GCF = product of shared primes (lowest power), LCM = product of all primes (highest power).',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <text x="14" y="20" font-size="10" fill="#9ecef0" font-weight="700">12 = 2 × 2 × 3</text>
  <text x="14" y="36" font-size="10" fill="#9ecef0" font-weight="700">18 = 2 × 3 × 3</text>
  <rect x="14" y="46" width="110" height="22" rx="5" fill="rgba(122,171,207,.18)" stroke="#7aabcf" stroke-width="1"/>
  <text x="69" y="60" text-anchor="middle" font-size="10" fill="#7aabcf" font-weight="700">GCF = 2 × 3 = 6</text>
  <rect x="130" y="46" width="116" height="22" rx="5" fill="rgba(201,160,96,.18)" stroke="#c9a060" stroke-width="1"/>
  <text x="188" y="60" text-anchor="middle" font-size="10" fill="#c9a060" font-weight="700">LCM = 2² × 3² = 36</text>
  <text x="14" y="84" font-size="9" fill="#7aabcf">Shared primes (lowest power)</text>
  <text x="130" y="84" font-size="9" fill="#c9a060">All primes (highest power)</text>
  <text x="14" y="100" font-size="9" fill="#7ab060">Check: 6 × 36 = 216 = 12 × 18 ✓</text>
 </svg>`,
 caption:'GCF: shared primes only. LCM: all primes, highest power.',
 steps:['Break each number into its PRIME FACTORS. (12 = 2 × 2 × 3, etc.)','For GCF: write down ONLY the primes that appear in BOTH lists, using the LOWEST power they appear in.','For LCM: write down EVERY prime that appears in EITHER list, using the HIGHEST power.','Multiply your selected primes to get the answer.','Optional check: GCF × LCM should equal the product of the two original numbers.'],
 example:'GCF and LCM of 8 and 12. 8 = 2³, 12 = 2² × 3. GCF = 2² = 4. LCM = 2³ × 3 = 24. Check: 4 × 24 = 96 = 8 × 12 ✓.'},

/* ── ARITHMETIC ─────────────────────────────────── */
{cat:'Numbers & Operations',tags:['arithmetic','daily','finance'],
 title:'Number Operations, Fractions & Percents',
 theory:'',
 reality:'If a pizza has 8 slices and you eat 3, you ate 3/8 of it — that is 37.5%. Stores use percents for sales, cooks use fractions in recipes, and banks use decimals for money. You use this math every single day.',
 formula:'PEMDAS: ( ) → ^ → × ÷ → + −\na/b + c/d = (ad + bc) / bd\nPercent: part/whole × 100\nPercent change: (new−old)/old × 100\nNew = original × (1 ± rate)',
 method:'Place-value decomposition: break numbers into tens and ones, multiply each part separately, then sum the partial products.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="14" width="110" height="38" rx="8" fill="rgba(90,176,216,.12)" stroke="#5ab0d8" stroke-width="1"/>
  <text x="65" y="29" text-anchor="middle" font-size="9" fill="#5ab0d8" font-weight="700">FRACTION</text>
  <text x="65" y="42" text-anchor="middle" font-size="9" fill="#9ecef0">2/3 + 1/4 = 8/12 + 3/12 = 11/12</text>
  <text x="65" y="55" text-anchor="middle" font-size="8" fill="#7aabcf">Common denominator: ×LCD</text>
  <rect x="140" y="14" width="112" height="38" rx="8" fill="rgba(122,176,96,.12)" stroke="#7ab060" stroke-width="1"/>
  <text x="196" y="29" text-anchor="middle" font-size="9" fill="#7ab060" font-weight="700">PERCENT</text>
  <text x="196" y="42" text-anchor="middle" font-size="9" fill="#a0c888">18 of 60 = 18/60 × 100 = 30%</text>
  <text x="196" y="55" text-anchor="middle" font-size="8" fill="#7ab060">part ÷ whole → decimal → ×100</text>
  <rect x="10" y="66" width="242" height="30" rx="6" fill="rgba(201,160,96,.10)" stroke="#c9a060" stroke-width="1"/>
  <text x="131" y="78" text-anchor="middle" font-size="8" fill="#c9a060" font-weight="700">CHUNKING (48×25): 50×25=1250, then −2×25=50, result=1200</text>
  <text x="131" y="90" text-anchor="middle" font-size="8" fill="#d4b87a">Round up → multiply easy → subtract excess</text>
 </svg>`,
 caption:'Fractions share a denominator; percents are parts per 100; chunking splits large multiplications.',
 steps:['Estimate the answer first to catch errors.','For fractions: find the LCD, convert, then add/subtract numerators.','For percent: write part/whole as a decimal then multiply by 100.','For percent change: (new − old) / old — a negative means decrease.','Use chunking for mental multiplication: round one factor to a nearby easy number, multiply, then correct.'],
 example:'Tax on a $48 item at 25%: 25% = 0.25. $48 × 0.25 = $12.00. (Chunk: 50×0.25=$12.50, minus 2×0.25=$0.50 → $12.00 ✓)'},

{cat:'Numbers & Operations',tags:['arithmetic','chemistry','physics','engineering'],
 title:'Scientific Notation, Sig Figs & SI Prefixes',
 theory:'',
 reality:'The distance from Earth to the Sun is 150,000,000,000 meters — way too long to write! Scientists shrink it to 1.5 x 10^11 m. Your phone chip is about 5 nanometers wide. Scientific notation makes huge and tiny numbers easy to handle.',
 formula:'N = a × 10ⁿ  (1 ≤ a < 10)\n10⁻³ = milli (m)  10⁻⁶ = micro (μ)\n10⁻⁹ = nano (n)  10³ = kilo (k)\n10⁶ = mega (M)  10⁹ = giga (G)\n% error = |measured − accepted| / accepted × 100',
 method:'Sig-fig rule: result has as many sig figs as the least-precise input. Multiplication/division: match fewest sig figs. Addition/subtraction: match fewest decimal places.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <text x="130" y="18" text-anchor="middle" font-size="10" fill="#5ab0d8" font-weight="700">6.022 × 10²³</text>
  <line x1="30" y1="28" x2="90" y2="28" stroke="#7aabcf" stroke-width="1"/>
  <line x1="100" y1="28" x2="220" y2="28" stroke="#c9a060" stroke-width="1"/>
  <text x="60" y="40" text-anchor="middle" font-size="8.5" fill="#7aabcf">coefficient a</text>
  <text x="160" y="40" text-anchor="middle" font-size="8.5" fill="#c9a060">exponent = decimal moves</text>
  <rect x="6" y="52" width="58" height="44" rx="6" fill="rgba(90,176,216,.12)" stroke="#5ab0d8" stroke-width="1"/>
  <text x="35" y="66" text-anchor="middle" font-size="8" fill="#5ab0d8">nano</text>
  <text x="35" y="78" text-anchor="middle" font-size="10" fill="#9ecef0" font-weight="700">10⁻⁹</text>
  <text x="35" y="90" text-anchor="middle" font-size="7" fill="#7aabcf">nm, ns</text>
  <rect x="72" y="52" width="50" height="44" rx="6" fill="rgba(90,176,216,.12)" stroke="#5ab0d8" stroke-width="1"/>
  <text x="97" y="66" text-anchor="middle" font-size="8" fill="#5ab0d8">micro</text>
  <text x="97" y="78" text-anchor="middle" font-size="10" fill="#9ecef0" font-weight="700">10⁻⁶</text>
  <text x="97" y="90" text-anchor="middle" font-size="7" fill="#7aabcf">μm, μs</text>
  <rect x="130" y="52" width="50" height="44" rx="6" fill="rgba(122,176,96,.12)" stroke="#7ab060" stroke-width="1"/>
  <text x="155" y="66" text-anchor="middle" font-size="8" fill="#7ab060">kilo</text>
  <text x="155" y="78" text-anchor="middle" font-size="10" fill="#a0c888" font-weight="700">10³</text>
  <text x="155" y="90" text-anchor="middle" font-size="7" fill="#7ab060">km, kg</text>
  <rect x="188" y="52" width="66" height="44" rx="6" fill="rgba(201,160,96,.12)" stroke="#c9a060" stroke-width="1"/>
  <text x="221" y="66" text-anchor="middle" font-size="8" fill="#c9a060">giga</text>
  <text x="221" y="78" text-anchor="middle" font-size="10" fill="#d4b87a" font-weight="700">10⁹</text>
  <text x="221" y="90" text-anchor="middle" font-size="7" fill="#c9a060">GHz, GB</text>
 </svg>`,
 caption:'Move decimal until one digit is left of point. Count moves = exponent. Prefix scales the unit.',
 steps:['Move the decimal point so exactly one non-zero digit sits left of it.','Count moves: right is negative exponent, left is positive.','For multiply/divide in sci notation: multiply coefficients, add exponents.','Round final answer to the same number of sig figs as the least precise given value.','Use prefix table to swap between SI units without converting the full power.'],
 example:'Avogadro: 602,200,000,000,000,000,000,000 = 6.022 × 10²³. Nanometer: 1 nm = 1 × 10⁻⁹ m. Error: measured=9.81, accepted=9.80 → |9.81−9.80|/9.80×100 = 0.10%'},

/* ── ALL ALGEBRA ────────────────────────────────── */
{cat:'Algebra',tags:['algebra','math'],
 title:'Linear Equations, Inequalities & Systems',
 theory:'',
 reality:'A phone plan costs $30 per month plus $0.10 per text. Write it as C = 0.10t + 30 and predict any bill instantly! Companies set prices and engineers design roads using these same equations every day.',
 formula:'ax + b = c  →  x = (c − b) / a\ny = mx + b  (slope-intercept)\nax + by = e\ncx + dy = f  (system)\n← flip inequality when × or ÷ by negative',
 method:'Elimination: multiply rows so one variable cancels. Substitution: isolate one variable, plug into the other equation. (Research: students who choose the method consciously outperform those who always use the same one.)',
 svg:`<svg viewBox="0 0 260 120" xmlns="http://www.w3.org/2000/svg">
  <line x1="14" y1="108" x2="246" y2="12" stroke="#7aabcf" stroke-width="2"/>
  <line x1="14" y1="30" x2="246" y2="100" stroke="#c9a060" stroke-width="2"/>
  <circle cx="140" cy="62" r="5" fill="#7ab060" stroke="#fff" stroke-width="1.5"/>
  <text x="148" y="58" font-size="8.5" fill="#7ab060" font-weight="700">Solution (x,y)</text>
  <text x="20" y="96" font-size="8" fill="#7aabcf">Line 1: y = mx+b</text>
  <text x="140" y="96" font-size="8" fill="#c9a060">Line 2: y = cx+d</text>
  <path d="M20 8 H80 M60 4 L80 8 L60 12" fill="none" stroke="#5a5a5a" stroke-width="1"/>
  <text x="10" y="15" font-size="7" fill="#8a8a8a">y-axis</text>
  <path d="M252 108 V70 M248 76 L252 70 L256 76" fill="none" stroke="#5a5a5a" stroke-width="1"/>
  <text x="238" y="120" font-size="7" fill="#8a8a8a">x-axis</text>
  <line x1="14" y1="108" x2="252" y2="108" stroke="#444" stroke-width="1"/>
  <line x1="14" y1="8" x2="14" y2="108" stroke="#444" stroke-width="1"/>
 </svg>`,
 caption:'Solution is the intersection point — where both equations are true simultaneously.',
 steps:['Distribute and clear all parentheses.','Move all variable terms to one side and constants to the other.','For systems: choose elimination when coefficients align easily, substitution when a variable has coefficient 1.','After elimination, substitute the found value back into either original equation.','Check: plug both values into BOTH original equations to confirm.'],
 example:'Solve: x + y = 10 and x − y = 2. Add equations: 2x = 12 → x = 6. Then 6+y=10 → y=4. Check: 6+4=10 ✓ and 6−4=2 ✓'},

{cat:'Algebra',tags:['algebra','physics','finance'],
 title:'Quadratics, Factoring & the Quadratic Formula',
 theory:'',
 reality:'When you throw a ball, it follows a curved path called a parabola — that is a quadratic! Engineers design roller coasters, bridges, and satellite dishes using this curve. Figuring out when a launched rocket hits the ground uses the quadratic formula.',
 formula:'ax² + bx + c = 0\nx = (−b ± √(b² − 4ac)) / 2a\nVertex: x = −b / 2a\nDiff of squares: a² − b² = (a−b)(a+b)\nPerfect sq: (a+b)² = a² + 2ab + b²',
 method:'AC method for trinomials: multiply a×c, find factor pair that sums to b, split middle term, factor by grouping. Proven faster than trial-and-error for ax²+bx+c with a≠1.',
 svg:`<svg viewBox="0 0 260 120" xmlns="http://www.w3.org/2000/svg">
  <line x1="14" y1="108" x2="246" y2="108" stroke="#444" stroke-width="1"/>
  <line x1="130" y1="12" x2="130" y2="112" stroke="#444" stroke-width="1"/>
  <path d="M20 108 Q130 -10 240 108" fill="none" stroke="#7aabcf" stroke-width="2.5"/>
  <circle cx="60" cy="108" r="4" fill="#c07070" stroke="#fff" stroke-width="1.5"/>
  <circle cx="200" cy="108" r="4" fill="#c07070" stroke="#fff" stroke-width="1.5"/>
  <circle cx="130" cy="49" r="4" fill="#c9a060" stroke="#fff" stroke-width="1.5"/>
  <text x="50" y="120" text-anchor="middle" font-size="8" fill="#c07070">x₁ root</text>
  <text x="200" y="120" text-anchor="middle" font-size="8" fill="#c07070">x₂ root</text>
  <text x="145" y="47" font-size="8" fill="#c9a060">vertex (−b/2a, min)</text>
  <text x="10" y="20" font-size="8" fill="#7aabcf">y = ax²+bx+c</text>
  <text x="160" y="20" font-size="7.5" fill="#8a8a8a">discriminant b²−4ac:</text>
  <text x="160" y="32" font-size="7.5" fill="#7ab060">&gt;0 two roots</text>
  <text x="160" y="44" font-size="7.5" fill="#c9a060">=0 one root</text>
  <text x="160" y="56" font-size="7.5" fill="#c07070">&lt;0 no real roots</text>
 </svg>`,
 caption:'Parabola: roots = x-intercepts; vertex = axis of symmetry; discriminant tells number of solutions.',
 steps:['Always try to factor first — faster when it works.','Check for special patterns: difference of squares, perfect square trinomial.','AC method: compute a×c, find factors of ac that sum to b, split bx, then group.','If factoring fails, use quadratic formula — works for any quadratic.','Interpret: x values are x-intercepts; vertex is max/min height, revenue, or area.'],
 example:'2x²+7x+3=0. AC: 2×3=6, factors of 6 that sum to 7 → 1 and 6. Split: 2x²+x+6x+3 = x(2x+1)+3(2x+1) = (x+3)(2x+1). Roots: x=−3, x=−1/2.'},

{cat:'Algebra',tags:['algebra','finance','chemistry','data'],
 title:'Functions, Exponents, Logs & Sequences',
 theory:'',
 reality:'Bacteria double every hour — that is exponential growth. Start with 1 bacterium, and after 10 hours you have over 1,000. Doctors use this to predict infections. Banks use it for compound interest. Your phone battery draining follows these same patterns.',
 formula:'f(x): one input → one output\naᵐ · aⁿ = aᵐ⁺ⁿ    (aᵐ)ⁿ = aᵐⁿ\nlog_b(x)=y  ↔  bʸ = x\nln(x) = log_e(x)\nArithmetic seq: aₙ = a₁ + (n−1)d\nGeometric seq: aₙ = a₁ · rⁿ⁻¹\nExponential: A = Peʳᵗ  or  A = P(1+r)ⁿ',
 method:'To solve exponential equations: take log of both sides. To solve log equations: exponentiate both sides. (Inverse function approach — matches standard CLEP/AP solution method.)',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <line x1="14" y1="100" x2="246" y2="100" stroke="#444" stroke-width="1"/>
  <line x1="14" y1="8" x2="14" y2="104" stroke="#444" stroke-width="1"/>
  <path d="M20 95 Q60 92 90 80 Q130 62 170 32 Q200 12 240 8" fill="none" stroke="#7aabcf" stroke-width="2" opacity=".9"/>
  <path d="M20 8 Q60 32 90 50 Q130 68 170 80 Q200 90 240 95" fill="none" stroke="#c9a060" stroke-width="2" opacity=".9"/>
  <text x="200" y="24" font-size="8.5" fill="#7aabcf" font-weight="700">y = eˣ</text>
  <text x="188" y="88" font-size="8.5" fill="#c9a060" font-weight="700">y = ln(x)</text>
  <path d="M20 20 L240 100" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="90" y="38" font-size="7.5" fill="#888">y = x (mirror line)</text>
  <text x="90" y="108" text-anchor="middle" font-size="8" fill="#7aabcf">eˣ and ln(x) are inverses — reflect over y=x</text>
 </svg>`,
 caption:'Exponential and log functions are inverses of each other — solving one uses the other.',
 steps:['Identify input variable and output — check if the function is one-to-one.','For exponents: use product/quotient/power rules to simplify before solving.','To isolate an exponent, take the log of both sides (log base matches the base).','To isolate a log, exponentiate both sides (base raised to both sides).','For sequences: determine if each step adds (arithmetic) or multiplies (geometric), then write the general term.'],
 example:'Solve 3^x = 81. Take log₃: x = log₃(81) = 4 (since 3⁴=81). Or: compound interest $1000 at 5% for 3 years: A=1000(1.05)³ = $1157.63'},

/* ── ANALYTIC GEOMETRY ──────────────────────────── */
{cat:'Coordinate Geometry',tags:['geometry','math','engineering'],
 title:'Lines, Circles, Distance & Midpoint',
 theory:'',
 reality:'GPS finds your exact location by measuring distances from satellites overhead. Architects use coordinate geometry to place every wall and window in a building. The midpoint formula finds the exact center between any two locations on a map.',
 formula:'Slope: m = (y₂−y₁)/(x₂−x₁)\nDistance: d = √((x₂−x₁)²+(y₂−y₁)²)\nMidpoint: M = ((x₁+x₂)/2, (y₁+y₂)/2)\nCircle: (x−h)²+(y−k)² = r²\nSlope-intercept: y = mx+b\nPoint-slope: y−y₁ = m(x−x₁)',
 method:'Standard form reveals center and radius immediately by completing the square — convert x²+y²+Dx+Ey+F=0 to standard form to read off (h,k) and r directly.',
 svg:`<svg viewBox="0 0 260 120" xmlns="http://www.w3.org/2000/svg">
  <line x1="14" y1="108" x2="246" y2="108" stroke="#444" stroke-width="1"/>
  <line x1="130" y1="10" x2="130" y2="112" stroke="#444" stroke-width="1"/>
  <circle cx="130" cy="60" r="40" fill="none" stroke="#7aabcf" stroke-width="2"/>
  <circle cx="130" cy="60" r="2.5" fill="#7aabcf"/>
  <line x1="130" y1="60" x2="162" y2="40" stroke="#c9a060" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="136" y="56" font-size="8" fill="#c9a060">r</text>
  <text x="124" y="70" font-size="8" fill="#7aabcf">(h,k)</text>
  <circle cx="74" cy="90" r="3" fill="#c07070"/>
  <circle cx="188" cy="38" r="3" fill="#c07070"/>
  <line x1="74" y1="90" x2="188" y2="38" stroke="#7ab060" stroke-width="1.5"/>
  <text x="118" y="78" font-size="8" fill="#7ab060">d=√(Δx²+Δy²)</text>
 </svg>`,
 caption:'Circle centered at (h,k) with radius r. Distance formula from Pythagorean theorem.',
 steps:['Plot the given points or center to set up the geometry visually.','Use slope formula to find steepness; slope of perpendicular = −1/m.','Distance formula comes from the Pythagorean theorem applied to Δx and Δy.','For a circle from general form, complete the square in x and y separately.','Midpoint is the average of the x-coordinates and the average of the y-coordinates.'],
 example:'Circle: x²+y²−6x+4y−3=0. Complete square: (x²−6x+9)+(y²+4y+4)=3+9+4. So (x−3)²+(y+2)²=16. Center (3,−2), radius 4.'},

{cat:'Coordinate Geometry',tags:['geometry','physics','engineering'],
 title:'Conics: Parabola, Ellipse & Hyperbola',
 theory:'',
 reality:'Satellite dishes are parabolas that focus all signals to one point. Planets orbit the Sun in ellipses, not circles. Whispering galleries in museums are ellipse-shaped so a whisper at one end is clearly heard at the other — that is geometry in action.',
 formula:'Parabola: y = a(x−h)²+k  or  x = a(y−k)²+h\nEllipse: (x−h)²/a²+(y−k)²/b²=1\nHyperbola: (x−h)²/a²−(y−k)²/b²=1\nFocus distance: c²=a²−b² (ellipse)\nc²=a²+b² (hyperbola)',
 method:'Complete the square on both variables to reach standard form. The shape is identified by sign: same-sign denominators = ellipse; opposite signs = hyperbola; one variable linear = parabola.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <path d="M20 108 Q65 -8 110 108" fill="none" stroke="#7aabcf" stroke-width="2"/>
  <text x="65" y="16" text-anchor="middle" font-size="8" fill="#7aabcf">Parabola</text>
  <ellipse cx="178" cy="60" rx="35" ry="48" fill="none" stroke="#c9a060" stroke-width="2"/>
  <text x="178" y="14" text-anchor="middle" font-size="8" fill="#c9a060">Ellipse</text>
  <ellipse cx="178" cy="60" rx="10" ry="48" fill="none" stroke="#c9a060" stroke-width="1" stroke-dasharray="3,2" opacity=".5"/>
  <path d="M200 12 Q248 60 200 108 M156 12 Q108 60 156 108" fill="none" stroke="#c07070" stroke-width="0" opacity="0"/>
  <text x="130" y="108" text-anchor="middle" font-size="8" fill="#8a8a8a">vertex · focus · directrix · center · foci</text>
 </svg>`,
 caption:'Parabola: one focus. Ellipse: two foci, sum of distances constant. Hyperbola: two foci, difference constant.',
 steps:['Complete the square in both x and y to reach standard form.','Identify the shape: linear variable → parabola; same sign fractions → ellipse; opposite → hyperbola.','Read center/vertex, a, b, and compute c for the foci.','Sketch axes of symmetry and plot the key points (vertices, co-vertices, foci).','For AP/CLEP: know that a > b > 0 for ellipse; a is the transverse semi-axis for hyperbola.'],
 example:'9x²+4y²=36 → x²/4+y²/9=1. Ellipse: a=3 (y-axis), b=2 (x-axis), c=√(9−4)=√5. Foci at (0,±√5).'},

/* ── ALL GEOMETRY ───────────────────────────────── */
{cat:'Geometry',tags:['geometry','daily','engineering'],
 title:'Plane Geometry: Angles, Area & Similarity',
 theory:'',
 reality:'A carpenter cuts wood at exact angles. A painter calculates wall area to buy the right amount of paint. Architects use similarity to scale blueprints up to real buildings. Geometry is the math of everything you can see, build, and measure.',
 formula:'Triangle area: A = bh/2\nCircle: C = 2πr,  A = πr²\nParallelogram: A = bh\nTrapezoid: A = (b₁+b₂)h/2\nPythagorean: a²+b²=c²\nSimilar: matching sides proportional',
 method:'Polya diagram strategy: label every known measurement on the figure before writing any equation. Unknown angles are found by adding/subtracting known angles from 180° or 360°.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <polygon points="130,12 30,106 230,106" fill="rgba(122,171,207,.10)" stroke="#7aabcf" stroke-width="2"/>
  <line x1="130" y1="12" x2="130" y2="106" stroke="#c9a060" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="134" y="62" font-size="8" fill="#c9a060">h</text>
  <text x="70" y="118" font-size="8" fill="#8a8a8a">b</text>
  <text x="22" y="96" font-size="8.5" fill="#c07070">A</text>
  <text x="224" y="96" font-size="8.5" fill="#c07070">B</text>
  <text x="126" y="10" font-size="8.5" fill="#c07070">C</text>
  <text x="3" y="118" font-size="8" fill="#7aabcf">A = ½bh</text>
  <circle cx="210" cy="50" r="36" fill="rgba(201,160,96,.08)" stroke="#c9a060" stroke-width="2"/>
  <text x="210" y="53" text-anchor="middle" font-size="8" fill="#c9a060">A=πr²</text>
  <text x="210" y="66" text-anchor="middle" font-size="8" fill="#c9a060">C=2πr</text>
 </svg>`,
 caption:'Triangle area = ½ base × height. Circle uses radius in both area and circumference.',
 steps:['Label the shape — mark base, height, and all known sides and angles.','Use complementary (sum 90°), supplementary (sum 180°), and vertical angles (equal) to find missing angles.','For similar triangles: set up a proportion of corresponding sides and solve.','Apply the correct area formula — height must be perpendicular to the base.','For composite figures, split into simpler shapes, find each area, then add or subtract.'],
 example:'Triangle with base 8 cm and height 5 cm: A = ½(8)(5) = 20 cm². Circle with radius 7: A = π(49) ≈ 153.94 cm².'},

{cat:'Geometry',tags:['geometry','chemistry','engineering','daily'],
 title:'Solid Geometry: Volume, Surface Area & Density',
 theory:'',
 reality:'How much water fits in a swimming pool? How much cardboard makes a cereal box? Shipping companies calculate volume to pack containers. Doctors measure bone density to check for osteoporosis. These calculations happen in construction and medicine every day.',
 formula:'Prism/Cylinder V = A_base × h\nCylinder V = πr²h,  SA = 2πr²+2πrh\nCone V = ⅓πr²h\nSphere V = (4/3)πr³,  SA = 4πr²\nDensity ρ = m/V\nPyramid V = ⅓A_base × h',
 method:'Composite solid strategy: decompose complex 3D objects into prisms, cylinders, cones, and hemispheres. Add or subtract volumes depending on the shape (e.g., hollow cylinders).',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="68" cy="94" rx="40" ry="10" fill="rgba(122,171,207,.15)" stroke="#7aabcf" stroke-width="1.5"/>
  <line x1="28" y1="94" x2="28" y2="50" stroke="#7aabcf" stroke-width="1.5"/>
  <line x1="108" y1="94" x2="108" y2="50" stroke="#7aabcf" stroke-width="1.5"/>
  <ellipse cx="68" cy="50" rx="40" ry="10" fill="rgba(122,171,207,.10)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="68" y="74" text-anchor="middle" font-size="8" fill="#7aabcf">V=πr²h</text>
  <circle cx="180" cy="62" r="44" fill="rgba(201,160,96,.08)" stroke="#c9a060" stroke-width="2"/>
  <text x="180" y="58" text-anchor="middle" font-size="8" fill="#c9a060">V=4πr³/3</text>
  <text x="180" y="72" text-anchor="middle" font-size="8" fill="#c9a060">SA=4πr²</text>
  <text x="130" y="114" text-anchor="middle" font-size="8" fill="#8a8a8a">Cylinder · Sphere · ρ=m/V</text>
 </svg>`,
 caption:'Cylinder: circular base × height. Sphere: depends only on radius. Density links mass to volume.',
 steps:['Convert ALL dimensions to the same unit before calculating.','Identify the base shape of prisms and cylinders, then multiply base area by height.','For cones and pyramids, use ⅓ × base area × height.','For density: if you know any two of mass, volume, density, find the third by rearranging ρ = m/V.','For composite solids, break into known shapes and add/subtract volumes.'],
 example:'A cylinder of radius 3 cm and height 10 cm: V = π(3²)(10) = 90π ≈ 282.7 cm³. If it is aluminum (ρ = 2.7 g/cm³), mass = 2.7 × 282.7 ≈ 763 g.'},

/* ── TRIGONOMETRY ───────────────────────────────── */
{cat:'Trigonometry',tags:['geometry','calculus','physics','engineering'],
 title:'Unit Circle, Triangles & Pythagorean Identities',
 theory:'',
 reality:'A sailor uses angles and distances to navigate across the ocean without landmarks. Game designers use sine and cosine to make characters move in smooth circles. Your smartphone knows which way it is tilting because its gyroscope uses trigonometry every second.',
 formula:'SOH-CAH-TOA:\nsin θ = opp/hyp   cos θ = adj/hyp   tan θ = opp/adj\nUnit circle: (cos θ, sin θ)\nPythagorean: sin²θ+cos²θ=1\n1+tan²θ=sec²θ   1+cot²θ=csc²θ\nInverse: θ = arcsin(x), arccos(x), arctan(x)',
 method:'ASTC (All Students Take Calculus): All positive in Q1, Sine positive in Q2, Tangent in Q3, Cosine in Q4. Use reference angles to find exact values from 30-60-90 and 45-45-90 triangles.',
 svg:`<svg viewBox="0 0 260 120" xmlns="http://www.w3.org/2000/svg">
  <circle cx="130" cy="60" r="48" fill="none" stroke="rgba(122,171,207,.4)" stroke-width="1.5"/>
  <line x1="78" y1="60" x2="182" y2="60" stroke="#444" stroke-width="1"/>
  <line x1="130" y1="8" x2="130" y2="112" stroke="#444" stroke-width="1"/>
  <line x1="130" y1="60" x2="164" y2="36" stroke="#7aabcf" stroke-width="2"/>
  <circle cx="164" cy="36" r="3.5" fill="#7aabcf"/>
  <line x1="164" y1="60" x2="164" y2="36" stroke="#c9a060" stroke-width="1.8" stroke-dasharray="3,2"/>
  <line x1="130" y1="60" x2="164" y2="60" stroke="#c07070" stroke-width="1.8" stroke-dasharray="3,2"/>
  <path d="M148 60 A18 18 0 0 0 143 48" fill="none" stroke="#7ab060" stroke-width="1.5"/>
  <text x="148" y="57" font-size="8" fill="#7ab060">θ</text>
  <text x="166" y="50" font-size="8" fill="#c9a060">sin θ</text>
  <text x="142" y="70" font-size="8" fill="#c07070">cos θ</text>
  <text x="168" y="33" font-size="8" fill="#7aabcf">(cos θ, sin θ)</text>
  <text x="72" y="14" font-size="8" fill="#5a8a5a">Q2 sin+</text>
  <text x="152" y="14" font-size="8" fill="#7aabcf">Q1 all+</text>
  <text x="72" y="110" font-size="8" fill="#c9a060">Q3 tan+</text>
  <text x="152" y="110" font-size="8" fill="#c07070">Q4 cos+</text>
 </svg>`,
 caption:'Point on unit circle = (cos θ, sin θ). ASTC rule shows which functions are positive per quadrant.',
 steps:['Draw the right triangle or unit circle position for the given angle.','For standard angles (30°, 45°, 60°), use exact values from the special triangles.','For other quadrants, find the reference angle (acute angle to x-axis), then apply ASTC sign rule.','Use Pythagorean identities to swap between sin, cos, tan without recalculating.','For inverses: the output is an angle — check the restricted domain (arcsin: −π/2 to π/2).'],
 example:'Find sin(150°). Reference angle = 30°, Q2 so sin is positive. sin(30°)=1/2. So sin(150°)=1/2. Check: (cos150°,sin150°) = (−√3/2, 1/2) on unit circle. ✓'},

{cat:'Trigonometry',tags:['physics','engineering','calculus'],
 title:'Trig Graphs, Waves & Radians',
 theory:'',
 reality:'Sound, light, and radio waves are all sine waves. Your speaker makes music by vibrating in wave patterns. Doctors read heartbeats on a monitor — that wavy EKG line is a sine wave. Radians help engineers design everything that spins or pulses.',
 formula:'Radians = degrees × π/180\ny = A sin(Bx + C) + D\nAmplitude = |A|\nPeriod = 2π/|B|\nPhase shift = −C/B\nVertical shift = D\nWave: y = A sin(kx − ωt + φ)',
 method:'Graph by landmarks: start at phase shift, plot max at T/4, midline at T/2, min at 3T/4, return at T. Five-point method is the most efficient for AP/CLEP graphing questions.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <line x1="14" y1="56" x2="246" y2="56" stroke="#444" stroke-width="1"/>
  <line x1="14" y1="10" x2="14" y2="100" stroke="#444" stroke-width="1"/>
  <path d="M14 56 C40 10 66 10 92 56 C118 100 144 100 170 56 C196 10 222 10 248 56" fill="none" stroke="#7aabcf" stroke-width="2.5"/>
  <line x1="14" y1="18" x2="246" y2="18" stroke="#c9a060" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="14" y1="94" x2="246" y2="94" stroke="#c9a060" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="92" y1="10" x2="170" y2="10" stroke="#c07070" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="131" y="8" text-anchor="middle" font-size="8" fill="#c07070">Period T = 2π/|B|</text>
  <text x="6" y="21" font-size="7.5" fill="#c9a060">A</text>
  <text x="6" y="97" font-size="7.5" fill="#c9a060">−A</text>
  <text x="20" y="44" font-size="7.5" fill="#8a8a8a">Amplitude |A|</text>
  <text x="130" y="108" text-anchor="middle" font-size="8" fill="#7ab060">y = A·sin(Bx+C)+D — five landmark points</text>
 </svg>`,
 caption:'Sine wave: A=amplitude, T=period, phase shift moves graph left/right, D shifts up/down.',
 steps:['Convert degrees to radians when using calculus formulas: multiply by π/180.','Read amplitude as the vertical distance from midline to peak.','Compute period = 2π/|B| — this is the length of one complete cycle.','Phase shift = −C/B moves the graph horizontally (negative = shift right).','For waves in physics: connect angular frequency ω = 2πf and wave number k = 2π/λ.'],
 example:'y = 3 sin(2x − π/2) + 1. Amplitude=3, Period=2π/2=π, Phase shift=π/4 right, Vertical shift=1 up. Five key x-values: start at π/4, then add π/4 each step.'},

/* ── DIFFERENTIAL CALCULUS ─────────────────────── */
{cat:'Derivatives & Limits',tags:['calculus','physics','finance','engineering'],
 title:'Limits, Derivatives & Rates of Change',
 theory:'',
 reality:'Your car speedometer shows how fast your position is changing — that is a derivative! Weather forecasters calculate how quickly temperature is dropping. Stock traders watch how fast prices change. Derivatives measure the rate of change of anything in the real world.',
 formula:'Limit: lim[h→0] (f(x+h)−f(x))/h\nd/dx xⁿ = n·xⁿ⁻¹\nd/dx eˣ = eˣ\nd/dx ln x = 1/x\nd/dx sin x = cos x\nd/dx cos x = −sin x\nSum rule: (f+g)′ = f′+g′',
 method:"L'Hôpital's Rule: if limit gives 0/0 or ∞/∞ form, differentiate numerator and denominator separately, then re-evaluate. Use for AP Calc limits with indeterminate forms.",
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <line x1="14" y1="108" x2="246" y2="108" stroke="#444" stroke-width="1"/>
  <line x1="14" y1="10" x2="14" y2="112" stroke="#444" stroke-width="1"/>
  <path d="M20 100 Q80 98 120 70 Q160 42 200 22 Q220 14 240 12" fill="none" stroke="#7aabcf" stroke-width="2.5"/>
  <circle cx="140" cy="52" r="4" fill="#c9a060"/>
  <line x1="90" y1="80" x2="200" y2="28" stroke="#c9a060" stroke-width="2"/>
  <text x="135" y="44" font-size="7.5" fill="#c9a060">tangent line</text>
  <text x="135" y="56" font-size="7.5" fill="#c9a060">slope = f′(x)</text>
  <line x1="140" y1="52" x2="140" y2="108" stroke="#c07070" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="142" y="88" font-size="7.5" fill="#c07070">x = a</text>
  <text x="16" y="22" font-size="8.5" fill="#7aabcf">y = f(x)</text>
  <text x="60" y="116" text-anchor="middle" font-size="8" fill="#8a8a8a">secant → tangent as h → 0</text>
 </svg>`,
 caption:'Derivative = slope of tangent line at one point. As h shrinks, secant becomes tangent.',
 steps:['Simplify the function before differentiating — combine like terms, rewrite radicals as powers.','Apply power rule term by term: bring exponent down, reduce exponent by 1.','Memorize the standard derivatives: trig, exponential, and logarithm.','Interpret result: derivative units = output units per input unit (e.g., m/s is derivative of meters with respect to seconds).','For limits: try direct substitution first; if 0/0, factor/cancel or use L\'Hôpital\'s Rule.'],
 example:'f(x) = 3x⁴ − 5x² + 2. f′(x) = 12x³ − 10x. At x=1: f′(1) = 12−10 = 2. This is the slope of f at x=1.'},

{cat:'Derivatives & Limits',tags:['calculus','engineering','finance'],
 title:'Product, Quotient, Chain Rule & Optimization',
 theory:'',
 reality:'A factory wants to make the biggest box possible from one flat sheet of cardboard. A farmer wants to fence the most land using the least fencing. Companies use these techniques to cut costs and maximize profit — it is math that saves real money every day.',
 formula:'Product: (fg)′ = f′g + fg′\nQuotient: (f/g)′ = (f′g−fg′)/g²\nChain: [f(g(x))]′ = f′(g(x))·g′(x)\nImplicit: differentiate both sides, solve for dy/dx\nOptimization: set f′(x)=0, test with f″(x)\nRelated rates: differentiate both sides w.r.t. time t',
 method:'Chain rule mnemonic: "derivative of outside (leaving inside alone) times derivative of inside." For optimization: always verify whether critical point is max or min using second derivative test (f″ > 0 → min, f″ < 0 → max).',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="20" width="60" height="28" rx="7" fill="rgba(122,171,207,.15)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="40" y="31" text-anchor="middle" font-size="8.5" fill="#7aabcf" font-weight="700">outer f</text>
  <text x="40" y="43" text-anchor="middle" font-size="8" fill="#9ecef0">f′(g(x))</text>
  <text x="76" y="37" text-anchor="middle" font-size="12" fill="#555">×</text>
  <rect x="86" y="20" width="60" height="28" rx="7" fill="rgba(201,160,96,.15)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="116" y="31" text-anchor="middle" font-size="8.5" fill="#c9a060" font-weight="700">inner g</text>
  <text x="116" y="43" text-anchor="middle" font-size="8" fill="#d4b87a">g′(x)</text>
  <text x="156" y="37" text-anchor="middle" font-size="10" fill="#555">=</text>
  <rect x="164" y="20" width="88" height="28" rx="7" fill="rgba(122,176,96,.12)" stroke="#7ab060" stroke-width="1.5"/>
  <text x="208" y="31" text-anchor="middle" font-size="8.5" fill="#7ab060" font-weight="700">[f(g(x))]′</text>
  <text x="208" y="43" text-anchor="middle" font-size="8" fill="#a0c888">Chain result</text>
  <line x1="14" y1="108" x2="246" y2="108" stroke="#444" stroke-width="1"/>
  <path d="M20 108 Q80 104 120 68 Q150 38 180 70 Q210 100 240 108" fill="none" stroke="#c07070" stroke-width="2"/>
  <circle cx="120" cy="68" r="4" fill="#7ab060"/>
  <text x="124" y="64" font-size="8" fill="#7ab060">max f′=0</text>
  <circle cx="178" cy="70" r="4" fill="#c9a060"/>
  <text x="140" y="88" font-size="7.5" fill="#c9a060">local min</text>
  <text x="20" y="100" font-size="8" fill="#8a8a8a">Optimization: critical pts where f′(x)=0</text>
 </svg>`,
 caption:'Chain rule: outside × inside derivative. Optimization: f′=0 at extrema; f″ determines max vs min.',
 steps:['Identify the outer and inner functions before applying chain rule.','For product rule: d(uv)/dx = u′v + uv′ — differentiate each factor in turn.','For quotient rule: remember "low d-high minus high d-low, all over low-squared."','For optimization: define the objective function, take its derivative, set equal to zero, and solve.','Confirm max or min: f″(x) > 0 → concave up → minimum; f″(x) < 0 → concave down → maximum.'],
 example:'Differentiate h(x)=sin(x³). Outer=sin, inner=x³. h′(x)=cos(x³)·3x². Optimization: maximize area A=x(100−x). A′=100−2x=0 → x=50. A″=−2<0 (max). Max area=50×50=2500 m².'},

/* ── INTEGRAL CALCULUS ─────────────────────────── */
{cat:'Integration',tags:['calculus','physics','engineering'],
 title:'Antiderivatives, Area & the Fundamental Theorem',
 theory:'',
 reality:'How far did a car travel if you only know its speed at every moment? You add up all the tiny distances — that is integration. Engineers calculate fuel consumption. Doctors measure total drug dosage in a patient over time using this same idea.',
 formula:'∫ xⁿ dx = xⁿ⁺¹/(n+1) + C  (n ≠ −1)\n∫ eˣ dx = eˣ + C\n∫ 1/x dx = ln|x| + C\n∫ sin x dx = −cos x + C\nFTC: ∫_a^b f(x) dx = F(b) − F(a)\nAvg value = 1/(b−a) · ∫_a^b f(x) dx',
 method:'Fundamental Theorem of Calculus (FTC Part 2): find the antiderivative F, then evaluate F(b) − F(a). The constant C disappears in definite integrals. Units of ∫f dx = units of f × units of x.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <line x1="14" y1="108" x2="246" y2="108" stroke="#444" stroke-width="1"/>
  <line x1="14" y1="10" x2="14" y2="112" stroke="#444" stroke-width="1"/>
  <path d="M30 100 Q80 98 120 70 Q160 40 200 22 Q220 14 240 12" fill="none" stroke="#7aabcf" stroke-width="2"/>
  <path d="M70 90 Q80 88 100 78 Q120 68 140 56 L140 108 L70 108 Z" fill="rgba(122,171,207,.18)" stroke="none"/>
  <line x1="70" y1="10" x2="70" y2="108" stroke="#c9a060" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="140" y1="10" x2="140" y2="108" stroke="#c9a060" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="68" y="118" font-size="8" fill="#c9a060">a</text>
  <text x="137" y="118" font-size="8" fill="#c9a060">b</text>
  <text x="100" y="90" text-anchor="middle" font-size="8.5" fill="#7aabcf" font-weight="700">∫_a^b f(x) dx</text>
  <text x="100" y="102" text-anchor="middle" font-size="7.5" fill="#7aabcf">= F(b) − F(a)</text>
  <text x="16" y="22" font-size="8.5" fill="#7aabcf">y=f(x)</text>
 </svg>`,
 caption:'Shaded area = definite integral. FTC: find antiderivative F, evaluate at b, subtract value at a.',
 steps:['Identify whether the integral is indefinite (+ C) or definite (bounded).','For indefinite integrals, reverse the derivative rules: power rule in reverse, standard forms.','For definite integrals: find antiderivative F(x), then evaluate F(b) − F(a).','Always attach units: if integrating velocity (m/s) over time (s), result is meters.','Average value of f on [a,b] = (1/(b−a)) times the definite integral.'],
 example:'∫₀² 3x² dx. Antiderivative: x³. Evaluate: 2³ − 0³ = 8. Area under 3x² from x=0 to x=2 is 8 square units.'},

{cat:'Integration',tags:['calculus','engineering','physics'],
 title:'Integration Techniques: u-Sub, Parts & Applications',
 theory:'',
