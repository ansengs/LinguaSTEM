<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alphabet Root Language Exercise</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#2a2a2a;color:#c8c8c8;min-height:100vh;padding:0.5rem}
:root{
--c1:#333333;
--c2:#3a3a3a;
--c3:#424242;
--tx:#d4d4d4;
--ts:#8a8a8a;
--tt:#5e5e5e;
--bd:rgba(255,255,255,0.09);
--info:#1e2d3d;
--tinfo:#7aabcf;
--warn:#2e2518;
--twarn:#c9a060;
--succ:#1c2a18;
--tsucc:#7ab060;
--danger:#2e1e1e;
--tdanger:#c07070;
}
@media(prefers-color-scheme:dark){
:root{
--c1:#272520;
--c2:#2f2d27;
--c3:#38352e;
--tx:#ccc8be;
--ts:#8a8780;
--tt:#5e5c57;
--bd:rgba(200,190,170,0.1);
--info:#1e2e3d;
--tinfo:#7aabcf;
--warn:#332a18;
--twarn:#c9a060;
--succ:#1c2e18;
--tsucc:#7ab060;
--danger:#2e1e1e;
--tdanger:#c07070;
}}
#app{max-width:760px;margin:0 auto;padding:0.5rem 0.25rem}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:0.6rem;gap:6px;flex-wrap:wrap}
.timer-box{font-size:12px;font-weight:500;color:var(--tinfo);background:var(--info);padding:3px 10px;border-radius:20px;min-width:64px;text-align:center;cursor:pointer;user-select:none}
.timer-box.warn{color:var(--twarn);background:var(--warn)}
.timer-box.done{color:var(--tsucc);background:var(--succ)}
.timer-box.paused{opacity:.55}
.mode-divider{display:inline-block;width:1px;height:16px;background:var(--bd);margin:0 2px;vertical-align:middle}
.progress-bar{height:3px;background:var(--bd);border-radius:2px;margin-bottom:0.55rem;overflow:hidden}
.progress-fill{height:100%;background:var(--tinfo);border-radius:2px;transition:width .3s}
.nav{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:0.55rem}
.nav-btn{font-size:11px;font-weight:500;padding:3px 7px;border:0.5px solid var(--bd);border-radius:5px;cursor:pointer;background:var(--c2);color:var(--ts);transition:all .15s}
.nav-btn:hover{background:var(--c3);color:var(--tx)}
.nav-btn.active{background:var(--tinfo);color:#fff;border-color:var(--tinfo)}
.card{background:var(--c1);border:0.5px solid var(--bd);border-radius:10px;padding:0.85rem 0.95rem;margin-bottom:0.5rem}
.card-row{display:grid;grid-template-columns:1fr;gap:0.5rem;margin-bottom:0.5rem}
@media(min-width:640px){.card-row.split{grid-template-columns:1fr 1fr}.card-row.split>.card{margin-bottom:0}}
.letter-hero{display:flex;align-items:flex-start;gap:1rem;flex-wrap:wrap}
.letter-glyph{font-size:54px;font-weight:500;line-height:1;color:var(--tinfo);min-width:64px;text-align:center}
.hebrew-glyph{font-size:36px;color:var(--ts);margin-top:2px;text-align:center}
.letter-info{flex:1;min-width:200px}
.letter-en{font-size:18px;font-weight:500;color:var(--tx);margin-bottom:2px}
.hebrew-name{font-size:13px;color:var(--ts);margin-bottom:5px}
.symbol-tag{display:inline-block;font-size:11px;padding:2px 9px;background:var(--warn);color:var(--twarn);border-radius:20px;margin-bottom:6px}
.meaning-tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.tag{font-size:10px;padding:2px 7px;background:var(--c2);border:0.5px solid var(--bd);border-radius:20px;color:var(--ts)}
.ipa-row{font-size:12px;color:var(--tx);margin-bottom:2px}
.ipa-sym{font-size:14px;font-weight:500;color:var(--tinfo);font-family:monospace}
.section-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--tt);margin-bottom:6px;margin-top:0.5rem}
.section-title:first-child{margin-top:0}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.vocab-item{background:var(--c2);border:0.5px solid var(--bd);border-radius:7px;padding:8px 10px;cursor:pointer;transition:all .15s}
.vocab-item:hover{border-color:var(--tinfo)}
.vocab-item.revealed .vocab-meaning{display:block}
.vocab-item.revealed{border-color:var(--tsucc)}
.vocab-word{font-size:13px;font-weight:500;color:var(--tx)}
.vocab-ipa{font-size:11px;color:var(--ts);font-family:monospace;margin:1px 0}
.vocab-meaning{display:none;font-size:11px;color:var(--tsucc);margin-top:3px;line-height:1.4}
.vocab-hint{font-size:10px;color:var(--tt);margin-top:2px}
.lang-tabs{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px}
.lang-tab{font-size:11px;padding:2px 8px;border:0.5px solid var(--bd);border-radius:20px;cursor:pointer;background:var(--c2);color:var(--ts);transition:all .15s}
.lang-tab:hover{background:var(--c3)}
.lang-tab.active{background:var(--tinfo);color:#fff;border-color:var(--tinfo)}
.lang-entry{font-size:12px;color:var(--tx);margin-bottom:3px;line-height:1.45}
.lang-word{font-weight:500}
.lang-ipa{font-family:monospace;font-size:11px;color:var(--ts)}
.root-box{background:var(--c2);border-left:2px solid var(--bd);border-radius:0 6px 6px 0;padding:6px 10px;margin-bottom:4px;font-size:12px;line-height:1.4}
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:0.5rem;gap:6px}
.btn{font-size:12px;padding:6px 14px;border:0.5px solid var(--bd);border-radius:7px;cursor:pointer;background:var(--c2);color:var(--tx);transition:all .15s;font-weight:500}
.btn:hover{background:var(--c3)}
.btn.primary{background:var(--tinfo);color:#fff;border-color:var(--tinfo)}
.btn.primary:hover{opacity:.9}
.mode-bar{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.mode-btn{font-size:11px;padding:3px 9px;border:0.5px solid var(--bd);border-radius:20px;cursor:pointer;background:var(--c2);color:var(--ts)}
.mode-btn.active{background:var(--succ);color:var(--tsucc);border-color:var(--tsucc)}
.quiz-prompt{font-size:15px;font-weight:500;color:var(--tx);margin-bottom:10px;text-align:center;padding:0.7rem;background:var(--c2);border-radius:7px}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px}
.quiz-opt{padding:9px 10px;border:0.5px solid var(--bd);border-radius:7px;cursor:pointer;font-size:12px;background:var(--c2);color:var(--tx);transition:all .15s;text-align:left}
.quiz-opt:hover{border-color:var(--tinfo);background:var(--info)}
.quiz-opt.correct{background:var(--succ);color:var(--tsucc);border-color:var(--tsucc)}
.quiz-opt.wrong{background:var(--danger);color:var(--tdanger);border-color:var(--tdanger)}
.score-row{font-size:12px;color:var(--ts);text-align:center}
.streak{font-size:11px;color:var(--twarn);background:var(--warn);padding:2px 8px;border-radius:20px}
.chars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:3px}
.char-item{background:var(--c2);border:0.5px solid var(--bd);border-radius:7px;padding:8px 10px}
.char-script{font-size:10px;color:var(--tt);margin-bottom:2px;text-transform:uppercase;letter-spacing:.05em}
.char-glyph{font-size:20px;font-weight:500;color:var(--tinfo);margin-bottom:1px;line-height:1.2}
.char-name{font-size:11px;font-weight:500;color:var(--tx);margin-bottom:1px}
.char-note{font-size:10px;color:var(--ts);line-height:1.35}
/* Added balanced morpheme bank styles: keeps original app look */
.search{width:100%;font-size:13px;padding:7px 10px;border:0.5px solid var(--bd);border-radius:7px;background:var(--c2);color:var(--tx);outline:none;margin-bottom:6px}
.search:focus{border-color:var(--tinfo);box-shadow:0 0 0 2px rgba(122,171,207,.12)}
.filter-row{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin:6px 0}
.link-chip{font-size:11px;padding:3px 8px;border:0.5px solid var(--bd);border-radius:20px;cursor:pointer;background:var(--c2);color:var(--ts);text-decoration:none;display:inline-block;transition:all .15s}
.link-chip:hover{background:var(--c3);color:var(--tx)}
.link-chip.active{background:var(--tinfo);color:#fff;border-color:var(--tinfo)}
.muted{font-size:11px;color:var(--ts);line-height:1.4}
.count-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px;margin-top:6px}
.count-card{background:var(--c2);border:0.5px solid var(--bd);border-radius:8px;padding:10px;text-align:center;text-decoration:none;display:block;transition:all .15s}
.count-card:hover{border-color:var(--tinfo);background:var(--c3)}
.big{font-size:24px;color:var(--tinfo);font-weight:600;line-height:1}
.small{font-size:10px;color:var(--ts);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.vocab-item:target,.root-box:target{border-color:var(--tinfo);box-shadow:0 0 0 2px rgba(122,171,207,.18)}
.download-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}

/* Reading/Writing Strategy module */
.strategy-title{font-size:18px;font-weight:600;color:var(--tx);margin-bottom:4px}.strategy-sub{font-size:12px;color:var(--ts);line-height:1.45;margin-bottom:8px}.strategy-jump{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.strategy-jump a{font-size:11px;padding:3px 8px;border:0.5px solid var(--bd);border-radius:20px;background:var(--c2);color:var(--tinfo);text-decoration:none}.mini-formula{white-space:pre-line;background:var(--c2);border:0.5px solid var(--bd);border-radius:7px;padding:8px 10px;margin:6px 0;font-size:11px;line-height:1.45;color:var(--tx)}.method-list{padding-left:1rem;margin-top:5px;color:var(--ts);font-size:12px;line-height:1.45}.method-list li{margin-bottom:5px}.strategy-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px;margin-top:6px}.strategy-card{background:var(--c2);border:0.5px solid var(--bd);border-radius:8px;padding:9px 10px;font-size:11px;line-height:1.4;color:var(--ts)}.strategy-card strong{display:block;color:var(--tx);font-size:12px;margin-bottom:3px}.topic-row{background:var(--c2);border-left:2px solid var(--tinfo);border-radius:0 7px 7px 0;padding:8px 10px;margin-bottom:5px;font-size:11px;line-height:1.45;color:var(--ts)}.topic-row b{display:block;color:var(--tx);font-size:12px;margin-bottom:2px}.write-box{background:var(--info);border:0.5px solid rgba(122,171,207,.25);border-radius:8px;padding:9px 10px;font-size:12px;line-height:1.45;color:var(--tinfo);margin:6px 0}.pill-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}.pill{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--succ);color:var(--tsucc)}

/* STEM formula and interactive solver module */
.stem-title{font-size:18px;font-weight:600;color:var(--tx);margin-bottom:4px}.stem-sub{font-size:12px;color:var(--ts);line-height:1.45;margin-bottom:8px}.stem-toolbar{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.stem-chip{font-size:11px;padding:3px 8px;border:.5px solid var(--bd);border-radius:20px;background:var(--c2);color:var(--tinfo);cursor:pointer}.stem-chip:hover,.stem-chip.active{background:var(--tinfo);color:#fff;border-color:var(--tinfo)}.stem-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px;margin-top:6px}.formula-card{background:var(--c2);border:.5px solid var(--bd);border-radius:8px;padding:9px 10px;font-size:11px;line-height:1.4;color:var(--ts);cursor:pointer;transition:all .15s}.formula-card:hover{border-color:var(--tinfo);transform:translateY(-1px)}.formula-card strong{display:block;color:var(--tx);font-size:12px;margin-bottom:3px}.formula{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-line;background:rgba(0,0,0,.14);border:.5px solid var(--bd);border-radius:6px;padding:6px 8px;color:var(--tinfo);margin:5px 0;font-size:11px}.steps{padding-left:1rem;margin-top:5px;color:var(--ts);font-size:11px;line-height:1.45}.steps li{margin-bottom:3px}.solver-box{background:var(--info);border:.5px solid rgba(122,171,207,.25);border-radius:8px;padding:10px;margin-top:8px}.solver-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}.solver-row input,.solver-row select{width:100%;font-size:12px;padding:7px 9px;border:.5px solid var(--bd);border-radius:7px;background:var(--c2);color:var(--tx);outline:none}.solver-row input:focus,.solver-row select:focus{border-color:var(--tinfo)}.diagram{background:var(--c2);border:.5px solid var(--bd);border-radius:8px;padding:8px;margin-top:6px;text-align:center;color:var(--ts);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.35}.diagram svg{max-width:100%;height:auto}.answer{background:var(--succ);color:var(--tsucc);border-radius:7px;padding:7px 9px;margin-top:6px;font-size:12px;line-height:1.4}.quick-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}.mini-badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:20px;background:var(--warn);color:var(--twarn);margin:2px 3px 0 0}


/* STEM quick solution video methods */
.video-link{display:inline-block;margin-top:5px;font-size:10px;color:var(--tinfo);text-decoration:none;border-bottom:0.5px solid rgba(122,171,207,.45)}
.video-link:hover{color:var(--tx);border-color:var(--tx)}
.quick-steps{margin-top:5px;padding-left:0.95rem;color:var(--ts);font-size:11px;line-height:1.45}
.quick-steps li{margin-bottom:3px}

</style>
</head>
<body>
<div id="app">
<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Daily alphabet root language exercise — Hebrew, IPA, and cross-language vocabulary</h2>
<div class="top-bar">
  <div style="display:flex;gap:5px;align-items:center;flex-wrap:wrap">
    <span style="font-size:13px;font-weight:500;color:var(--tx)">Alphabet Roots + STEM</span>
    <span class="streak" id="streak-display">streak: 0</span>
    <button class="btn" onclick="resetStreak()" title="Reset streak counter" style="font-size:10px;padding:2px 7px">↺</button>
  </div>
  <div class="mode-bar" role="tablist" aria-label="Study modes">
    <button class="mode-btn active" onclick="setMode('explore')" id="mode-explore" title="Per-letter alphabet view">Alphabet</button>
    <button class="mode-btn" onclick="setMode('vocab')" id="mode-vocab" title="Per-letter vocabulary">Vocab</button>
    <button class="mode-btn" onclick="setMode('quiz')" id="mode-quiz" title="Per-letter quiz">Quiz</button>
    <button class="mode-btn" onclick="setMode('morph')" id="mode-morph" title="Per-letter morphemes">Morphemes</button>
    <span class="mode-divider" aria-hidden="true"></span>
    <button class="mode-btn" onclick="setMode('counts')" id="mode-counts" title="Global morpheme overview">Counts</button>
    <button class="mode-btn" onclick="setMode('stem')" id="mode-stem" title="Global STEM reference">STEM</button>
    <button class="mode-btn" onclick="setMode('strategy')" id="mode-strategy" title="Global reading/writing strategy">Strategy</button>
  </div>
  <div class="timer-box" id="timer" role="button" tabindex="0" title="Click to pause/resume; double-click to reset" onclick="toggleTimer()" ondblclick="resetTimer()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleTimer();}">10:00</div>
</div>
<div class="progress-bar"><div class="progress-fill" id="prog" style="width:3.8%"></div></div>
<div class="nav" id="letter-nav"></div>
<div id="main-content"></div>
<div class="bottom-nav">
  <button class="btn" id="prev-btn" onclick="go(-1)">← Prev</button>
  <span style="font-size:11px;color:var(--tt)" id="pos-label">A — 1 of 26</span>
  <button class="btn primary" id="next-btn" onclick="go(1)">Next →</button>
</div>
</div>
<script>

const QUICK_STEM_METHODS=[

const DATA=[

vocab:[
  {w:"authority",ipa:"/ɔːˈθɒr.ɪ.ti/",def:"Power to lead — Aleph (strength) + Ayin (insight) + Tav (covenant)",root:"Latin auctoritas; Aleph: first/chief"},

function renderStrategy(){
  document.getElementById('pos-label').textContent='Reading & Writing Strategy';
  document.getElementById('main-content').innerHTML=`
<div class="card" id="strategy-top"><div class="strategy-title">Rapid Reading/Writing Strategy</div><div class="strategy-sub">A textbook-style system for efficient reading and writing: purpose, preview, structure, grammar, recall, compression, application, and review.</div><div class="mini-formula"><strong>MASTER METHOD</strong>\nPurpose → Preview → Predict → Read in Chunks → Mark Structure → Recall → Compress → Apply → Review</div><div class="strategy-jump"><a href="#process">9-Step Process</a><a href="#linguistic-topics">Linguistic Topics</a><a href="#genre-reading">Genres</a><a href="#writing-system">Writing</a><a href="#memory-drills">Memory</a><a href="#daily-routine">Daily Routine</a></div></div>
<div class="card" id="process"><div class="section-title">The 9-step process for any topic</div><ol class="method-list"><li><strong>Set purpose:</strong> Decide whether you are reading to pass a test, write a paper, make a decision, follow directions, enjoy a story, or verify facts.</li><li><strong>Preview structure:</strong> Inspect title, headings, introduction, conclusion, visuals, bold words, citations, summaries, questions, and repeated terms.</li><li><strong>Predict the map:</strong> Guess the organization: problem/solution, cause/effect, compare/contrast, sequence, argument, narrative, or legal rule.</li><li><strong>Read in chunks:</strong> Read one paragraph or section at a time. Stop and state the point in one sentence.</li><li><strong>Mark grammar:</strong> Identify subject, verb, object, modifiers, prepositions, conditions, and conclusion words.</li><li><strong>Separate main from support:</strong> Main idea tells what the text says; support explains, proves, illustrates, qualifies, or limits it.</li><li><strong>Recall without looking:</strong> Close the text and explain the point aloud. Reread only the confusing part.</li><li><strong>Compress:</strong> Turn a paragraph into one sentence, a section into a note, and a source into a 3-line summary.</li><li><strong>Apply:</strong> Use the idea in a sentence, outline, answer, essay paragraph, discussion, or real-life decision.</li></ol></div>
<div class="card" id="linguistic-topics"><div class="section-title">Concise structure for each linguistic topic</div>${STRATEGY_TOPICS.map(t=>`<div class="topic-row"><b>${t[0]}</b><span style="color:var(--tinfo)">Read:</span> ${t[1]}<br><span style="color:var(--twarn)">Write:</span> ${t[2]}</div>`).join('')}</div>
<div class="card" id="genre-reading"><div class="section-title">High-speed reading method by subject / genre</div><div class="strategy-grid">${GENRE_METHODS.map(x=>`<div class="strategy-card"><strong>${x[0]}</strong><p><span style="color:var(--tinfo)">Fast path:</span> ${x[1]}</p><p><span style="color:var(--twarn)">Slow down for:</span> ${x[2]}</p><div class="mini-formula">${x[3]}</div></div>`).join('')}</div></div>
<div class="card" id="writing-system"><div class="section-title">Efficient writing structure</div><div class="mini-formula"><strong>Sentence:</strong> Subject → Verb → Object/Complement → Modifier\n<strong>Paragraph:</strong> Topic sentence → Evidence → Explanation → Link\n<strong>Essay:</strong> Thesis → Reasons → Evidence → Counterpoint → Conclusion\n<strong>Research:</strong> Question → Gap → Method → Finding → Meaning → Limit</div><div class="write-box"><strong>Academic paragraph formula:</strong> Claim the point in the first sentence. Give evidence in the middle. Explain how the evidence proves the claim. End by linking back to the thesis or forward to the next paragraph.</div><ol class="method-list"><li><strong>Plan:</strong> Write the purpose, audience, thesis/main point, and required format.</li><li><strong>Outline:</strong> Arrange ideas before polishing sentences.</li><li><strong>Draft fast:</strong> Write simple sentences first; improve style later.</li><li><strong>Add evidence:</strong> Use facts, examples, quotes, data, definitions, scenes, or legal clauses.</li><li><strong>Explain evidence:</strong> Never drop evidence without explaining its meaning.</li><li><strong>Revise by passes:</strong> idea, organization, paragraph unity, sentence clarity, grammar, mechanics.</li></ol></div>
<div class="card" id="memory-drills"><div class="section-title">Rapid memory drills</div><div class="strategy-grid"><div class="strategy-card"><strong>3-2-1 Recall</strong><p>Write 3 key points, 2 useful terms, and 1 question.</p></div><div class="strategy-card"><strong>One-Sentence Compression</strong><p>Reduce every paragraph to: “This paragraph says ___ because ___.”</p></div><div class="strategy-card"><strong>Root Decode</strong><p>Split prefix/root/suffix, guess meaning, check context, then use the word.</p></div><div class="strategy-card"><strong>Teach Back</strong><p>Explain the idea as if teaching a beginner.</p></div><div class="strategy-card"><strong>Spacing</strong><p>Review after 10 minutes, 1 day, 3 days, and 1 week.</p></div><div class="strategy-card"><strong>Interleaving</strong><p>Practice several genres so structure recognition gets faster.</p></div></div></div>
<div class="card" id="daily-routine"><div class="section-title">10-minute daily routine</div><div class="mini-formula">1 minute: Preview headings and key terms\n2 minutes: Read one small section\n2 minutes: Mark subject/verb/object + main/support\n2 minutes: Write a 3-line note\n2 minutes: Decode 3 vocabulary words by roots\n1 minute: Recall aloud without looking</div><div class="pill-row"><span class="pill">Fast</span><span class="pill">Memorable</span><span class="pill">College-ready</span><span class="pill">Research-ready</span><span class="pill">Everyday practical</span></div></div>`;

function stemFilter(cat){document.querySelectorAll('.formula-card:not(.quick-stem-card)').forEach(c=>{const tags=c.dataset.tags||'';const show=cat==='All'||c.dataset.cat===cat||tags.includes(cat.toLowerCase());c.style.display=show?'block':'none';});document.querySelectorAll('.stem-chip[data-cat]').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));}
function stemSolve(){const kind=document.getElementById('stem-solver-kind').value;const a=parseFloat(document.getElementById('stem-a').value);const b=parseFloat(document.getElementById('stem-b').value);let out='Enter two numbers to solve.';if(Number.isFinite(a)&&Number.isFinite(b)){if(kind==='percent')out=`${a}% of ${b} = ${(a/100*b).toLocaleString()}. Quick: convert ${a}% to ${a/100}, then multiply.`;if(kind==='slope')out=`Slope m = (y₂-y₁)/(x₂-x₁). Using y change ${b} and x change ${a}: m = ${(b/a).toLocaleString()}.`;if(kind==='pythag')out=`Hypotenuse c = √(a²+b²) = √(${a*a+b*b}) = ${Math.hypot(a,b).toLocaleString()}.`;if(kind==='compound')out=`Compound growth A = P(1+r)^t = ${a}(1+${b/100})¹ ≈ ${(a*(1+b/100)).toLocaleString()}. For more years, repeat the factor.`;if(kind==='convert')out=`Length conversion: ${a} meters = ${(a*3.28084).toLocaleString()} ft; ${b} miles/hour = ${(b*0.44704).toLocaleString()} m/s.`;}document.getElementById('stem-answer').innerHTML=out;}

function filterQuickStem(area,btn){
  document.querySelectorAll('#quick-stem-methods .stem-chip').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.querySelectorAll('.quick-stem-card').forEach(card=>{
    card.style.display=(area==='all'||card.dataset.area===area)?'block':'none';
  });
}

function startTimer(){
  if(timerRunning||timerSec<=0)return;
  timerRunning=true;
  timerInterval=setInterval(()=>{
    timerSec--;
    updateTimer();
    if(timerSec<=0){clearInterval(timerInterval);timerRunning=false;updateTimer();}
  },1000);
  updateTimer();
}
function pauseTimer(){
  if(!timerRunning)return;
  clearInterval(timerInterval);
  timerRunning=false;
  updateTimer();
}
function toggleTimer(){
  if(timerSec<=0){resetTimer();return;}
  if(timerRunning)pauseTimer();else startTimer();
}
function resetTimer(){
  clearInterval(timerInterval);
  timerRunning=false;
  timerSec=600;
  updateTimer();
}
function updateTimer(){
  const m=Math.floor(timerSec/60),s=timerSec%60;
  const el=document.getElementById('timer');
  if(!el)return;
  el.textContent=`${m}:${s.toString().padStart(2,'0')}`;
  let cls='timer-box';
  if(timerSec<=0)cls+=' done';
  else if(timerSec<=60)cls+=' warn';
  if(!timerRunning&&timerSec>0&&timerSec<600)cls+=' paused';
  el.className=cls;
}

function jumpTo(i){cur=i;render();startTimer();}
function go(dir){cur=(cur+dir+26)%26;render();}
function setMode(m){
  mode=m;
  ['explore','vocab','quiz','morph','counts','stem','strategy'].forEach(x=>{const b=document.getElementById('mode-'+x); if(b)b.classList.toggle('active',x===m);});
  if(m==='quiz')generateQuiz();
  render();
}
function generateQuiz(){
  const d=DATA[cur];
  const allMeans=DATA.flatMap(x=>x.means);
  const correct=d.means[Math.floor(Math.random()*d.means.length)];
  let wrong=[];
  while(wrong.length<3){const r=allMeans[Math.floor(Math.random()*allMeans.length)];if(!d.means.includes(r)&&!wrong.includes(r))wrong.push(r);}
  const opts=[correct,...wrong].sort(()=>Math.random()-.5);
  quizState={letter:d.l,hname:d.hname,correct,opts,answered:false};
}
function answerQuiz(opt){
  if(!quizState||quizState.answered)return;
  quizState.answered=true;
  const isCorrect=opt===quizState.correct;
  if(isCorrect)setStreak(streak+1);else setStreak(0);
  document.querySelectorAll('.quiz-opt').forEach(btn=>{
    if(btn.dataset.opt===quizState.correct)btn.classList.add('correct');
    else if(btn.dataset.opt===opt&&!isCorrect)btn.classList.add('wrong');
    btn.style.pointerEvents='none';
  });
  render();
}
function render(){
  buildNav();
  const nav=document.getElementById('letter-nav'), bottom=document.querySelector('.bottom-nav');
  const isLetterMode=(mode==='explore'||mode==='vocab'||mode==='quiz'||mode==='morph');
  if(nav)nav.style.display=isLetterMode?'flex':'none';
  if(bottom)bottom.style.display=isLetterMode?'flex':'none';
  const d=DATA[cur];
  const prog=document.getElementById('prog'), pos=document.getElementById('pos-label');
  if(isLetterMode){
    if(prog)prog.style.width=((cur+1)/26*100)+'%';
    if(pos)pos.textContent=`${d.l} — ${cur+1} of 26`;
  } else {
    if(prog)prog.style.width='100%';
    // pos-label is set by each global render function
  }
  if(mode==='strategy')renderStrategy();
  else if(mode==='stem')renderSTEM();
  else if(mode==='counts')renderCounts();
  else if(mode==='explore')renderExplore(d);
  else if(mode==='vocab')renderVocab(d);
  else if(mode==='quiz')renderQuiz(d);
  else if(mode==='morph')renderMorph(d);
}
function renderExplore(d){
  const ch=CHARS[d.l]||[];
  document.getElementById('main-content').innerHTML=`
<div class="card">
  <div class="letter-hero">
    <div><div class="letter-glyph">${d.l}</div><div class="hebrew-glyph">${d.heb}</div></div>
    <div class="letter-info">
      <div class="letter-en">${d.l} — ${d.hname} (${d.heb})</div>
      <div class="hebrew-name">Hebrew: ${d.hname} | IPA: ${d.ipa.map(x=>`<span class="ipa-sym">${x}</span>`).join(' ')}</div>
      <div class="symbol-tag">${d.sym}</div>
      <div class="meaning-tags">${d.means.map(m=>`<span class="tag">${m}</span>`).join('')}</div>
      <div class="section-title">IPA pronunciations</div>
      ${d.ipa.map((ip,i)=>`<div class="ipa-row"><span class="ipa-sym">[${ip}]</span> — ${d.ipa_desc[i]||''}</div>`).join('')}
    </div>
  </div>
</div>
${ch.length?`<div class="card">
  <div class="section-title">Root characters in modern scripts</div>
  <div class="chars-grid">${ch.map(c=>`<div class="char-item"><div class="char-script">${c.script}</div><div class="char-glyph">${c.chars}</div><div class="char-name">${c.name}</div><div class="char-note">${c.note}</div></div>`).join('')}</div>
</div>`:''}
<div class="card-row split">
<div class="card">
  <div class="section-title">Root families</div>
  ${d.roots.map(r=>`<div class="root-box"><strong style="font-size:11px;color:var(--ts)">${r.fam}</strong><br><span style="font-weight:500;color:var(--tx)">${r.root}</span><span style="color:var(--ts)"> — ${r.meaning}</span></div>`).join('')}
</div>
<div class="card">
  <div class="section-title">Cross-language</div>
  <div class="lang-tabs">${['English','Mandarin','German','Russian','Spanish','French'].map(lg=>`<button class="lang-tab${lg===activeLang?' active':''}" onclick="switchLang('${lg}')">${lg}</button>`).join('')}</div>
  <div style="margin-bottom:8px">${(()=>{const le=d.langs.find(x=>x.lang===activeLang)||d.langs[0];return`<div class="lang-entry"><span class="lang-word">${le.word}</span> <span class="lang-ipa">${le.ipa}</span><br><span style="font-size:11px;color:var(--ts)">${le.note}</span></div>`;})()}</div>
  <div class="section-title">All languages</div>
  ${d.langs.map(lg=>`<div class="lang-entry"><span style="font-size:10px;color:var(--tt);min-width:56px;display:inline-block">${lg.lang}</span> <span class="lang-word">${lg.word}</span> <span class="lang-ipa">${lg.ipa}</span> — <span style="font-size:11px;color:var(--ts)">${lg.note}</span></div>`).join('')}
</div>
</div>`;
}
function renderVocab(d){
  document.getElementById('main-content').innerHTML=`
<div class="card">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap">
    <span class="letter-glyph" style="font-size:48px">${d.l}</span>
    <div style="flex:1;min-width:160px"><div style="font-size:14px;font-weight:500;color:var(--tx)">${d.hname}: ${d.means.join(' · ')}</div><div style="font-size:12px;color:var(--ts)">Tap any word to reveal its root meaning</div></div>
    <div style="display:flex;gap:6px"><button class="btn" onclick="toggleAllVocab(true)">Reveal all</button><button class="btn" onclick="toggleAllVocab(false)">Hide all</button></div>
  </div>
  <div class="vocab-grid">${d.vocab.map((v,i)=>`<div class="vocab-item" id="vi${i}" onclick="this.classList.toggle('revealed')"><div class="vocab-word">${v.w}</div><div class="vocab-ipa">${v.ipa}</div><div class="vocab-hint">← tap to decode</div><div class="vocab-meaning">${v.def}<br><span style="color:var(--tt);font-size:11px">${v.root}</span></div></div>`).join('')}</div>
</div>
<div class="card">
  <div class="section-title">IPA sounds for "${d.l}"</div>
  ${d.ipa.map((ip,i)=>`<div class="ipa-row" style="margin-bottom:4px"><span class="ipa-sym">[${ip}]</span> — ${d.ipa_desc[i]||''}</div>`).join('')}
</div>`;
}
function toggleAllVocab(reveal){document.querySelectorAll('#main-content .vocab-item').forEach(el=>el.classList.toggle('revealed',!!reveal));}
function renderQuiz(d){
  if(!quizState||quizState.letter!==d.l)generateQuiz();
  const q=quizState;
  document.getElementById('main-content').innerHTML=`
<div class="card">
  <div style="text-align:center;margin-bottom:8px"><span class="letter-glyph" style="font-size:56px">${d.l}</span><span class="hebrew-glyph" style="font-size:36px;margin-left:12px">${d.heb}</span></div>
  <div class="quiz-prompt">What does <strong>${d.hname} (${d.heb})</strong> mean?</div>
  <div class="quiz-opts">${q.opts.map(opt=>`<button class="quiz-opt${q.answered&&opt===q.correct?' correct':q.answered&&opt!==q.correct?' wrong':''}" data-opt="${opt}" onclick="answerQuiz('${opt}')" ${q.answered?'disabled':''}>${opt}</button>`).join('')}</div>
  ${q.answered?`<div style="text-align:center;margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="retryQuiz()">↻ Retry this letter</button><button class="btn primary" onclick="nextQuiz()">Next letter →</button></div>`:''}
  <div class="score-row" style="margin-top:8px">IPA: ${d.ipa.map(ip=>`<span class="ipa-sym">[${ip}]</span>`).join(' ')} &nbsp;|&nbsp; Symbol: ${d.sym}</div>
</div>
<div class="card">
  <div class="section-title">Root connection</div>
  ${d.roots.slice(0,2).map(r=>`<div class="root-box"><span style="font-size:11px;color:var(--ts)">${r.fam}</span><br><strong style="color:var(--tx)">${r.root}</strong><span style="color:var(--ts)"> — ${r.meaning}</span></div>`).join('')}
</div>`;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function allMorphEntries(){return Object.entries(MORPHEMES).flatMap(([letter,arr])=>arr.map((e,i)=>({...e,letter,index:i,id:'morph-'+letter+'-'+i})));}
function entriesForLetter(letter){return (MORPHEMES[letter]||[]).map((e,i)=>({...e,letter,index:i,id:'morph-'+letter+'-'+i}));}
function typeCount(list,type){return list.filter(e=>String(e.type).toLowerCase().includes(type)).length;}
function originHit(e,o){return o==='all'||String(e.origin).toLowerCase().includes(o);}
function kindHit(e,k){return k==='all'||String(e.type).toLowerCase().includes(k);}
function catHit(e,c){return c==='all'||(e.cats||[]).includes(c);}
function textHit(e,query){if(!query)return true;const hay=[e.m,e.type,e.origin,e.meaning,e.examples,(e.cats||[]).join(' ')].join(' ').toLowerCase();return hay.includes(query.toLowerCase());}
function filteredMorphs(list){return list.filter(e=>catHit(e,cat)&&originHit(e,origin)&&kindHit(e,kind)&&textHit(e,q));}
function chip(group,value,label,current){return '<button class="link-chip '+(current===value?'active':'')+'" onclick="setMorphFilter(\''+group+'\',\''+value+'\')">'+esc(label||value)+'</button>';}
function itemCard(e){return '<div class="vocab-item" id="'+e.id+'"><div class="vocab-word">'+esc(e.m)+'</div><div class="vocab-ipa">'+esc(e.type)+' · '+esc(e.origin)+'</div><div class="vocab-meaning" style="display:block">'+esc(e.meaning)+'</div><div class="muted">'+esc(e.examples)+'</div><div style="margin-top:6px">'+(e.cats||[]).map(c=>'<a class="tag" href="#morph-'+esc(c)+'" onclick="openCategory(\''+esc(c)+'\')">'+esc(c)+'</a>').join('')+'</div></div>';}
function renderMorphResults(letter){const base=entriesForLetter(letter),list=filteredMorphs(base);const status=document.getElementById('morph-status'),res=document.getElementById('morph-results');if(status)status.textContent='Showing '+list.length+' of '+base.length+' entries for '+letter+'.';if(res)res.innerHTML=list.length?list.map(itemCard).join(''):'<div class="muted">No matches for this letter. Try another category, type, origin, or search term.</div>';}
function updateMorphSearch(value){q=value;renderMorphResults(DATA[cur].l);}
function setMorphFilter(group,value){if(group==='cat')cat=value;if(group==='origin')origin=value;if(group==='kind')kind=value;if(mode==='morph')renderMorph(DATA[cur]);else renderCounts();}
function renderMorph(d){const list=entriesForLetter(d.l);const c={prefix:typeCount(list,'prefix'),root:typeCount(list,'root'),suffix:typeCount(list,'suffix')};document.getElementById('main-content').innerHTML=`
<div class="card">
  <div class="letter-hero">
    <div><div class="letter-glyph">${d.l}</div><div class="hebrew-glyph">${list.length}</div></div>
    <div class="letter-info">
      <div class="letter-en">${d.l} — Morphemes + Original Roots</div>
      <div class="muted">This keeps the original Hebrew/IPA/cross-language app and adds balanced common morphemes for legal policies/contracts/business, research reading, college writing, livelihood/work, and everyday language.</div>
      <div class="section-title">This letter</div>
      <span class="symbol-tag">${c.prefix} prefixes</span> <span class="symbol-tag">${c.root} roots</span> <span class="symbol-tag">${c.suffix} suffixes / endings</span>
      <div class="download-row"><button class="btn" onclick="downloadApp()">Download this HTML</button></div>
    </div>
  </div>
</div>
<div class="card" id="morph-controls">
  <div class="section-title">Search and filters</div>
  <input class="search" id="morph-search" value="${esc(q)}" oninput="updateMorphSearch(this.value)" placeholder="Search this letter by morpheme, meaning, example, origin, or category" autocomplete="off" spellcheck="false">
  <div class="filter-row"><span class="muted">Category</span>${['all','common','research','legal','college','livelihood'].map(x=>chip('cat',x,x,cat)).join('')}</div>
  <div class="filter-row"><span class="muted">Origin</span>${['all','latin','greek','french','germanic'].map(x=>chip('origin',x,x,origin)).join('')}</div>
  <div class="filter-row"><span class="muted">Type</span>${['all','prefix','root','suffix'].map(x=>chip('kind',x,x,kind)).join('')}</div>
  <div class="muted" id="morph-status"></div>
</div>
<div class="card"><div class="section-title">${d.l} entries</div><div class="vocab-grid" id="morph-results"></div></div>`;renderMorphResults(d.l);}
function renderCounts(){document.getElementById('pos-label').textContent='Morpheme overview — all letters';const all=allMorphEntries();const totals={total:all.length,prefix:typeCount(all,'prefix'),root:typeCount(all,'root'),suffix:typeCount(all,'suffix')};const cats=['common','research','legal','college','livelihood'];const origins=['Latin','Greek','French','Germanic'];document.getElementById('main-content').innerHTML=`
<div class="card">
  <div class="section-title">Balanced morpheme capacity included</div>
  <div class="count-grid">
    <a class="count-card" href="#all-morphemes" onclick="openCategory('all')"><div class="big">${totals.total}</div><div class="small">total entries</div></a>
    <a class="count-card" href="#all-morphemes" onclick="openKind('prefix')"><div class="big">${totals.prefix}</div><div class="small">prefix-capable</div></a>
    <a class="count-card" href="#all-morphemes" onclick="openKind('root')"><div class="big">${totals.root}</div><div class="small">root-capable</div></a>
    <a class="count-card" href="#all-morphemes" onclick="openKind('suffix')"><div class="big">${totals.suffix}</div><div class="small">suffix-capable</div></a>
  </div>
  <div class="muted" style="margin-top:10px">Click a count or category to jump to the corresponding filtered item list.</div>
  <div class="download-row"><button class="btn" onclick="downloadApp()">Download this HTML</button></div>
</div>
<div class="card-row split">
<div class="card"><div class="section-title">Category links</div>${cats.map(c=>`<a class="root-box" id="morph-${c}" style="display:block;text-decoration:none" href="#all-morphemes" onclick="openCategory('${c}')"><strong style="color:var(--tx)">${c}</strong><span style="float:right;color:var(--tinfo)">${all.filter(e=>(e.cats||[]).includes(c)).length}</span><br><span class="muted">Open all ${c} morphemes</span></a>`).join('')}</div>
<div class="card"><div class="section-title">Origin links</div>${origins.map(o=>`<a class="root-box" style="display:block;text-decoration:none" href="#all-morphemes" onclick="openOrigin('${o.toLowerCase()}')"><strong style="color:var(--tx)">${o}</strong><span style="float:right;color:var(--tinfo)">${all.filter(e=>String(e.origin).toLowerCase().includes(o.toLowerCase())).length}</span><br><span class="muted">Open all ${o} morphemes</span></a>`).join('')}</div>
</div>
<div class="card" id="all-morphemes"><div class="section-title">Filtered items</div><input class="search" id="global-search" value="${esc(q)}" oninput="updateGlobalSearch(this.value)" placeholder="Search all entries" autocomplete="off" spellcheck="false"><div class="filter-row"><span class="muted">Category</span>${cats.concat(['all']).sort((a,b)=>a==='all'?-1:b==='all'?1:a.localeCompare(b)).map(x=>chip('cat',x,x,cat)).join('')}</div><div class="filter-row"><span class="muted">Type</span>${['all','prefix','root','suffix'].map(x=>chip('kind',x,x,kind)).join('')}</div><div class="muted" id="global-status"></div><div class="vocab-grid" id="global-results"></div></div>`;renderGlobalResults();}
function renderGlobalResults(){const active=filteredMorphs(allMorphEntries());const status=document.getElementById('global-status'),res=document.getElementById('global-results');if(status)status.textContent='Showing '+active.length+' matching entries.';if(res)res.innerHTML=active.map(itemCard).join('')||'<div class="muted">No matches. Clear search or filters.</div>';}
function updateGlobalSearch(value){q=value;renderGlobalResults();}
function openCategory(c){cat=c;mode='counts';render();setTimeout(()=>{const el=document.getElementById('all-morphemes');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},0);}
function openKind(k){kind=k;mode='counts';render();setTimeout(()=>{const el=document.getElementById('all-morphemes');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},0);}
function openOrigin(o){origin=o;mode='counts';render();setTimeout(()=>{const el=document.getElementById('all-morphemes');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},0);}
function downloadApp(){const blob=new Blob([document.documentElement.outerHTML],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='alphabet_root_language_exercise_merged_morphemes.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

function nextQuiz(){cur=(cur+1)%26;generateQuiz();render();}
function retryQuiz(){generateQuiz();render();}
function switchLang(lg){activeLang=lg;render();}
setStreak(streak);
updateTimer();
render();
</script>
</body>
</html>
