<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alphabet Root Language Exercise</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#2a2a2a;color:#c8c8c8;min-height:100vh;padding:1rem}
:root{
--c1:#333333;
--c2:#3a3a3a;
--c3:#424242;
--tx:#d4d4d4;
--ts:#8a8a8a;
--tt:#5e5e5e;
--bd:rgba(255,255,255,0.09);
--info:#1e2d3d;
--tinfo:#7aabcf;
--warn:#2e2518;
--twarn:#c9a060;
--succ:#1c2a18;
--tsucc:#7ab060;
--danger:#2e1e1e;
--tdanger:#c07070;
}
@media(prefers-color-scheme:dark){
:root{
--c1:#272520;
--c2:#2f2d27;
--c3:#38352e;
--tx:#ccc8be;
--ts:#8a8780;
--tt:#5e5c57;
--bd:rgba(200,190,170,0.1);
--info:#1e2e3d;
--tinfo:#7aabcf;
--warn:#332a18;
--twarn:#c9a060;
--succ:#1c2e18;
--tsucc:#7ab060;
--danger:#2e1e1e;
--tdanger:#c07070;
}}
#app{max-width:700px;margin:0 auto;padding:1rem 0.5rem}
.top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;gap:8px;flex-wrap:wrap}
.timer-box{font-size:13px;font-weight:500;color:var(--tinfo);background:var(--info);padding:4px 12px;border-radius:20px;min-width:72px;text-align:center}
.timer-box.warn{color:var(--twarn);background:var(--warn)}
.timer-box.done{color:var(--tsucc);background:var(--succ)}
.progress-bar{height:4px;background:var(--bd);border-radius:2px;margin-bottom:1rem;overflow:hidden}
.progress-fill{height:100%;background:var(--tinfo);border-radius:2px;transition:width .3s}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:1rem}
.nav-btn{font-size:12px;font-weight:500;padding:4px 8px;border:0.5px solid var(--bd);border-radius:6px;cursor:pointer;background:var(--c2);color:var(--ts);transition:all .15s}
.nav-btn:hover{background:var(--c3);color:var(--tx)}
.nav-btn.active{background:var(--tinfo);color:#fff;border-color:var(--tinfo)}
.card{background:var(--c1);border:0.5px solid var(--bd);border-radius:12px;padding:1.25rem;margin-bottom:0.75rem}
.letter-hero{display:flex;align-items:flex-start;gap:1.5rem;flex-wrap:wrap}
.letter-glyph{font-size:72px;font-weight:500;line-height:1;color:var(--tinfo);min-width:80px;text-align:center}
.hebrew-glyph{font-size:48px;color:var(--ts);margin-top:4px;text-align:center}
.letter-info{flex:1;min-width:200px}
.letter-en{font-size:22px;font-weight:500;color:var(--tx);margin-bottom:2px}
.hebrew-name{font-size:14px;color:var(--ts);margin-bottom:6px}
.symbol-tag{display:inline-block;font-size:12px;padding:2px 10px;background:var(--warn);color:var(--twarn);border-radius:20px;margin-bottom:8px}
.meaning-tags{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.tag{font-size:11px;padding:2px 8px;background:var(--c2);border:0.5px solid var(--bd);border-radius:20px;color:var(--ts)}
.ipa-row{font-size:13px;color:var(--tx);margin-bottom:2px}
.ipa-sym{font-size:16px;font-weight:500;color:var(--tinfo);font-family:monospace}
.section-title{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--tt);margin-bottom:8px;margin-top:0.75rem}
.vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.vocab-item{background:var(--c2);border:0.5px solid var(--bd);border-radius:8px;padding:10px 12px;cursor:pointer;transition:all .15s}
.vocab-item:hover{border-color:var(--tinfo)}
.vocab-item.revealed .vocab-meaning{display:block}
.vocab-item.revealed{border-color:var(--tsucc)}
.vocab-word{font-size:14px;font-weight:500;color:var(--tx)}
.vocab-ipa{font-size:12px;color:var(--ts);font-family:monospace;margin:2px 0}
.vocab-meaning{display:none;font-size:12px;color:var(--tsucc);margin-top:4px;line-height:1.4}
.vocab-hint{font-size:11px;color:var(--tt);margin-top:2px}
.lang-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.lang-tab{font-size:11px;padding:3px 9px;border:0.5px solid var(--bd);border-radius:20px;cursor:pointer;background:var(--c2);color:var(--ts);transition:all .15s}
.lang-tab:hover{background:var(--c3)}
.lang-tab.active{background:var(--tinfo);color:#fff;border-color:var(--tinfo)}
.lang-entry{font-size:13px;color:var(--tx);margin-bottom:4px;line-height:1.5}
.lang-word{font-weight:500}
.lang-ipa{font-family:monospace;font-size:12px;color:var(--ts)}
.root-box{background:var(--c2);border-left:2px solid var(--bd);border-radius:0 6px 6px 0;padding:8px 12px;margin-bottom:6px;font-size:13px;line-height:1.5}
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:1rem;gap:8px}
.btn{font-size:13px;padding:7px 18px;border:0.5px solid var(--bd);border-radius:8px;cursor:pointer;background:var(--c2);color:var(--tx);transition:all .15s;font-weight:500}
.btn:hover{background:var(--c3)}
.btn.primary{background:var(--tinfo);color:#fff;border-color:var(--tinfo)}
.btn.primary:hover{opacity:.9}
.mode-bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.mode-btn{font-size:11px;padding:3px 10px;border:0.5px solid var(--bd);border-radius:20px;cursor:pointer;background:var(--c2);color:var(--ts)}
.mode-btn.active{background:var(--succ);color:var(--tsucc);border-color:var(--tsucc)}
.quiz-prompt{font-size:16px;font-weight:500;color:var(--tx);margin-bottom:12px;text-align:center;padding:1rem;background:var(--c2);border-radius:8px}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.quiz-opt{padding:10px;border:0.5px solid var(--bd);border-radius:8px;cursor:pointer;font-size:13px;background:var(--c2);color:var(--tx);transition:all .15s;text-align:left}
.quiz-opt:hover{border-color:var(--tinfo);background:var(--info)}
.quiz-opt.correct{background:var(--succ);color:var(--tsucc);border-color:var(--tsucc)}
.quiz-opt.wrong{background:var(--danger);color:var(--tdanger);border-color:var(--tdanger)}
.score-row{font-size:13px;color:var(--ts);text-align:center}
.streak{font-size:11px;color:var(--twarn);background:var(--warn);padding:2px 8px;border-radius:20px}
.chars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:4px}
.char-item{background:var(--c2);border:0.5px solid var(--bd);border-radius:8px;padding:10px 12px}
.char-script{font-size:11px;color:var(--tt);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.char-glyph{font-size:22px;font-weight:500;color:var(--tinfo);margin-bottom:2px;line-height:1.2}
.char-name{font-size:12px;font-weight:500;color:var(--tx);margin-bottom:2px}
.char-note{font-size:11px;color:var(--ts);line-height:1.4}
</style>
</head>
<body>
<div id="app">
<h2 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Daily alphabet root language exercise — Hebrew, IPA, and cross-language vocabulary</h2>
<div class="top-bar">
  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
    <span style="font-size:14px;font-weight:500;color:var(--tx)">Alphabet Roots</span>
    <span class="streak" id="streak-display">streak: 0</span>
  </div>
  <div class="mode-bar">
    <button class="mode-btn active" onclick="setMode('explore')" id="mode-explore">Explore</button>
    <button class="mode-btn" onclick="setMode('vocab')" id="mode-vocab">Vocab</button>
    <button class="mode-btn" onclick="setMode('quiz')" id="mode-quiz">Quiz</button>
  </div>
  <div class="timer-box" id="timer">10:00</div>
</div>
<div class="progress-bar"><div class="progress-fill" id="prog" style="width:3.8%"></div></div>
<div class="nav" id="letter-nav"></div>
<div id="main-content"></div>
<div class="bottom-nav">
  <button class="btn" id="prev-btn" onclick="go(-1)">← Prev</button>
  <span style="font-size:12px;color:var(--tt)" id="pos-label">A — 1 of 26</span>
  <button class="btn primary" id="next-btn" onclick="go(1)">Next →</button>
</div>
</div>
<script>

P:[{script:"Greek",chars:"Π π",name:"Pi",note:"From Pe (פ); mouth shape rotated into Pi's two legs"},
   {script:"Cyrillic",chars:"П п",name:"Pe",note:"From Pi/Pe; the mouth-portal shape"},
   {script:"Arabic",chars:"ف",name:"Fāʾ",note:"Pe's descendant in Arabic; took F-sound but Pe lineage"},
   {script:"Devanagari",chars:"प",name:"pa",note:"Bilabial stop; Pe in Sanskrit — the mouth-sound"},
   {script:"Armenian",chars:"Պ պ",name:"Peh",note:"Pe directly named; the mouth letter"},
   {script:"Runic",chars:"ᛈ",name:"Pertho",note:"Fate/lot rune; P as what the mouth declares"}],
Q:[{script:"Greek",chars:"(dropped)",name:"Koppa Ϙ",note:"Greeks had Koppa (Ϙ) from Qoph but dropped it; kept in numerals"},
   {script:"Latin",chars:"Q q",name:"Q",note:"Preserved Koppa/Qoph in Latin; always followed by U (the hook needs the peg)"},
   {script:"Arabic",chars:"ق",name:"Qāf",note:"Qoph directly; the deep back-of-throat sound; uvular stop"},
   {script:"Devanagari",chars:"क / ख",name:"ka/kha",note:"Sanskrit merged Qoph into K-sounds; no separate Q"},
   {script:"Ethiopic",chars:"ቀ",name:"Qaf",note:"Qoph preserved in Ge'ez/Ethiopic as a distinct letter"}],
R:[{script:"Greek",chars:"Ρ ρ",name:"Rho",note:"From Resh (ר); head shape rotated — Rho's leg is the head turning"},
   {script:"Cyrillic",chars:"Р р",name:"Er",note:"From Rho/Resh; the chief/head sound"},
   {script:"Arabic",chars:"ر",name:"Rāʾ",note:"Resh directly; the head letter; tapped R"},
   {script:"Devanagari",chars:"र",name:"ra",note:"Flap/trill; Resh in Sanskrit — rāja = king (head)"},
   {script:"Armenian",chars:"Ռ ռ",name:"Ra",note:"From Rho/Resh; the chief sound"},
   {script:"Runic",chars:"ᚱ",name:"Raidho",note:"Ride/journey rune; R as the head that leads the way"}],
S:[{script:"Greek",chars:"Σ σ ς",name:"Sigma",note:"From Shin (ש); the teeth/flame shape became Sigma's zigzag"},
   {script:"Cyrillic",chars:"С с",name:"Es",note:"From Sigma/Shin; the sharp consuming sound"},
   {script:"Arabic",chars:"س ش",name:"Sīn / Shīn",note:"Arabic kept BOTH: Sīn (س) and Shīn (ش) — the s/sh split from Shin"},
   {script:"Devanagari",chars:"स श",name:"sa / śa",note:"Sanskrit also has both S and Sh from Shin's two sounds"},
   {script:"Armenian",chars:"Ս ս",name:"Seh",note:"From Sigma/Shin; the sharpness sound"},
   {script:"Runic",chars:"ᛊ",name:"Sowilo",note:"Sun rune; S as the solar flame — Shin's fire"}],
T:[{script:"Greek",chars:"Τ τ",name:"Tau",note:"From Tav (ת); the cross/mark is preserved perfectly — T is a Tav"},
   {script:"Cyrillic",chars:"Т т",name:"Te",note:"From Tau/Tav; the covenant-mark sound"},
   {script:"Arabic",chars:"ت ث",name:"Tāʾ / Thāʾ",note:"Tav split into T and Th in Arabic; both from the seal"},
   {script:"Devanagari",chars:"त थ",name:"ta / tha",note:"Sanskrit also preserves T and Th from Tav's two sounds"},
   {script:"Armenian",chars:"Տ տ",name:"Teh",note:"From Tau/Tav; the sealing sound"},
   {script:"Runic",chars:"ᛏ",name:"Tiwaz",note:"Tyr/victory rune; T as the mark of the warrior's covenant"}],
U:[{script:"Greek",chars:"Υ υ",name:"Upsilon",note:"From Vav (ו); the hook/peg became the Y-fork of Upsilon"},
   {script:"Cyrillic",chars:"У у",name:"U",note:"From Upsilon/Vav via Greek; joining sound as vowel"},
   {script:"Arabic",chars:"و",name:"Wāw",note:"Vav directly — Wāw means 'and' in Arabic just as Vav means 'and' in Hebrew"},
   {script:"Devanagari",chars:"उ",name:"u",note:"Vowel form; Vav's joining as a vowel in Sanskrit"},
   {script:"Armenian",chars:"Ու ու",name:"U",note:"From Upsilon; the Vav-vowel"},
   {script:"Runic",chars:"ᚢ",name:"Uruz",note:"Aurochs/strength rune; U as the primal joining force"}],
V:[{script:"Latin",chars:"V v",name:"V",note:"Latin V originally covered both U and V sounds — one letter, two jobs (from Vav)"},
   {script:"Cyrillic",chars:"В в",name:"Ve",note:"From Greek/Latin V; Vav's connecting sound"},
   {script:"Arabic",chars:"و",name:"Wāw",note:"Wāw is V/W/U/O — all from Vav's single hook"},
   {script:"Devanagari",chars:"व",name:"va",note:"The V/W sound; Vav in Sanskrit — also means 'wind'"},
   {script:"Armenian",chars:"Վ վ",name:"Vev",note:"Vav directly named; the hook-connector"},
   {script:"Runic",chars:"ᚹ",name:"Wunjo",note:"Joy/perfection rune; V/W as the fulfilling connection"}],
W:[{script:"Latin",chars:"W w",name:"Double-U",note:"Medieval Latin doubled V (Vav) to make W — the name says it: double-U"},
   {script:"Arabic",chars:"و",name:"Wāw",note:"Wāw is the W-sound ancestor; the Vav that went west became W"},
   {script:"Cyrillic",chars:"(no W)",name:"—",note:"Slavic languages use В (V) or У (U) instead; W is a western development"},
   {script:"Devanagari",chars:"व",name:"va/wa",note:"The same letter covers both V and W in Sanskrit"},
   {script:"Runic",chars:"ᚹ",name:"Wunjo",note:"The W-rune; double-Vav energy of joy and completion"}],
X:[{script:"Greek",chars:"Χ χ / Ξ ξ",name:"Chi / Xi",note:"Greeks used Chi (Χ) for kh-sound and Xi (Ξ) for ks; both from Semitic crossing"},
   {script:"Cyrillic",chars:"Х х",name:"Kha",note:"From Chi; the crossing-breath sound"},
   {script:"Arabic",chars:"خ",name:"Khāʾ",note:"The kh-sound; from the same crossing-breath family"},
   {script:"Devanagari",chars:"क्ष",name:"kṣa",note:"Conjunct letter kṣ = the X-combination in Sanskrit"},
   {script:"Armenian",chars:"Խ խ",name:"Xeh",note:"The kh/x sound; from Chi lineage"},
   {script:"Chinese",chars:"叉",name:"chā",note:"Cross/fork character — visually the X-crossing"}],
Y:[{script:"Greek",chars:"Υ υ",name:"Upsilon",note:"From Vav/Yod blend; in Greek Upsilon serves Y and U"},
   {script:"Cyrillic",chars:"Й й / Я я",name:"Short-I / Ya",note:"Й = the Y-glide (Yod); Я = 'ya' = I/self — Yod's self preserved"},
   {script:"Arabic",chars:"ي",name:"Yāʾ",note:"Yod directly; Y-sound and long-I; last Arabic letter"},
   {script:"Devanagari",chars:"य",name:"ya",note:"Palatal approximant; Yod's hand-glide in Sanskrit"},
   {script:"Armenian",chars:"Յ յ",name:"Yiwn",note:"Yod directly; the Y-sound"},
   {script:"Runic",chars:"ᛃ",name:"Jera",note:"Year/harvest rune; Y/J as the hand of the turning year"}],
Z:[{script:"Greek",chars:"Ζ ζ",name:"Zeta",note:"From Zayin (ז); the weapon/sword became the zigzag of Zeta"},
   {script:"Cyrillic",chars:"З з",name:"Ze",note:"From Zeta/Zayin; the cutting sound"},
   {script:"Arabic",chars:"ز",name:"Zayn",note:"Zayin directly — even the name is unchanged: Zayn"},
   {script:"Devanagari",chars:"ज / z",name:"ja / z",note:"Sanskrit uses Ja for the Z-family; Z is a later addition"},
   {script:"Armenian",chars:"Զ զ",name:"Zeh",note:"From Zeta/Zayin; the sword-letter"},
   {script:"Runic",chars:"ᛉ",name:"Algiz",note:"Protection/elk rune; Z as the weapon raised in defense — Zayin"}]
};

let cur=0,mode='explore',activeLang='English',quizState=null,streak=0;
let timerSec=600,timerRunning=false,timerInterval=null;

function startTimer(){
  if(timerRunning)return;
  timerRunning=true;
  timerInterval=setInterval(()=>{
    timerSec--;
    updateTimer();
    if(timerSec<=0){clearInterval(timerInterval);timerRunning=false;}
  },1000);
}
function updateTimer(){
  const m=Math.floor(timerSec/60),s=timerSec%60;
  const el=document.getElementById('timer');
  el.textContent=`${m}:${s.toString().padStart(2,'0')}`;
  el.className='timer-box'+(timerSec<=60?' warn':timerSec<=0?' done':'');
}
function buildNav(){
  document.getElementById('letter-nav').innerHTML=DATA.map((d,i)=>`<button class="nav-btn${i===cur?' active':''}" onclick="jumpTo(${i})">${d.l}</button>`).join('');
}
function jumpTo(i){cur=i;render();startTimer();}
function go(dir){cur=(cur+dir+26)%26;render();}
function setMode(m){
  mode=m;
  ['explore','vocab','quiz'].forEach(x=>document.getElementById('mode-'+x).classList.toggle('active',x===m));
  if(m==='quiz')generateQuiz();
  render();
}
function generateQuiz(){
  const d=DATA[cur];
  const allMeans=DATA.flatMap(x=>x.means);
  const correct=d.means[Math.floor(Math.random()*d.means.length)];
  let wrong=[];
  while(wrong.length<3){const r=allMeans[Math.floor(Math.random()*allMeans.length)];if(!d.means.includes(r)&&!wrong.includes(r))wrong.push(r);}
  const opts=[correct,...wrong].sort(()=>Math.random()-.5);
  quizState={letter:d.l,hname:d.hname,correct,opts,answered:false};
}
function answerQuiz(opt){
  if(!quizState||quizState.answered)return;
  quizState.answered=true;
  const isCorrect=opt===quizState.correct;
  if(isCorrect){streak++;document.getElementById('streak-display').textContent='streak: '+streak;}
  else{streak=0;document.getElementById('streak-display').textContent='streak: 0';}
  document.querySelectorAll('.quiz-opt').forEach(btn=>{
    if(btn.dataset.opt===quizState.correct)btn.classList.add('correct');
    else if(btn.dataset.opt===opt&&!isCorrect)btn.classList.add('wrong');
    btn.style.pointerEvents='none';
  });
  render();
}
function render(){
  buildNav();
  const d=DATA[cur];
  document.getElementById('prog').style.width=((cur+1)/26*100)+'%';
  document.getElementById('pos-label').textContent=`${d.l} — ${cur+1} of 26`;
  if(mode==='explore')renderExplore(d);
  else if(mode==='vocab')renderVocab(d);
  else renderQuiz(d);
}
function renderExplore(d){
  const ch=CHARS[d.l]||[];
  document.getElementById('main-content').innerHTML=`
<div class="card">
  <div class="letter-hero">
    <div><div class="letter-glyph">${d.l}</div><div class="hebrew-glyph">${d.heb}</div></div>
    <div class="letter-info">
      <div class="letter-en">${d.l} — ${d.hname} (${d.heb})</div>
      <div class="hebrew-name">Hebrew: ${d.hname} | IPA: ${d.ipa.map(x=>`<span class="ipa-sym">${x}</span>`).join(' ')}</div>
      <div class="symbol-tag">${d.sym}</div>
      <div class="meaning-tags">${d.means.map(m=>`<span class="tag">${m}</span>`).join('')}</div>
      <div class="section-title">IPA pronunciations</div>
      ${d.ipa.map((ip,i)=>`<div class="ipa-row"><span class="ipa-sym">[${ip}]</span> — ${d.ipa_desc[i]||''}</div>`).join('')}
    </div>
  </div>
</div>
${ch.length?`<div class="card">
  <div class="section-title">Root characters in modern scripts</div>
  <div class="chars-grid">${ch.map(c=>`<div class="char-item"><div class="char-script">${c.script}</div><div class="char-glyph">${c.chars}</div><div class="char-name">${c.name}</div><div class="char-note">${c.note}</div></div>`).join('')}</div>
</div>`:''}
<div class="card">
  <div class="section-title">Root families</div>
  ${d.roots.map(r=>`<div class="root-box"><strong style="font-size:12px;color:var(--ts)">${r.fam}</strong><br><span style="font-weight:500;color:var(--tx)">${r.root}</span><span style="color:var(--ts)"> — ${r.meaning}</span></div>`).join('')}
</div>
<div class="card">
  <div class="section-title">Cross-language</div>
  <div class="lang-tabs">${['English','Mandarin','German','Russian','Spanish','French'].map(lg=>`<button class="lang-tab${lg===activeLang?' active':''}" onclick="switchLang('${lg}')">${lg}</button>`).join('')}</div>
  <div style="margin-bottom:12px">${(()=>{const le=d.langs.find(x=>x.lang===activeLang)||d.langs[0];return`<div class="lang-entry"><span class="lang-word">${le.word}</span> <span class="lang-ipa">${le.ipa}</span><br><span style="font-size:12px;color:var(--ts)">${le.note}</span></div>`;})()}</div>
  <div class="section-title">All languages</div>
  ${d.langs.map(lg=>`<div class="lang-entry"><span style="font-size:11px;color:var(--tt);min-width:64px;display:inline-block">${lg.lang}</span> <span class="lang-word">${lg.word}</span> <span class="lang-ipa">${lg.ipa}</span> — <span style="font-size:12px;color:var(--ts)">${lg.note}</span></div>`).join('')}
</div>`;
}
function renderVocab(d){
  document.getElementById('main-content').innerHTML=`
<div class="card">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
    <span class="letter-glyph" style="font-size:48px">${d.l}</span>
    <div><div style="font-size:14px;font-weight:500;color:var(--tx)">${d.hname}: ${d.means.join(' · ')}</div><div style="font-size:12px;color:var(--ts)">Tap any word to reveal its root meaning</div></div>
  </div>
  <div class="vocab-grid">${d.vocab.map((v,i)=>`<div class="vocab-item" id="vi${i}" onclick="this.classList.toggle('revealed')"><div class="vocab-word">${v.w}</div><div class="vocab-ipa">${v.ipa}</div><div class="vocab-hint">← tap to decode</div><div class="vocab-meaning">${v.def}<br><span style="color:var(--tt);font-size:11px">${v.root}</span></div></div>`).join('')}</div>
</div>
<div class="card">
  <div class="section-title">IPA sounds for "${d.l}"</div>
  ${d.ipa.map((ip,i)=>`<div class="ipa-row" style="margin-bottom:4px"><span class="ipa-sym">[${ip}]</span> — ${d.ipa_desc[i]||''}</div>`).join('')}
</div>`;
}
function renderQuiz(d){
  if(!quizState||quizState.letter!==d.l)generateQuiz();
  const q=quizState;
  document.getElementById('main-content').innerHTML=`
<div class="card">
  <div style="text-align:center;margin-bottom:8px"><span class="letter-glyph" style="font-size:56px">${d.l}</span><span class="hebrew-glyph" style="font-size:36px;margin-left:12px">${d.heb}</span></div>
  <div class="quiz-prompt">What does <strong>${d.hname} (${d.heb})</strong> mean?</div>
  <div class="quiz-opts">${q.opts.map(opt=>`<button class="quiz-opt${q.answered&&opt===q.correct?' correct':q.answered&&opt!==q.correct?' wrong':''}" data-opt="${opt}" onclick="answerQuiz('${opt}')" ${q.answered?'disabled':''}>${opt}</button>`).join('')}</div>
  ${q.answered?`<div style="text-align:center;margin-top:8px"><button class="btn primary" onclick="nextQuiz()">Next question →</button></div>`:''}
  <div class="score-row" style="margin-top:8px">IPA: ${d.ipa.map(ip=>`<span class="ipa-sym">[${ip}]</span>`).join(' ')} &nbsp;|&nbsp; Symbol: ${d.sym}</div>
</div>
<div class="card">
  <div class="section-title">Root connection</div>
  ${d.roots.slice(0,2).map(r=>`<div class="root-box"><span style="font-size:11px;color:var(--ts)">${r.fam}</span><br><strong style="color:var(--tx)">${r.root}</strong><span style="color:var(--ts)"> — ${r.meaning}</span></div>`).join('')}
</div>`;
}
function nextQuiz(){cur=(cur+1)%26;generateQuiz();render();}
function switchLang(lg){activeLang=lg;render();}
render();
</script>
</body>
</html>
