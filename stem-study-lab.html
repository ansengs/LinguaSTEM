{cat:'Algebra',tags:['arithmetic','beginner','algebra','accuplacer'],
 title:'Ratios, Rates & Proportions',
 theory:'',
 reality:'A recipe says "3 cups flour for every 2 eggs." Gas mileage is "miles per gallon." Map scales say "1 inch = 50 miles." All of these are ratios or rates. Proportions let you scale them up or down without changing the relationship.',
 formula:'Ratio:        a : b   or   a/b\nRate:         a units per b units (one quantity per other)\nProportion:   a/b = c/d   →   cross-multiply: a·d = b·c\nUnit rate:    rate with denominator = 1',
 method:'Cross-multiplication shortcut: any proportion a/b = c/d becomes a·d = b·c. To find a unit rate, divide so the bottom becomes 1.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <text x="14" y="20" font-size="11" fill="#9ecef0" font-weight="700">3 cups flour : 2 eggs   →   ? cups : 8 eggs</text>
  <rect x="14" y="30" width="100" height="30" rx="6" fill="rgba(122,171,207,.12)" stroke="#7aabcf" stroke-width="0.8"/>
  <text x="64" y="42" text-anchor="middle" font-size="10" fill="#7aabcf">3</text>
  <line x1="32" y1="46" x2="96" y2="46" stroke="#7aabcf" stroke-width="0.8"/>
  <text x="64" y="56" text-anchor="middle" font-size="10" fill="#7aabcf">2</text>
  <text x="120" y="48" font-size="14" fill="#c9a060">=</text>
  <rect x="138" y="30" width="100" height="30" rx="6" fill="rgba(201,160,96,.14)" stroke="#c9a060" stroke-width="0.8"/>
  <text x="188" y="42" text-anchor="middle" font-size="10" fill="#c9a060">x</text>
  <line x1="156" y1="46" x2="220" y2="46" stroke="#c9a060" stroke-width="0.8"/>
  <text x="188" y="56" text-anchor="middle" font-size="10" fill="#c9a060">8</text>
  <text x="14" y="78" font-size="10" fill="#7ab060" font-weight="700">Cross-multiply: 3·8 = 2·x</text>
  <text x="14" y="92" font-size="10" fill="#7ab060">→ 24 = 2x  →  x = 12 cups</text>
  <text x="170" y="92" font-size="9" fill="#8a8a8a">scale factor 4</text>
 </svg>`,
 caption:'Set up the ratio, then cross-multiply',
 steps:['Write the ratio as a fraction with the same units in matching positions (top vs. top, bottom vs. bottom).','Set up the proportion: known ratio = unknown ratio.','Cross-multiply: top of left × bottom of right equals bottom of left × top of right.','Solve the resulting one-step equation for the unknown.','Sanity-check: did the units line up? Is the answer in the right ballpark?'],
 example:'A car drives 180 miles on 6 gallons. How far on 10 gallons? 180/6 = x/10. Cross: 180·10 = 6·x → 1800 = 6x → x = 300 miles.'},

{cat:'Algebra',tags:['algebra','beginner','accuplacer'],
 title:'Linear Inequalities',
 theory:'',
 reality:'"You must be at least 65 inches tall to ride." "Spend less than $50." "Earn more than 80% to pass." All of these are inequalities — math statements about ranges, not single answers.',
 formula:'Solve the same way as equations EXCEPT:\n  When you multiply or divide by a NEGATIVE number, FLIP the inequality sign.\n\n<  : less than           ≤ : less than or equal\n>  : greater than        ≥ : greater than or equal',
 method:'Treat it like an equation step-by-step, but the moment you multiply or divide both sides by a negative, flip < to > (or ≤ to ≥). Check by plugging a number from your answer set into the original.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <text x="14" y="22" font-size="11" fill="#9ecef0" font-weight="700">−2x + 5 &lt; 11</text>
  <text x="14" y="40" font-size="9" fill="#c9a060">Step 1: subtract 5 →  −2x &lt; 6</text>
  <text x="14" y="56" font-size="9" fill="#c07070" font-weight="700">Step 2: divide by −2 → FLIP the sign:  x &gt; −3</text>
  <line x1="20" y1="86" x2="240" y2="86" stroke="#5e5e5e" stroke-width="0.6"/>
  <line x1="100" y1="83" x2="100" y2="89" stroke="#5e5e5e" stroke-width="0.6"/>
  <text x="100" y="103" text-anchor="middle" font-size="9" fill="#8a8a8a">−3</text>
  <circle cx="100" cy="86" r="3" fill="none" stroke="#7ab060" stroke-width="1.2"/>
  <line x1="103" y1="86" x2="240" y2="86" stroke="#7ab060" stroke-width="1.6"/>
  <polygon points="240,86 234,82 234,90" fill="#7ab060"/>
  <text x="170" y="80" font-size="9" fill="#7ab060" font-weight="700">all x &gt; −3</text>
 </svg>`,
 caption:'Open circle for &lt;/&gt;; closed for ≤/≥. Flip when multiplying by negative.',
 steps:['Treat the inequality like an equation. Move terms with x to one side, numbers to the other.','Combine like terms.','Isolate x. CAUTION: if you must multiply or divide by a negative number, flip the inequality sign.','Graph on a number line: open circle for < or >, filled circle for ≤ or ≥. Shade the side that includes the solutions.','Check: pick any number in your shaded region; it should make the original inequality true.'],
 example:'Solve 3x − 7 ≥ 5. Add 7: 3x ≥ 12. Divide by 3 (positive — no flip): x ≥ 4. Closed circle at 4, shade right.'},

{cat:'Algebra',tags:['algebra','beginner','accuplacer','aaf'],
 title:'Functions: Notation, Evaluation & Transformations',
 theory:'',
 reality:'A function is a machine: feed it an input, it returns a single output. Cost as a function of items bought, distance as a function of time — they\'re everywhere. f(x) is just shorthand for "the rule named f, applied to input x."',
 formula:'Notation:        f(x) = (rule using x)\nEvaluate:        f(a) = (replace every x with a)\nDomain:          allowed inputs\nRange:           possible outputs\nTransformations of y = f(x):\n  f(x) + k  → shift UP k\n  f(x − h)  → shift RIGHT h\n  −f(x)     → flip over x-axis\n  a·f(x)    → vertical stretch by factor a',
 method:'Evaluation tip: wrap parentheses around what you substitute. f(x) = x² − 3 then f(−2) = (−2)² − 3 = 4 − 3 = 1. The parentheses prevent sign mistakes.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <rect x="20" y="36" width="42" height="40" rx="6" fill="rgba(122,171,207,.18)" stroke="#7aabcf" stroke-width="1"/>
  <text x="41" y="52" text-anchor="middle" font-size="9" fill="#7aabcf" font-weight="700">INPUT</text>
  <text x="41" y="66" text-anchor="middle" font-size="11" fill="#9ecef0">x = 4</text>
  <line x1="64" y1="56" x2="100" y2="56" stroke="#c9a060" stroke-width="1.2" marker-end="url(#fnar1)"/>
  <defs><marker id="fnar1" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c9a060"/></marker></defs>
  <rect x="100" y="32" width="68" height="48" rx="8" fill="rgba(201,160,96,.18)" stroke="#c9a060" stroke-width="1.2"/>
  <text x="134" y="50" text-anchor="middle" font-size="10" fill="#c9a060" font-weight="700">f(x) = x² − 3</text>
  <text x="134" y="68" text-anchor="middle" font-size="9" fill="#d4b87a">(the machine)</text>
  <line x1="170" y1="56" x2="206" y2="56" stroke="#7ab060" stroke-width="1.2" marker-end="url(#fnar2)"/>
  <defs><marker id="fnar2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#7ab060"/></marker></defs>
  <rect x="206" y="36" width="44" height="40" rx="6" fill="rgba(122,176,96,.18)" stroke="#7ab060" stroke-width="1"/>
  <text x="228" y="52" text-anchor="middle" font-size="9" fill="#7ab060" font-weight="700">OUTPUT</text>
  <text x="228" y="66" text-anchor="middle" font-size="11" fill="#a0c888">f(4) = 13</text>
  <text x="130" y="100" text-anchor="middle" font-size="8" fill="#8a8a8a">Substitute, square, subtract: 4²−3 = 16−3 = 13</text>
 </svg>`,
 caption:'A function is an input-output machine. f(a) = "plug a in for x."',
 steps:['Identify the rule: f(x) = (something with x).','To evaluate f(a), wrap a in parentheses and replace EVERY x.','Simplify using order of operations.','For transformations: numbers added OUTSIDE move the graph vertically, INSIDE shift it horizontally (in the OPPOSITE direction).','Domain: list any x-values that break the rule (division by zero, negative under a square root, etc.) and exclude them.'],
 example:'g(x) = 3x + 1. Find g(−2). Wrap: g(−2) = 3(−2) + 1 = −6 + 1 = −5.'},

{cat:'Algebra',tags:['algebra','beginner','accuplacer','aaf'],
 title:'Polynomial Equations — Factor & Solve',
 theory:'',
 reality:'Trajectories of thrown objects, profit-maximization curves, and area problems all give you polynomial equations. Setting one equal to zero and factoring is how you find where the curve crosses the x-axis — the answer to "when?" or "for what input?"',
 formula:'Quadratic standard form:  ax² + bx + c = 0\nFactor patterns:\n  Difference of squares:  a² − b² = (a−b)(a+b)\n  Perfect square:         a² ± 2ab + b² = (a ± b)²\n  Common monomial:        ax² + bx = x(ax + b)\nZero-product property: if A·B = 0 then A = 0 or B = 0',
 method:'Factoring decision tree: (1) GCF first — pull out anything common. (2) Try difference-of-squares pattern. (3) Try the AC method or "two numbers that multiply to ac and add to b". (4) If nothing works, use the quadratic formula.',
 svg:`<svg viewBox="0 0 260 120" xmlns="http://www.w3.org/2000/svg">
  <text x="14" y="22" font-size="11" fill="#9ecef0" font-weight="700">x² − 5x + 6 = 0</text>
  <text x="14" y="40" font-size="9" fill="#c9a060">Find two numbers: multiply to 6, add to −5</text>
  <text x="14" y="56" font-size="9" fill="#c9a060" font-weight="700">→ −2 and −3   ✓ ((−2)(−3)=6, −2+−3=−5)</text>
  <text x="14" y="72" font-size="9" fill="#7aabcf">Factor:  (x − 2)(x − 3) = 0</text>
  <text x="14" y="88" font-size="9" fill="#7ab060" font-weight="700">Zero-product: x − 2 = 0   OR   x − 3 = 0</text>
  <rect x="60" y="96" width="60" height="20" rx="4" fill="rgba(122,176,96,.18)" stroke="#7ab060" stroke-width="0.8"/>
  <text x="90" y="110" text-anchor="middle" font-size="11" fill="#7ab060" font-weight="700">x = 2</text>
  <rect x="140" y="96" width="60" height="20" rx="4" fill="rgba(122,176,96,.18)" stroke="#7ab060" stroke-width="0.8"/>
  <text x="170" y="110" text-anchor="middle" font-size="11" fill="#7ab060" font-weight="700">x = 3</text>
 </svg>`,
 caption:'Factor → use zero-product rule → split into smaller equations',
 steps:['Set the equation equal to zero (move everything to one side).','Pull out any GREATEST COMMON FACTOR first.','For ax² + bx + c: find two numbers that multiply to a·c and add to b.','Rewrite using those numbers and factor by grouping; or use the quadratic formula x = (−b ± √(b²−4ac)) / (2a).','Apply the zero-product property: set each factor equal to zero, solve, and list both roots.'],
 example:'Solve x² + 2x − 8 = 0. Two numbers: ×−8, +2 → +4 and −2. Factor (x+4)(x−2)=0. Roots: x = −4 or x = 2.'},

{cat:'Algebra',tags:['algebra','accuplacer','aaf'],
 title:'Rational Equations — Equations with Fractions',
 theory:'',
 reality:'Work-rate problems ("two pumps fill a tank in...") and average-speed problems ("part of trip at one speed, part at another...") give you rational equations: equations with variables in denominators. Clear the fractions to make life easy.',
 formula:'Multiply BOTH SIDES by the LCD (least common denominator), then solve as usual.\n\nALWAYS check for excluded values: any x that makes a denominator zero is forbidden.',
 method:'Step 1: factor every denominator. Step 2: find LCD. Step 3: multiply both sides of the equation by the LCD — this cancels all fractions. Step 4: solve the resulting equation. Step 5: discard any answer that makes an original denominator zero (extraneous).',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <text x="14" y="22" font-size="11" fill="#9ecef0" font-weight="700">2/x + 1/3 = 5/6</text>
  <text x="14" y="40" font-size="9" fill="#c9a060">LCD of x, 3, 6 is 6x</text>
  <text x="14" y="56" font-size="9" fill="#c9a060">Multiply each term by 6x:</text>
  <text x="14" y="70" font-size="9" fill="#7aabcf">12 + 2x = 5x</text>
  <text x="14" y="86" font-size="9" fill="#7ab060" font-weight="700">3x = 12  →  x = 4</text>
  <text x="14" y="102" font-size="8" fill="#8a8a8a">Check x ≠ 0 (denominator). 4 is allowed ✓</text>
 </svg>`,
 caption:'Clear the fractions with the LCD, then check for excluded x',
 steps:['Factor every denominator if it is not already a single number or single variable.','Find the LCD of all denominators.','Multiply BOTH sides of the equation, term by term, by the LCD. Cancel.','Solve the resulting non-fraction equation.','CHECK: substitute your answer into the ORIGINAL equation and reject any value that makes a denominator zero.'],
 example:'Solve 1/(x+2) = 3/x. Cross-multiply: x = 3(x+2) → x = 3x+6 → −2x = 6 → x = −3. Check: x = −3 makes neither denom zero. ✓'},

{cat:'Algebra',tags:['algebra','accuplacer','aaf'],
 title:'Radical Equations — Equations with Square Roots',
 theory:'',
 reality:'Pendulum period, free-fall time, and pythagorean distance problems all give you radical equations. The trick is that you must square both sides — but squaring can create fake answers, so you must check every solution.',
 formula:'To clear a square root: ISOLATE the radical, then SQUARE both sides.\n\nIf there are TWO radicals: isolate one, square, simplify, isolate the other, square again.\n\nALWAYS check: squaring can introduce extraneous solutions.',
 method:'Why check? Squaring both sides treats both +√ and −√ the same, so a "solution" might satisfy the squared equation but not the original. Plug every candidate back in.',
 svg:`<svg viewBox="0 0 260 100" xmlns="http://www.w3.org/2000/svg">
  <text x="14" y="20" font-size="11" fill="#9ecef0" font-weight="700">√(x + 7) = 3</text>
  <text x="14" y="38" font-size="9" fill="#c9a060">Square both sides:  x + 7 = 9</text>
  <text x="14" y="54" font-size="9" fill="#7aabcf">Solve:  x = 2</text>
  <text x="14" y="72" font-size="9" fill="#7ab060" font-weight="700">Check: √(2+7) = √9 = 3 ✓</text>
  <rect x="14" y="80" width="232" height="16" rx="4" fill="rgba(192,112,112,.10)" stroke="#c07070" stroke-width="0.7"/>
  <text x="130" y="92" text-anchor="middle" font-size="9" fill="#c07070" font-weight="700">Always check — squaring can create fake answers!</text>
 </svg>`,
 caption:'Isolate the root, square, solve, and CHECK every answer',
 steps:['Move every non-radical term to the OTHER side so the radical is alone.','Square both sides of the equation. (For cube roots, cube both sides.)','Simplify and solve the resulting equation. It may be linear or quadratic.','For two radicals: after first square, isolate the remaining radical and square again.','Substitute every candidate solution back into the ORIGINAL equation. Discard any that don\'t work.'],
 example:'Solve √(2x + 3) = 5. Square: 2x + 3 = 25 → 2x = 22 → x = 11. Check: √(22+3)=√25=5. ✓'},

{cat:'Algebra',tags:['algebra','accuplacer','aaf'],
 title:'Exponential & Logarithmic Equations',
 theory:'',
 reality:'Population growth, radioactive decay, compound interest, and earthquake magnitudes (Richter scale) all use exponential or logarithmic equations. Whenever something grows or shrinks by the same RATIO each step, exponentials describe it.',
 formula:'Exponential: bˣ = bʸ  ⇒  x = y    (same base = same exponent)\n\nKey fact: log_b(x) and bˣ are INVERSES.\n  • To solve bˣ = c, take log of both sides.\n  • To solve log_b(x) = c, exponentiate: x = bᶜ.\n\nLog rules:\n  log(ab) = log a + log b\n  log(a/b) = log a − log b\n  log(aⁿ) = n · log a',
 method:'Quick decision: equation has a variable as an EXPONENT? Take a log. Equation has a variable INSIDE a log? Exponentiate (raise the base to both sides).',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="14" width="116" height="40" rx="6" fill="rgba(122,171,207,.10)" stroke="#7aabcf" stroke-width="0.8"/>
  <text x="72" y="30" text-anchor="middle" font-size="9" fill="#7aabcf" font-weight="700">EXPONENTIAL</text>
  <text x="72" y="46" text-anchor="middle" font-size="10" fill="#9ecef0">2ˣ = 32</text>
  <rect x="138" y="14" width="108" height="40" rx="6" fill="rgba(201,160,96,.10)" stroke="#c9a060" stroke-width="0.8"/>
  <text x="192" y="30" text-anchor="middle" font-size="9" fill="#c9a060" font-weight="700">LOGARITHMIC</text>
  <text x="192" y="46" text-anchor="middle" font-size="10" fill="#d4b87a">log₂(x) = 5</text>
  <text x="14" y="72" font-size="9" fill="#7aabcf">Same base: 2ˣ = 2⁵ → x = 5</text>
  <text x="138" y="72" font-size="9" fill="#c9a060">Exponentiate: x = 2⁵ = 32</text>
  <rect x="14" y="84" width="232" height="22" rx="6" fill="rgba(122,176,96,.10)" stroke="#7ab060" stroke-width="0.8"/>
  <text x="130" y="98" text-anchor="middle" font-size="10" fill="#7ab060" font-weight="700">Logs and exponents undo each other.</text>
 </svg>`,
 caption:'Variable in exponent → log it. Variable in log → exponentiate.',
 steps:['Identify the form: is the variable an EXPONENT or INSIDE a log?','For exponentials: rewrite both sides with the same base if possible. If equal bases, equal exponents — solve.','If bases can\'t be matched: take log of both sides, then use log(aⁿ) = n·log(a) to bring the variable down.','For logarithmic equations: combine logs into a single log first (using product/quotient rules), then exponentiate.','Check the domain: any answer making the inside of a log ≤ 0 must be discarded.'],
 example:'Solve 5ˣ = 125. Same base trick: 125 = 5³, so 5ˣ = 5³ → x = 3.'},

{cat:'Statistics',tags:['probability','accuplacer','beginner'],
 title:'Sets, Venn Diagrams & Set Notation',
 theory:'',
 reality:'When 60 students like math and 40 like science and 25 like both, how many like neither? Set theory is how we organize and count overlapping groups — used in surveys, databases, polling, and probability.',
 formula:'A ∪ B = "A union B" = elements in A OR B (or both)\nA ∩ B = "A intersection B" = elements in BOTH A AND B\nA\' or Aᶜ = complement of A = NOT in A\n|A| = number of elements in A\n\nInclusion–exclusion:\n  |A ∪ B| = |A| + |B| − |A ∩ B|',
 method:'Draw it! For two-set problems, sketch two overlapping circles. Fill in the overlap first, then the rest, then the outside. Counting becomes obvious.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="10" width="232" height="90" rx="8" fill="none" stroke="#5e5e5e" stroke-width="0.6" stroke-dasharray="2,2"/>
  <text x="226" y="22" text-anchor="end" font-size="9" fill="#8a8a8a">Universe U</text>
  <circle cx="100" cy="58" r="34" fill="rgba(122,171,207,.20)" stroke="#7aabcf" stroke-width="1"/>
  <circle cx="160" cy="58" r="34" fill="rgba(201,160,96,.20)" stroke="#c9a060" stroke-width="1"/>
  <text x="80" y="62" text-anchor="middle" font-size="11" fill="#7aabcf" font-weight="700">A only</text>
  <text x="80" y="74" text-anchor="middle" font-size="9" fill="#9ecef0">35</text>
  <text x="180" y="62" text-anchor="middle" font-size="11" fill="#c9a060" font-weight="700">B only</text>
  <text x="180" y="74" text-anchor="middle" font-size="9" fill="#d4b87a">15</text>
  <text x="130" y="62" text-anchor="middle" font-size="10" fill="#7ab060" font-weight="700">A∩B</text>
  <text x="130" y="74" text-anchor="middle" font-size="9" fill="#a0c888">25</text>
  <text x="220" y="92" text-anchor="end" font-size="9" fill="#8a8a8a">outside both: 5</text>
 </svg>`,
 caption:'Two circles, three regions. Fill the overlap first.',
 steps:['List the universe (everyone you\'re counting) and label each set.','Place the count of A ∩ B (the overlap) FIRST in the center region.','For "A only", subtract the overlap from |A|. Same for "B only".','The complement (outside both) = |U| − everything inside either circle.','Read counts directly off the diagram. For probability: divide each region by |U|.'],
 example:'In a class of 80: 50 take Math (A), 35 take Science (B), 25 take both. |A∪B| = 50 + 35 − 25 = 60. So 80 − 60 = 20 take neither.'},

/* ===== ACCUPLACER Reading mechanics ===== */
{cat:'Reading',tags:['reading','accuplacer','beginner'],
 title:'Reading: Finding the Main Idea',
 theory:'',
 reality:'Every email, article, and instruction page has ONE central point — the main idea. Find it and you\'ve "got" the passage. Miss it and even all the details won\'t help you answer the question.',
 formula:'Main idea = WHAT the passage is mostly about\nDifferent from a TOPIC (one phrase) and a DETAIL (one fact)\n\nLook for:\n  • Repeated words or themes\n  • A sentence that summarizes the rest (often first or last)\n  • The umbrella claim that all other sentences support',
 method:'Test each answer choice with the "umbrella test": does this answer COVER everything in the passage, or does it only cover one detail? The right answer covers the whole umbrella.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="14" width="232" height="20" rx="6" fill="rgba(122,171,207,.18)" stroke="#7aabcf" stroke-width="1"/>
  <text x="130" y="28" text-anchor="middle" font-size="10" fill="#7aabcf" font-weight="700">MAIN IDEA — the umbrella claim</text>
  <line x1="60" y1="36" x2="60" y2="46" stroke="#7aabcf" stroke-width="0.6"/>
  <line x1="130" y1="36" x2="130" y2="46" stroke="#7aabcf" stroke-width="0.6"/>
  <line x1="200" y1="36" x2="200" y2="46" stroke="#7aabcf" stroke-width="0.6"/>
  <rect x="20" y="48" width="80" height="18" rx="4" fill="rgba(201,160,96,.14)" stroke="#c9a060" stroke-width="0.7"/>
  <text x="60" y="60" text-anchor="middle" font-size="9" fill="#c9a060">Detail 1</text>
  <rect x="100" y="48" width="60" height="18" rx="4" fill="rgba(201,160,96,.14)" stroke="#c9a060" stroke-width="0.7"/>
  <text x="130" y="60" text-anchor="middle" font-size="9" fill="#c9a060">Detail 2</text>
  <rect x="160" y="48" width="80" height="18" rx="4" fill="rgba(201,160,96,.14)" stroke="#c9a060" stroke-width="0.7"/>
  <text x="200" y="60" text-anchor="middle" font-size="9" fill="#c9a060">Detail 3</text>
  <rect x="14" y="76" width="232" height="26" rx="6" fill="rgba(122,176,96,.10)" stroke="#7ab060" stroke-width="0.8"/>
  <text x="130" y="89" text-anchor="middle" font-size="9" fill="#7ab060" font-weight="700">UMBRELLA TEST</text>
  <text x="130" y="100" text-anchor="middle" font-size="9" fill="#a0c888">Does the answer cover ALL details, or just one?</text>
 </svg>`,
 caption:'The main idea is the umbrella under which all the details fit',
 steps:['Read the whole passage once — fast, just to get the gist.','Ask yourself: "What is this passage mostly about?" Try answering in your own words in one sentence.','Look at the FIRST and LAST sentences. They often state the main idea explicitly.','Now check the answers. Reject any that focus on only one detail. Reject any too broad to fit the passage.','The remaining choice should be the umbrella — broad enough to cover the whole passage, narrow enough to be specific.'],
 example:'Passage: "Bees pollinate crops worth $15B/year. They also produce honey and beeswax. Saving bees protects food supply." Main idea: "Bees provide significant economic and agricultural value" — covers all three details. Wrong: "Bees produce honey" (one detail only).'},

{cat:'Reading',tags:['reading','accuplacer','beginner'],
 title:'Reading: Drawing Inferences',
 theory:'',
 reality:'Inferences are educated guesses based on text clues — like a detective. Authors don\'t always say things directly; sometimes they imply. "She slammed the door" → you infer she\'s angry, even though "angry" isn\'t in the sentence.',
 formula:'Inference = Text Evidence + Reasoning\n\nNOT a guess. NOT outside knowledge.\nMUST be supported by SOMETHING in the passage.',
 method:'The "two-finger" test: point at the answer, then point at the line in the passage that proves it. If you can\'t point to evidence, it\'s not the right inference. The right answer follows DIRECTLY from clues you can locate.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="14" width="100" height="80" rx="8" fill="rgba(122,171,207,.10)" stroke="#7aabcf" stroke-width="1"/>
  <text x="64" y="28" text-anchor="middle" font-size="9" fill="#7aabcf" font-weight="700">CLUES (in text)</text>
  <text x="64" y="44" text-anchor="middle" font-size="8" fill="#9ecef0">"checked sky"</text>
  <text x="64" y="58" text-anchor="middle" font-size="8" fill="#9ecef0">"packed umbrella"</text>
  <text x="64" y="72" text-anchor="middle" font-size="8" fill="#9ecef0">"basket inside"</text>
  <text x="118" y="58" font-size="14" fill="#c9a060">→</text>
  <rect x="138" y="14" width="108" height="80" rx="8" fill="rgba(122,176,96,.10)" stroke="#7ab060" stroke-width="1"/>
  <text x="192" y="28" text-anchor="middle" font-size="9" fill="#7ab060" font-weight="700">INFERENCE</text>
  <text x="192" y="50" text-anchor="middle" font-size="11" fill="#a0c888" font-weight="700">"She expects rain"</text>
  <text x="192" y="68" text-anchor="middle" font-size="8" fill="#a0c888">(not stated, but</text>
  <text x="192" y="80" text-anchor="middle" font-size="8" fill="#a0c888">strongly supported)</text>
 </svg>`,
 caption:'Combine clues with reasoning. Stay anchored to the text.',
 steps:['Read the passage carefully and underline anything that feels like a HINT or detail.','Identify the question: what is being inferred?','Look for 2 or 3 clues in the passage that point to the same conclusion.','Test each answer: "Can I point to specific text that supports this?" If no, it\'s wrong.','Pick the answer that the text MOST DIRECTLY supports — even if it\'s not stated explicitly.'],
 example:'Passage: "Carlos hadn\'t eaten since 6 a.m. By 2 p.m. his stomach was loud enough to embarrass him in the meeting." Inference: "Carlos was hungry" — supported by "hadn\'t eaten" + "stomach loud."'},

{cat:'Reading',tags:['reading','accuplacer','beginner'],
 title:'Reading: Vocabulary in Context',
 theory:'',
 reality:'You don\'t always need to know what a word means in a vacuum — context tells you. "Lauded" might be unfamiliar, but "the achievement was lauded by everyone who admired her work" gives it away. Most test-day vocabulary is solved by context, not memorization.',
 formula:'4 context-clue types:\n  1. DEFINITION clue: "fauna, or animals, of the region..."\n  2. SYNONYM clue: "she was elated — overjoyed, even..."\n  3. ANTONYM clue: "unlike his brusque manner, she was warm..."\n  4. INFERENCE clue: surrounding sentences imply the meaning',
 method:'TONE is half the battle. If the surrounding text is positive, the unknown word is probably positive too. Reject answer choices whose tone clashes with the rest of the sentence.',
 svg:`<svg viewBox="0 0 260 100" xmlns="http://www.w3.org/2000/svg">
  <text x="14" y="20" font-size="9" fill="#9ecef0" font-weight="700">"The decision was [LAUDED] by activists who fought for it."</text>
  <line x1="14" y1="28" x2="246" y2="28" stroke="#5e5e5e" stroke-width="0.4" stroke-dasharray="2,2"/>
  <text x="14" y="44" font-size="9" fill="#7aabcf">Clue 1: "activists who fought for it" → they wanted it</text>
  <text x="14" y="58" font-size="9" fill="#7aabcf">Clue 2: their reaction must be POSITIVE</text>
  <text x="14" y="74" font-size="10" fill="#7ab060" font-weight="700">→ "lauded" most likely means "praised"</text>
  <rect x="14" y="84" width="232" height="14" rx="4" fill="rgba(192,112,112,.08)" stroke="#c07070" stroke-width="0.5"/>
  <text x="130" y="94" text-anchor="middle" font-size="8" fill="#c07070">Negative answers like "blocked" or "rejected" clash with tone — eliminate.</text>
 </svg>`,
 caption:'Match the unknown word\'s TONE to the surrounding sentence',
 steps:['Replace the unfamiliar word with "BLANK" and read the sentence again.','Decide: is the missing word POSITIVE, NEGATIVE, or NEUTRAL? That alone often eliminates two answers.','Look at the words BEFORE and AFTER the unknown word for definition, synonym, antonym, or inference clues.','Plug each remaining answer choice into the sentence. Does it sound natural and match the meaning?','Pick the choice that fits both the tone and the surrounding context.'],
 example:'"The lecturer was so prolix that students began checking the clock." Tone is negative (students bored). "Prolix" = wordy/long-winded.'},

/* ===== ACCUPLACER Writing mechanics ===== */
{cat:'Writing',tags:['writing','accuplacer','beginner'],
 title:'Writing: Subject-Verb Agreement & Pronouns',
 theory:'',
 reality:'"The students was ready" sounds wrong because the subject (students) is plural but the verb (was) is singular. Subject-verb agreement is the most common error tested on the ACCUPLACER Writing section.',
 formula:'Singular subject → singular verb (he runs, she has, it is)\nPlural subject → plural verb (they run, they have, they are)\n\nIgnore phrases between subject and verb when matching!\n\nPronouns must agree with their ANTECEDENT in number and gender.',
 method:'CROSS OUT the prepositional phrase between the subject and verb. The real subject is what\'s left. "The box [of pencils] is/are heavy" → cross out "[of pencils]" → "The box is heavy."',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <text x="14" y="22" font-size="10" fill="#9ecef0" font-weight="700">The group of students was/were ready.</text>
  <line x1="55" y1="14" x2="170" y2="14" stroke="#c07070" stroke-width="0.7" stroke-dasharray="2,2"/>
  <text x="112" y="9" text-anchor="middle" font-size="7" fill="#c07070">cross out — distractor!</text>
  <line x1="20" y1="38" x2="240" y2="38" stroke="#5e5e5e" stroke-width="0.4"/>
  <text x="14" y="54" font-size="10" fill="#7ab060">Real subject:  group  (singular)</text>
  <text x="14" y="68" font-size="10" fill="#7ab060" font-weight="700">→ Use singular verb:  was</text>
  <rect x="14" y="80" width="232" height="22" rx="6" fill="rgba(122,176,96,.10)" stroke="#7ab060" stroke-width="0.8"/>
  <text x="130" y="94" text-anchor="middle" font-size="9" fill="#7ab060">"The group of students was ready." ✓</text>
 </svg>`,
 caption:'Cross out the prepositional phrase, then match subject to verb',
 steps:['Find the verb in the sentence.','Ask "WHO or WHAT is doing this verb?" — that\'s your subject.','Cross out any prepositional phrase (of, in, with, etc.) between the subject and verb.','Match: singular subject → singular verb (often ends in -s); plural subject → plural verb.','For pronouns: every "he/she/it/they" should clearly point back to one specific noun (the antecedent), and they should agree in number.'],
 example:'"Each of the answers (is/are) correct." Strip "of the answers" → "Each is correct." Each is singular, so use IS.'},

{cat:'Writing',tags:['writing','accuplacer','beginner'],
 title:'Writing: Punctuation Essentials',
 theory:'',
 reality:'Commas can change meaning — "Let\'s eat, Grandma" vs. "Let\'s eat Grandma" is a literal life-or-death difference. Punctuation is how writing controls pace, grouping, and meaning.',
 formula:'COMMA — used for:\n  • after intro phrases ("After lunch, we left.")\n  • before FANBOYS conjunctions joining 2 independent clauses\n  • around non-essential info\n  • between items in a list\n\nSEMICOLON — joins 2 closely related independent clauses\nCOLON — introduces a list, explanation, or quote\nAPOSTROPHE — possession (Sam\'s book) and contractions (don\'t)',
 method:'Comma splice red flag: if you find two complete sentences joined ONLY by a comma, that\'s an error. Fix by (a) adding a FANBOYS word (and, but, or, etc.), (b) using a semicolon, or (c) splitting into two sentences.',
 svg:`<svg viewBox="0 0 260 120" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="14" width="116" height="44" rx="6" fill="rgba(192,112,112,.10)" stroke="#c07070" stroke-width="0.8"/>
  <text x="72" y="28" text-anchor="middle" font-size="9" fill="#c07070" font-weight="700">COMMA SPLICE</text>
  <text x="72" y="42" text-anchor="middle" font-size="8" fill="#c07070">"I ran, I was late."</text>
  <text x="72" y="54" text-anchor="middle" font-size="8" fill="#c07070">two complete + just comma ✗</text>
  <rect x="138" y="14" width="108" height="44" rx="6" fill="rgba(122,176,96,.10)" stroke="#7ab060" stroke-width="0.8"/>
  <text x="192" y="28" text-anchor="middle" font-size="9" fill="#7ab060" font-weight="700">FIX OPTIONS</text>
  <text x="192" y="40" text-anchor="middle" font-size="8" fill="#a0c888">"I ran; I was late."</text>
  <text x="192" y="50" text-anchor="middle" font-size="8" fill="#a0c888">"I ran, but I was late."</text>
  <text x="14" y="78" font-size="9" fill="#7aabcf">After intro phrase:  After lunch, we left.</text>
  <text x="14" y="92" font-size="9" fill="#c9a060">Possessive:  Sarah\'s notebook · the dogs\' bowls</text>
  <text x="14" y="106" font-size="9" fill="#7ab060">Colon for a list:  Bring three items: pen, paper, ID.</text>
 </svg>`,
 caption:'Each mark has one job. Don\'t use a comma where you need a stronger break.',
 steps:['After an intro phrase or word (However, After dinner, In fact), put a comma.','Joining two complete sentences? Use either semicolon, OR comma + FANBOYS (for, and, nor, but, or, yet, so).','For non-essential info (asides), surround with commas: "My brother, who lives in Ohio, called."','Apostrophe shows possession (Sarah\'s) or a contraction (don\'t = do not). NEVER use it for plural.','Colon introduces a list, explanation, or quote — but only after a complete sentence.'],
 example:'Wrong: "I studied hard, I passed." (comma splice). Right: "I studied hard, so I passed." (comma + FANBOYS) or "I studied hard; I passed." (semicolon).'},

{cat:'Writing',tags:['writing','accuplacer','beginner'],
 title:'Writing: Sentence Structure & Fragments',
 theory:'',
 reality:'A sentence needs a subject AND a verb AND must express a complete thought. "Because the bus was late" has a subject and verb but isn\'t complete — it\'s a fragment. Fixing fragments and run-ons is a top ACCUPLACER topic.',
 formula:'Independent clause:  has subject + verb + complete thought   (= a sentence)\nDependent clause:    has subject + verb but starts with "because, when, although, if..."  (incomplete)\n\nFRAGMENT: a dependent clause or partial idea standing alone\nRUN-ON: two independent clauses joined incorrectly (no punctuation, or just a comma)',
 method:'Fragment fix: connect the dependent clause to a complete sentence with a comma. Run-on fix: insert proper punctuation (period, semicolon, or comma+FANBOYS).',
 svg:`<svg viewBox="0 0 260 120" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="14" width="232" height="28" rx="6" fill="rgba(192,112,112,.10)" stroke="#c07070" stroke-width="0.8"/>
  <text x="22" y="26" font-size="9" fill="#c07070" font-weight="700">FRAGMENT  ✗</text>
  <text x="22" y="38" font-size="9" fill="#c07070">"Because the bus was late."  ← starts with "because" — incomplete</text>
  <rect x="14" y="46" width="232" height="28" rx="6" fill="rgba(192,112,112,.10)" stroke="#c07070" stroke-width="0.8"/>
  <text x="22" y="58" font-size="9" fill="#c07070" font-weight="700">RUN-ON  ✗</text>
  <text x="22" y="70" font-size="9" fill="#c07070">"I was late I missed the test."  ← two sentences smashed together</text>
  <rect x="14" y="78" width="232" height="34" rx="6" fill="rgba(122,176,96,.10)" stroke="#7ab060" stroke-width="0.8"/>
  <text x="22" y="90" font-size="9" fill="#7ab060" font-weight="700">FIXED  ✓</text>
  <text x="22" y="102" font-size="9" fill="#a0c888">"Because the bus was late, I missed the test."</text>
 </svg>`,
 caption:'Every sentence needs subject + verb + complete thought',
 steps:['Read the sentence ALOUD. Does it sound finished? If your voice trails off expecting more, you have a fragment.','Spot the dependent clause starters: because, although, when, while, if, since, after, before, unless. These signal possible fragments.','For a fragment: attach it to a complete sentence using a comma (intro position) or no comma (back position).','For a run-on: find the two complete sentences. Separate with period, semicolon, or comma + FANBOYS.','Read the fix aloud — it should sound natural and complete.'],
 example:'Run-on: "It rained we stayed in." Fix 1: "It rained, so we stayed in." Fix 2: "It rained; we stayed in." Fix 3: "It rained. We stayed in."'},

/* ===== AP STATISTICS coverage gap ===== */
{cat:'Statistics',tags:['data','statistics','ap'],
 title:'AP Statistics: Sampling, Study Design & Two-Way Tables',
 theory:'',
 reality:'Election polls, drug trials, and Netflix recommendations all rely on sampling. The DESIGN of how you collect data determines whether your conclusion is trustworthy. Bad sampling = bad results, no matter how clever the math.',
 formula:'Sampling methods:\n  • SRS (simple random)        – every group equally likely\n  • Stratified                  – split into groups, sample within each\n  • Systematic                  – every kth element\n  • Cluster                     – sample whole groups\n\nObservational study: just observe — only association.\nExperiment: assign treatments — can show causation.\n\nTwo-way table:\n  P(A | B) = (count A and B) / (count B)',
 method:'Causation requires an experiment with random assignment. Observational studies (no matter how big) only show association. Watch for confounding variables.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="14" width="232" height="14" rx="3" fill="rgba(122,171,207,.18)" stroke="#7aabcf" stroke-width="0.6"/>
  <text x="130" y="24" text-anchor="middle" font-size="9" fill="#7aabcf" font-weight="700">Two-way table — Drug trial</text>
  <line x1="14" y1="32" x2="246" y2="32" stroke="#5e5e5e" stroke-width="0.4"/>
  <text x="20" y="48" font-size="9" fill="#9ecef0" font-weight="700"></text>
  <text x="120" y="48" font-size="9" fill="#9ecef0" font-weight="700">Improved</text>
  <text x="190" y="48" font-size="9" fill="#9ecef0" font-weight="700">Same</text>
  <text x="240" y="48" font-size="9" fill="#9ecef0" font-weight="700">Total</text>
  <text x="20" y="64" font-size="9" fill="#7aabcf">Drug</text>
  <text x="124" y="64" font-size="9" fill="#a0c888">60</text>
  <text x="194" y="64" font-size="9" fill="#a0c888">40</text>
  <text x="244" y="64" font-size="9" fill="#a0c888">100</text>
  <text x="20" y="78" font-size="9" fill="#7aabcf">Placebo</text>
  <text x="124" y="78" font-size="9" fill="#d4b87a">30</text>
  <text x="194" y="78" font-size="9" fill="#d4b87a">70</text>
  <text x="244" y="78" font-size="9" fill="#d4b87a">100</text>
  <line x1="14" y1="84" x2="246" y2="84" stroke="#5e5e5e" stroke-width="0.4"/>
  <text x="14" y="100" font-size="9" fill="#7ab060" font-weight="700">P(Improved | Drug) = 60/100 = 0.60</text>
 </svg>`,
 caption:'Random assignment → causation. Random sampling → generalization.',
 steps:['Identify the population of interest and the sample method used.','Watch for BIAS: voluntary response, undercoverage, or non-response can ruin a sample.','Distinguish OBSERVATIONAL from EXPERIMENTAL — only experiments can establish cause-and-effect.','For two-way tables: marginal totals are row/column sums. Joint = single cell ÷ grand total. Conditional = cell ÷ row (or column) total.','Always state conclusions in context, with appropriate uncertainty (e.g., "this suggests, but cannot prove...").'],
 example:'200-person drug study, randomized: P(Improved | Drug) = 60/100 = 60%. P(Improved | Placebo) = 30/100 = 30%. Difference of 30 pts is large enough to suggest the drug helps.'},

/* ===== AP BIOLOGY ===== */
{cat:'Biology',tags:['biology','ap','science','beginner'],
 title:'AP Biology Foundations — Cells, DNA & Evolution',
 theory:'',
 reality:'Every disease, crop, vaccine, and ecosystem depends on biology. From cell biology to evolution, four big ideas tie AP Biology together: evolution, energy & matter, information storage, and systems interactions.',
 formula:'Cell types:\n  • PROKARYOTIC – no nucleus (bacteria)\n  • EUKARYOTIC  – has nucleus (plants, animals, fungi)\n\nDNA: double helix of A-T and G-C base pairs\n  Replication: semi-conservative\n  Transcription: DNA → mRNA\n  Translation: mRNA → protein (in ribosome)\n\nEvolution: Mutation → Variation → Selection → Adaptation',
 method:'Big-picture link: every AP Bio topic ties back to one of 4 big ideas — Evolution, Energy/Matter, Information, or Systems. When stuck, ask: which big idea is this question testing?',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="14" width="76" height="86" rx="6" fill="rgba(122,171,207,.10)" stroke="#7aabcf" stroke-width="0.8"/>
  <text x="52" y="28" text-anchor="middle" font-size="9" fill="#7aabcf" font-weight="700">EUKARYOTIC CELL</text>
  <ellipse cx="52" cy="60" rx="32" ry="24" fill="rgba(122,171,207,.10)" stroke="#7aabcf" stroke-width="0.6"/>
  <circle cx="52" cy="55" r="9" fill="rgba(192,112,112,.30)" stroke="#c07070" stroke-width="0.7"/>
  <text x="52" y="58" text-anchor="middle" font-size="6" fill="#c07070">DNA</text>
  <ellipse cx="38" cy="74" rx="3" ry="2" fill="#7ab060"/>
  <ellipse cx="66" cy="74" rx="3" ry="2" fill="#7ab060"/>
  <text x="52" y="94" text-anchor="middle" font-size="7" fill="#9ecef0">nucleus, organelles</text>
  <rect x="98" y="14" width="148" height="42" rx="6" fill="rgba(201,160,96,.10)" stroke="#c9a060" stroke-width="0.8"/>
  <text x="172" y="28" text-anchor="middle" font-size="9" fill="#c9a060" font-weight="700">CENTRAL DOGMA</text>
  <text x="172" y="42" text-anchor="middle" font-size="9" fill="#d4b87a">DNA → RNA → PROTEIN</text>
  <text x="172" y="52" text-anchor="middle" font-size="7" fill="#d4b87a">transcribe · translate</text>
  <rect x="98" y="62" width="148" height="38" rx="6" fill="rgba(122,176,96,.10)" stroke="#7ab060" stroke-width="0.8"/>
  <text x="172" y="76" text-anchor="middle" font-size="9" fill="#7ab060" font-weight="700">EVOLUTION</text>
  <text x="172" y="88" text-anchor="middle" font-size="8" fill="#a0c888">Variation → Selection</text>
  <text x="172" y="97" text-anchor="middle" font-size="7" fill="#a0c888">→ Adaptation over time</text>
 </svg>`,
 caption:'Cell → DNA → Protein → Trait → Selected by environment',
 steps:['Distinguish prokaryote (bacteria, no nucleus) from eukaryote (plant/animal, has nucleus + organelles).','Memorize the central dogma: DNA codes for RNA (transcription), RNA codes for protein (translation).','Mitosis = body cell division (2 identical daughters). Meiosis = sex cell division (4 unique gametes).','For evolution: variation arises from mutation; selection acts on variation; adaptations emerge over generations.','For ecology: producers → primary consumers → secondary consumers; energy flows up but only ~10% transfers per level.'],
 example:'A bacterial population evolves antibiotic resistance. Mutation creates one resistant cell → antibiotic kills the rest → only resistant cell survives & reproduces → next generation is resistant. Classic natural selection.'},

/* ===== AP ENVIRONMENTAL SCIENCE ===== */
{cat:'Environmental Science',tags:['environment','ap','science'],
 title:'AP Environmental Science Essentials',
 theory:'',
 reality:'Climate change, pollution, biodiversity loss, water scarcity — environmental science is about how human systems interact with Earth\'s natural systems. The exam stresses quantitative reasoning with real units and real-world data.',
 formula:'Energy pyramid: ~10% energy transfers up each trophic level\n\nGreenhouse gases: CO₂, CH₄, N₂O, water vapor\n  Trap infrared radiation → warming\n\nPopulation growth:\n  Exponential: r constant — J-curve\n  Logistic:    grows then plateaus at carrying capacity K — S-curve\n\nBiodiversity hot spots = high species count + endemic species + threatened',
 method:'Always check UNITS in environmental questions: kWh vs. kW, tons vs. metric tons, ppm vs. ppb. Conversions tank exam scores faster than concept gaps. Carry units through every calculation.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <polygon points="130,16 100,40 160,40" fill="rgba(192,112,112,.20)" stroke="#c07070" stroke-width="0.8"/>
  <text x="130" y="32" text-anchor="middle" font-size="7" fill="#c07070" font-weight="700">tertiary</text>
  <polygon points="100,42 80,62 180,62 160,42" fill="rgba(201,160,96,.20)" stroke="#c9a060" stroke-width="0.8"/>
  <text x="130" y="55" text-anchor="middle" font-size="7" fill="#c9a060" font-weight="700">secondary consumers</text>
  <polygon points="80,64 60,84 200,84 180,64" fill="rgba(122,171,207,.20)" stroke="#7aabcf" stroke-width="0.8"/>
  <text x="130" y="77" text-anchor="middle" font-size="7" fill="#7aabcf" font-weight="700">primary consumers (herbivores)</text>
  <polygon points="60,86 40,102 220,102 200,86" fill="rgba(122,176,96,.20)" stroke="#7ab060" stroke-width="0.8"/>
  <text x="130" y="98" text-anchor="middle" font-size="7" fill="#7ab060" font-weight="700">producers (plants, algae)</text>
  <text x="226" y="46" font-size="7" fill="#c07070">~10%</text>
  <text x="226" y="68" font-size="7" fill="#c9a060">~10%</text>
  <text x="226" y="90" font-size="7" fill="#7aabcf">~10%</text>
 </svg>`,
 caption:'Energy pyramid: only ~10% transfers up each trophic level',
 steps:['Memorize the major greenhouse gases (CO₂, CH₄, N₂O) and their relative warming potential.','Distinguish primary (raw extraction) from secondary (processing) sources of pollution.','Apply the 10% rule: energy or biomass at each trophic level is ~10% of the level below.','For population: J-curve = unchecked exponential; S-curve = leveling at carrying capacity K.','Track UNITS carefully: kWh, ppm, MJ — exam questions deliberately switch units to test conversion skills.'],
 example:'A solar panel produces 5 kWh/day. Yearly: 5 × 365 = 1825 kWh. At $0.13/kWh, savings = $237/year. Watch the units!'},

/* ===== COMPUTER SCIENCE ===== */
{cat:'Computer Science',tags:['cs','ap','beginner'],
 title:'Computer Science Foundations — Algorithms, Boolean Logic & Binary',
 theory:'',
 reality:'Every search-engine query, GPS route, video stream, and password check uses an algorithm. Computers think in binary (0s and 1s) and decide using Boolean logic (true/false). Understanding these foundations is the entry to AP CS A and AP CSP.',
 formula:'Binary: base-2 — each digit is 0 or 1.\n  1011₂ = 1·8 + 0·4 + 1·2 + 1·1 = 11₁₀\n\nBoolean operators:\n  AND  : true only if BOTH true\n  OR   : true if EITHER true\n  NOT  : flips true ↔ false\n\nAlgorithm: a finite step-by-step procedure to solve a problem.',
 method:'For binary conversion, use the place-value method: write powers of 2 from right (1, 2, 4, 8, 16, 32...) and add up the values where there\'s a 1. For Boolean problems, build a truth table — list every possible input combination, then evaluate.',
 svg:`<svg viewBox="0 0 260 110" xmlns="http://www.w3.org/2000/svg">
  <rect x="14" y="14" width="118" height="40" rx="6" fill="rgba(122,171,207,.10)" stroke="#7aabcf" stroke-width="0.8"/>
  <text x="73" y="28" text-anchor="middle" font-size="9" fill="#7aabcf" font-weight="700">BINARY → DECIMAL</text>
  <text x="73" y="44" text-anchor="middle" font-size="11" fill="#9ecef0" font-family="ui-monospace,monospace">1011₂ = 11₁₀</text>
  <rect x="138" y="14" width="108" height="40" rx="6" fill="rgba(201,160,96,.10)" stroke="#c9a060" stroke-width="0.8"/>
  <text x="192" y="28" text-anchor="middle" font-size="9" fill="#c9a060" font-weight="700">TRUTH TABLE  AND</text>
  <text x="158" y="44" font-size="9" fill="#d4b87a" font-family="ui-monospace,monospace">T·T=T  T·F=F</text>
  <text x="158" y="52" font-size="9" fill="#d4b87a" font-family="ui-monospace,monospace">F·T=F  F·F=F</text>
  <rect x="14" y="62" width="232" height="44" rx="6" fill="rgba(122,176,96,.10)" stroke="#7ab060" stroke-width="0.8"/>
  <text x="22" y="76" font-size="9" fill="#7ab060" font-weight="700">ALGORITHM (linear search)</text>
  <text x="22" y="89" font-size="8" fill="#a0c888" font-family="ui-monospace,monospace">for each item in list:</text>
  <text x="32" y="100" font-size="8" fill="#a0c888" font-family="ui-monospace,monospace">if item == target: return position</text>
 </svg>`,
 caption:'Binary digits, Boolean logic, and step-by-step algorithms',
 steps:['BINARY: write powers of 2 above each digit. Add powers where the digit is 1. (1011 = 8+0+2+1 = 11.)','DECIMAL → BINARY: divide by 2 repeatedly, recording remainders bottom-to-top.','BOOLEAN: build a truth table with every possible T/F combination of inputs.','ALGORITHM: write the steps in plain English (pseudocode) before writing code. State input, output, and process.','Trace through your algorithm with a small example to verify correctness — this is what the AP CS exam rewards.'],
 example:'Linear search: to find 7 in [3, 5, 7, 9], check 3 (no), check 5 (no), check 7 (yes — return position 2). Worst case: n comparisons for n items.'},
