/* ── ATOMIC STRUCTURE & PERIODIC TABLE ─────────── */
{cat:'Chemistry',tags:['chemistry','physics','science'],
 title:'Atomic Structure, Electronic Configuration & Periodic Trends',
 theory:'',
 reality:'Your non-stick pan is coated with Teflon — made of fluorine atoms that grip their electrons tightly. Gold does not rust because its electron arrangement is extremely stable. The periodic table lets chemists predict which atoms will bond, react violently, or do absolutely nothing.',
 formula:'Atomic number Z = number of protons\nMass number A = protons + neutrons\nElectronic config: 1s² 2s² 2p⁶ 3s² 3p⁶...\nMax electrons per sublevel: s=2, p=6, d=10, f=14\nBohr energy: Eₙ = −13.6/n² eV (hydrogen)\nRydberg: 1/λ = Rₕ(1/n₁² − 1/n₂²)\nIonisation energy trend: increases → across period, ↓ down group\nAtomic radius trend: decreases → across period, ↑ down group\nElectronegativity: increases → and ↑ (except noble gases)',
 method:'Electron configuration shortcut: use the noble gas core in brackets, then continue from after it. For transition metals, remember Cr=[Ar]3d⁵4s¹ and Cu=[Ar]3d¹⁰4s¹ (half-filled and fully-filled d shells are extra stable).',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <!-- Periodic table trends arrows -->
  <rect x="10" y="10" width="240" height="96" rx="8" fill="rgba(122,171,207,.06)" stroke="#7aabcf" stroke-width="1.5"/>
  <!-- Simplified periodic table block -->
  <text x="130" y="26" text-anchor="middle" font-size="9" fill="#7aabcf" font-weight="700">Periodic Trends</text>
  <!-- Period arrow (left to right) -->
  <line x1="30" y1="50" x2="200" y2="50" stroke="#c9a060" stroke-width="2.5"/>
  <polygon points="200,46 210,50 200,54" fill="#c9a060"/>
  <text x="120" y="44" text-anchor="middle" font-size="8.5" fill="#c9a060">→ IE ↑  radius ↓  EN ↑</text>
  <!-- Group arrow (top to bottom) -->
  <line x1="228" y1="30" x2="228" y2="96" stroke="#c07070" stroke-width="2.5"/>
  <polygon points="224,96 228,106 232,96" fill="#c07070"/>
  <text x="228" y="26" text-anchor="middle" font-size="8" fill="#c07070">↓</text>
  <text x="246" y="65" font-size="8" fill="#c07070" transform="rotate(90,228,65)">IE ↓  radius ↑</text>
  <!-- Orbital filling -->
  <text x="25" y="72" font-size="8" fill="#7ab060">Aufbau: 1s 2s 2p 3s 3p 4s 3d 4p...</text>
  <text x="25" y="86" font-size="8" fill="#9ecef0">Pauli: max 2 e⁻/orbital (↑↓)</text>
  <text x="25" y="100" font-size="8" fill="#c9a060">Hund: fill empty first (↑↑↑ before ↑↓)</text>
 </svg>`,
 caption:'Trends across period: IE and EN increase, radius decreases. Down a group: opposite. Orbital filling follows Aufbau, Pauli, Hund.',
 steps:['Write electron configuration: fill sublevels in Aufbau order (1s 2s 2p 3s 3p 4s 3d...).','Use noble gas core shorthand: Na=[Ne]3s¹ (Ne ends at Z=10, Na adds one 3s electron).','Note exceptions: Cr=[Ar]3d⁵4s¹ and Cu=[Ar]3d¹⁰4s¹ — half-filled and full d shells gain extra stability.','Periodic trends: ionisation energy increases left→right (nuclear charge increases, same shielding); decreases top→bottom (more shielding, larger radius).','Electronegativity highest at F (3.98); increases across periods and up groups following the same logic as IE.'],
 example:'Fe (Z=26): [Ar]3d⁶4s². Fe²⁺ loses 4s first: [Ar]3d⁶. Fe³⁺: [Ar]3d⁵. Rydberg: light emitted when H transitions n=3→n=2: 1/λ=1.097×10⁷(1/4−1/9)=1.524×10⁶ m⁻¹ → λ=656 nm (red, visible).'},

/* ── CHEMICAL BONDING ───────────────────────────── */
{cat:'Chemistry',tags:['chemistry','science'],
 title:'Chemical Bonding: Ionic, Covalent, VSEPR & Hybridisation',
 theory:'',
 reality:'Table salt forms because sodium gives an electron to chlorine — ionic bonding. Water is bent in shape (VSEPR), making it polar, which is why it dissolves salt but not oil. The shape of a molecule determines its smell, melting point, and how it reacts with your body.',
 formula:'Ionic: Δ electronegativity > 1.7 → ionic\nCovalent: ΔEN < 1.7 → covalent (< 0.5 nonpolar)\nBond order = (bonding e⁻ − antibonding e⁻)/2\nFormal charge = valence e⁻ − lone e⁻ − ½ bonding e⁻\nVSEPR pairs → geometry:\n  2 → linear (180°)\n  3 → trigonal planar (120°)\n  4 → tetrahedral (109.5°)\n  5 → trigonal bipyramidal\n  6 → octahedral (90°)\nHybridisation: sp(2 regions), sp²(3), sp³(4)\nσ bond: head-on overlap; π bond: side-on',
 method:'Lewis structure method: (1) count total valence electrons, (2) connect atoms with single bonds, (3) fill octets on outer atoms first, (4) give remaining electrons to central atom, (5) convert lone pairs to multiple bonds if central atom lacks octet. Minimise formal charges.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="4" y="4" width="118" height="110" rx="7" fill="rgba(122,171,207,.06)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="63" y="18" text-anchor="middle" font-size="8.5" fill="#7aabcf" font-weight="700">VSEPR Geometries</text>
  <!-- Linear -->
  <circle cx="28" cy="36" r="7" fill="rgba(122,171,207,.3)" stroke="#7aabcf" stroke-width="1"/>
  <circle cx="63" cy="36" r="7" fill="rgba(201,160,96,.3)" stroke="#c9a060" stroke-width="1.5"/>
  <circle cx="98" cy="36" r="7" fill="rgba(122,171,207,.3)" stroke="#7aabcf" stroke-width="1"/>
  <line x1="35" y1="36" x2="56" y2="36" stroke="#888" stroke-width="1.5"/>
  <line x1="70" y1="36" x2="91" y2="36" stroke="#888" stroke-width="1.5"/>
  <text x="63" y="52" text-anchor="middle" font-size="8" fill="#888">linear 180°</text>
  <!-- Tetrahedral -->
  <circle cx="63" cy="78" r="7" fill="rgba(201,160,96,.3)" stroke="#c9a060" stroke-width="1.5"/>
  <circle cx="32" cy="68" r="5" fill="rgba(192,112,112,.3)" stroke="#c07070" stroke-width="1"/>
  <circle cx="94" cy="68" r="5" fill="rgba(192,112,112,.3)" stroke="#c07070" stroke-width="1"/>
  <circle cx="45" cy="98" r="5" fill="rgba(192,112,112,.3)" stroke="#c07070" stroke-width="1"/>
  <circle cx="81" cy="98" r="5" fill="rgba(192,112,112,.3)" stroke="#c07070" stroke-width="1"/>
  <line x1="57" y1="73" x2="37" y2="70" stroke="#888" stroke-width="1.2"/>
  <line x1="69" y1="73" x2="89" y2="70" stroke="#888" stroke-width="1.2"/>
  <line x1="58" y1="83" x2="48" y2="95" stroke="#888" stroke-width="1.2"/>
  <line x1="68" y1="83" x2="78" y2="95" stroke="#888" stroke-width="1.2"/>
  <text x="63" y="112" text-anchor="middle" font-size="8" fill="#888">tetrahedral 109.5°</text>
  <!-- Right panel: hybridisation -->
  <rect x="134" y="4" width="122" height="110" rx="7" fill="rgba(201,160,96,.06)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="195" y="18" text-anchor="middle" font-size="8.5" fill="#c9a060" font-weight="700">Hybridisation</text>
  <text x="142" y="34" font-size="8" fill="#d4b87a">sp  → 2 σ bonds, linear</text>
  <text x="142" y="48" font-size="8" fill="#d4b87a">sp² → 3 σ bonds, 1 π bond</text>
  <text x="142" y="62" font-size="8" fill="#d4b87a">sp³ → 4 σ bonds, tetrahedral</text>
  <text x="142" y="78" font-size="8" fill="#c9a060">σ bonds: overlap along axis</text>
  <text x="142" y="92" font-size="8" fill="#c9a060">π bonds: side-on, above/below</text>
  <text x="142" y="106" font-size="8" fill="#888">C₂H₂: sp  C₂H₄: sp²  CH₄: sp³</text>
 </svg>`,
 caption:'VSEPR: electron pairs (bonding + lone) repel → geometry. Lone pairs compress angles. sp³=tetrahedral, sp²=trigonal planar.',
 steps:['Count total valence electrons from the periodic table, accounting for charge (add e⁻ for negative, subtract for positive).','Draw skeleton with central atom; connect all atoms with single bonds.','Distribute remaining electrons to outer atoms to complete octets; place leftover on central atom.','Determine electron pair geometry (all pairs) and molecular geometry (bonding pairs only).','Assign hybridisation: count electron pair regions around central atom → sp(2), sp²(3), sp³(4), sp³d(5), sp³d²(6).'],
 example:'CO₂: C has 4 valence e⁻, each O has 6 → total=16. C connects to 2 O (4 e⁻ used). Each O needs 4 more → 8 lone pair e⁻. But C has 0 — promote lone pairs to double bonds. Result: O=C=O, 2 regions → sp hybridisation, linear, 180°. Nonpolar (symmetric).'},

/* ── CHEMICAL REACTIONS & STOICHIOMETRY ─────────── */
{cat:'Chemistry',tags:['chemistry','science'],
 title:'Reaction Types, Balancing, Redox & Electrochemistry',
 theory:'',
 reality:'Bleach cleans because it strips electrons from stain molecules — a redox reaction. Rust forms when iron loses electrons to oxygen on your car. Your rechargeable battery works by reversing a redox reaction. Balancing chemical equations is chemistry\'s version of double-entry accounting.',
 formula:'Balancing: atoms and charge equal on both sides\nOxidation state rules:\n  free element = 0; monoatomic ion = charge\n  O usually −2; H usually +1; F always −1\nOIL RIG: Oxidation Is Loss, Reduction Is Gain\nCell potential: E°cell = E°cathode − E°anode\nΔG° = −nFE°  (F=96,485 C/mol)\nNernst: E = E° − (RT/nF)·lnQ\nElectrolysis: m = (M·I·t)/(n·F)  (Faraday\'s law)\nActivity series: more active metal displaces less active',
 method:'Half-reaction method for balancing redox in acidic solution: (1) separate into oxidation and reduction half-reactions, (2) balance atoms (use H₂O for O, H⁺ for H), (3) balance charge with electrons, (4) multiply to equalise electrons transferred, (5) add half-reactions and cancel electrons.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <!-- Galvanic cell diagram -->
  <rect x="10" y="18" width="100" height="80" rx="6" fill="rgba(122,171,207,.08)" stroke="#7aabcf" stroke-width="1.5"/>
  <rect x="150" y="18" width="100" height="80" rx="6" fill="rgba(201,160,96,.08)" stroke="#c9a060" stroke-width="1.5"/>
  <!-- electrodes -->
  <rect x="40" y="28" width="12" height="58" rx="3" fill="rgba(192,112,112,.25)" stroke="#c07070" stroke-width="1.5"/>
  <text x="46" y="24" text-anchor="middle" font-size="8" fill="#c07070">Anode</text>
  <text x="46" y="96" text-anchor="middle" font-size="7.5" fill="#c07070">oxidation</text>
  <rect x="208" y="28" width="12" height="58" rx="3" fill="rgba(122,176,96,.25)" stroke="#7ab060" stroke-width="1.5"/>
  <text x="214" y="24" text-anchor="middle" font-size="8" fill="#7ab060">Cathode</text>
  <text x="214" y="96" text-anchor="middle" font-size="7.5" fill="#7ab060">reduction</text>
  <!-- electron flow -->
  <path d="M52 28 Q130 4 208 28" fill="none" stroke="#888" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="130" y="10" text-anchor="middle" font-size="8" fill="#888">e⁻ flow →</text>
  <!-- salt bridge -->
  <rect x="108" y="30" width="44" height="24" rx="4" fill="rgba(128,128,128,.2)" stroke="#888" stroke-width="1.5"/>
  <text x="130" y="46" text-anchor="middle" font-size="8" fill="#888">salt bridge</text>
  <text x="60" y="60" text-anchor="middle" font-size="8" fill="#7aabcf">Zn→Zn²⁺</text>
  <text x="200" y="60" text-anchor="middle" font-size="8" fill="#7ab060">Cu²⁺→Cu</text>
  <text x="130" y="108" text-anchor="middle" font-size="8" fill="#888">E°cell = E°cathode − E°anode = 0.34−(−0.76) = 1.10 V</text>
 </svg>`,
 caption:'Galvanic cell: electrons flow from anode (oxidation, −) to cathode (reduction, +). Salt bridge maintains charge balance.',
 steps:['Assign oxidation states to all atoms. Identify what is oxidised (OS increases) and reduced (OS decreases).','Write separate half-reactions. Balance atoms, then balance oxygen with H₂O, hydrogen with H⁺.','Balance charge with electrons (e⁻). Multiply half-reactions so electrons cancel when added.','Add half-reactions; cancel electrons and anything appearing on both sides.','For cell potential: E°cell=E°cathode−E°anode. Positive E°cell → spontaneous. ΔG°=−nFE°.'],
 example:'Zn/Cu galvanic cell: Anode: Zn→Zn²⁺+2e⁻ (E°=−0.76 V). Cathode: Cu²⁺+2e⁻→Cu (E°=+0.34 V). E°cell=0.34−(−0.76)=+1.10 V. ΔG°=−2·96485·1.10=−212,270 J=−212.3 kJ. Spontaneous ✓'},

/* ── ORGANIC CHEMISTRY ──────────────────────────── */
{cat:'Chemistry',tags:['chemistry','science'],
 title:'Organic Chemistry: Functional Groups, Reactions & Nomenclature',
 theory:'',
 reality:'Aspirin, plastic, gasoline, vitamins, and alcohol are all organic molecules. The -OH group makes something an alcohol. The -COOH group makes it an acid like vinegar. Knowing functional groups tells a chemist how a molecule will react, what it smells like, and whether it is safe.',
 formula:'Alkane: CₙH₂ₙ₊₂  (only C−C single bonds)\nAlkene: CₙH₂ₙ   (C=C double bond)\nAlkyne: CₙH₂ₙ₋₂ (C≡C triple bond)\nKey functional groups:\n  −OH: alcohol\n  −COOH: carboxylic acid\n  −COO−: ester\n  −CO−: ketone; −CHO: aldehyde\n  −NH₂: amine\nCombustion: CₓHᵧ + O₂ → CO₂ + H₂O\nAddition (alkene): Br₂ adds across C=C\nSaponification: ester + NaOH → acid salt + alcohol',
 method:'IUPAC naming: (1) find the longest carbon chain containing the principal functional group, (2) number from the end closest to the functional group, (3) name substituents as prefixes with their position numbers. Suffix for functional group: -ol, -al, -one, -oic acid, -amine.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="4" y="4" width="252" height="110" rx="8" fill="rgba(122,176,96,.05)" stroke="#7ab060" stroke-width="1.5"/>
  <text x="130" y="18" text-anchor="middle" font-size="9" fill="#7ab060" font-weight="700">Key Functional Groups</text>
  <!-- Alcohol -->
  <text x="22" y="36" font-size="8.5" fill="#7aabcf" font-weight="700">−OH</text>
  <text x="22" y="48" font-size="8" fill="#9ecef0">Alcohol</text>
  <text x="22" y="58" font-size="7.5" fill="#888">polar, H-bond</text>
  <!-- Carboxylic acid -->
  <text x="80" y="36" font-size="8.5" fill="#c9a060" font-weight="700">−COOH</text>
  <text x="80" y="48" font-size="8" fill="#d4b87a">Carboxylic acid</text>
  <text x="80" y="58" font-size="7.5" fill="#888">acidic, H-bond</text>
  <!-- Amine -->
  <text x="160" y="36" font-size="8.5" fill="#c07070" font-weight="700">−NH₂</text>
  <text x="160" y="48" font-size="8" fill="#c07070">Amine</text>
  <text x="160" y="58" font-size="7.5" fill="#888">basic</text>
  <!-- Ester -->
  <text x="22" y="80" font-size="8.5" fill="#7ab060" font-weight="700">−COO−</text>
  <text x="22" y="92" font-size="8" fill="#a0c888">Ester</text>
  <text x="22" y="102" font-size="7.5" fill="#888">fragrant</text>
  <!-- Aldehyde/Ketone -->
  <text x="100" y="80" font-size="8.5" fill="#a060c0" font-weight="700">C=O</text>
  <text x="100" y="92" font-size="8" fill="#a060c0">Carbonyl</text>
  <text x="100" y="102" font-size="7.5" fill="#888">aldehyde (end)</text>
  <text x="100" y="112" font-size="7.5" fill="#888">ketone (middle)</text>
  <!-- Alkene/Alkyne -->
  <text x="180" y="80" font-size="8.5" fill="#c9a060" font-weight="700">C=C / C≡C</text>
  <text x="180" y="92" font-size="8" fill="#d4b87a">Alkene/Alkyne</text>
  <text x="180" y="102" font-size="7.5" fill="#888">addition rxns</text>
 </svg>`,
 caption:'Functional groups determine reactivity and physical properties. The carbonyl group (C=O) is found in aldehydes, ketones, esters, and carboxylic acids.',
 steps:['Identify the functional group from the molecular formula or structure — it determines the compound type and reactions.','For IUPAC naming: find the parent chain (longest containing the principal group), number to give the group the lowest number, name substituents alphabetically with position numbers.','Alkene reactions: electrophilic addition. HX adds by Markovnikov\'s rule (H adds to less substituted C).','Alcohol oxidation: primary → aldehyde → carboxylic acid; secondary → ketone; tertiary → cannot be oxidised easily.','Ester formation: carboxylic acid + alcohol → ester + H₂O (condensation reaction). Saponification reverses this with NaOH.'],
 example:'Ethanol (CH₃CH₂OH) oxidised by K₂Cr₂O₇: primary alcohol → ethanal (acetaldehyde, CH₃CHO) → ethanoic acid (acetic acid, CH₃COOH). Saponification: ethyl acetate + NaOH → sodium acetate + ethanol.'},

/* ── NUCLEAR & RADIOACTIVITY ────────────────────── */
{cat:'Chemistry',tags:['chemistry','physics','science'],
 title:'Nuclear Chemistry: Radioactivity, Decay & Nuclear Energy',
 theory:'',
 reality:'Carbon-14 decays at a known steady rate, so scientists can date ancient bones and wooden artifacts — that is radiocarbon dating. Nuclear power plants use uranium fission to generate a significant portion of the world\'s electricity. Radiation therapy uses targeted radioactivity to destroy cancer tumors.',
 formula:'Alpha: ᴬZX → ᴬ⁻⁴Z⁻₂Y + ⁴₂He\nBeta⁻: ᴬZX → ᴬZ+1Y + e⁻ + ν̄_e\nBeta⁺: ᴬZX → ᴬZ-1Y + e⁺ + νe\nGamma: nucleus loses energy as γ ray (no mass/charge change)\nBinding energy: E_b = Δm·c²  (Δm=mass defect)\nN(t) = N₀·e^(−λt)\nT½ = ln2/λ ≈ 0.693/λ\nActivity: A = λN  (Bq = decays/s)\nFission: heavy nucleus splits (U-235, Pu-239)\nFusion: light nuclei combine (H→He in stars)',
 method:'Conservation laws in nuclear reactions: atomic number Z (proton number) and mass number A are both conserved. Always check that ΣZ and ΣA are equal on both sides of the nuclear equation. Use mass defect to calculate energy released.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <!-- Nuclear decay types -->

/* ─── QUIZ HELPERS ─────────────────────────────────────────────── */
function rnd(n){return Math.floor(Math.random()*n);}
function pick(arr){return arr[rnd(arr.length)];}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function distractors(correct,pool,n=3){const d=[];const tried=new Set([String(correct)]);const p=shuffle(pool);for(const x of p){const s=String(x);if(!tried.has(s)){d.push(x);tried.add(s);}if(d.length>=n)break;}while(d.length<n)d.push('—');return d;}
function fmtNum(n,dec=2){return parseFloat(n.toFixed(dec));}

function genAlphabetQ(){

    ()=>{const correct=d.hname;const pool=DATA.map(x=>x.hname);return {prompt:`What is the Hebrew letter name for <strong>${d.l}</strong>?`,correct,opts:shuffle([correct,...distractors(correct,pool)]),hint:`Symbol meaning: ${d.sym}`};},
    ()=>{const correct=d.sym;const pool=DATA.map(x=>x.sym);return {prompt:`What does the symbol for <strong>${d.hname} (${d.l})</strong> represent?`,correct,opts:shuffle([correct,...distractors(correct,pool)]),hint:`Meanings: ${d.means.join(', ')}`};},
    ()=>{const ip=pick(d.ipa);const correct=pick(d.ipa_desc.filter(Boolean))||d.ipa_desc[0];const pool=DATA.flatMap(x=>x.ipa_desc).filter(Boolean);return {prompt:`The IPA symbol <strong>[${ip}]</strong> on the letter <strong>${d.l}</strong> sounds like…?`,correct,opts:shuffle([correct,...distractors(correct,pool)]),hint:`Letter: ${d.l} · ${d.hname}`};}
  ];
  return pick(types)();
}

function genMorphQ(){
  const all=allMorphEntries();

    ()=>{const correct=e.meaning;const pool=all.map(x=>x.meaning);return {prompt:`What does the morpheme <strong>${e.m}</strong> mean?`,correct,opts:shuffle([correct,...distractors(correct,pool)]),hint:`${e.type} · ${e.origin} · e.g. ${e.examples}`};},
    ()=>{const correct=e.type;const pool=['prefix','root','suffix','combining form'];return {prompt:`Is <strong>${e.m}</strong> (meaning: ${e.meaning}) a…?`,correct,opts:shuffle([correct,...distractors(correct,pool)]),hint:`Origin: ${e.origin} · e.g. ${e.examples}`};},
    ()=>{const correct=e.origin;const pool=[...new Set(all.map(x=>x.origin))];return {prompt:`What language does <strong>${e.m}</strong> (${e.meaning}) come from?`,correct,opts:shuffle([correct,...distractors(correct,pool)]),hint:`${e.type} · e.g. ${e.examples}`};},
    ()=>{const ex=e.examples.split(',')[0].trim();const correct=e.m;const pool=all.map(x=>x.m);return {prompt:`Which morpheme appears in the word <strong>${ex}</strong>?`,correct,opts:shuffle([correct,...distractors(correct,pool)]),hint:`Meaning: ${e.meaning} · ${e.origin}`};}
  ];
  return pick(types)();
}

function genArithmeticQ(){
  const types=[
    ()=>{const a=rnd(50)+1,b=rnd(50)+1,c=a+b;const correct=String(c);const d=[c+rnd(5)+1,c-rnd(5)-1,a*b].map(String);return {prompt:`<strong>${a} + ${b} = ?</strong>`,correct,opts:shuffle([correct,...distractors(correct,d)]),hint:'Addition'};},
    ()=>{const a=rnd(50)+10,b=rnd(a)+1,c=a-b;const correct=String(c);const d=[c+rnd(5)+1,c-rnd(5)-1,a+b].map(String);return {prompt:`<strong>${a} − ${b} = ?</strong>`,correct,opts:shuffle([correct,...distractors(correct,d)]),hint:'Subtraction'};},

    // Punctuation
    ()=>{const cases=[{q:'Which sentence uses a semicolon correctly?',correct:'"She finished the report; her manager approved it immediately."',opts:['"She finished the report; and her manager approved it."','"She; finished the report for her manager."','"She finished; the report quickly."'],hint:'A semicolon joins two independent clauses — not used before "and"',cat:'Punctuation'},{q:'Which sentence correctly uses a colon?',correct:'"He needed three things: a pen, paper, and focus."',opts:['"He: needed three things."','"He needed: to focus."','"He needed three: things."'],hint:'A colon introduces a list or explanation after an independent clause',cat:'Punctuation'},{q:'Which sentence correctly punctuates a non-restrictive clause?',correct:'"My sister, who lives in Denver, called yesterday."',opts:['"My sister who lives in Denver called yesterday."','"My sister, who lives in Denver called yesterday."','"My, sister who lives in Denver, called yesterday."'],hint:'Non-restrictive (extra info) clauses need commas on both sides',cat:'Punctuation'}];const c=pick(cases);return{prompt:`<em style="font-size:10px;color:var(--ts)">${c.cat}</em><br><br><strong>${c.q}</strong>`,correct:c.correct,opts:shuffle([c.correct,...distractors(c.correct,c.opts)]),hint:c.hint};},

function genAccuplacerQ(){
  if(quizSubCategory==='arithmetic')return genAccuplacerArithmeticQ();
  if(quizSubCategory==='qas')return genAccuplacerQRQ();
  if(quizSubCategory==='aaf')return genAccuplacerAdvAlgQ();
  if(quizSubCategory==='reading')return genAccuplacerReadingQ();
  if(quizSubCategory==='writing')return genAccuplacerWritingQ();
  if(quizSubCategory==='essay')return genAccuplacerEssayQ();
  // Mixed: pick randomly across all sections
  const all=[genAccuplacerArithmeticQ,genAccuplacerQRQ,genAccuplacerAdvAlgQ,genAccuplacerReadingQ,genAccuplacerWritingQ,genAccuplacerEssayQ];
  return pick(all)();
}

function generateQuiz(){
  let q;
  if(quizCategory==='alphabet')q=genAlphabetQ();
  else if(quizCategory==='morphemes')q=genMorphQ();
  else if(quizCategory==='arithmetic')q=genArithmeticQ();
  else if(quizCategory==='algebra')q=genAlgebraQ();
  else if(quizCategory==='geometry')q=genGeometryQ();
  else if(quizCategory==='calculus'){
    if(quizSubCategory==='clep_precalc')q=genCLEPPrecalcQ();
    else if(quizSubCategory==='ap_calc')q=genAPCalcQ();
    else q=genCalculusQ();
  }
  else if(quizCategory==='physics'){
    if(quizSubCategory==='ap_mech')q=genAPMechQ();
    else if(quizSubCategory==='ap_em')q=genAPEMQ();
    else q=genPhysicsQ();
  }
  else if(quizCategory==='chemistry'){
    if(quizSubCategory==='ap_chem')q=genAPChemQ();
    else q=genChemistryQ();
  }
  else if(quizCategory==='accuplacer')q=genAccuplacerQ();
  else q=genAlphabetQ();
  quizState={...q,answered:false};
}
function setQuizCategory(cat){quizCategory=cat;quizSubCategory='general';generateQuiz();render();}
function setQuizSubCategory(sub){quizSubCategory=sub;generateQuiz();render();}

function answerQuiz(idx){
  if(!quizState||quizState.answered)return;
  quizState.answered=true;
  quizState.chosenIdx=idx;
  const isCorrect=quizState.opts[idx]===quizState.correct;
  if(isCorrect)setStreak(streak+1);else setStreak(0);
  render();
}

function allMorphEntries(){return Object.entries(MORPHEMES).flatMap(([letter,arr])=>arr.map((e,i)=>({...e,letter,index:i,id:'morph-'+letter+'-'+i})));}
function entriesForLetter(letter){return (MORPHEMES[letter]||[]).map((e,i)=>({...e,letter,index:i,id:'morph-'+letter+'-'+i}));}
function typeCount(list,type){return list.filter(e=>String(e.type).toLowerCase().includes(type)).length;}
function originHit(e,o){return o==='all'||String(e.origin).toLowerCase().includes(o);}
function kindHit(e,k){return k==='all'||String(e.type).toLowerCase().includes(k);}
function catHit(e,c){return c==='all'||(e.cats||[]).includes(c);}
function textHit(e,query){if(!query)return true;const hay=[e.m,e.type,e.origin,e.meaning,e.examples,(e.cats||[]).join(' ')].join(' ').toLowerCase();return hay.includes(query.toLowerCase());}
function filteredMorphs(list){return list.filter(e=>catHit(e,cat)&&originHit(e,origin)&&kindHit(e,kind)&&textHit(e,q));}
function chip(group,value,label,current){return '<button class="link-chip '+(current===value?'active':'')+'" onclick="setMorphFilter(\''+group+'\',\''+value+'\')">'+esc(label||value)+'</button>';}
function itemCard(e){return '<div class="vocab-item" id="'+e.id+'"><div class="vocab-word">'+esc(e.m)+'</div><div class="vocab-ipa">'+esc(e.type)+' · '+esc(e.origin)+'</div><div class="vocab-meaning" style="display:block">'+esc(e.meaning)+'</div><div class="muted">'+esc(e.examples)+'</div><div style="margin-top:6px">'+(e.cats||[]).map(c=>'<a class="tag" href="#morph-'+esc(c)+'" onclick="openCategory(\''+esc(c)+'\')">'+esc(c)+'</a>').join('')+'</div></div>';}

    chemistry:[()=>qMake('What is the atomic number of carbon?','6',['12','8','14'],'Carbon has 6 protons.','Atomic structure'),()=>qMake('A solution with pH 3 is:','acidic',['basic','neutral','nonpolar'],'pH below 7 is acidic.','Acids and bases')]
  };

    writing:[()=>qMake('Choose the best version:','Each of the students has completed his or her assignment.',['Each of the students have completed their assignments.','Each of the students has completed their assignments.','Each of the students have completed his or her assignment.'],'“Each” is singular, so use “has.”','Writing conventions'),()=>qMake('Which sentence is correctly punctuated?','It’s raining outside; bring an umbrella.',['Its raining outside, bring an umbrella.','It’s raining outside bring an umbrella.','Its raining outside; bring an umbrella.'],'Use it’s = it is; a semicolon can join two related independent clauses.','Punctuation')],
    arithmetic:[()=>qMake('What is <strong>2.4 × 0.5</strong>?','1.2',['12','0.12','2.9'],'Half of 2.4 is 1.2.','Decimal operations'),()=>qMake('A recipe uses 3 cups of flour for 12 servings. How many cups are needed for 20 servings?','5',['4','6','7.5'],'3/12 = x/20, so x = 5.','Ratios and proportions')],

// ===== ACCUPLACER UPGRADE (Injected) =====
let accScore = 250;
let difficulty = 1;
let correctStreak = 0;
let testMode = false;
let testTime = 3600;
let answered = false;

function updateAdaptive(isCorrect){
  if(isCorrect){
    accScore += 3 + difficulty;
    correctStreak++;
    if(correctStreak >= 2 && difficulty < 5){
      difficulty++;
      correctStreak = 0;
    }
  } else {
    accScore -= 2;
    difficulty = Math.max(1, difficulty - 1);
    correctStreak = 0;
  }
  accScore = Math.max(200, Math.min(300, accScore));
}

const accuplacerQuestions = [
  {section:"Reading",level:1,prompt:"The passage mainly discusses:",options:["A theory","An experiment","A result","An opinion"],answer:1},
  {section:"Writing",level:2,prompt:"Choose the correct sentence:",options:["Dog run fast","The dog runs fast","Dog runs fastly","The dog run fast"],answer:1},
  {section:"Arithmetic",level:1,prompt:"3/4 + 2/5 =",options:["23/20","7/9","1 7/20","11/20"],answer:0},
  {section:"Quantitative",level:3,prompt:"x + 5 = 9, x =",options:["4","5","9","14"],answer:0},
  {section:"Algebra",level:4,prompt:"x² - 4 = 0",options:["±2","±4","2","4"],answer:0}
];

function getAdaptiveQuestion(){
  let pool = accuplacerQuestions.filter(q=>q.level===difficulty);
  if(!pool.length) pool = accuplacerQuestions; // fallback: use all questions
  return pool[Math.floor(Math.random()*pool.length)];
}

function renderAccuplacer(){
  let q = getAdaptiveQuestion();
  answered = false;
  let html = `<div class="card">
    <div class="quiz-prompt">${q.prompt}</div>
    <div class="quiz-opts">`;
  q.options.forEach((opt,i)=>{
    html += `<button class="quiz-opt" onclick="submitAccuplacer(${i},${q.answer})">${opt}</button>`;
  });
  html += `</div><div class="score-row">Score: ${accScore}</div></div>`;
  document.getElementById("main-content").innerHTML = html;
}

function submitAccuplacer(choice,answer){
  if(answered) return;
  answered = true;
  updateAdaptive(choice===answer);
  setTimeout(renderAccuplacer,800);
}

function startFullTest(){
  testMode = true;
  testTime = 3600;
}

function gradeEssay(){
  let text = document.getElementById("essayInput")?.value || "";
  let score = 1;
  if(text.length > 300) score++;
  if(text.includes("because")) score++;
  if(text.split('.').length > 5) score++;
  alert("Essay Score: " + score + "/8");
}

// Hook into existing mode system
const oldSetMode = window.setMode;
window.setMode = function(mode){
  if(mode === "accuplacer"){
    // Delegate to the unified quiz engine if available
    if(typeof window.QXSetTrack === 'function'){
      window.QXSetTrack('accuplacer');
      if(typeof window.openQuizLab === 'function') window.openQuizLab();
    } else {
      renderAccuplacer(); // fallback to legacy
    }
    // Ensure desktop nav button is highlighted
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    const ab = document.getElementById('mode-accuplacer');
    if(ab) ab.classList.add('active');
  } else {
    if(typeof oldSetMode === 'function') oldSetMode(mode);
  }
}

  function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function shuffleQ(q){
    const pairs = q.options.map((t,i)=>({t,i}));
    for(let i=pairs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pairs[i],pairs[j]]=[pairs[j],pairs[i]];}
    return {...q, options: pairs.map(p=>p.t), answer: pairs.findIndex(p=>p.i===q.answer)};
  }

  /* ---------- QUESTION SELECTION ---------- */
  function nextQuestion(){
    if(S.track === 'quiz'){
      const pool = QB[S.quizCat] || QB.arithmetic;
      return shuffleQ(pick(pool));
    }
    if(S.track === 'ap'){
      const pool = QB[S.apExam] || [];
      return pool.length ? shuffleQ(pick(pool)) : null;
    }
    if(S.track === 'clep'){
      const pool = QB[S.clepExam] || [];
      return pool.length ? shuffleQ(pick(pool)) : null;
    }
    if(S.track === 'accuplacer'){
      if(S.accuSection === 'essay') return null; // handled separately
      let pool;
      if(S.accuSection === 'mixed'){
        pool = [...QB.accu_reading, ...QB.accu_writing, ...QB.accu_arithmetic, ...QB.accu_qras, ...QB.accu_aaf];
      } else {
        pool = QB[S.accuSection] || [];
      }
      // progressive difficulty: prefer questions at current difficulty ±1
      const lvl = S.accuDifficulty;
      const sameLevel = pool.filter(q=>q.level===lvl);
      const candidatePool = sameLevel.length ? sameLevel : pool.filter(q=>Math.abs(q.level-lvl)<=1);
      return shuffleQ(pick((candidatePool.length?candidatePool:pool)));
    }
    return null;
  }

  /* ---------- ACCUPLACER ADAPTIVE ENGINE ---------- */
  function updateAccu(isCorrect, topic){
    if(isCorrect){
      S.accuScaled += 3 + S.accuDifficulty;
      S.accuStreak++;
      if(S.accuStreak >= 2 && S.accuDifficulty < 5){ S.accuDifficulty++; S.accuStreak = 0; }
      S.accuStrong[topic] = (S.accuStrong[topic]||0) + 1;
    } else {
      S.accuScaled -= 2;
      S.accuDifficulty = Math.max(1, S.accuDifficulty - 1);
      S.accuStreak = 0;
      S.accuMissed[topic] = (S.accuMissed[topic]||0) + 1;
    }
    S.accuScaled = Math.max(200, Math.min(300, S.accuScaled));
  }

  }

  function essayCard(){
    return `<div class="card">
      <div class="section-title">WritePlacer Essay</div>
      <div class="quiz-prompt" style="text-align:left">Some people argue that technology has made students better learners; others argue the opposite. Take a position and support it with reasons and examples. Aim for 300–600 words.</div>
      <textarea id="qx-essay-input" style="width:100%;height:200px;background:var(--c2);color:var(--tx);border:.5px solid var(--bd);border-radius:7px;padding:10px;font-size:12px;line-height:1.5;font-family:inherit"></textarea>
      <div class="filter-row" style="margin-top:8px"><button class="btn primary" onclick="QXGradeEssay()">Grade with WritePlacer rubric</button></div>
      <div id="qx-essay-score"></div>
      <div class="strategy-grid">
        <div class="strategy-card"><strong>Purpose / Focus</strong>Clear position consistent with the prompt.</div>
        <div class="strategy-card"><strong>Organization</strong>Intro, body paragraphs, transitions, conclusion.</div>
        <div class="strategy-card"><strong>Development</strong>Specific reasons and concrete examples.</div>
        <div class="strategy-card"><strong>Language Use</strong>Sentence variety, word choice, grammar, mechanics.</div>
      </div>
    </div>`;
  }

  /* ---------- TOP-LEVEL RENDER ---------- */
  function render(){
    const main = document.getElementById('main-content');
    if(!main) return;
    let subcats = '';
    if(S.track==='quiz') subcats = quizSubcats();
    if(S.track==='ap') subcats = apSubcats();
    if(S.track==='clep') subcats = clepSubcats();
    if(S.track==='accuplacer') subcats = accuSubcats();

    let content;
    if(S.track==='accuplacer' && S.accuSection==='essay'){
      content = essayCard();
    } else {
      content = questionCard();
    }
    const stats = (S.track==='accuplacer') ? accuStats() : '';
    const sheet = answerSheet();
    main.innerHTML = `
      <div class="card">
        <div class="stem-title">Quiz &amp; Exam Lab</div>
        <div class="stem-sub">Adaptive practice with a learn-as-you-go answer sheet. Every answer shows the reasoning and a step-by-step walkthrough.</div>
        ${trackTabs()}
        ${bannerFor(S.track)}
        ${subcats}
        <div class="filter-row" style="margin-top:8px">
          <button class="link-chip" onclick="QXReset()">Reset session</button>
          ${S.track==='accuplacer'?'<button class="link-chip" onclick="QXStartTimedTest()">Start full-length timed test</button>':''}
        </div>
      </div>
      ${stats}
      ${content}
      ${sheet}
    `;
  }

  /* ---------- ACTIONS ---------- */
  window.QXSetTrack = function(t){
    S.track = t;
    if(t==='quiz') S.current = nextQuestion();
    if(t==='ap') S.current = nextQuestion();
    if(t==='clep') S.current = nextQuestion();
    if(t==='accuplacer'){ S.current = nextQuestion(); }
    S.answered = false;
    render();
  };
  window.QXSetQuizCat = function(c){ S.quizCat=c; S.current=nextQuestion(); S.answered=false; render(); };
  window.QXSetApExam  = function(c){ S.apExam=c;  S.current=nextQuestion(); S.answered=false; render(); };
  window.QXSetClepExam= function(c){ S.clepExam=c;S.current=nextQuestion(); S.answered=false; render(); };
  window.QXSetAccuSection = function(c){
    S.accuSection = c;
    S.current = (c==='essay') ? null : nextQuestion();
    S.answered = false;
    render();
  };

  window.QXAnswer = function(idx){
    if(S.answered || !S.current) return;
    const q = S.current;
    q.chosen = idx;
    S.answered = true;
    const ok = idx === q.answer;
    S.total++;
    if(ok) S.score++;
    if(S.track==='accuplacer') updateAccu(ok, q.topic||q.focus||'general');
    S.sheet.push({
      focus:q.focus, prompt:q.prompt, options:q.options,
      chosen:q.chosen, correctIdx:q.answer,
      why:q.why, how:q.how, topic:q.topic, ok
    });
    if(S.sheet.length > 60) S.sheet.shift();
    render();
  };

  window.QXNext = function(){
    S.current = nextQuestion();
    S.answered = false;
    render();
  };

  window.QXReset = function(){
    S.score=0; S.total=0; S.sheet=[];
    if(S.track==='accuplacer'){
      S.accuScaled=250; S.accuDifficulty=1; S.accuStreak=0; S.accuMissed={}; S.accuStrong={};
      if(S.timerId){clearInterval(S.timerId); S.timerId=null;} S.timeLeft=3600;
    }
    S.current = nextQuestion(); S.answered=false;
    render();
  };

  window.QXStartTimedTest = function(){
    S.track='accuplacer';
    S.score=0; S.total=0; S.sheet=[];
    S.accuScaled=250; S.accuDifficulty=1; S.accuStreak=0; S.accuMissed={}; S.accuStrong={};
    S.timeLeft=3600;
    if(S.timerId) clearInterval(S.timerId);
    S.timerId = setInterval(()=>{
      S.timeLeft--;
      if(S.timeLeft<=0){ clearInterval(S.timerId); S.timerId=null; alert('Time up! Review your score report.'); }
    }, 1000);
    S.current = nextQuestion(); S.answered=false;
    render();
  };

  window.QXGradeEssay = function(){
    const text = (document.getElementById('qx-essay-input')?.value || '').trim();
    const words = text ? text.split(/\s+/).length : 0;
    let score = 1;
    if(words >= 150) score++;
    if(words >= 300) score++;
    if(/\b(because|therefore|however|for example|as a result|in addition)\b/i.test(text)) score++;
    if((text.match(/[.!?]/g)||[]).length >= 6) score++;
    if(/\b(first|second|finally|in conclusion|moreover|consequently)\b/i.test(text)) score++;
    if(words >= 450) score++;
    score = Math.max(1, Math.min(8, score));
    const el = document.getElementById('qx-essay-score');
    if(el){
      const feedback = [];
      if(words<150) feedback.push('Length is short — aim for 300+ words.');
      if(!/\b(first|second|finally|in conclusion)\b/i.test(text)) feedback.push('Add organizational signposts (first, second, finally).');
      if(!/\b(because|therefore|however|for example)\b/i.test(text)) feedback.push('Use transitions to connect reasons.');
      el.innerHTML = `<div class="qx-feedback ${score>=5?'correct':'wrong'}">
        <b>WritePlacer estimate: ${score}/8 · ${words} words</b>
        <span class="qx-why"><strong>Rubric:</strong> Purpose, Organization, Development, Language Use.</span>
        ${feedback.length?`<span class="qx-how"><em>To improve:</em> ${feedback.join(' ')}</span>`:'<span class="qx-how"><em>Strong response — review for grammar and word choice.</em></span>'}
      </div>`;
    }
  };

  /* ---------- ENTRY HOOKS — REPLACE EARLIER DEFS ---------- */
  window.openQuizLab = function(){
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    const btn = document.getElementById('mode-quiz');
    if(btn) btn.classList.add('active');
    const nav = document.getElementById('letter-nav'); if(nav) nav.style.display='none';
    const bottom = document.querySelector('.bottom-nav'); if(bottom) bottom.style.display='none';
    const prog = document.getElementById('prog'); if(prog) prog.style.width='100%';
    const pos = document.getElementById('pos-label'); if(pos) pos.textContent='Quiz & Exam Lab';
    S.track = 'quiz';
    S.current = nextQuestion();
    S.answered = false;
    render();
  };

  window.openExamLab = function(cat){
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    const btn = document.getElementById('mode-'+cat);
    if(btn) btn.classList.add('active');
    const nav = document.getElementById('letter-nav'); if(nav) nav.style.display='none';
    const bottom = document.querySelector('.bottom-nav'); if(bottom) bottom.style.display='none';
    const prog = document.getElementById('prog'); if(prog) prog.style.width='100%';
    const pos = document.getElementById('pos-label'); if(pos) pos.textContent=(cat==='ap'?'AP Exam':cat==='clep'?'CLEP Exam':cat.toUpperCase())+' Practice';
    S.track = cat; // 'ap' or 'clep'
    S.current = nextQuestion();
    S.answered = false;
    render();
  };

  // expose state for debugging
  window.QXBank = QB;
})();

// ===== MENU GROUPING FIX =====
(function(){
  const previousSetMode = window.setMode;
  window.setMode = function(mode){
    if(typeof previousSetMode === 'function'){
      previousSetMode(mode);
    }
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));

    if(btn) btn.classList.add('active');

// ===== SAFETY PATCH: PREVENT BROKEN MENU HOOKS =====
(function(){
  window.safeSetMode = window.safeSetMode || function(mode){
    if(typeof window.setMode === 'function') return window.setMode(mode);
    const main=document.getElementById('main-content');
    if(main) main.innerHTML='<div class="card"><div class="section-title">Unavailable</div><div class="muted">This section could not load.</div></div>';
  };

  if(typeof window.openQuizLab !== 'function'){
    window.openQuizLab = function(){
      const main=document.getElementById('main-content');
      if(main) main.innerHTML='<div class="card"><div class="section-title">Quiz</div><div class="muted">Quiz section is unavailable in this file.</div></div>';
    };
  }

  if((document.getElementById('mode-ap') || document.getElementById('mode-clep')) && typeof window.openExamLab !== 'function'){
    window.openExamLab = function(cat){
      const main=document.getElementById('main-content');
      if(main) main.innerHTML='<div class="card"><div class="section-title">'+cat.toUpperCase()+'</div><div class="muted">Exam section is unavailable in this file.</div></div>';
    };
  }
})();

/* ─── RESPONSIVE MOBILE NAV SYSTEM ─── */
(function(){

  /* ── Mobile popup open/close ── */
  window.toggleMobileMenu = function(id){
    const popup = document.getElementById('mpopup-' + id);
    const overlay = document.getElementById('mobile-overlay');
    if(!popup) return;
    const isOpen = popup.classList.contains('open');
    // close all popups first
    document.querySelectorAll('.mobile-popup').forEach(p=>{
      p.classList.remove('open');
      p.style.display='none';
    });
    if(!isOpen){
      popup.style.display='block';
      // Trigger reflow for transition
      popup.getBoundingClientRect();
      popup.classList.add('open');
      overlay.classList.add('open');
    } else {
      overlay.classList.remove('open');
    }
  };

  window.closeMobileMenu = function(){
    document.querySelectorAll('.mobile-popup').forEach(p=>{
      p.classList.remove('open');
      setTimeout(()=>{ p.style.display='none'; }, 260);
    });
    const overlay = document.getElementById('mobile-overlay');
    if(overlay) overlay.classList.remove('open');
  };

  /* ── Sync timer display to both desktop + mobile timers ── */
  const _origFmt = window.formatTime;
  function syncTimers(text, cls){
    const dt = document.getElementById('timer');
    const mt = document.getElementById('timer-mobile');
    [dt, mt].forEach(el=>{
      if(!el) return;
      el.textContent = text;
      el.className = (el === dt ? 'timer-box' : 'timer-mobile timer-box') + (cls?' '+cls:'');
    });
  }

  // Patch the existing timer tick to also update mobile timer
  const _origToggle = window.toggleTimer;
  // We'll patch via MutationObserver on the desktop timer element
  document.addEventListener('DOMContentLoaded', ()=>{
    const dtimer = document.getElementById('timer');
    const mtimer = document.getElementById('timer-mobile');
    if(dtimer && mtimer){
      const obs = new MutationObserver(()=>{
        mtimer.textContent = dtimer.textContent;
        mtimer.className = 'timer-mobile ' + dtimer.className.replace('timer-box','').trim();
        if(dtimer.classList.contains('warn')) mtimer.style.color='var(--twarn)';
        else if(dtimer.classList.contains('done')) mtimer.style.color='var(--tsucc)';
        else mtimer.style.color='var(--tinfo)';
      });
      obs.observe(dtimer, {characterData:true, childList:true, subtree:true, attributes:true});
    }

    // Sync streak display to mobile
    const ds = document.getElementById('streak-display');
    const ms = document.getElementById('streak-display-mobile');
    if(ds && ms){
      new MutationObserver(()=>{ ms.textContent = ds.textContent; })
        .observe(ds, {characterData:true, childList:true, subtree:true});
    }
  });

  /* ── Active tab highlighting on mobile ── */
  const modeToMtab = {
    explore:'mtab-explore', vocab:'mtab-vocab', morph:'mtab-morph',
    stem:'mtab-stem', counts:'mtab-more', strategy:'mtab-more',
    quiz:'mtab-practice', ap:'mtab-practice', clep:'mtab-practice', accuplacer:'mtab-practice'
  };

  // Patch setMode to also update mobile tabs
  const _origSetMode2 = window.setMode;
  window.setMode = function(mode){
    if(typeof _origSetMode2 === 'function') _origSetMode2(mode);
    updateMobileTabs(mode);
    // Add to desktop nav group active state
    updateDesktopActive(mode);
  };

  function updateMobileTabs(mode){
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    const tabId = modeToMtab[mode];
    if(tabId){
      const el = document.getElementById(tabId);
      if(el) el.classList.add('active');
    }
  }

  function updateDesktopActive(mode){
    // Clear all mode-btn active states first
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    // Map mode to button id
    const id = 'mode-' + mode;
    const btn = document.getElementById(id);
    if(btn) btn.classList.add('active');
  }

  // Patch openQuizLab and openExamLab to update mobile tabs
  const _oQL = window.openQuizLab;
  window.openQuizLab = function(){
    if(typeof _oQL==='function') _oQL();
    updateMobileTabs('quiz');
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    const btn = document.getElementById('mode-quiz');
    if(btn) btn.classList.add('active');
  };

  const _oEL = window.openExamLab;
  window.openExamLab = function(cat){
    if(typeof _oEL==='function') _oEL(cat);
    updateMobileTabs(cat);
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    const btn = document.getElementById('mode-'+cat);
    if(btn) btn.classList.add('active');
  };

  /* ── Update mobile streak label in More popup ── */
  window._origResetStreak = window.resetStreak;
  window.resetStreak = function(){
    if(typeof window._origResetStreak==='function') window._origResetStreak();
    const lbl = document.getElementById('mobile-streak-label');
    const ds = document.getElementById('streak-display');
    if(lbl && ds) lbl.textContent = 'Current: ' + ds.textContent.replace('streak: ','');
  };

  /* ── Keyboard escape closes mobile menu ── */
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape') window.closeMobileMenu();
  });

})();

</script>
