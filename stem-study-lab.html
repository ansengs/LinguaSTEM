  <text x="130" y="108" text-anchor="middle" font-size="8" fill="#7ab060">y = A·sin(Bx+C)+D — five landmark points</text>
 </svg>`,
 caption:'Sine wave: A=amplitude, T=period, phase shift moves graph left/right, D shifts up/down.',
 steps:['Convert degrees to radians when using calculus formulas: multiply by π/180.','Read amplitude as the vertical distance from midline to peak.','Compute period = 2π/|B| — this is the length of one complete cycle.','Phase shift = −C/B moves the graph horizontally (negative = shift right).','For waves in physics: connect angular frequency ω = 2πf and wave number k = 2π/λ.'],
 example:'y = 3 sin(2x − π/2) + 1. Amplitude=3, Period=2π/2=π, Phase shift=π/4 right, Vertical shift=1 up. Five key x-values: start at π/4, then add π/4 each step.'},

/* ── DIFFERENTIAL CALCULUS ─────────────────────── */
{cat:'Derivatives & Limits',tags:['calculus','physics','finance','engineering'],
 title:'Limits, Derivatives & Rates of Change',
 theory:'',
 reality:'Your car speedometer shows how fast your position is changing — that is a derivative! Weather forecasters calculate how quickly temperature is dropping. Stock traders watch how fast prices change. Derivatives measure the rate of change of anything in the real world.',
 formula:'Limit: lim[h→0] (f(x+h)−f(x))/h\nd/dx xⁿ = n·xⁿ⁻¹\nd/dx eˣ = eˣ\nd/dx ln x = 1/x\nd/dx sin x = cos x\nd/dx cos x = −sin x\nSum rule: (f+g)′ = f′+g′',
 method:"L'Hôpital's Rule: if limit gives 0/0 or ∞/∞ form, differentiate numerator and denominator separately, then re-evaluate. Use for AP Calc limits with indeterminate forms.",
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <line x1="14" y1="108" x2="246" y2="108" stroke="#444" stroke-width="1"/>
  <line x1="14" y1="10" x2="14" y2="112" stroke="#444" stroke-width="1"/>
  <path d="M20 100 Q80 98 120 70 Q160 42 200 22 Q220 14 240 12" fill="none" stroke="#7aabcf" stroke-width="2.5"/>
  <circle cx="140" cy="52" r="4" fill="#c9a060"/>
  <line x1="90" y1="80" x2="200" y2="28" stroke="#c9a060" stroke-width="2"/>
  <text x="135" y="44" font-size="7.5" fill="#c9a060">tangent line</text>
  <text x="135" y="56" font-size="7.5" fill="#c9a060">slope = f′(x)</text>
  <line x1="140" y1="52" x2="140" y2="108" stroke="#c07070" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="142" y="88" font-size="7.5" fill="#c07070">x = a</text>
  <text x="16" y="22" font-size="8.5" fill="#7aabcf">y = f(x)</text>
  <text x="60" y="116" text-anchor="middle" font-size="8" fill="#8a8a8a">secant → tangent as h → 0</text>
 </svg>`,
 caption:'Derivative = slope of tangent line at one point. As h shrinks, secant becomes tangent.',
 steps:['Simplify the function before differentiating — combine like terms, rewrite radicals as powers.','Apply power rule term by term: bring exponent down, reduce exponent by 1.','Memorize the standard derivatives: trig, exponential, and logarithm.','Interpret result: derivative units = output units per input unit (e.g., m/s is derivative of meters with respect to seconds).','For limits: try direct substitution first; if 0/0, factor/cancel or use L\'Hôpital\'s Rule.'],
 example:'f(x) = 3x⁴ − 5x² + 2. f′(x) = 12x³ − 10x. At x=1: f′(1) = 12−10 = 2. This is the slope of f at x=1.'},

{cat:'Derivatives & Limits',tags:['calculus','engineering','finance'],
 title:'Product, Quotient, Chain Rule & Optimization',
 theory:'',
 reality:'A factory wants to make the biggest box possible from one flat sheet of cardboard. A farmer wants to fence the most land using the least fencing. Companies use these techniques to cut costs and maximize profit — it is math that saves real money every day.',
 formula:'Product: (fg)′ = f′g + fg′\nQuotient: (f/g)′ = (f′g−fg′)/g²\nChain: [f(g(x))]′ = f′(g(x))·g′(x)\nImplicit: differentiate both sides, solve for dy/dx\nOptimization: set f′(x)=0, test with f″(x)\nRelated rates: differentiate both sides w.r.t. time t',
 method:'Chain rule mnemonic: "derivative of outside (leaving inside alone) times derivative of inside." For optimization: always verify whether critical point is max or min using second derivative test (f″ > 0 → min, f″ < 0 → max).',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="20" width="60" height="28" rx="7" fill="rgba(122,171,207,.15)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="40" y="31" text-anchor="middle" font-size="8.5" fill="#7aabcf" font-weight="700">outer f</text>
  <text x="40" y="43" text-anchor="middle" font-size="8" fill="#9ecef0">f′(g(x))</text>
  <text x="76" y="37" text-anchor="middle" font-size="12" fill="#555">×</text>
  <rect x="86" y="20" width="60" height="28" rx="7" fill="rgba(201,160,96,.15)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="116" y="31" text-anchor="middle" font-size="8.5" fill="#c9a060" font-weight="700">inner g</text>
  <text x="116" y="43" text-anchor="middle" font-size="8" fill="#d4b87a">g′(x)</text>
  <text x="156" y="37" text-anchor="middle" font-size="10" fill="#555">=</text>
  <rect x="164" y="20" width="88" height="28" rx="7" fill="rgba(122,176,96,.12)" stroke="#7ab060" stroke-width="1.5"/>
  <text x="208" y="31" text-anchor="middle" font-size="8.5" fill="#7ab060" font-weight="700">[f(g(x))]′</text>
  <text x="208" y="43" text-anchor="middle" font-size="8" fill="#a0c888">Chain result</text>
  <line x1="14" y1="108" x2="246" y2="108" stroke="#444" stroke-width="1"/>
  <path d="M20 108 Q80 104 120 68 Q150 38 180 70 Q210 100 240 108" fill="none" stroke="#c07070" stroke-width="2"/>
  <circle cx="120" cy="68" r="4" fill="#7ab060"/>
  <text x="124" y="64" font-size="8" fill="#7ab060">max f′=0</text>
  <circle cx="178" cy="70" r="4" fill="#c9a060"/>
  <text x="140" y="88" font-size="7.5" fill="#c9a060">local min</text>
  <text x="20" y="100" font-size="8" fill="#8a8a8a">Optimization: critical pts where f′(x)=0</text>
 </svg>`,
 caption:'Chain rule: outside × inside derivative. Optimization: f′=0 at extrema; f″ determines max vs min.',
 steps:['Identify the outer and inner functions before applying chain rule.','For product rule: d(uv)/dx = u′v + uv′ — differentiate each factor in turn.','For quotient rule: remember "low d-high minus high d-low, all over low-squared."','For optimization: define the objective function, take its derivative, set equal to zero, and solve.','Confirm max or min: f″(x) > 0 → concave up → minimum; f″(x) < 0 → concave down → maximum.'],
 example:'Differentiate h(x)=sin(x³). Outer=sin, inner=x³. h′(x)=cos(x³)·3x². Optimization: maximize area A=x(100−x). A′=100−2x=0 → x=50. A″=−2<0 (max). Max area=50×50=2500 m².'},

/* ── INTEGRAL CALCULUS ─────────────────────────── */
{cat:'Integration',tags:['calculus','physics','engineering'],
 title:'Antiderivatives, Area & the Fundamental Theorem',
 theory:'',
 reality:'How far did a car travel if you only know its speed at every moment? You add up all the tiny distances — that is integration. Engineers calculate fuel consumption. Doctors measure total drug dosage in a patient over time using this same idea.',
 formula:'∫ xⁿ dx = xⁿ⁺¹/(n+1) + C  (n ≠ −1)\n∫ eˣ dx = eˣ + C\n∫ 1/x dx = ln|x| + C\n∫ sin x dx = −cos x + C\nFTC: ∫_a^b f(x) dx = F(b) − F(a)\nAvg value = 1/(b−a) · ∫_a^b f(x) dx',
 method:'Fundamental Theorem of Calculus (FTC Part 2): find the antiderivative F, then evaluate F(b) − F(a). The constant C disappears in definite integrals. Units of ∫f dx = units of f × units of x.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <line x1="14" y1="108" x2="246" y2="108" stroke="#444" stroke-width="1"/>
  <line x1="14" y1="10" x2="14" y2="112" stroke="#444" stroke-width="1"/>
  <path d="M30 100 Q80 98 120 70 Q160 40 200 22 Q220 14 240 12" fill="none" stroke="#7aabcf" stroke-width="2"/>
  <path d="M70 90 Q80 88 100 78 Q120 68 140 56 L140 108 L70 108 Z" fill="rgba(122,171,207,.18)" stroke="none"/>
  <line x1="70" y1="10" x2="70" y2="108" stroke="#c9a060" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="140" y1="10" x2="140" y2="108" stroke="#c9a060" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="68" y="118" font-size="8" fill="#c9a060">a</text>
  <text x="137" y="118" font-size="8" fill="#c9a060">b</text>
  <text x="100" y="90" text-anchor="middle" font-size="8.5" fill="#7aabcf" font-weight="700">∫_a^b f(x) dx</text>
  <text x="100" y="102" text-anchor="middle" font-size="7.5" fill="#7aabcf">= F(b) − F(a)</text>
  <text x="16" y="22" font-size="8.5" fill="#7aabcf">y=f(x)</text>
 </svg>`,
 caption:'Shaded area = definite integral. FTC: find antiderivative F, evaluate at b, subtract value at a.',
 steps:['Identify whether the integral is indefinite (+ C) or definite (bounded).','For indefinite integrals, reverse the derivative rules: power rule in reverse, standard forms.','For definite integrals: find antiderivative F(x), then evaluate F(b) − F(a).','Always attach units: if integrating velocity (m/s) over time (s), result is meters.','Average value of f on [a,b] = (1/(b−a)) times the definite integral.'],
 example:'∫₀² 3x² dx. Antiderivative: x³. Evaluate: 2³ − 0³ = 8. Area under 3x² from x=0 to x=2 is 8 square units.'},

{cat:'Integration',tags:['calculus','engineering','physics'],
 title:'Integration Techniques: u-Sub, Parts & Applications',
 theory:'',
 reality:'These are tools engineers use to solve integrals that do not fit simple patterns. Finding the center of gravity of an airplane wing, calculating the work a pump does, or designing the shape of a dam all require these techniques.',
 formula:'u-sub: ∫f(g(x))g′(x) dx = ∫f(u) du\nBy parts: ∫u dv = uv − ∫v du\n(LIATE: Log, Inverse, Algebraic, Trig, Exp)\nDisk: V = π∫[f(x)]² dx\nWasher: V = π∫([R(x)]²−[r(x)]²) dx\nShell: V = 2π∫x·f(x) dx',
 method:'LIATE rule for integration by parts: choose u from the function that comes first in LIATE; dv is the rest. This gives the most tractable ∫v du. For volumes, disk method for rotation around x-axis; shell method often simpler for rotation around y-axis.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <line x1="14" y1="108" x2="246" y2="108" stroke="#444" stroke-width="1"/>
  <line x1="14" y1="10" x2="14" y2="112" stroke="#444" stroke-width="1"/>
  <path d="M60 108 Q100 104 130 80 Q160 56 190 108 Z" fill="rgba(201,160,96,.18)" stroke="#c9a060" stroke-width="2"/>
  <path d="M60 108 Q100 104 130 80 Q160 56 190 108" fill="none" stroke="#c9a060" stroke-width="2"/>
  <ellipse cx="125" cy="108" rx="65" ry="12" fill="rgba(122,171,207,.12)" stroke="#7aabcf" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="125" y="80" text-anchor="middle" font-size="7.5" fill="#c9a060">Disk Method</text>
  <text x="125" y="92" text-anchor="middle" font-size="7.5" fill="#c9a060">V=π∫[f(x)]²dx</text>
  <text x="125" y="112" text-anchor="middle" font-size="7.5" fill="#7aabcf">Rotation → solid of revolution</text>
  <text x="16" y="30" font-size="8" fill="#8a8a8a">u-sub: let u=inner, du=inner′dx</text>
  <text x="16" y="44" font-size="8" fill="#8a8a8a">Parts: ∫u dv = uv − ∫v du</text>
  <text x="16" y="58" font-size="8" fill="#8a8a8a">LIATE: choose u from left</text>
 </svg>`,
 caption:'u-substitution wraps up the inner function. Parts splits a product. Rotation around x-axis creates disks.',
 steps:['For u-substitution: spot a function and its derivative inside the integrand, let u = inner function.','Compute du = inner′ dx, rewrite the entire integral in terms of u, integrate, then substitute back.','For integration by parts: pick u from LIATE order, then dv = rest. Compute v by integrating dv.','Evaluate uv and subtract ∫v du. Sometimes you need to apply parts twice.','For volumes: disk method → square the function; washer → subtract inner squared from outer squared.'],
 example:'∫x·eˣ dx. By parts: u=x, dv=eˣdx → du=dx, v=eˣ. Result: xeˣ − ∫eˣdx = xeˣ − eˣ + C = eˣ(x−1)+C.'},

/* ── LINEAR ALGEBRA ─────────────────────────────── */
{cat:'Matrices & Vectors',tags:['linear algebra','physics','engineering'],
 title:'Vectors, Matrices & Systems of Equations',
 theory:'',
 reality:'A video game character moves with a velocity vector — speed AND direction together. Google Maps solves a giant system of equations to find the fastest route. Every 3D animated movie uses matrix math to rotate and position every object on screen.',
 formula:'Ax = b  (system as matrix equation)\nRREF solves systems with row operations\ndot: a·b = |a||b|cosθ = Σaᵢbᵢ\ncross: |a×b| = |a||b|sinθ\ndet(A): 2×2: ad−bc\nA⁻¹ exists iff det(A) ≠ 0',
 method:'Gaussian elimination with row reduction: use three row operations (swap rows, scale row, add multiple of one row to another). Row echelon form → back substitution. RREF → read solution directly. Research confirms this is the most reliable systematic method.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="20" width="80" height="68" rx="8" fill="rgba(122,171,207,.08)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="50" y="38" text-anchor="middle" font-size="8.5" fill="#7aabcf" font-weight="700">Matrix A</text>
  <text x="50" y="54" text-anchor="middle" font-size="9.5" fill="#9ecef0" font-family="monospace">[a b | e]</text>
  <text x="50" y="68" text-anchor="middle" font-size="9.5" fill="#9ecef0" font-family="monospace">[c d | f]</text>
  <text x="50" y="82" text-anchor="middle" font-size="7.5" fill="#7aabcf">Row reduce →</text>
  <text x="100" y="57" text-anchor="middle" font-size="16" fill="#555">→</text>
  <rect x="112" y="20" width="80" height="68" rx="8" fill="rgba(122,176,96,.08)" stroke="#7ab060" stroke-width="1.5"/>
  <text x="152" y="38" text-anchor="middle" font-size="8.5" fill="#7ab060" font-weight="700">RREF</text>
  <text x="152" y="54" text-anchor="middle" font-size="9.5" fill="#a0c888" font-family="monospace">[1 0 | x₁]</text>
  <text x="152" y="68" text-anchor="middle" font-size="9.5" fill="#a0c888" font-family="monospace">[0 1 | x₂]</text>
  <text x="152" y="82" text-anchor="middle" font-size="7.5" fill="#7ab060">Solution!</text>
  <text x="205" y="57" text-anchor="middle" font-size="16" fill="#555">→</text>
  <circle cx="228" cy="54" r="22" fill="rgba(201,160,96,.10)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="228" y="50" text-anchor="middle" font-size="8" fill="#c9a060">det(A)</text>
  <text x="228" y="62" text-anchor="middle" font-size="8" fill="#c9a060">≠ 0 → A⁻¹</text>
  <text x="130" y="108" text-anchor="middle" font-size="8" fill="#8a8a8a">Gaussian elimination: swap · scale · add rows</text>
 </svg>`,
 caption:'Row reduce augmented matrix to RREF. Each pivot column corresponds to one solved variable.',
 steps:['Write the augmented matrix [A|b] from the system Ax=b.','Use three row operations: R↔R (swap), cR (scale), R+cR (add multiple).','Achieve row echelon form: leading 1s cascade left to right.','For full RREF: also clear entries above each leading 1.','Check determinant: det≠0 means unique solution; det=0 means no solution or infinite solutions.'],
 example:'System: 2x+y=5, x+3y=10. Matrix: [2 1|5][1 3|10] → RREF → [1 0|1][0 1|3]. Solution: x=1, y=3. Check: 2(1)+3=5 ✓, 1+9=10 ✓'},

/* ── DIFFERENTIAL EQUATIONS ────────────────────── */
{cat:'ODEs',tags:['calculus','chemistry','physics'],
 title:'Separable ODEs: Growth, Decay & Cooling',
 theory:'',
 reality:'Hot chocolate cools toward room temperature — that follows a differential equation called Newton\'s cooling law. Doctors use these equations to figure out how a drug leaves your body over time. Scientists model animal populations and radioactive decay the exact same way.',
 formula:'dy/dt = ky  →  y = Ce^(kt)\nHalf-life: A = A₀(1/2)^(t/T½)\nCooling: dT/dt = −k(T − T_env)\n→  T(t) = T_env + (T₀−T_env)e^(−kt)\nLogistic: dP/dt = rP(1 − P/K)',
 method:'Separation of variables: move all y-terms (including dy) to one side and all t-terms (including dt) to the other, then integrate both sides. Always include the constant C and apply initial conditions to solve for C.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <line x1="14" y1="108" x2="246" y2="108" stroke="#444" stroke-width="1"/>
  <line x1="14" y1="10" x2="14" y2="112" stroke="#444" stroke-width="1"/>
  <path d="M20 100 Q60 98 100 80 Q140 55 180 32 Q200 22 240 16" fill="none" stroke="#7aabcf" stroke-width="2.5"/>
  <path d="M20 20 Q60 22 100 36 Q140 55 180 78 Q200 88 240 98" fill="none" stroke="#c07070" stroke-width="2.5"/>
  <text x="200" y="22" font-size="8.5" fill="#7aabcf">growth k&gt;0</text>
  <text x="200" y="92" font-size="8.5" fill="#c07070">decay k&lt;0</text>
  <text x="130" y="58" text-anchor="middle" font-size="8.5" fill="#c9a060" font-weight="700">y = Ce^(kt)</text>
  <text x="130" y="108" text-anchor="middle" font-size="8" fill="#8a8a8a">Initial condition C=y₀ when t=0</text>
 </svg>`,
 caption:'k>0 → exponential growth. k<0 → decay. Initial condition pins the curve at t=0.',
 steps:['Write the rate equation: dy/dt = f(y)·g(t).','Separate: dy/f(y) = g(t) dt.','Integrate both sides independently.','Solve for y explicitly (often involves e^x or ln).','Substitute the initial condition (t=0, y=y₀) to find the constant C.'],
 example:'Carbon-14 decay: dA/dt = −0.000121A. Separate: dA/A = −0.000121 dt. Integrate: ln|A| = −0.000121t+C. Exponentiate: A = A₀e^(−0.000121t). Half-life = ln(2)/0.000121 ≈ 5,730 years.'},

/* ── STATISTICS + DATA ─────────────────────────── */
{cat:'Statistics',tags:['data','finance','science'],
 title:'Descriptive Statistics, Distributions & Probability',
 theory:'',
 reality:'If your class takes a test, what is the average score and how spread out are the grades? Statistics helps doctors know if a medicine actually works, businesses understand customers, and scientists make sense of messy data. Probability tells you how likely things are.',
 formula:'Mean: μ = Σx/n\nVariance: σ² = Σ(x−μ)²/n\nStd dev: σ = √σ²\nz-score: z = (x−μ)/σ\nNormal: 68-95-99.7 rule\nP(A and B) = P(A)·P(B) if independent\nP(A or B) = P(A)+P(B)−P(A∩B)',
 method:'Five-number summary + boxplot: min, Q1, median, Q3, max. IQR = Q3−Q1. Outlier if x < Q1−1.5IQR or x > Q3+1.5IQR. This is the standard exploratory data analysis (EDA) protocol used in AP Statistics and data science.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <path d="M14 100 Q65 100 130 18 Q195 100 246 100" fill="rgba(122,171,207,.12)" stroke="#7aabcf" stroke-width="2"/>
  <line x1="130" y1="10" x2="130" y2="104" stroke="#c9a060" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="66" y1="68" x2="66" y2="104" stroke="#7ab060" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="194" y1="68" x2="194" y2="104" stroke="#7ab060" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="130" y="15" text-anchor="middle" font-size="8" fill="#c9a060">μ (mean)</text>
  <text x="66" y="116" text-anchor="middle" font-size="7.5" fill="#7ab060">μ−σ</text>
  <text x="194" y="116" text-anchor="middle" font-size="7.5" fill="#7ab060">μ+σ</text>
  <text x="130" y="64" text-anchor="middle" font-size="7.5" fill="#7aabcf">68%</text>
  <rect x="30" y="68" width="72" height="10" rx="3" fill="rgba(122,171,207,.2)" stroke="#7aabcf" stroke-width="1"/>
  <rect x="158" y="68" width="72" height="10" rx="3" fill="rgba(122,171,207,.2)" stroke="#7aabcf" stroke-width="1"/>
  <text x="130" y="108" text-anchor="middle" font-size="8" fill="#8a8a8a">68-95-99.7 rule · z-score = standard deviations from mean</text>
 </svg>`,
 caption:'Normal distribution: 68% within 1σ, 95% within 2σ, 99.7% within 3σ. z-score = distance in standard deviations.',
 steps:['Always plot data first — histogram, dotplot, or boxplot reveals shape, center, spread, and outliers.','Calculate mean for symmetric data; use median when the distribution is skewed or has outliers.','Use standard deviation for spread on bell-shaped data; use IQR for skewed data.','For probability: identify sample space, list favorable outcomes, apply addition/multiplication rules.','Check independence before using P(A)·P(B) — events must not influence each other.'],
 example:'Scores: 70,75,80,80,85,90,95. Mean=82.1. Median=80. Mode=80. Range=25. IQR=90−75=15. z-score for 95: (95−82.1)/8.4 ≈ 1.54 standard deviations above mean.'},

{cat:'Statistics',tags:['data','finance','engineering'],
 title:'Regression, Inference, Confidence & Hypothesis Testing',
 theory:'',
 reality:'Scientists tested a vaccine on 1,000 people. Did it actually work, or was it just random luck? Hypothesis testing answers that honestly. Regression predicts future house prices from past sales. Every published scientific study uses these tools to draw honest conclusions.',
 formula:'Lin. reg: ŷ = b₀ + b₁x\nr = correlation (−1 to +1)\nCI: x̄ ± z* · (σ/√n)\nMargin of error: E = z* · (σ/√n)\nHypothesis: H₀ vs Hₐ\nP-value < α → reject H₀\nt-stat: t = (x̄ − μ₀)/(s/√n)',
 method:'Four-step inference template (AP Statistics standard): State (H₀, Hₐ, α), Plan (identify test, check conditions), Do (calculate test statistic and p-value), Conclude (compare p-value to α, state in context).',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <line x1="20" y1="100" x2="240" y2="100" stroke="#444" stroke-width="1"/>
  <line x1="20" y1="10" x2="20" y2="104" stroke="#444" stroke-width="1"/>
  <circle cx="50" cy="85" r="3" fill="#7aabcf"/><circle cx="70" cy="80" r="3" fill="#7aabcf"/>
  <circle cx="90" cy="70" r="3" fill="#7aabcf"/><circle cx="110" cy="65" r="3" fill="#7aabcf"/>
  <circle cx="130" cy="55" r="3" fill="#7aabcf"/><circle cx="150" cy="48" r="3" fill="#7aabcf"/>
  <circle cx="170" cy="40" r="3" fill="#7aabcf"/><circle cx="190" cy="32" r="3" fill="#7aabcf"/>
  <line x1="40" y1="92" x2="200" y2="26" stroke="#c9a060" stroke-width="2"/>
  <text x="192" y="22" font-size="8" fill="#c9a060">ŷ=b₀+b₁x</text>
  <text x="22" y="24" font-size="7.5" fill="#7aabcf">r ≈ 0.98</text>
  <text x="22" y="36" font-size="7.5" fill="#7aabcf">strong positive</text>
  <text x="22" y="48" font-size="7.5" fill="#7aabcf">linear relation</text>
  <text x="130" y="116" text-anchor="middle" font-size="8" fill="#8a8a8a">SPDC: State · Plan · Do · Conclude</text>
 </svg>`,
 caption:'Regression line minimizes squared residuals. r near ±1 = strong linear relationship.',
 steps:['Make a scatterplot to visualize the relationship before calculating.','Compute the regression line; slope b₁ is the predicted change in y per unit change in x.','Examine residuals — if they show a pattern, the linear model is not the best fit.','For hypothesis tests: identify H₀ (no effect), Hₐ (direction of effect), compute test statistic, find p-value.','Conclude in context: "At α=0.05, we (do/do not) have sufficient evidence that ..."'],
 example:'CI for mean: n=36, x̄=50, σ=12, 95% CI. z*=1.96. E=1.96·(12/√36)=3.92. CI: (46.08, 53.92). Interpret: 95% confident population mean is between 46.08 and 53.92.'},

/* ── CHEMISTRY ─────────────────────────────────── */
{cat:'Chemistry',tags:['chemistry','science'],
 title:'Atomic Structure, Moles & Stoichiometry',
 theory:'',
 reality:'Everything you touch is made of atoms too tiny to see — one gram of carbon holds about 50 sextillion atoms. Chemists use moles to count atoms in amounts you can weigh on a scale. Stoichiometry is the recipe math that tells you exactly how much of each ingredient you need.',
 formula:'n = m / M  (moles = grams / molar mass)\nParticles = n × Nₐ  (Nₐ = 6.022×10²³)\nElectronic config: Aufbau, Pauli, Hund\nOxidation: gain e⁻ = reduced; lose e⁻ = oxidized\n% composition = (molar mass element / molar mass compound) × 100',
 method:'Mole map: Grams ÷ M → Moles × Nₐ → Particles. For reactions: moles of A × (mol ratio B/A) = moles of B. Always balance the equation first.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <defs><marker id="a2" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c9a060"/></marker></defs>
  <rect x="6" y="44" width="70" height="30" rx="8" fill="rgba(201,160,96,.15)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="41" y="57" text-anchor="middle" font-size="9" fill="#c9a060" font-weight="700">GRAMS</text>
  <text x="41" y="69" text-anchor="middle" font-size="8" fill="#d4b87a">÷ M (g/mol)</text>
  <line x1="78" y1="59" x2="96" y2="59" stroke="#c9a060" stroke-width="1.5" marker-end="url(#a2)"/>
  <rect x="97" y="44" width="66" height="30" rx="8" fill="rgba(122,171,207,.15)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="130" y="57" text-anchor="middle" font-size="9" fill="#7aabcf" font-weight="700">MOLES</text>
  <text x="130" y="69" text-anchor="middle" font-size="8" fill="#9ecef0">mol ratio</text>
  <line x1="165" y1="59" x2="183" y2="59" stroke="#c9a060" stroke-width="1.5" marker-end="url(#a2)"/>
  <rect x="184" y="44" width="70" height="30" rx="8" fill="rgba(122,176,96,.15)" stroke="#7ab060" stroke-width="1.5"/>
  <text x="219" y="57" text-anchor="middle" font-size="9" fill="#7ab060" font-weight="700">PARTICLES</text>
  <text x="219" y="69" text-anchor="middle" font-size="8" fill="#a0c888">× Nₐ</text>
  <text x="130" y="106" text-anchor="middle" font-size="9.5" fill="#c9a060" font-weight="700">Mole Map: Grams → Moles → Particles</text>
  <text x="130" y="118" text-anchor="middle" font-size="8" fill="#8a8a8a">Balance equation first → mole ratios from coefficients</text>
 </svg>`,
 caption:'Mole map: divide grams by molar mass to get moles, multiply by Avogadro for particles.',
 steps:['Balance the chemical equation — all atoms and charges must equal on both sides.','Convert given quantities to moles using n = m/M.','Use the balanced equation coefficient ratio to convert moles of one substance to another.','Convert product moles to grams, liters, or particles as needed.','For limiting reagent: find moles of each reactant, divide by its coefficient, choose the smaller result.'],
 example:'How many grams of H₂O from 4g H₂ + excess O₂? n(H₂)=4/2=2 mol. H₂:H₂O ratio=1:1 → 2 mol H₂O. Mass=2×18=36 g H₂O.'},

{cat:'Chemistry',tags:['chemistry','daily','science'],
 title:'Solutions, Gas Laws, pH & Equilibrium',
 theory:'',
 reality:'Soda is CO2 gas dissolved under pressure in liquid. Open the can and pressure drops, so bubbles escape — that is Boyle\'s Law! Your stomach acid has a pH of about 2. Scuba tanks use gas laws so divers always know exactly how much air they have left.',
 formula:'Molarity M = n/V (mol/L)\nDilution: M₁V₁ = M₂V₂\nIdeal gas: PV = nRT  (R=0.0821 L·atm/mol·K)\nCombined: P₁V₁/T₁ = P₂V₂/T₂\npH = −log[H⁺]   pOH = −log[OH⁻]\npH + pOH = 14 (at 25°C)\nKa = [H⁺][A⁻]/[HA]\nK = [products]/[reactants]',
 method:'Le Chatelier\'s principle: a system in equilibrium shifts to oppose any change imposed on it. Increase reactant → shift right. Increase pressure → shift to fewer moles of gas. Increase temperature → endothermic reaction shifts right.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="14" width="108" height="46" rx="8" fill="rgba(122,176,96,.10)" stroke="#7ab060" stroke-width="1.5"/>
  <text x="64" y="28" text-anchor="middle" font-size="8.5" fill="#7ab060" font-weight="700">pH Scale</text>
  <rect x="18" y="34" width="92" height="18" rx="4" fill="none" stroke="#8a8a8a" stroke-width="1"/>
  <rect x="18" y="34" width="46" height="18" rx="4" fill="rgba(192,112,112,.3)"/>
  <rect x="64" y="34" width="46" height="18" rx="4" fill="rgba(90,176,216,.2)"/>
  <text x="41" y="47" text-anchor="middle" font-size="8" fill="#c07070">acidic 0-6</text>
  <text x="87" y="47" text-anchor="middle" font-size="8" fill="#7aabcf">basic 8-14</text>
  <text x="64" y="68" text-anchor="middle" font-size="8" fill="#888">7 = neutral</text>
  <rect x="138" y="14" width="114" height="86" rx="8" fill="rgba(201,160,96,.08)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="195" y="28" text-anchor="middle" font-size="8.5" fill="#c9a060" font-weight="700">Equilibrium Shifts</text>
  <text x="148" y="44" font-size="8" fill="#d4b87a">Add reactant → shift right →</text>
  <text x="148" y="56" font-size="8" fill="#d4b87a">Remove product → shift right →</text>
  <text x="148" y="68" font-size="8" fill="#d4b87a">↑ Pressure → fewer gas moles</text>
  <text x="148" y="80" font-size="8" fill="#d4b87a">↑ Temp → endothermic side</text>
  <text x="195" y="96" text-anchor="middle" font-size="7.5" fill="#c9a060">Le Chatelier's Principle</text>
 </svg>`,
 caption:'pH scale: 0–6 acidic, 7 neutral, 8–14 basic. Equilibrium shifts to oppose changes (Le Chatelier).',
 steps:['For gas law problems: identify which variables are changing and which are constant to pick the right form.','Convert temperature to Kelvin (K = °C + 273.15) before any gas law calculation.','For pH: strong acids/bases fully dissociate; weak acids/bases use Ka/Kb and ICE tables.','For molarity: M = moles / liters. For dilution: moles are conserved → M₁V₁ = M₂V₂.','Apply Le Chatelier\'s principle by identifying the direction that relieves the stress.'],
 example:'PV=nRT: find V for 2 mol at 25°C, 1 atm. T=298 K. V=nRT/P=2(0.0821)(298)/1=48.9 L. pH of 0.01 M HCl: pH=−log(0.01)=2.'},

{cat:'Chemistry',tags:['chemistry','engineering','physics'],
 title:'Thermochemistry, Kinetics & Electrochemistry',
 theory:'',
 reality:'A hand warmer gets hot because a chemical reaction releases energy — thermochemistry! Your phone battery works through electrochemistry: chemicals push electrons through a circuit to power your screen. Car engines convert fuel heat into motion using the same principles.',
 formula:'q = mcΔT  (heat capacity)\nΔH°rxn = ΣΔH°f(products) − ΣΔH°f(reactants)\nΔG = ΔH − TΔS  (spontaneity)\nΔG < 0 → spontaneous\nRate = k[A]^m[B]^n\nt½ = ln(2)/k  (1st order)\nE°cell = E°cathode − E°anode\nΔG° = −nFE°',
 method:'Hess\'s Law: combine reaction equations algebraically to get ΔH for the target reaction. Reverse any reaction → change sign of ΔH. Multiply any reaction → multiply ΔH. Cell potential: always cathode minus anode (reduction − oxidation).',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="8" y="10" width="114" height="96" rx="8" fill="rgba(122,171,207,.08)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="65" y="24" text-anchor="middle" font-size="8.5" fill="#7aabcf" font-weight="700">Galvanic Cell</text>
  <rect x="18" y="32" width="38" height="58" rx="5" fill="rgba(192,112,112,.12)" stroke="#c07070" stroke-width="1"/>
  <text x="37" y="56" text-anchor="middle" font-size="7.5" fill="#c07070">Anode</text>
  <text x="37" y="68" text-anchor="middle" font-size="7.5" fill="#c07070">oxidation</text>
  <text x="37" y="80" text-anchor="middle" font-size="7.5" fill="#c07070">− electrode</text>
  <rect x="84" y="32" width="28" height="58" rx="5" fill="rgba(122,176,96,.12)" stroke="#7ab060" stroke-width="1"/>
  <text x="98" y="56" text-anchor="middle" font-size="7.5" fill="#7ab060">Cathode</text>
  <text x="98" y="68" text-anchor="middle" font-size="7.5" fill="#7ab060">reduction</text>
  <text x="98" y="80" text-anchor="middle" font-size="7.5" fill="#7ab060">+ electrode</text>
  <path d="M37 32 Q65 12 98 32" fill="none" stroke="#c9a060" stroke-width="1.5"/>
  <text x="65" y="16" text-anchor="middle" font-size="7.5" fill="#c9a060">e⁻ flow →</text>
  <rect x="132" y="10" width="120" height="96" rx="8" fill="rgba(201,160,96,.08)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="192" y="24" text-anchor="middle" font-size="8.5" fill="#c9a060" font-weight="700">Hess's Law</text>
  <text x="140" y="40" font-size="7.5" fill="#d4b87a">A → B  ΔH₁</text>
  <text x="140" y="54" font-size="7.5" fill="#d4b87a">B → C  ΔH₂</text>
  <line x1="138" y1="60" x2="248" y2="60" stroke="#c9a060" stroke-width="1"/>
  <text x="140" y="74" font-size="7.5" fill="#d4b87a">A → C  ΔH=ΔH₁+ΔH₂</text>
  <text x="192" y="90" text-anchor="middle" font-size="7.5" fill="#c9a060">Reverse rxn → flip sign</text>
  <text x="192" y="102" text-anchor="middle" font-size="7.5" fill="#c9a060">Scale rxn → scale ΔH</text>
 </svg>`,
 caption:'Galvanic cell: electrons flow anode→cathode. Hess\'s law: algebraically combine reactions for ΔH.',
 steps:['For q=mcΔT: m in grams, c in J/(g·°C), ΔT = T_final − T_initial (sign matters: + absorbs heat).','For ΔH°rxn: sum products\' formation enthalpies, subtract reactants\' (always products minus reactants).','For ΔG: if ΔH<0 and ΔS>0, always spontaneous. If ΔH>0 and ΔS<0, never spontaneous.','For kinetics: use ICE table (Initial, Change, Equilibrium) for equilibrium concentration problems.','For electrochemistry: E°cell = E°cathode − E°anode. Positive E°cell means spontaneous reaction.'],
 example:'E°cell for Zn/Cu cell: E°(Cu²⁺/Cu)=+0.34 V (cathode), E°(Zn²⁺/Zn)=−0.76 V (anode). E°cell=0.34−(−0.76)=+1.10 V → spontaneous.'},

/* ── PHYSICS ────────────────────────────────────── */
{cat:'Physics',tags:['physics','engineering'],
 title:'Classical Mechanics: Kinematics, Forces & Energy',
 theory:'',
 reality:'How fast does a falling object hit the ground? How much braking force stops a car safely? NASA uses these exact equations to land rockets. Car makers use them to design safer airbags. Every sport — throwing, jumping, kicking — follows these laws of motion.',
 formula:'v = v₀ + at\nx = x₀ + v₀t + ½at²\nv² = v₀² + 2a·Δx\nF = ma\nW = F·d·cosθ\nKE = ½mv²\nPE = mgh\nConservation: KE+PE = constant\np = mv  (momentum)\nJ = FΔt = Δp  (impulse)',
 method:'Free-body diagram (FBD) protocol: draw the object as a dot, add every force vector with a label, write ΣF=ma for x and y separately. This systematic approach prevents missing forces and is required on AP FRQs.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="90" y="54" width="80" height="40" rx="6" fill="rgba(122,171,207,.15)" stroke="#7aabcf" stroke-width="2"/>
  <text x="130" y="78" text-anchor="middle" font-size="9" fill="#7aabcf">OBJECT</text>
  <defs><marker id="fv" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#c9a060"/></marker></defs>
  <line x1="130" y1="54" x2="130" y2="20" stroke="#c9a060" stroke-width="2.5" marker-end="url(#fv)"/>
  <text x="134" y="38" font-size="8" fill="#c9a060">N (normal)</text>
  <line x1="130" y1="94" x2="130" y2="116" stroke="#c07070" stroke-width="2.5" marker-end="url(#fv)"/>
  <text x="134" y="112" font-size="8" fill="#c07070">mg (weight)</text>
  <line x1="90" y1="74" x2="54" y2="74" stroke="#7ab060" stroke-width="2.5" marker-end="url(#fv)"/>
  <text x="36" y="70" font-size="8" fill="#7ab060">f (friction)</text>
  <line x1="170" y1="74" x2="210" y2="74" stroke="#c9a060" stroke-width="2.5" marker-end="url(#fv)"/>
  <text x="212" y="78" font-size="8" fill="#c9a060">F (applied)</text>
  <text x="130" y="116" text-anchor="middle" font-size="0" fill="#888">.</text>
  <text x="20" y="14" font-size="8.5" fill="#8a8a8a">FBD: draw all forces, then ΣF=ma</text>
 </svg>`,
 caption:'Free-body diagram: every force on the object as a vector. ΣF=ma per axis separately.',
 steps:['Draw the FBD: object as dot, every force labeled with direction.','Set up x and y equations: ΣFₓ = maₓ and ΣFy = may.','For energy problems: identify initial and final states, set up KE+PE_initial = KE+PE_final (no friction) or include work by friction.','For projectile motion: horizontal (constant velocity) and vertical (constant g=9.8 m/s²) are independent.','For impulse-momentum: J = FΔt = Δp. For elastic collisions, both momentum and KE are conserved.'],
 example:'Block, m=5 kg, pushed by F=20 N on frictionless surface: a=F/m=20/5=4 m/s². After 3 s: v=0+4(3)=12 m/s. KE=½(5)(144)=360 J. FBD: N and mg cancel vertically, F causes horizontal acceleration.'},

{cat:'Physics',tags:['physics','engineering','chemistry'],
 title:'Electricity, Magnetism, Waves & Thermodynamics',
 theory:'',
 reality:'Every electronic device runs on circuits. Your phone charger controls voltage and current. MRI machines in hospitals use magnetic fields to see inside your body without surgery. Solar panels convert light waves into electricity for your home. This physics powers the modern world.',
 formula:'V = IR  (Ohm\'s Law)\nP = IV = I²R = V²/R\nSeries: R_total = ΣRᵢ\nParallel: 1/R = Σ(1/Rᵢ)\nCoulomb: F = kq₁q₂/r²\nE field: E = kQ/r²\nWave: v = fλ\nSnell: n₁sinθ₁ = n₂sinθ₂\nPV = nRT,  Q = mcΔT',
 method:'Kirchhoff\'s Laws: KCL — current in = current out at any node (charge conservation). KVL — sum of voltage drops around any closed loop = 0 (energy conservation). Use these systematically to solve any circuit.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="8" y="10" width="120" height="96" rx="8" fill="rgba(122,171,207,.08)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="68" y="24" text-anchor="middle" font-size="8.5" fill="#7aabcf" font-weight="700">Series Circuit</text>
  <line x1="30" y1="50" x2="60" y2="50" stroke="#7aabcf" stroke-width="2"/>
  <rect x="60" y="42" width="24" height="16" rx="3" fill="none" stroke="#c9a060" stroke-width="2"/>
  <text x="72" y="53" text-anchor="middle" font-size="8" fill="#c9a060">R₁</text>
  <line x1="84" y1="50" x2="100" y2="50" stroke="#7aabcf" stroke-width="2"/>
  <rect x="100" y="42" width="24" height="16" rx="3" fill="none" stroke="#c9a060" stroke-width="2"/>
  <text x="112" y="53" text-anchor="middle" font-size="8" fill="#c9a060">R₂</text>
  <line x1="30" y1="50" x2="30" y2="80" stroke="#7aabcf" stroke-width="2"/>
  <line x1="124" y1="50" x2="124" y2="80" stroke="#7aabcf" stroke-width="2"/>
  <circle cx="50" cy="80" r="12" fill="none" stroke="#7ab060" stroke-width="2"/>
  <text x="50" y="84" text-anchor="middle" font-size="9" fill="#7ab060">V</text>
  <line x1="30" y1="80" x2="38" y2="80" stroke="#7aabcf" stroke-width="2"/>
  <line x1="62" y1="80" x2="124" y2="80" stroke="#7aabcf" stroke-width="2"/>
  <text x="68" y="100" text-anchor="middle" font-size="8" fill="#7aabcf">same I, V splits</text>
  <rect x="140" y="10" width="112" height="96" rx="8" fill="rgba(201,160,96,.08)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="196" y="24" text-anchor="middle" font-size="8.5" fill="#c9a060" font-weight="700">Wave Properties</text>
  <path d="M148 60 Q162 38 176 60 Q190 82 204 60 Q218 38 232 60" fill="none" stroke="#c9a060" stroke-width="2"/>
  <line x1="148" y1="60" x2="232" y2="60" stroke="#888" stroke-width="1"/>
  <line x1="162" y1="38" x2="190" y2="38" stroke="#7ab060" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="176" y="34" text-anchor="middle" font-size="7" fill="#7ab060">λ (wavelength)</text>
  <text x="196" y="88" text-anchor="middle" font-size="8" fill="#c9a060">v = fλ</text>
  <text x="196" y="100" text-anchor="middle" font-size="7.5" fill="#c9a060">speed=freq×wavelength</text>
 </svg>`,
 caption:'Series circuit: same current, voltage splits. Parallel: same voltage, current splits. Wave: v=fλ.',
 steps:['For circuits: identify series vs parallel components. Series: same current, add voltages. Parallel: same voltage, add currents.','Use Kirchhoff\'s KVL to write voltage loop equations and KCL for node current equations.','For Coulomb\'s law: F = kq₁q₂/r² — force and electric field both follow inverse-square law.','For waves: know v=fλ. For light in media, use Snell\'s law with refractive indices.','For thermodynamics: track Q (heat added +, removed −), W (work done by system), and ΔU = Q − W.'],
 example:'V=12 V, R₁=3 Ω, R₂=6 Ω in series: R_total=9 Ω. I=12/9=1.33 A. V₁=1.33×3=4 V, V₂=1.33×6=8 V. Check: 4+8=12 ✓'},

/* ── FINANCE ────────────────────────────────────── */
{cat:'Finance & Commerce',tags:['finance','daily'],
 title:'Interest, Compound Growth & Loan Payments',
 theory:'',
 reality:'Save $100 at 5% interest and it doubles to $200 in about 14 years — without doing anything extra! But credit card debt grows the same way against you. Understanding compound interest is one of the most powerful money skills you can ever learn.',
 formula:'Simple: I = Prt\nCompound: A = P(1+r/n)^(nt)\nContinuous: A = Pe^(rt)\nPV = FV / (1+r)^t\nLoan PMT = P·r(1+r)^n / ((1+r)^n − 1)\nRule of 72: years to double ≈ 72/r%',
 method:'Rule of 72: divide 72 by the annual interest rate to estimate years to double. Quick, powerful mental math for comparing investment options — no calculator needed.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <line x1="14" y1="108" x2="246" y2="108" stroke="#444" stroke-width="1"/>
  <line x1="14" y1="10" x2="14" y2="112" stroke="#444" stroke-width="1"/>
  <path d="M20 100 Q60 98 100 88 Q140 72 170 50 Q200 28 230 14" fill="none" stroke="#7ab060" stroke-width="2.5"/>
  <path d="M20 100 Q100 96 160 80 Q200 68 230 50" fill="none" stroke="#7aabcf" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="190" y="20" font-size="8" fill="#7ab060">Compound</text>
  <text x="190" y="46" font-size="8" fill="#7aabcf">Simple</text>
  <text x="60" y="80" font-size="8" fill="#c9a060">$P</text>
  <text x="228" y="11" font-size="8" fill="#7ab060">$A</text>
  <text x="130" y="108" text-anchor="middle" font-size="8" fill="#8a8a8a">Compound grows faster — interest earns interest</text>
  <text x="20" y="20" font-size="8" fill="#c9a060">Rule 72: 72/rate = years to double</text>
 </svg>`,
 caption:'Compound interest accelerates over time — interest earns more interest. Simple interest is linear.',
 steps:['Convert APR to period rate: monthly rate = APR / 12.','For compound interest: A = P(1+r/n)^(nt) — n is compounding periods per year.','For continuous compounding: A = Pe^(rt) — use this when the problem says "compounded continuously."','For present value: PV = FV/(1+r)^t — reverse-engineers what an investment is worth today.','Rule of 72: years to double ≈ 72/r. At 6%, money doubles in ≈12 years.'],
 example:'$1000 at 6% compounded monthly for 5 years: r=0.06/12=0.005, n=60. A=1000(1.005)^60≈$1348.85. Rule of 72: doubles in 72/6=12 years.'},

/* ── ENGINEERING ────────────────────────────────── */
{cat:'Engineering & Statics',tags:['engineering','physics'],
 title:'Statics, Stress, Strain & Safety Factors',
 theory:'',
 reality:'Why does a bridge not collapse when thousands of cars cross it? Engineers calculate every force on every beam to ensure nothing breaks. A safety factor means the bridge is built 3 to 5 times stronger than the heaviest load it will ever carry.',
 formula:'Equilibrium: ΣF = 0,  Στ = 0\nTorque: τ = r × F  (or rF sinθ)\nStress: σ = F/A  (Pa = N/m²)\nStrain: ε = ΔL/L  (dimensionless)\nYoung\'s modulus: E = σ/ε\nSafety factor: SF = capacity / load\nHooke\'s Law: F = kx  (springs)',
 method:'Method of sections for trusses: cut through the truss, isolate one portion, and apply 3 equilibrium equations to find internal forces. Far faster than the method of joints for internal members.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="10" y="48" width="190" height="22" rx="4" fill="rgba(122,171,207,.12)" stroke="#7aabcf" stroke-width="2"/>
  <text x="105" y="63" text-anchor="middle" font-size="9" fill="#7aabcf">BEAM (ΣF=0, Στ=0)</text>
  <line x1="20" y1="70" x2="20" y2="95" stroke="#c9a060" stroke-width="3"/>
  <line x1="14" y1="95" x2="26" y2="95" stroke="#c9a060" stroke-width="3"/>
  <line x1="190" y1="70" x2="190" y2="95" stroke="#c9a060" stroke-width="3"/>
  <line x1="184" y1="95" x2="196" y2="95" stroke="#c9a060" stroke-width="3"/>
  <text x="22" y="108" text-anchor="middle" font-size="8" fill="#c9a060">R₁</text>
  <text x="190" y="108" text-anchor="middle" font-size="8" fill="#c9a060">R₂</text>
  <line x1="100" y1="10" x2="100" y2="48" stroke="#c07070" stroke-width="2.5"/>
  <text x="104" y="30" font-size="8" fill="#c07070">F (load)</text>
  <rect x="214" y="14" width="40" height="88" rx="4" fill="rgba(201,160,96,.10)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="234" y="28" text-anchor="middle" font-size="8" fill="#c9a060">σ=F/A</text>
  <text x="234" y="44" text-anchor="middle" font-size="8" fill="#d4b87a">stress</text>
  <text x="234" y="62" text-anchor="middle" font-size="8" fill="#c9a060">ε=ΔL/L</text>
  <text x="234" y="78" text-anchor="middle" font-size="8" fill="#d4b87a">strain</text>
  <text x="234" y="96" text-anchor="middle" font-size="8" fill="#c9a060">E=σ/ε</text>
 </svg>`,
 caption:'Beam in static equilibrium: reactions R₁+R₂ must balance load F. Stress=F/A; strain=ΔL/L.',
 steps:['Draw the free-body diagram of the structure with all applied loads and support reactions.','Write ΣFx=0, ΣFy=0, and Στ=0 (choose the torque pivot to eliminate as many unknowns as possible).','Compute stress σ=F/A (force divided by cross-sectional area).','Compute strain ε=ΔL/L (change in length divided by original length).','Safety factor = material strength / calculated stress — SF should be ≥ 2 for most structural applications.'],
 example:'Beam with load F=1000 N at center, span=4 m. Take torque about R₁: R₂×4=1000×2 → R₂=500 N. Then R₁=500 N. Column cross-section A=0.01 m², σ=1000/0.01=100,000 Pa = 100 kPa.'},

/* ── CONVERSIONS ────────────────────────────────── */
{cat:'Unit Conversions',tags:['conversion','daily','chemistry','engineering'],
 title:'Unit Conversions: Factor-Label Method',
 theory:'',
 reality:'A recipe uses grams but your scale shows ounces. A speed sign says km/h but your car shows mph. Doctors convert patient weight from pounds to kilograms before calculating medicine doses. Unit conversion is used in cooking, travel, science, and medicine every day.',
 formula:'1 in = 2.54 cm    1 ft = 12 in\n1 mi = 5280 ft = 1.609 km\n1 m = 100 cm = 1000 mm\n1 L = 1000 mL = 1 dm³\n1 kg = 1000 g    1 lb ≈ 453.6 g\n1 atm = 101,325 Pa    1 cal = 4.184 J\nmph × 0.44704 = m/s\n°C × 9/5 + 32 = °F    K = °C + 273.15',
 method:'Factor-label method (dimensional analysis): write starting value × (wanted unit / unwanted unit). Chain conversions so each step cancels the previous unit. Check: if units don\'t cancel to give wanted units, the setup is wrong.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="8" y="24" width="72" height="30" rx="6" fill="rgba(122,171,207,.15)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="44" y="37" text-anchor="middle" font-size="8.5" fill="#7aabcf" font-weight="700">Start value</text>
  <text x="44" y="49" text-anchor="middle" font-size="8" fill="#9ecef0">unit₁</text>
  <text x="84" y="42" text-anchor="middle" font-size="12" fill="#555">×</text>
  <rect x="90" y="14" width="72" height="52" rx="6" fill="rgba(201,160,96,.12)" stroke="#c9a060" stroke-width="1.5"/>
  <line x1="96" y1="39" x2="156" y2="39" stroke="#c9a060" stroke-width="1"/>
  <text x="123" y="32" text-anchor="middle" font-size="8" fill="#d4b87a">unit₂</text>
  <text x="123" y="52" text-anchor="middle" font-size="8.5" fill="#c9a060">unit₁</text>
  <text x="123" y="62" text-anchor="middle" font-size="7" fill="#c9a060">cancel ↑↓</text>
  <text x="167" y="42" text-anchor="middle" font-size="12" fill="#555">=</text>
  <rect x="176" y="24" width="76" height="30" rx="6" fill="rgba(122,176,96,.15)" stroke="#7ab060" stroke-width="1.5"/>
  <text x="214" y="37" text-anchor="middle" font-size="8.5" fill="#7ab060" font-weight="700">Result</text>
  <text x="214" y="49" text-anchor="middle" font-size="8" fill="#a0c888">unit₂</text>
  <text x="130" y="86" text-anchor="middle" font-size="9" fill="#c9a060">60 mi/hr × (5280 ft/mi) × (1 hr/3600 s) = 88 ft/s</text>
  <text x="130" y="100" text-anchor="middle" font-size="7.5" fill="#888">Units must cancel to leave only the desired unit</text>
  <text x="130" y="114" text-anchor="middle" font-size="7.5" fill="#888">Temperature conversions use formulas, not just ratios</text>
 </svg>`,
 caption:'Write start value × conversion fractions. Unwanted units cancel. Only desired unit remains.',
 steps:['Write the starting value and its unit.','Write the conversion fraction: wanted unit on top, unit to cancel on the bottom.','Chain as many fractions as needed — each step cancels the previous unit.','Multiply all numerator values together, multiply all denominator values, then divide.','For temperature: use formula (not ratio) because the scales have different zero points.'],
 example:'Convert 60 mph to m/s: 60 mi/hr × (1609 m/mi) × (1 hr/3600 s) = 96,540/3600 = 26.8 m/s. Check: 60 mph is highway speed; 26.8 m/s is reasonable ✓'},

/* ── DAILY USE ──────────────────────────────────── */
{cat:'Everyday Math',tags:['daily','finance','conversion'],
 title:'Everyday Math: Scaling, Rates, Bills & Estimates',
 theory:'',
 reality:'Is the big cereal box actually cheaper per ounce? How long will your road trip take? How much tip should you leave? Everyday math lets you check prices, plan trips, split bills, and make smart decisions without needing a calculator.',
 formula:'Unit price = cost / quantity\nFuel cost = (distance / mpg) × price/gallon\nElectric cost = kWh × rate\nRecipe scale = new servings / original × amount\nTip = bill × tip%\nPaycheck net = gross − taxes − deductions',
 method:'Proportional reasoning: if the rate or ratio is known, scale by multiplying. Never scale by adding. Cross-multiply for missing value in a proportion: a/b = c/x → x = bc/a.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="8" y="10" width="116" height="96" rx="8" fill="rgba(122,176,96,.08)" stroke="#7ab060" stroke-width="1.5"/>
  <text x="66" y="26" text-anchor="middle" font-size="8.5" fill="#7ab060" font-weight="700">Unit Price</text>
  <text x="66" y="42" text-anchor="middle" font-size="9" fill="#a0c888">Brand A: $2.40 / 16oz</text>
  <text x="66" y="56" text-anchor="middle" font-size="8.5" fill="#a0c888">= $0.15/oz</text>
  <text x="66" y="72" text-anchor="middle" font-size="9" fill="#a0c888">Brand B: $3.60 / 32oz</text>
  <text x="66" y="86" text-anchor="middle" font-size="8.5" fill="#7ab060">= $0.1125/oz ✓</text>
  <text x="66" y="100" text-anchor="middle" font-size="8" fill="#888">B is cheaper per unit</text>
  <rect x="140" y="10" width="112" height="96" rx="8" fill="rgba(201,160,96,.08)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="196" y="26" text-anchor="middle" font-size="8.5" fill="#c9a060" font-weight="700">Fuel Cost</text>
  <text x="196" y="46" text-anchor="middle" font-size="9" fill="#d4b87a">300 miles at 30 mpg</text>
  <text x="196" y="60" text-anchor="middle" font-size="9" fill="#d4b87a">= 10 gallons needed</text>
  <text x="196" y="76" text-anchor="middle" font-size="9" fill="#d4b87a">× $3.50/gal</text>
  <text x="196" y="90" text-anchor="middle" font-size="9" fill="#c9a060" font-weight="700">= $35.00</text>
  <text x="196" y="104" text-anchor="middle" font-size="8" fill="#888">distance ÷ mpg × price</text>
 </svg>`,
 caption:'Unit price comparison: divide total cost by quantity. Fuel: divide miles by mpg for gallons, then multiply by price.',
 steps:['Define the rate or ratio using the correct units (cost per ounce, miles per gallon).','For scaling: multiply the rate by the new quantity — never add rates together.','For proportion problems: write a/b = c/x and cross-multiply to solve for x.','For electric bills: convert wattage to kilowatts (÷1000), multiply by hours used to get kWh, then multiply by rate.','Estimate before calculating: if the answer is far from your estimate, recheck your setup.'],
 example:'Scale a recipe from 4 to 10 servings: scale factor = 10/4 = 2.5. If original uses 2 cups flour, new amount = 2×2.5 = 5 cups. Electric: 100W bulb × 8 hrs = 0.8 kWh × $0.12/kWh = $0.096/day ≈ $2.88/month.'}
,

/* ── REAL NUMBERS & NUMBER SETS ─────────────────── */
{cat:'Algebra',tags:['arithmetic','algebra','math'],
 title:'Real Number Sets, Intervals & Absolute Value',
 theory:'',
 reality:'Temperature goes above or below zero — absolute value tells you how far from zero without worrying about direction. A thermostat keeps temperature within an interval like 68 to 72 degrees. Programmers use intervals to set valid ranges so apps do not crash from bad input.',
 formula:'ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ ⊂ ℂ\n|x| = x if x≥0; −x if x<0\n|x| < a  ↔  −a < x < a\n|x| > a  ↔  x < −a  or  x > a\nOpen: (a,b)  Closed: [a,b]\nHalf-open: [a,b)  or  (a,b]\nUnbounded: (−∞,a] or [b,+∞)',
 method:'Absolute value equations: split into two cases (positive and negative). Absolute value inequalities: |x|<a → single interval; |x|>a → union of two intervals. Always check solutions satisfy original equation.',
 svg:`<svg viewBox="0 0 260 120" xmlns="http://www.w3.org/2000/svg">
  <rect x="4" y="8" width="252" height="104" rx="8" fill="rgba(90,176,216,.06)" stroke="#5ab0d8" stroke-width="1"/>
  <rect x="12" y="16" width="236" height="88" rx="7" fill="rgba(122,171,207,.08)" stroke="#7aabcf" stroke-width="1"/>
  <rect x="22" y="24" width="216" height="72" rx="6" fill="rgba(201,160,96,.08)" stroke="#c9a060" stroke-width="1"/>
  <rect x="34" y="32" width="192" height="56" rx="5" fill="rgba(122,176,96,.10)" stroke="#7ab060" stroke-width="1"/>
  <rect x="48" y="40" width="164" height="40" rx="4" fill="rgba(192,112,112,.10)" stroke="#c07070" stroke-width="1"/>
  <text x="62" y="64" text-anchor="middle" font-size="9.5" fill="#c07070" font-weight="700">ℕ ℤ</text>
  <text x="62" y="74" text-anchor="middle" font-size="7.5" fill="#c07070">integers</text>
  <text x="130" y="58" text-anchor="middle" font-size="9" fill="#7ab060" font-weight="700">ℚ  rationals</text>
  <text x="195" y="52" text-anchor="middle" font-size="9" fill="#c9a060" font-weight="700">ℝ\irrational</text>
  <text x="220" y="28" text-anchor="middle" font-size="9" fill="#7aabcf">ℝ reals</text>
  <text x="238" y="16" text-anchor="middle" font-size="9" fill="#5ab0d8">ℂ</text>
  <line x1="4" y1="100" x2="256" y2="100" stroke="#7aabcf" stroke-width="2"/>
  <line x1="80" y1="96" x2="80" y2="104" stroke="#c9a060" stroke-width="2"/>
  <line x1="180" y1="96" x2="180" y2="104" stroke="#c9a060" stroke-width="2"/>
  <circle cx="80" cy="100" r="4" fill="none" stroke="#c9a060" stroke-width="2"/>
  <circle cx="180" cy="100" r="4" fill="#c9a060"/>
  <text x="80" y="116" text-anchor="middle" font-size="8" fill="#c9a060">a open (</text>
  <text x="180" y="116" text-anchor="middle" font-size="8" fill="#c9a060">b closed ]</text>
 </svg>`,
 caption:'Number sets nest inside each other. Open circle = excluded endpoint. Filled circle = included endpoint.',
 steps:['Identify which number set a value belongs to: check divisibility (ℤ), ratio form (ℚ), or irrationality (ℝ\\ℚ).','For |ax+b|=c: set ax+b=c AND ax+b=−c; solve both; check both solutions.','For |x|<a (a>0): rewrite as −a<x<a; solution is a single interval (a,b).','For |x|>a: rewrite as x<−a OR x>a; solution is a union of two rays.','Write solution sets using interval notation: use ( ) for strict inequalities, [ ] for ≤ or ≥.'],
 example:'Solve |2x−3|≤5: −5≤2x−3≤5 → −2≤2x≤8 → −1≤x≤4. Solution: [−1,4]. Check endpoints: |2(−1)−3|=5 ✓, |2(4)−3|=5 ✓'},

/* ── POLYNOMIALS & ALGEBRAIC FRACTIONS ───────────── */
{cat:'Algebra',tags:['algebra','math','calculus'],
 title:'Polynomial Operations, Division & Remainder Theorem',
 theory:'',
 reality:'Engineers model the bending strength of a beam with polynomial equations. Economists model supply and demand curves the same way. Polynomial division simplifies complex expressions in calculators. It is the algebra behind computer graphics and physics simulations.',
 formula:'Division algorithm: P(x) = Q(x)·D(x) + R(x)\nRemainder Theorem: P(a) = remainder when P÷(x−a)\nFactor Theorem: (x−a) is a factor ↔ P(a)=0\nNewton binomial: (a+b)ⁿ = Σ C(n,k)·aⁿ⁻ᵏ·bᵏ\n(a+b)² = a²+2ab+b²\n(a−b)² = a²−2ab+b²\n(a+b)(a−b) = a²−b²\n(a±b)³ = a³±3a²b+3ab²±b³',
 method:'Ruffini\'s Rule (synthetic division): for divisor (x−a), write a and the coefficients; bring down the first, multiply by a, add — faster than full polynomial long division for linear divisors.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <text x="130" y="13" text-anchor="middle" font-size="9" fill="#7aabcf" font-weight="700">P(x)=2x³−3x²+x−5 ÷ (x−2), Ruffini</text>
  <rect x="4" y="18" width="252" height="56" rx="7" fill="rgba(122,171,207,.07)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="22" y="36" font-size="9.5" fill="#c9a060" font-weight="700">a=2 |</text>
  <text x="72"  y="36" text-anchor="middle" font-size="10" fill="#9ecef0" font-family="monospace">2</text>
  <text x="102" y="36" text-anchor="middle" font-size="10" fill="#9ecef0" font-family="monospace">-3</text>
  <text x="132" y="36" text-anchor="middle" font-size="10" fill="#9ecef0" font-family="monospace">1</text>
  <text x="162" y="36" text-anchor="middle" font-size="10" fill="#9ecef0" font-family="monospace">-5</text>
  <line x1="58" y1="40" x2="180" y2="40" stroke="#7aabcf" stroke-width="1"/>
  <text x="102" y="52" text-anchor="middle" font-size="9" fill="#c9a060" font-family="monospace">+4</text>
  <text x="132" y="52" text-anchor="middle" font-size="9" fill="#c9a060" font-family="monospace">+2</text>
  <text x="162" y="52" text-anchor="middle" font-size="9" fill="#c9a060" font-family="monospace">+6</text>
  <line x1="58" y1="56" x2="180" y2="56" stroke="#7aabcf" stroke-width="1"/>
  <text x="72"  y="68" text-anchor="middle" font-size="10" fill="#7ab060" font-family="monospace" font-weight="700">2</text>
  <text x="102" y="68" text-anchor="middle" font-size="10" fill="#7ab060" font-family="monospace" font-weight="700">1</text>
  <text x="132" y="68" text-anchor="middle" font-size="10" fill="#7ab060" font-family="monospace" font-weight="700">3</text>
  <text x="162" y="68" text-anchor="middle" font-size="10" fill="#c07070" font-family="monospace" font-weight="700">1</text>
  <text x="72"  y="79" text-anchor="middle" font-size="7.5" fill="#7ab060">x²</text>
  <text x="102" y="79" text-anchor="middle" font-size="7.5" fill="#7ab060">x</text>
  <text x="132" y="79" text-anchor="middle" font-size="7.5" fill="#7ab060">+3</text>
  <text x="162" y="79" text-anchor="middle" font-size="7.5" fill="#c07070">R=1</text>
  <text x="130" y="97" text-anchor="middle" font-size="8.5" fill="#c9a060">P(2)=1 (Remainder Theorem check)</text>
  <text x="130" y="110" text-anchor="middle" font-size="8" fill="#888">If R=0: (x−2) is a factor of P(x)</text>
 </svg>`,
 caption:'Ruffini: bring down → multiply by a → add. Remainder = P(a). If R=0, (x−a) is a factor.',
 steps:['Write all polynomial coefficients including zeros for missing powers.','Apply Ruffini\'s rule: bring first coefficient down, multiply by a, add to next coefficient, repeat.','The last value is the remainder R = P(a); all others are quotient coefficients (degree one less).','Factor Theorem: if P(a)=0 then (x−a) is a factor — use to find rational roots.','For algebraic fractions: factor numerator and denominator fully, cancel common factors, then simplify.'],
 example:'Is (x+2) a factor of P(x)=x³+3x²−4? Test P(−2): (−2)³+3(−2)²−4=−8+12−4=0. Yes! So (x+2) is a factor. Divide to get x²+x−2=(x+2)(x−1). Roots: x=−2, x=1.'},

/* ── EQUATIONS — EXTENDED ───────────────────────── */
{cat:'Algebra',tags:['algebra','math'],
 title:'Irrational, Logarithmic & Exponential Equations',
 theory:'',
 reality:'The Richter scale uses logarithms — a magnitude 7 earthquake is 10 times stronger than a 6, not just one step higher. Sound is measured in decibels, also a log scale. Your phone uses exponential math to compress photos and stream video without wasting storage.',
 formula:'Irrational: isolate radical → raise both sides to power → check\nLogarithmic: log_b(x)=y ↔ bʸ=x\nlog(A)+log(B)=log(AB)\nlog(A)−log(B)=log(A/B)\nn·log(A)=log(Aⁿ)\nExponential same base: aᵐ=aⁿ → m=n\nExponential diff base: take log of both sides',
 method:'For irrational equations: isolate the radical, square both sides (squaring can introduce extraneous solutions), solve the resulting polynomial, and verify ALL solutions in the ORIGINAL equation.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <rect x="4" y="6" width="120" height="106" rx="7" fill="rgba(122,171,207,.07)" stroke="#7aabcf" stroke-width="1.5"/>
  <text x="64" y="20" text-anchor="middle" font-size="8.5" fill="#7aabcf" font-weight="700">Irrational</text>
  <text x="64" y="34" text-anchor="middle" font-size="9" fill="#9ecef0">√(7x+42) = x+3</text>
  <text x="14" y="48" font-size="8" fill="#9ecef0">Square: 7x+42=(x+3)²</text>
  <text x="14" y="60" font-size="8" fill="#9ecef0">x²−x−30=0</text>
  <text x="14" y="72" font-size="8" fill="#9ecef0">(x−6)(x+5)=0</text>
  <text x="14" y="84" font-size="8" fill="#7ab060">x=6 ✓  check!</text>
  <text x="14" y="96" font-size="8" fill="#c07070">x=−5 ✗ extraneous</text>
  <text x="14" y="108" font-size="7.5" fill="#888">always verify in original</text>
  <rect x="136" y="6" width="120" height="106" rx="7" fill="rgba(201,160,96,.07)" stroke="#c9a060" stroke-width="1.5"/>
  <text x="196" y="20" text-anchor="middle" font-size="8.5" fill="#c9a060" font-weight="700">Exponential</text>
  <text x="196" y="34" text-anchor="middle" font-size="9" fill="#d4b87a">3ˣ = 9  same base</text>
  <text x="196" y="46" text-anchor="middle" font-size="8.5" fill="#d4b87a">3ˣ = 3² → x=2</text>
  <line x1="144" y1="54" x2="248" y2="54" stroke="#c9a060" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="196" y="66" text-anchor="middle" font-size="9" fill="#d4b87a">2ˣ = 5  diff base</text>
  <text x="196" y="78" text-anchor="middle" font-size="8.5" fill="#d4b87a">x·ln2 = ln5</text>
  <text x="196" y="90" text-anchor="middle" font-size="8.5" fill="#c9a060">x = ln5/ln2 ≈ 2.32</text>
  <text x="196" y="108" text-anchor="middle" font-size="7.5" fill="#888">injective property</text>
 </svg>`,
 caption:'Irrational: isolate radical, square, check. Exponential: match bases or take logarithm.',
 steps:['Irrational: isolate the radical on one side, square both sides, solve, then CHECK every solution in the original — squaring can create false solutions.','Logarithmic: use log properties to consolidate to a single log, convert to exponential form, solve, then check that all arguments are positive.','Exponential (same base): if bˣ=bⁿ then x=n (injective property).','Exponential (different bases): take ln of both sides, use ln(aˣ)=x·ln(a), isolate x.','For equations with both exponential and logarithmic terms: substitute t=bˣ to reduce to a polynomial.'],
 example:'log₂(x+3)+log₂(x−1)=5: combine → log₂((x+3)(x−1))=5 → (x+3)(x−1)=32 → x²+2x−35=0 → x=5 or x=−7. Check: x=−7 gives log₂(−4) undefined. Answer: x=5 only.'},

/* ── INEQUALITIES ───────────────────────────────── */
{cat:'Algebra',tags:['algebra','math','calculus'],
 title:'Polynomial & Rational Inequalities — Sign Chart Method',
 theory:'',
 reality:'A phone plan is only worth buying if you use more than 50 texts per month — that is an inequality. Engineers set safe operating ranges for machines. Inequalities define the conditions where something works, is affordable, or is safe. They are the math of real constraints.',
 formula:'Steps: Factor → Find zeros/excluded pts → Sign chart → Read intervals\nPolynomial: (x−a)ⁿ factor: odd n = sign change; even n = no sign change\nRational: include zeros of numerator AND excluded values of denominator\nFlip inequality when multiplying/dividing by negative',
 method:'Sign chart (tableau des signes): list all critical values in order on a number line, test one point in each interval, record + or − for the whole expression. Read off the solution intervals directly. This is the method used in French/Spanish baccalauréat and AP Calculus.',
 svg:`<svg viewBox="0 0 260 118" xmlns="http://www.w3.org/2000/svg">
  <text x="130" y="13" text-anchor="middle" font-size="9" fill="#7aabcf" font-weight="700">Solve (x−1)(x+3) > 0</text>
  <line x1="10" y1="30" x2="250" y2="30" stroke="#7aabcf" stroke-width="1.5"/>
  <line x1="10" y1="50" x2="250" y2="50" stroke="#7aabcf" stroke-width="1"/>
  <line x1="10" y1="70" x2="250" y2="70" stroke="#7aabcf" stroke-width="1"/>
